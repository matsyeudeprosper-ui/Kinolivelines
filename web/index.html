<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KinoliveLines · Harvest</title>
<style>
  :root{
    --bg:#0b0f14; --card:#121924; --card2:#0f151e; --line:#1e2937;
    --txt:#e6edf3; --dim:#8b98a9; --acc:#4da3ff; --green:#3fdc97; --red:#ff6b6b;
    --amber:#ffc857;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
       font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:24px}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;
         flex-wrap:wrap;gap:8px;margin-bottom:20px}
  h1{font-size:22px;font-weight:600;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .stamp{color:var(--dim);font-size:13px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
        margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;
           color:var(--dim);font-weight:600;margin-bottom:6px}
  .big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
  .sub{font-size:12.5px;color:var(--dim);margin-top:2px}
  .pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
  section{background:var(--card2);border:1px solid var(--line);border-radius:14px;
          padding:18px;margin-bottom:14px;overflow-x:auto}
  section h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--acc)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;
        font-variant-numeric:tabular-nums;white-space:nowrap}
  th{color:var(--dim);font-weight:600;text-align:left;padding:6px 14px 6px 0;
     border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;
     letter-spacing:.6px}
  td{padding:7px 14px 7px 0;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
  .ok{background:var(--green)} .bad{background:var(--red)}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;
        border:1px solid var(--line);color:var(--dim)}
  .banner{border:1px solid #4a3620;background:#241a0e;color:var(--amber);
          border-radius:14px;padding:14px 18px;font-size:13.5px;margin-bottom:14px}
  svg{display:block;width:100%;height:120px}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
  @media(max-width:640px){body{padding:12px}.big{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KinoliveLines <span>· Harvest</span></h1>
    <div class="stamp" id="stamp">loading…</div>
  </header>

  <div class="grid" id="topcards"></div>

  <div class="banner" id="expectBanner"></div>

  <section>
    <h2>Live account — open positions</h2>
    <table id="positions"></table>
  </section>

  <section>
    <h2>Live account — closed cycles &amp; balance</h2>
    <svg id="curve" viewBox="0 0 800 120" preserveAspectRatio="none"></svg>
    <table id="cycles"></table>
  </section>

  <section>
    <h2>Demo A/B — trail ($5 arm / $3 giveback) vs control</h2>
    <table id="ab"></table>
  </section>

  <section>
    <h2>What the backtest says to expect (M1, 0.01 lots — fixed reference)</h2>
    <table id="expect"></table>
  </section>

  <section>
    <h2>System health</h2>
    <table id="health"></table>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,plus)=>{if(v===null||v===undefined||v==="")return"–";
  const n=+v;const s=(plus&&n>0?"+":"")+n.toFixed(2);
  return `<span class="${n>0.004?"pos":n<-0.004?"neg":""}">${s}</span>`;};

async function refresh(){
  let d;
  try{ d=await (await fetch("stats.json",{cache:"no-store"})).json(); }
  catch(e){ $("stamp").textContent="stats.json unreachable — retrying"; return; }

  const L=d.live, hb=d.heartbeats||{};
  $("stamp").innerHTML=`updated ${d.generated_utc} UTC · auto-refresh ${d.refresh_seconds}s`;

  if(L){
    const m=L.magics["770407"]||{};
    const paidIn=d.deployed.start+(L.deposits??d.deployed.deposits);
    const floating=(L.positions||[]).filter(p=>p.magic===770407)
                    .reduce((s,p)=>s+p.pnl,0);
    const st=d.state.live||{};
    $("topcards").innerHTML=`
      <div class="card"><h3>Live equity</h3><div class="big">$${L.equity.toFixed(2)}</div>
        <div class="sub">balance $${L.balance.toFixed(2)} · BTC ${L.btc??"–"}</div></div>
      <div class="card"><h3>Today</h3><div class="big">${fmt(m.today+floating,1)}</div>
        <div class="sub">realised ${fmt(m.today,1)} · floating ${fmt(floating,1)}</div></div>
      <div class="card"><h3>This week</h3><div class="big">${fmt(m.week,1)}</div>
        <div class="sub">closed ${m.closed??0} · wins ${m.wins??0}</div></div>
      <div class="card"><h3>Since start</h3><div class="big">${fmt(L.equity-paidIn,1)}</div>
        <div class="sub">paid in $${paidIn.toFixed(2)} (incl. $${d.deployed.deposits} deposit)</div></div>
      <div class="card"><h3>Cycle</h3>
        <div class="big">${st.recovery?'<span class="warn">RECOVERY</span>':(st.positions?st.cycle_dir||"open":"flat")}</div>
        <div class="sub">${st.positions??0}/5 positions · cycle ${fmt(st.cycle_pnl,1)}</div></div>
      <div class="card"><h3>Protection (live)</h3>
        <div class="big">${st.protection_state==="ACTIVE"?(st.trail_armed?'<span class="warn">ARMED</span>':"watching")
          :st.protection_state?`<span class="neg">${st.protection_state}</span>`:"–"}</div>
        <div class="sub">day ${fmt(st.daily_total,1)} · arms at +$${st.trail_activate??"?"}${st.trail_armed?" · floor "+(+st.trail_floor).toFixed(2):""} · stop −$${st.daily_loss_limit??"?"}</div></div>`;
  }

  const ps=(L&&L.positions||[]).filter(p=>p.magic===770407);
  $("positions").innerHTML=ps.length
    ? "<tr><th>side</th><th>entry</th><th>P&L</th><th>age</th></tr>"+
      ps.map(p=>`<tr><td>${p.side}</td><td>${p.entry}</td><td>${fmt(p.pnl,1)}</td><td>${p.age_h} h</td></tr>`).join("")
    : "<tr><td class='sub'>flat — waiting for the next reversal</td></tr>";

  const cy=d.cycles||[];
  $("cycles").innerHTML=
    "<tr><th>cycle</th><th>dir</th><th>trades</th><th>hours</th><th>worst dip</th><th>recovery</th><th>net</th><th>balance</th></tr>"+
    cy.slice().reverse().map(c=>`<tr><td>${c.id}</td><td>${c.dir}</td><td>${c.trades}</td>
      <td>${c.hours}</td><td>${fmt(c.worst)}</td><td>${c.recovery}</td>
      <td>${fmt(c.net,1)}</td><td>$${(+c.balance).toFixed(2)}</td></tr>`).join("");

  // balance curve
  if(cy.length>1){
    const vals=cy.map(c=>+c.balance);
    const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
    const pts=vals.map((v,i)=>`${(i/(vals.length-1))*790+5},${110-((v-mn)/sp)*100}`).join(" ");
    $("curve").innerHTML=`<polyline points="${pts}" fill="none" stroke="#4da3ff"
      stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  if(d.demo){
    const g=k=>d.demo.magics[k]||{};
    const c=g("770405"), t=g("770408"), p=g("770404");
    const tr=d.state.trail||{};
    $("ab").innerHTML=`
      <tr><th>arm</th><th>today</th><th>week</th><th>total</th><th>closed</th><th>status</th></tr>
      <tr><td>control 770405</td><td>${fmt(c.today,1)}</td><td>${fmt(c.week,1)}</td>
          <td>${fmt(c.total,1)}</td><td>${c.closed??0}</td><td><span class="pill">no trail</span></td></tr>
      <tr><td>trail 770408</td><td>${fmt(t.today,1)}</td><td>${fmt(t.week,1)}</td>
          <td>${fmt(t.total,1)}</td><td>${t.closed??0}</td>
          <td><span class="pill">${tr.trail_state||"?"} · day ${fmt(tr.trail_daily_total,1)}${tr.trail_armed?" · ARMED floor "+tr.trail_floor:""}</span></td></tr>
      <tr><td class="sub">plain 770404 (reference)</td><td>${fmt(p.today,1)}</td>
          <td>${fmt(p.week,1)}</td><td>${fmt(p.total,1)}</td><td>${p.closed??0}</td><td></td></tr>`;
  }

  const E=d.expect;
  $("expectBanner").textContent="⚠ "+E.verdict;
  $("expect").innerHTML=`
    <tr><th></th><th>typical</th><th>good</th><th>bad</th></tr>
    <tr><td>Day P&L</td><td>median ${fmt(E.daily.median,1)} · green ${E.daily.green}%</td>
        <td>best ${fmt(E.daily.best,1)}</td><td>worst ${fmt(E.daily.worst,1)}</td></tr>
    <tr><td>Dip inside a day</td><td>$${E.daily_dd.typical}</td>
        <td></td><td>1-in-10 &gt; $${E.daily_dd.p90} · worst $${E.daily_dd.worst}</td></tr>
    <tr><td>Month P&L</td><td colspan="3">${E.monthly.note}: mean ${fmt(E.monthly.mean,1)},
        range ${fmt(E.monthly.lo)} … ${fmt(E.monthly.hi,1)} — anchor noise dominates</td></tr>`;

  const names={live_bot:"live harvest bot",ctrl_bot:"demo control bot",
               trail_bot:"demo trail bot",shadow:"shadow trail (live, records only)",
               observer:"signal observer"};
  $("health").innerHTML="<tr><th>service</th><th>heartbeat</th></tr>"+
    Object.entries(names).map(([k,n])=>{
      const a=hb[k]; const ok=a!==null&&a!==undefined&&a<300;
      return `<tr><td>${n}</td><td><span class="dot ${ok?"ok":"bad"}"></span>${ok?a+"s ago":"STALE"}</td></tr>`;}).join("")+
    `<tr><td>brick drift</td><td>${d.state.drift??"–"}%${d.state.drift_action?' <span class="neg">ACTION NEEDED</span>':""}</td></tr>`;

  $("foot").textContent="Read-only dashboard · numbers are USD at 0.01 lots · "+
    "backtest reference is preregistered and does not change with live results";
}
refresh();
setInterval(refresh,30000);
</script>
</body>
</html>
