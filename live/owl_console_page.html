<script>
const B=location.pathname.replace(/console\/?$/,'');

const money=(v,d=2)=>v==null||isNaN(v)?'—':((v>=0?'+':'−')+'$'+Math.abs(v).toLocaleString(EN?'en-US':'fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}));

const cl=v=>v>0.005?'pos':(v<-0.005?'neg':'');
const ago=t=>{if(!t)return '—';const s=Date.now()/1000-t;if(s<90)return T('à l’instant','just now');if(s<3600)return Math.round(s/60)+' min';if(s<86400)return Math.round(s/3600)+' h';return Math.round(s/86400)+T(' j',' d');};
const dd=t=>{if(!t)return '';const d=new Date(t*1000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',acc:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
 mem:'M15 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4M3 21l9.5-9.5M14 11l7-7M18 3l3 3',money:'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',sys:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
 eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',pause:'M6 4h4v16H6zM14 4h4v16h-4z',play:'M5 3l14 9-14 9z',stop:'M5 5h14v14H5z',note:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',key:'M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4',redo:'M3 12a9 9 0 1 0 3-6.7M3 4v5h5',copy:'M9 9h11v11H9zM5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1'};
const pic=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
let A=null,C=null,SW=null,INB=[],PG='home',PW=null,AF='all',SHEET=null;
function toast(m){const t=$('toast');t.innerHTML=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3600);}
function openSh(h,key){$('shb').innerHTML=h;$('sh').classList.add('on');$('sh').querySelector('.pn').scrollTop=0;document.body.style.overflow='hidden';if(!SHEET)history.pushState({sh:1},'');SHEET=key||'x';}
function closeSh(pop){if(!SHEET)return;$('sh').classList.remove('on');document.body.style.overflow='';SHEET=null;if(!pop&&history.state&&history.state.sh)history.back();}
window.addEventListener('popstate',()=>{if(SHEET)closeSh(true);});
// the master password: asked once, kept in memory only for this visit (never stored)
function askPw(){return new Promise(res=>{if(PW)return res(PW);openSh('<h2>'+T('Mot de passe maître','Master password')+'</h2><p class="p" style="font-size:.86rem;color:var(--muted2);margin:6px 0 0">'+T('Demandé une fois pour cette visite, gardé seulement en mémoire.','Asked once for this visit, kept in memory only.')+'</p><input class="in" id="pwi" type="password" autocomplete="current-password" style="margin-top:14px"><button class="btn full" id="pwok">'+T('Continuer','Continue')+'</button>','pw');
 setTimeout(()=>{const i=$('pwi');if(i)i.focus();},200);const go=()=>{const v=($('pwi').value||'').trim();if(!v)return;PW=v;closeSh();res(v);};$('pwok').onclick=go;$('pwi').onkeydown=e=>{if(e.key==='Enter')go();};});}
async function adm(action,params){const pw=await askPw();const body=Object.entries(Object.assign({},params,{pwd:pw})).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
 try{const r=await fetch(B+action,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const j=await r.json();if(j&&j.err&&/password|mot de passe/i.test(j.err)){PW=null;toast(T('Mot de passe refusé.','Password refused.'));}return j;}catch(e){toast(T('Pas de connexion.','No connection.'));return null;}}
async function place(action,body){try{const r=await fetch(B+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}catch(e){return null;}}
async function load(){try{const [a,c,s,i]=await Promise.all([fetch(B+'api',{cache:'no-store'}).then(r=>r.json()),fetch(B+'console_data',{cache:'no-store'}).then(r=>r.json()),fetch(B+'nest_switches').then(r=>r.json()).catch(()=>null),fetch(B+'inbox').then(r=>r.json()).catch(()=>({items:[]}))]);A=a;C=c;SW=s;INB=(i&&i.items)||[];}catch(e){$('pg-home').innerHTML='<div class="lock">'+T('La console ne répond pas. Réessayez.','The console does not answer. Try again.')+'</div>';return;}render();}

/* ---------- shared figures ---------- */
const nest=()=>(A&&A.nest)||[];
const realAcc=()=>nest().filter(x=>x.real);
function accState(x){if(x.paused)return ['w',T('En pause','Paused')];if(x.err)return ['r',T('Ne joint pas le compte','Cannot reach the account')];if(x.blocked)return ['r',T('Bloqué : ','Blocked: ')+x.blocked];if(x.trade&&!x.botlive&&!x.observer)return ['r',T('Robot arrêté','Robot stopped')];if(x.stale)return ['w',T('Données en retard','Data late')];return ['g',x.observer?T('Observateur','Observer'):T('En marche','Running')];}
function todos(){const L=[],P=(A&&A.pending)||[],R=(A&&A.revenue)||{};
 if(P.length)L.push({c:'#e8c55a',i:'!',t:P.length+T(' demande'+(P.length>1?'s':'')+' en attente d’un code',' request'+(P.length>1?'s':'')+' waiting for a code'),s:P.map(p=>p.name).join(', '),go:'mem'});
 const bad=nest().filter(x=>['r'].includes(accState(x)[0]));if(bad.length)L.push({c:'#ff5c5c',i:'■',t:bad.length+T(' compte'+(bad.length>1?'s':'')+' à regarder',' account'+(bad.length>1?'s':'')+' to check'),s:bad.map(x=>x.name+' · '+accState(x)[1]).join(' · '),go:'acc'});
 if((C.payouts||[]).length)L.push({c:'#a78bfa',i:'$',t:C.payouts.length+T(' créateur'+(C.payouts.length>1?'s':'')+' à payer',' creator'+(C.payouts.length>1?'s':'')+' to pay'),s:C.payouts.map(p=>p.name+' '+usd(p.cash)).join(' · '),go:'money'});
 if((C.creators||[]).length)L.push({c:'#8fc6ff',i:'★',t:C.creators.length+T(' créateur'+(C.creators.length>1?'s':'')+' à valider',' creator'+(C.creators.length>1?'s':'')+' to review'),s:C.creators.map(p=>p.name).join(', '),go:'money'});
 if((R.due||[]).length)L.push({c:'#e8c55a',i:'⏳',t:R.due.length+T(' abonnement'+(R.due.length>1?'s':'')+' finit dans 7 jours',' plan'+(R.due.length>1?'s':'')+' ending within 7 days'),s:R.due.map(d=>d.name+' · '+d.days+T(' j',' d')).join(' · '),go:'money'});
 const sy=C.system||{};if(sy.mem_free!=null&&sy.mem_free<2)L.push({c:'#ff5c5c',i:'▲',t:T('Mémoire du serveur basse','Server memory low'),s:sy.mem_free+' GB '+T('libres','free'),go:'sys'});

 if(SW&&SW.paused)L.push({c:'#ff5c5c',i:'⏸',t:T('Tout le nid est en pause','The whole nest is paused'),s:T('Aucun robot ne prend de trade.','No robot takes trades.'),go:'sys'});
 return L;}

/* ---------- Pilotage ---------- */
function pHome(){const R=(A&&A.revenue)||{},act=R.active||{},Re=realAcc(),tot=Re.reduce((a,x)=>a+(+x.bal||0),0),td=Re.reduce((a,x)=>a+(+x.today||0),0);
 const live=nest().filter(x=>x.trade&&!x.observer),on=live.filter(x=>x.botlive&&!x.paused&&!x.err).length,paid=(act.family||0)+(act.manual||0)+(act.strategy||0);
 const h=new Date().getHours(),hi=h<12?T('Bonjour','Good morning'):(h<18?T('Bon après-midi','Good afternoon'):T('Bonsoir','Good evening'));
 const L=todos();let o='<div class="hero"><div class="hi">'+hi+' · '+T('votre nid aujourd’hui','your nest today')+'</div><div class="hm">'+usd(R.mrr||0,0)+'<span style="font-size:1rem;color:var(--muted2);font-weight:700"> '+T('/ mois','/ month')+'</span></div><div class="hs">'+T('revenu récurrent · ','recurring revenue · ')+paid+T(' abonné'+(paid>1?'s':'')+' payant'+(paid>1?'s':''),' paying member'+(paid>1?'s':''))+'</div></div>';
 o+='<div class="kpis"><div class="kp"><small>'+T('Argent géré','Money managed')+'</small><b>'+usd(tot,0)+'</b><span class="'+cl(td)+'">'+money(td)+T(' aujourd’hui',' today')+' · '+Re.length+T(' réels',' real')+'</span></div>'+
  '<div class="kp"><small>'+T('Robots en marche','Robots running')+'</small><b style="color:'+(on===live.length?'var(--up-soft)':'var(--warn)')+'">'+on+' / '+live.length+'</b><span>'+(on===live.length?T('tous en route','all running'):T('à regarder','to check'))+'</span></div>'+
  '<div class="kp"><small>'+T('Abonnés','Members')+'</small><b>'+paid+'</b><span>'+T('Famille ','Family ')+(act.family||0)+' · Signal '+(act.manual||0)+' · '+T('Strat. ','Strat. ')+(act.strategy||0)+'</span></div>'+
  '<div class="kp"><small>'+T('Visiteurs 7 j','Visitors 7 d')+'</small><b>'+(C.funnel||[]).slice(-7).reduce((a,f)=>a+(f.landing||0),0)+'</b><span>'+(C.funnel||[]).slice(-7).reduce((a,f)=>a+(f.offers||0),0)+T(' ont vu les offres',' saw the offers')+'</span></div></div>';
 o+='<div class="sec">'+T('À faire','To do')+(L.length?' <em>'+L.length+'</em>':'')+'</div>'+(L.length?'<div class="todo">'+L.map(x=>'<button class="td" data-go="'+x.go+'"><i style="background:'+x.c+'22;color:'+x.c+'">'+x.i+'</i><span class="t"><b>'+esc(x.t)+'</b><small>'+esc(x.s)+'</small></span><span style="color:var(--muted)">›</span></button>').join('')+'</div>':'<div class="allgood">'+pic('M20 6L9 17l-5-5').replace('<svg','<svg width="22" height="22"')+T('Rien à faire. Le nid tourne tout seul.','Nothing to do. The nest runs on its own.')+'</div>');
 o+='<div class="sec">'+T('Croissance · 21 jours','Growth · 21 days')+'</div><div class="card">'+funnel()+'</div>';
 const P=(R.payments||[]).slice(0,4);if(P.length)o+='<div class="sec">'+T('Derniers paiements','Latest payments')+'<button data-go="money">'+T('Tout','All')+' ›</button></div><div class="card" style="padding:4px 16px">'+P.map(p=>'<div class="row"><span class="l"><b>'+esc((C.plans[p.granted]||{}).label||p.granted)+'</b><small>'+dd(p.t)+' · '+esc((p.currency||'').toUpperCase())+'</small></span><span class="r pos">+$'+Number(p.amount||0).toFixed(0)+'</span></div>').join('')+'</div>';
 $('pg-home').innerHTML=o;}
function funnel(){const F=C.funnel||[];if(!F.length)return '<p class="p">'+T('Pas encore de visites.','No visits yet.')+'</p>';const mx=Math.max(1,...F.map(f=>f.landing||0));

  '<div class="leg"><span><i style="background:var(--surface3)"></i>'+T('visite','visit')+'</span><span><i style="background:var(--accent)"></i>'+T('a vu les offres','saw offers')+'</span><span><i style="background:var(--up)"></i>'+T('a choisi','chose')+'</span></div>';}

/* ---------- Comptes ---------- */
function pAcc(){const L=nest().filter(x=>AF==='all'||(AF==='real'&&x.real)||(AF==='demo'&&!x.real)||(AF==='alert'&&accState(x)[0]!=='g'));
