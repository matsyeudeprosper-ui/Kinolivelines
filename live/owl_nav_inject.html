<!-- 2026-11-02 (owner: "the new design navigation..." then "merge the old and new design so nothing is lost"): ONE bottom menu for
     every page - the new pages AND the robot dashboard (its old tab bar is hidden; its sections are reached by address:
     ?classic=1#marche (live market), #hist (performance), #set (settings), #nid (the nest, owner), #home (today)). -->
<style>
#knav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;
 padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,15,20,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-top:1px solid rgba(255,255,255,.07);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root[data-theme="light"] #knav{background:rgba(246,248,252,.92);border-top-color:#e3e8f0}
#knav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#8a9bb0;min-width:58px;padding:4px 0;text-decoration:none}
#knav a.on{color:#e8eef4}:root[data-theme="light"] #knav a.on{color:#121722}
#knav svg{width:22px;height:22px}
#knav .kd{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#7c6cff,#22d3ee);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
.tabbar{display:none!important}
</style>
<nav id="knav" aria-label="Navigation">
 <a data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-fr="Accueil" data-en="Home">Accueil</span></a>
 <a data-p="atelier"><span class="kd">K</span><span>Kino</span></a>
 <a data-p="mesrobots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg><span data-fr="Robots" data-en="Robots">Robots</span></a>
 <a data-p="marche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg><span data-fr="Marché" data-en="Market">Marché</span></a>
 <a data-p="compte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-fr="Compte" data-en="Account">Compte</span></a>
</nav>
<script>(function(){try{var seg=location.pathname.split('/').filter(Boolean),tok=seg[0],sub=seg[1]||'';
 var en=false;try{en=(localStorage.getItem('owlLang')||document.documentElement.lang)==='en';}catch(e){}
 var dash=sub==='';                                  /* the robot dashboard (?classic=1) */
 function act(){var h=(location.hash||'').slice(1);
  var pg=dash?({marche:'marche',robot:'marche',hist:'compte',set:'compte',nid:'compte',offres:'compte'}[h]||'home'):
   ({tests:'mesrobots',place:'mesrobots',wealth:'compte',parrainage:'compte',kino:'compte',rentabilite:'compte'}[sub]||sub||'home');
  document.querySelectorAll('#knav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-p')===pg);});}
 document.querySelectorAll('#knav a').forEach(function(a){var p=a.getAttribute('data-p');
  a.href=p==='marche'?'/'+tok+'/?classic=1#marche':'/'+tok+'/'+p;
  var s=a.querySelector('span[data-fr]');if(s)s.textContent=en?s.getAttribute('data-en'):s.getAttribute('data-fr');});
 if(dash){                                           /* a section of the dashboard opened by its address */
  var go=function(){var h=(location.hash||'').slice(1)||'home';h=h==='robot'?'marche':h;
   if(['home','marche','hist','set','nid'].indexOf(h)<0||typeof tab!=='function')return;
   var b=document.getElementById('tb-'+h)||[].slice.call(document.querySelectorAll('.tb')).find(function(x){return (x.getAttribute('onclick')||'').indexOf("'"+h+"'")>=0;});
   tab(h,b||null);if(h==='marche'&&typeof mxView==='function')setTimeout(function(){mxView('market',true)},50);act();};
  window.addEventListener('hashchange',go);if((location.hash||'').slice(1)==='nid')setTimeout(go,300);}
 act();window.addEventListener('hashchange',act);
 fetch('/'+tok+'/home_data').then(function(r){return r.json()}).then(function(d){if(d&&d.cid){var k=document.querySelector('#knav a[data-p="atelier"]');if(k)k.href='/'+tok+'/atelier?c='+encodeURIComponent(d.cid);}}).catch(function(){});
}catch(e){}})();</script>
