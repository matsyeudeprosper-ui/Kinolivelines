/* 2026-10-12 (owner): "Strategies" - every strategy of the nest in one place: live, in trial, studied,
   validated, not started, rejected; a space per strategy. Same tokens as Rentabilite and Patrimoine. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;
 --border:#1f2a38;--border2:#2b3a4d;--hl:inset 0 1px 0 rgba(255,255,255,.04);
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;

 --up:#2ecc71;--up-soft:#8df0bb;--down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;
 --r:16px;--r-lg:24px;--hero1:#0d2236;--hero2:#103a5c;--grid:rgba(255,255,255,.06);--tip:#0e1621;
 --ok-bg:rgba(46,204,113,.12);--mid-bg:rgba(232,197,90,.12);--bad-bg:rgba(255,92,92,.12);--vi-bg:rgba(167,139,250,.13);--gr-bg:rgba(138,155,176,.12)}
:root[data-theme=light]{--bg:#eef2f7;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#e6ecf4;--border:#dde4ed;--border2:#c7d2df;
 --hl:inset 0 1px 0 rgba(255,255,255,.7);--text:#0f172a;--text2:#33415a;--muted:#5f6f85;--muted2:#4c5b70;
 --accent:#2563eb;--accent-soft:#1d4ed8;--accent-bg:rgba(37,99,235,.10);--up:#15803d;--up-soft:#166534;--down:#dc2626;--down-soft:#b91c1c;
 --warn:#a16207;--violet:#7c3aed;--violet-soft:#6d28d9;--grid:rgba(15,23,42,.07);--tip:#ffffff;--hero1:#123a63;--hero2:#1d5a94}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));overflow-x:hidden}

.wrap{max-width:880px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
#aur{position:fixed;inset:-20% -10% auto -10%;height:480px;z-index:0;pointer-events:none;
 background:radial-gradient(50% 60% at 15% 25%,rgba(167,139,250,.16),transparent 70%),radial-gradient(50% 55% at 85% 15%,rgba(59,130,246,.22),transparent 70%),radial-gradient(40% 40% at 60% 75%,rgba(46,204,113,.09),transparent 70%);filter:blur(10px)}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px}
.hrow{display:flex;align-items:center;gap:12px}

.ttl{flex:1;min-width:0}.ttl h1{font-size:1.35rem;font-weight:800;letter-spacing:-.015em}

.live{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--up-soft);border:1px solid rgba(46,204,113,.35);background:var(--ok-bg);border-radius:99px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.card{scroll-margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--hl);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}

.date .dt{flex:1;min-width:0}.date .dt b{display:block;font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date .dt small{font-size:.76rem;color:var(--muted)}
.date .in{flex:none;font-size:.72rem;font-weight:800;color:var(--accent-soft);background:var(--accent-bg);border-radius:99px;padding:4px 9px}
/* toolbar */
nav{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:10px 0 12px}

.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted2);font-size:.84rem;font-weight:700;padding:9px 13px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;transition:all .2s}

.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on em{background:rgba(127,127,127,.25);color:inherit}
.tb2{display:flex;gap:8px;margin-top:9px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:3px;gap:2px;flex:none}

.seg button.on{background:var(--surface3);color:var(--text)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:0 12px;height:40px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

.sc{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px 16px 14px 19px;box-shadow:var(--hl);overflow:hidden;width:100%;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .2s;animation:fade .35s ease both}

.fi{flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--c)}
.fi svg{width:20px;height:20px}
.sc .tt{flex:1;min-width:0}
.sc .tt b{display:block;font-size:1rem;font-weight:800;line-height:1.3;letter-spacing:-.005em}
.sc .tt small{display:block;font-size:.74rem;color:var(--muted);margin-top:3px;font-weight:600}
.sc p{font-size:.86rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ev{background:var(--surface2);color:var(--muted2);border:1px solid var(--border)}
.ev svg{width:11px;height:11px}
.pbar{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden;flex:1;min-width:60px}

.rr .no.g1{background:linear-gradient(135deg,#f6d77a,#c99a2e);color:#2a1f05}.rr .no.g2{background:linear-gradient(135deg,#e3e8ef,#9aa6b5);color:#1b2330}.rr .no.g3{background:linear-gradient(135deg,#e9b48a,#a8673a);color:#2a1606}

.rr .vv{flex:none;text-align:right}.rr .vv b{display:block;font-size:.95rem;font-weight:800}.rr .vv small{font-size:.7rem;color:var(--muted)}
.rr svg.sp{flex:none;width:64px;height:28px}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:10px}
/* detail */
#det{display:none}
body.det #list,body.det #top{display:none}body.det #det{display:block;animation:fade .3s ease}
.dh{background:linear-gradient(150deg,var(--hero1),var(--hero2));border-color:rgba(143,198,255,.18)}
.dh .fi{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.dh h3{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.2;color:#fff;margin-top:14px}
.dh p{font-size:.95rem;line-height:1.55;color:#d6e6f3;margin-top:8px}
.dh .ft{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.verd{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);font-size:.9rem;line-height:1.5;color:#eaf2f9}

.stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;position:sticky;top:0;z-index:4;background:linear-gradient(var(--bg) 80%,transparent);padding:10px 0 8px}
.stabs::-webkit-scrollbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kp{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:13px}

.kp .v{font-size:1.35rem;font-weight:900;margin-top:6px;letter-spacing:-.02em}
.kp .n{font-size:.74rem;color:var(--muted);margin-top:3px;line-height:1.35}
.pos{color:var(--up)}.neg{color:var(--down)}.gold{color:var(--warn)}
.chart{position:relative;margin-top:6px}.chart svg{display:block;width:100%;overflow:visible}

.acc .ab{display:none;padding:2px 14px 14px}.acc.open .ab{display:block}

.acc .nm{min-width:96px}
.acc .chev{flex:none;transition:transform .2s;color:var(--muted)}.acc.open .chev{transform:rotate(180deg)}
.mrow{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted2);margin:4px 0 12px}.mrow b{color:var(--text)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border2);border-radius:2px}
.tli{position:relative;padding:0 0 16px}
.tli:before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tli b{display:block;font-size:.74rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.tli span{display:block;font-size:.9rem;line-height:1.45;margin-top:3px}
.mk{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:620px){.mk{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.mc{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:14px}

.mc .si{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.74rem;background:var(--surface3);border:1px solid var(--border2)}
.mc .h b{display:block;font-size:.95rem;font-weight:800}.mc .h small{font-size:.72rem;color:var(--muted)}

.crit{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

@keyframes sk{to{background-position:-200% 0}}
/* the Labo's three sides */
#doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin:6px 0 12px;box-shadow:var(--hl)}

.door{border:0;background:transparent;color:var(--muted2);font-size:.86rem;font-weight:800;padding:10px 4px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:all .2s}

<script>
const EN=(()=>{try{return localStorage.getItem('owlLang')==='en';}catch(e){return false;}})();
const T=(f,e)=>EN?e:f, $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tt=x=>EN?(x.title_en||x.title_fr):(x.title_fr||x.title_en), pl=x=>EN?(x.plain_en||x.plain_fr):(x.plain_fr||x.plain_en), vd=x=>EN?(x.verdict_en||x.verdict_fr):(x.verdict_fr||x.verdict_en);
const ST={live:{fr:'En direct',en:'Live',c:'var(--up)',cls:'background:var(--ok-bg);color:var(--up-soft)'},

 rejected:{fr:'Écartée',en:'Rejected',c:'var(--down)',cls:'background:var(--bad-bg);color:var(--down-soft)'}};
const ORDER=['live','trial','study','ready','not_started','rejected'];
const EVI={real:{fr:'Argent réel',en:'Real money',t:4},demo:{fr:'Compte démo',en:'Demo account',t:3},virtual:{fr:'Virtuel',en:'Virtual',t:2},backtest:{fr:'Sur le passé',en:'Past data',t:1},idea:{fr:'Idée',en:'Idea',t:0}};
const FAM={structure:['Structure','Structure','M3 17l6-6 4 4 8-8M15 7h6v6'],rythme:['Rythme','Timing','M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],
 meteo:['Météo','Weather','M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9.5 4.25 4.25 0 0 0 7 18zM13 18l-2 4'],argent:['Argent','Money','M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5 9 9.5 12 10s5 1.6 5 3.5-2.2 3.5-5 3.5-5-1.1-5-3'],
 cible:['Objectif','Target','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01'],donnees:['Données','Data','M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6'],
 risque:['Risque','Risk','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z'],entree:['Entrée','Entry','M10 17l5-5-5-5M15 12H3M21 3v18'],
 marche:['Marché','Market','M3 3v18h18M7 14l4-4 3 3 5-6'],marches:['Marchés','Markets','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18'],
 portefeuille:['Portefeuille','Portfolio','M3 7h18v13H3zM16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M3 12h18'],recherche:['Recherche','Research','M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35']};
const fic=f=>{const p=(FAM[f]||FAM.recherche)[2];return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>';};
const fnm=f=>(FAM[f]||FAM.recherche)[EN?1:0];
const GRADE={A:['Mieux sur les deux moitiés du test','Better on both halves of the test'],B:['Un peu mieux','Slightly better'],C:['Pas mieux','Not better'],'=':['Sans effet','No effect']};
const sb=s=>{const m=ST[s]||ST.study;return '<span class="bd" style="'+m.cls+'"><i></i>'+T(m.fr,m.en)+'</span>';};
const eb=e=>{const m=EVI[e];if(!m)return '';return '<span class="bd ev">'+T(m.fr,m.en)+'</span>';};
const money=(v,d=2)=>v==null?'—':((v>=0?'+':'−')+'$'+Math.abs(v).toLocaleString(EN?'en-US':'fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}));
const pc=(v,d=1)=>v==null?'—':(v>=0?'+':'−')+Math.abs(v).toFixed(d)+' %';
const num=(v,d=0)=>v==null?'—':(+v).toLocaleString(EN?'en-US':'fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const cl=v=>v==null?'':(v>0?'pos':(v<0?'neg':''));
function ago(t){if(!t)return '—';const s=Date.now()/1000-t;if(s<90)return T("à l'instant",'just now');if(s<3600)return T('il y a ','')+Math.round(s/60)+' min'+T('',' ago');if(s<86400)return T('il y a ','')+Math.round(s/3600)+' h'+T('',' ago');return T('il y a ','')+Math.round(s/86400)+T(' j',' d ago');}
function dIn(d){const t=new Date(d+'T12:00:00Z').getTime(),n=Math.ceil((t-Date.now())/86400000);return n<=0?T("aujourd'hui",'today'):(n===1?T('demain','tomorrow'):T('dans '+n+' j','in '+n+' d'));}
const MON=EN?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const fdate=s=>{if(!s)return '—';const d=new Date(typeof s==='number'?s*1000:(String(s).length<=10?s+'T12:00:00Z':s));if(isNaN(d))return '—';return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear();};
function spark(a,w=74,h=26){if(!a||a.length<2)return '';const mn=Math.min(0,...a),mx=Math.max(0,...a),r=(mx-mn)||1;
 const P=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1));const up=a[a.length-1]>=0;
 const z=(h-2-(0-mn)/r*(h-4)).toFixed(1);
 return '<svg class="sp" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="0" x2="'+w+'" y1="'+z+'" y2="'+z+'" stroke="var(--border2)" stroke-width="1" stroke-dasharray="2 2"/><polyline points="'+P.join(' ')+'" fill="none" stroke="'+(up?'var(--up)':'var(--down)')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';}
function ring(p,c='var(--accent)',lab){p=Math.max(0,Math.min(1,p||0));const R=24,C=2*Math.PI*R;
 return '<div class="ring"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="'+R+'" fill="none" stroke="var(--surface3)" stroke-width="6"/><circle cx="29" cy="29" r="'+R+'" fill="none" stroke="'+c+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'"/></svg><span>'+(lab!=null?lab:Math.round(p*100)+'%')+'</span></div>';}
let CH=0;
function lineChart(series,opts={}){ // series: [{a:[..], c:color, n:name}] same length not needed
 const id='ch'+(++CH),W=600,H=opts.h||190;const all=series.flatMap(s=>s.a);if(all.length<2)return '<div class="empty">'+T('Pas encore assez de trades','Not enough trades yet')+'</div>';
 const mn=Math.min(0,...all),mx=Math.max(0,...all),r=(mx-mn)||1,Y=v=>(H-14-(v-mn)/r*(H-28));
 let g='';for(let k=0;k<=3;k++){const v=mn+r*k/3,y=Y(v);g+='<line x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)"/><text x="'+(W-2)+'" y="'+(y-4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(opts.unit==='r'?(v>=0?'+':'')+v.toFixed(1)+' R':money(v,0))+'</text>';}
 const z=Y(0);let p='';
 series.forEach((s,si)=>{const n=s.a.length;const pts=s.a.map((v,i)=>[i/(n-1)*W,Y(v)]);
  if(si===0)p+='<path d="M0,'+z.toFixed(1)+' L'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L')+' L'+W+','+z.toFixed(1)+' Z" fill="'+s.c+'" opacity=".10"/>';
  p+='<polyline points="'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+s.c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="6 5"':'')+'/>';});
 setTimeout(()=>{const el=$(id);if(!el)return;const sv=el.querySelector('svg'),tp=el.querySelector('.tip'),cx=el.querySelector('.cx');
  const mv=e=>{const b=sv.getBoundingClientRect();const fx=Math.max(0,Math.min(1,((e.touches?e.touches[0].clientX:e.clientX)-b.left)/b.width));
   let html='';series.forEach(s=>{const i=Math.round(fx*(s.a.length-1));html+=(series.length>1?'<span style="color:'+s.c+'">● </span>':'')+(opts.lab?opts.lab(i,s):'')+(opts.unit==='r'?(s.a[i]>=0?'+':'')+s.a[i].toFixed(2)+' R':money(s.a[i]))+(series.length>1?'<br>':'');});
   tp.innerHTML=html;tp.style.display='block';tp.style.left=(fx*b.width)+'px';tp.style.top=(Y(series[0].a[Math.round(fx*(series[0].a.length-1))])/H*b.height)+'px';cx.setAttribute('x1',fx*W);cx.setAttribute('x2',fx*W);cx.style.display='';};
  const out=()=>{tp.style.display='none';cx.style.display='none';};
  sv.addEventListener('pointermove',mv);sv.addEventListener('pointerleave',out);sv.addEventListener('touchmove',mv,{passive:true});sv.addEventListener('touchend',out);},0);
 return '<div class="chart" id="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">'+g+'<line x1="0" x2="'+W+'" y1="'+z.toFixed(1)+'" y2="'+z.toFixed(1)+'" stroke="var(--border2)" stroke-dasharray="3 4"/>'+p+'<line class="cx" y1="0" y2="'+H+'" stroke="var(--muted)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>'+
  (series.length>1?'<div class="mrow" style="margin-top:10px">'+series.map(s=>'<span><span class="dot" style="background:'+s.c+'"></span> '+esc(s.n)+'</span>').join('')+'</div>':'');}
function divBars(rows){ // rows: [{l, v, n, s}] v = net; bars centred on zero
 if(!rows.length)return '<div class="empty">—</div>';const m=Math.max(...rows.map(r=>Math.abs(r.v)))||1;
 return '<div class="bars">'+rows.map(r=>{const w=Math.abs(r.v)/m*50;return '<div class="br"><span class="l">'+esc(r.l)+'</span><span class="t"><i style="'+(r.v>=0?'left:50%;':'right:50%;')+'width:'+w.toFixed(1)+'%;background:'+(r.v>=0?'var(--up)':'var(--down)')+'"></i></span><span class="r '+cl(r.v)+'">'+(r.f?r.f(r.v):money(r.v))+'<small>'+esc(r.s||'')+'</small></span></div>';}).join('')+'</div>';}
const SYMI={BTCUSD:'₿',ETHUSD:'Ξ',XAUUSD:'Au',XAGUSD:'Ag',USOIL:'OIL',US30:'DJ',USTEC:'NQ',US500:'SP',DE30:'DAX',UK100:'UK',JP225:'JP',EURUSD:'€$',GBPUSD:'£$',USDJPY:'$¥'};
const SYMN={BTCUSD:['Bitcoin','Bitcoin'],ETHUSD:['Ether','Ether']};

let D=null,F=localStorage.getItem('owlStratF')||'all',V=localStorage.getItem('owlStratV')||'list',Q='';
try{if(!ORDER.includes(F)&&F!=='all')F='all';}catch(e){}
const byId=id=>(D&&D.items||[]).find(x=>x.id===id);

/* ---------- the metric shown on a card ---------- */
function cardMet(x){
 if(x.id==='owl'&&x.total&&x.total.n)return spark(x.total.curve)+'<span>'+x.accounts_pos+'/'+x.accounts.length+' '+T('comptes +','accts +')+'</span>';
 if(x.total&&x.total.n)return spark(x.total.curve)+'<span class="'+cl(x.total.net)+'">'+money(x.total.net)+'</span>';
 if(x.protocol){const p=x.protocol;return '<span class="pbar" style="width:70px"><i style="width:'+Math.min(100,100*(p.elapsed||0)/p.days)+'%"></i></span><span>'+T('Jour ','Day ')+Math.floor(p.elapsed||0)+'/'+p.days+'</span>';}
 if(x.twin&&x.twin.trades)return (x.twin.curve?spark(x.twin.curve):'')+'<span class="'+cl(x.twin.net)+'">'+money(x.twin.net)+'</span><span style="color:var(--muted);font-weight:600">'+x.twin.trades+' tr.</span>';
 if(x.progress){const p=x.progress;return '<span class="pbar" style="width:70px"><i style="width:'+Math.min(100,100*(p.have||0)/p.need)+'%"></i></span><span>'+(p.have||0)+'/'+p.need+'</span>';}
 if(x.grade&&GRADE[x.grade])return '<span style="color:var(--muted2);font-weight:700;font-size:.78rem">'+T(GRADE[x.grade][0],GRADE[x.grade][1])+'</span>';
 return '';}
function card(x,i){const m=ST[x.status]||ST.study;
 return '<button class="sc'+(x.flag?' flag':'')+'" style="--c:'+m.c+';animation-delay:'+Math.min(i,12)*30+'ms" onclick="go(\''+x.id+'\')">'+
  '<div class="top"><span class="fi">'+fic(x.fam)+'</span><span class="tt"><b>'+esc(tt(x))+'</b><small>'+fnm(x.fam)+(x.since?' · '+T('depuis le ','since ')+fdate(x.since):'')+(x.in_robot||x.parent?' · '+T('dans le robot','in the robot'):'')+'</small></span></div>'+
  (pl(x)?'<p>'+esc(pl(x))+'</p>':(vd(x)?'<p>'+esc(vd(x))+'</p>':''))+
  '<div class="ft">'+sb(x.status)+eb(x.evidence)+'<span class="met">'+cardMet(x)+'</span></div></button>';}

/* ---------- top: hero + running now + dates ---------- */
function renderTop(){const c=D.counts||{},N=(D.items||[]).length;
 const owl=byId('owl');const last=owl&&owl.total&&owl.total.last;
 let h='<div class="card hero"><div class="eyebrow">'+T('Le laboratoire des stratégies','The strategy lab')+'</div>'+
  '<div class="big">'+N+'<small>'+T('stratégies suivies','strategies tracked')+'</small></div>'+
  '<p>'+T('Chaque idée passe par les mêmes étapes : sur le passé, puis en virtuel, puis avec de l\'argent. Celles qui échouent restent ici, pour ne jamais les refaire.','Every idea goes through the same steps: past data, then virtual, then real money. The ones that fail stay here, so they are never redone.')+'</p>'+
  '<div class="sbar">'+ORDER.filter(s=>c[s]).map(s=>'<i style="flex:'+c[s]+';background:'+ST[s].c+'"></i>').join('')+'</div>'+
  '<div class="slegend">'+ORDER.filter(s=>c[s]).map(s=>'<button onclick="setF(\''+s+'\',1)"><span class="dot" style="background:'+ST[s].c+'"></span>'+T(ST[s].fr,ST[s].en)+' <b>'+c[s]+'</b></button>').join('')+'</div>'+
  (last?'<div class="pulse"><span class="dot"></span><span>'+T('Dernier trade du robot ','Robot\'s last trade ')+ago(last)+' · '+num(owl.total.n)+T(' trades sur tous les comptes',' trades across all accounts')+'</span></div>':'')+'</div>';
 // running now: anything with a progress to watch
 const R=[];
 (D.items||[]).forEach(x=>{
  if(x.protocol&&x.protocol.start){const p=x.protocol;R.push({id:x.id,p:(p.elapsed||0)/p.days,lab:Math.floor(p.elapsed||0)+'/'+p.days,t:tt(x),s:T('jours de l\'essai figé','days of the frozen trial'),c:'var(--accent)'});}
  else if(x.progress)R.push({id:x.id,p:(x.progress.have||0)/x.progress.need,lab:(x.progress.have||0)+'',t:tt(x),s:(x.progress.have||0)+' / '+x.progress.need+' '+T(x.progress.unit_fr,x.progress.unit_en),c:'var(--violet)'});
  else if(x.start&&x.end&&x.status==='study'){const a=new Date(x.start+'T00:00:00Z')/1e3,b=new Date(x.end+'T23:59:00Z')/1e3,p=(Date.now()/1e3-a)/(b-a);R.push({id:x.id,p,lab:Math.round(Math.max(0,Math.min(1,p))*100)+'%',t:tt(x),s:T('verdict le ','verdict on ')+fdate(x.end),c:'var(--violet)'});}
  else if(x.twin&&x.twin.trades&&x.status==='trial')R.push({id:x.id,p:Math.min(1,x.twin.trades/30),lab:x.twin.trades+'',t:tt(x),s:T('trades du jumeau · ','twin trades · ')+money(x.twin.net),c:'var(--accent)'});
  else if(x.id==='fresh'&&x.total)R.push({id:x.id,p:Math.min(1,x.total.n/100),lab:x.total.n+'',t:tt(x),s:T('trades en démo · ','demo trades · ')+money(x.total.net),c:'var(--accent)'});});
 if(R.length)h+='<div class="grp">'+T('En cours, à suivre','Running, worth watching')+' <em>'+R.length+'</em></div><div class="hs">'+R.map(r=>'<button class="run" onclick="go(\''+r.id+'\')">'+ring(r.p,r.c,r.lab)+'<span class="rt"><b>'+esc(r.t)+'</b><small>'+esc(r.s)+'</small></span></button>').join('')+'</div>';
 if((D.next||[]).length)h+='<div class="card" style="margin-top:6px"><h2>'+T('Prochains rendez-vous','Coming up')+'</h2><div class="dates">'+D.next.map(n=>{const d=new Date(n.date+'T12:00:00Z');

  ((v.items||[]).map(x=>'<div class="tli"><b>'+ago(new Date(x.t).getTime()/1000)+'</b><span>'+esc(EN?(x.en||x.fr):x.fr)+'</span></div>').join('')||'<div class="sub">—</div>')+'</div></div>';
 // clues and questions
 const P=t.pistes||[];const LB={trop_tot:[T('trop tôt','too early'),'var(--muted)'],a_tester:[T('à vérifier','worth checking'),'var(--up-soft)'],divergent:[T('pas net','not clear'),'var(--warn)']};
 if(P.length)h+='<div class="card" id="tm-pi"><h2>'+T('Les pistes','The clues')+'<span class="bd ev">'+P.length+'</span></h2><div class="sub" style="margin-bottom:12px">'+T('Des piles de vrais trades que l\'IA met face à tous les autres.','Piles of real trades the AI puts against all the others.')+'</div><div class="rk">'+
  P.map(p=>{const l=LB[p.label]||[T('en cours','being counted'),'var(--muted)'];const d=p.win!=null&&p.rest_win!=null?p.win-p.rest_win:null;
   return '<div class="rr" style="align-items:flex-start"><span class="nm"><b style="white-space:normal">'+esc(EN?(p.name_en||p.name_fr):(p.name_fr||p.name_en))+'</b><small>'+(p.n||0)+' trades · <span style="color:'+l[1]+'">'+l[0]+'</span>'+(p.by==='chercheur'?' · '+T('ouverte par l\'IA','opened by the AI'):'')+'</small></span><span class="vv"><b class="'+(d==null?'':(d>=0?'pos':'neg'))+'">'+(p.win!=null?num(p.win,0)+' %':'—')+'</b><small>'+T('autres ','others ')+(p.rest_win!=null?num(p.rest_win,0)+' %':'—')+'</small></span></div>';}).join('')+'</div></div>';
 const Q=t.asks||[];if(Q.length)h+='<div class="card" id="tm-qa"><h2>'+T('Questions et réponses','Questions and answers')+'</h2><div class="mini">'+Q.map(q=>'<div class="mi" style="align-items:flex-start;flex-direction:column;gap:6px"><b>'+esc(EN?q.seed_en:q.seed_fr)+'</b>'+(q.answer_fr?'<span style="color:var(--text2)">'+esc(EN?(q.answer_en||q.answer_fr):q.answer_fr)+'</span>':'<small style="color:var(--muted)">'+esc(q.note||T('en attente','waiting'))+'</small>')+'</div>').join('')+'</div></div>';
 $('top').innerHTML=h;$('list').innerHTML='';}

/* ---------- routing + loading for all three sides ---------- */
function route(){const h=new URLSearchParams(location.hash.slice(1));const id=h.get('s'),rid=h.get('r');
 if(id&&D&&byId(id)){if(SIDE!=='strat'){SIDE='strat';doors();}CUR=byId(id);CURR=null;SEC=h.get('v')||'ov';document.body.classList.add('det');renderDet();window.scrollTo(0,0);return;}
 if(rid&&RB&&rbById(rid)){if(SIDE!=='robots'){SIDE='robots';doors();}CURR=rbById(rid);CUR=null;RSEC=h.get('v')||'ov';document.body.classList.add('det');renderRobot();window.scrollTo(0,0);return;}
 if((id&&!D)||(rid&&!RB)){load();return;}
 NAV=0;document.body.classList.remove('det');CUR=null;CURR=null;head();paint();}
const LOCK='<div class="card" style="margin-top:10px"><h2>'+T('Réservé à l\'offre Stratégie','Strategy plan only')+'</h2><div class="sub">'+T('Le labo montre toutes les stratégies, tous les robots et le travail des IA. Il fait partie de l\'offre Stratégie.','The lab shows every strategy, every robot and the AIs\' work. It is part of the Strategy plan.')+'</div></div>';
async function getJ(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});return r.json();}
async function load(){try{
 const h=new URLSearchParams(location.hash.slice(1));
 const needS=SIDE==='strat'||h.get('s')||SIDE==='robots',needR=SIDE==='robots'||h.get('r'),needT=SIDE==='team';
 const [s,r,t]=await Promise.all([needS?getJ('strategies_data'):null,needR?getJ('robots_data'):null,needT?getJ('team_data'):null]);
 if([s,r,t].some(x=>x&&x.err)){$('top').innerHTML='';$('list').innerHTML=LOCK;return;}
 const first=(s&&!D)||(r&&!RB)||(t&&!TM);if(s)D=s;if(r)RB=r;if(t)TM=t;$('livet').textContent=T('À jour','Up to date');
 // a refresh never moves the reader: lists redraw, an open strategy or robot keeps its place
 if(document.body.classList.contains('det')){if(CUR)CUR=byId(CUR.id)||CUR;if(CURR)CURR=rbById(CURR.id)||CURR;if(first)route();return;}
 const q=$('q'),typing=q&&document.activeElement===q;
 if(first)route();else paint();
 if(typing){const q2=$('q');if(q2){q2.focus();q2.setSelectionRange(Q.length,Q.length);}}
}catch(e){$('livet').textContent=T('Hors ligne','Offline');}}
window.addEventListener('hashchange',route);
$('back').onclick=e=>{e.preventDefault();if(document.body.classList.contains('det')){if(NAV>0){NAV--;history.back();}else{history.replaceState(null,'',location.pathname+location.search);route();}return;}
 if(history.length>1)history.back();else location.href='./';};
if(EN){document.documentElement.lang='en';}
doors();head();load();setInterval(()=>{if(!document.hidden)load();},60000);
</script></body></html>
