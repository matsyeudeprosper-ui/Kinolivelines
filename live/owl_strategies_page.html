function ztVerdict(a,c){if(!a||a.trades==null)return {c:'var(--muted)',k:'gy',i:'?',t:T('Pas de résultat','No result'),s:''};

 // 2026-10-17 (owner: "solid, not random?"): a gain is only "solid" when it beats random entries on the same market and
 // period (95 out of 100 random draws do worse). Below that, a gain is "not proven"; with no control yet, it says so.

 if(a.net>0&&pc!=null)return {c:'var(--up)',k:'gr',i:'✓',sh:T('Bat le hasard','Beats chance'),t:T('Bat le hasard, mais pas sur toute la période','Beats chance, but not over the whole period'),s:bt+T(', mais une des deux moitiés perd.',', but one of the two halves loses.')};

 (r.mtests||[]).filter(x=>x.state==='done'&&x.robot).forEach(x=>R.push({sym:x.sym,nm:mkName(x.sym)||x.name||x.sym,cat:((MKL&&MKL.symbols||[]).find(z=>z.s===x.sym)||{}).cat,a:x.robot,b:x.parent_result||{},ctl:x.ctl||null,days:x.days,fills:x.fills||'bars',win:x.window_utc,at:x.tested_at}));

function cmpShow(a,b){const A=bById(a),B=bById(b);if(!A||!B)return;const x=A.test.robot,y=B.test.robot,na=T(A.name_fr,A.name_en),nb=T(B.name_fr,B.name_en);
 const row=(l,va,vb,fa,fb,hi)=>{const wa=hi==null?0:(hi?(va>vb):(va<vb))?1:((va===vb)?0:2);
  return '<tr><td>'+l+'</td><td'+(wa===1?' class="w"':'')+'>'+fa+'</td><td'+(wa===2?' class="w"':'')+'>'+fb+'</td></tr>';};
 const pc2=v=>v==null?'—':Math.round(v*100)+' %';
 const RA=A.resolved||{},RB2=B.resolved||{};const diff=[];
 SLOTS.forEach(s=>{const k=s[0],va=slotVal(RA,k),vb=slotVal(RB2,k);if(va!==vb)diff.push('<div class="cdf"><span>'+pic(s[2])+s[1]+'</span><b>'+esc(va)+'</b><b>'+esc(vb)+'</b></div>');});
 shOpen(na+' · '+nb,'<div class="card">'+lineChart([{a:cumOf(x.curve),c:'var(--accent)',n:na},{a:cumOf(y.curve),c:'#e8c55a',n:nb}],{h:200})+
  '<div class="note">'+T('Les deux testés sur la même période, avec le même compte de départ : seules les pièces changent.','Both tested over the same period with the same starting account: only the pieces change.')+'</div></div>'+
  '<div class="card"><table class="ctb"><tr><th></th><th style="color:var(--accent-soft)">'+esc(na)+'</th><th style="color:#e8c55a">'+esc(nb)+'</th></tr>'+
  row(T('Résultat','Result'),x.net,y.net,'<span class="'+cl(x.net)+'">'+money(x.net)+'</span>','<span class="'+cl(y.net)+'">'+money(y.net)+'</span>',true)+
  row('Trades',x.trades,y.trades,num(x.trades||0),num(y.trades||0),null)+
  row(T('Gagnés','Won'),x.win_rate,y.win_rate,pc2(x.win_rate),pc2(y.win_rate),true)+
  row(T('Facteur de profit','Profit factor'),x.profit_factor,y.profit_factor,num(x.profit_factor,2),num(y.profit_factor,2),true)+
  row(T('Plus forte baisse','Deepest dip'),x.cc_dd,y.cc_dd,'−$'+num(x.cc_dd||0,0),'−$'+num(y.cc_dd||0,0),false)+
  row(T('1re moitié','1st half'),x.first_half,y.first_half,money(x.first_half||0),money(y.first_half||0),true)+
  row(T('2e moitié','2nd half'),x.later_half,y.later_half,money(x.later_half||0),money(y.later_half||0),true)+'</table>'+
  '<div class="note">'+T('En gras : le meilleur des deux sur la ligne. Une seule moitié qui gagne ne suffit pas.','In bold: the better of the two on that line. Winning only one half is not enough.')+'</div></div>'+
  (diff.length?'<div class="card"><h2>'+T('Ce qui les différencie','What differs')+'</h2>'+diff.join('')+'</div>':'')+
  '<div class="fds"><button class="fd" onclick="goB(\''+a+'\')">'+ICO('#8fc6ff',BOT)+'<span class="tx"><b>'+esc(na)+'</b><small>'+T('ouvrir sa page','open its page')+'</small></span><span class="cv">›</span></button><button class="fd" onclick="goB(\''+b+'\')">'+ICO('#e8c55a',BOT)+'<span class="tx"><b>'+esc(nb)+'</b><small>'+T('ouvrir sa page','open its page')+'</small></span><span class="cv">›</span></button></div>');}

async function gsOpen(){shOpen(T('Chercher dans le labo','Search the lab'),'<label class="search" style="width:100%;margin-bottom:12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="gsq" placeholder="'+T('Une stratégie, un robot, une pièce…','A strategy, a robot, a piece…')+'" oninput="gsRun(this.value)" autocomplete="off"></label><div id="gsr"></div>');
 setTimeout(()=>{const q=$('gsq');if(q)q.focus();},350);
 try{const [s,r]=await Promise.all([D?null:getJ('strategies_data'),RB?null:getJ('robots_data')]);
  if((s&&s.err)||(r&&r.err)){const g=$('gsr');if(g)g.innerHTML=LOCK;return;}if(s)D=s;if(r)RB=r;}catch(e){}
 gsRun(($('gsq')||{}).value||'');}

 if(q.length<2){g.innerHTML='<div class="note">'+T('Tapez au moins deux lettres : un robot, une pièce, un marché (or, nasdaq…) ou une stratégie.','Type at least two letters: a robot, a piece, a market (gold, nasdaq…) or a strategy.')+'</div>';return;}
 const has=t=>String(t||'').toLowerCase().includes(q);
 const S=((D&&D.items)||[]).filter(x=>has(tt(x))||has(pl(x))||has(vd(x))).slice(0,12);
 const R=(BLD().robots||[]).filter(r=>has(r.name_fr)||has(r.name_en)).slice(0,8);
 const P=pcs().filter(x=>has(x.name_fr)||has(x.name_en)||has(x.plain_fr)||has(x.plain_en)).slice(0,10);
 const MK={};(BLD().robots||[]).forEach(r=>{if(r.test&&r.test.robot)(MK.BTCUSD=MK.BTCUSD||[]).push([r,r.test.robot,r.test.ctl]);(r.mtests||[]).filter(x=>x.state==='done'&&x.robot).forEach(x=>(MK[x.sym]=MK[x.sym]||[]).push([r,x.robot,x.ctl]));});
 const MS=Object.keys(MK).filter(sy=>has(sy)||has(mkName(sy))||has({XAUUSD:'gold or',USTEC:'nasdaq',US30:'dow',USOIL:'oil petrole pétrole',BTCUSD:'bitcoin btc'}[sy]));
 const row=(on,ic,c,t,s)=>'<button class="fd" onclick="'+on+'">'+ICO(c,ic)+'<span class="tx"><b>'+t+'</b>'+(s?'<small>'+s+'</small>':'')+'</span><span class="cv">›</span></button>';
 let h='';
 let hS='';if(S.length)hS+='<div class="grp">'+T('Stratégies','Strategies')+' <em>'+S.length+'</em></div><div class="fds">'+S.map(x=>{const m=ST[x.status]||ST.study;return row('go(\''+x.id+'\')',fic(x.fam),m.c,esc(tt(x)),T(m.fr,m.en)+' · '+fnm(x.fam));}).join('')+'</div>';
 if(R.length)h+='<div class="grp">'+T('Robots','Robots')+' <em>'+R.length+'</em></div><div class="fds">'+R.map(r=>{const m=bstOf(r),tr=r.test&&r.test.robot;return row('goB(\''+r.id+'\')',BOT,m.c,esc(T(r.name_fr,r.name_en)),T(m.fr,m.en)+(tr?' · '+money(tr.net,0)+' · '+(ztVerdict(tr,r.test.ctl).sh||''):''));}).join('')+'</div>';
 if(MS.length)h+='<div class="grp">'+T('Marchés','Markets')+' <em>'+MS.length+'</em></div><div class="fds">'+MS.map(sy=>{const L=MK[sy].sort((a,b)=>(b[1].net||0)-(a[1].net||0)),bst=L[0],v=ztVerdict(bst[1],bst[2]);return row('goZt(\''+bst[0].id+'\')',pic('M3 3v18h18M7 14l4-4 4 4 5-6'),v.c,esc(mkName(sy)||sy),L.length+T(' robot'+(L.length>1?'s':'')+' testé'+(L.length>1?'s':'')+' · meilleur : ',' robot'+(L.length>1?'s':'')+' tested · best: ')+esc(T(bst[0].name_fr,bst[0].name_en))+' '+money(bst[1].net,0)+' · '+(v.sh||''));}).join('')+'</div>';
 if(P.length)h+='<div class="grp">'+T('Pièces','Pieces')+' <em>'+P.length+'</em></div><div class="fds">'+P.map(x=>{const sl=SLOTS.find(s=>SLOTT[s[0]]===x.type)||SLOTS[0];return row('goP(\''+x.id+'\')',pic(sl[2]),(PST[x.status]||PST.tested).c,esc(T(x.name_fr,x.name_en)),sl[1]+' · '+T((PST[x.status]||PST.tested).fr,(PST[x.status]||PST.tested).en));}).join('')+'</div>';
 h+=hS;   // strategies last: robots, markets and pieces are what people look for here
 g.innerHTML=h||'<div class="empty">'+T('Rien trouvé pour « ','Nothing found for “')+esc(q)+T(' ».','”.')+'</div>';}

/* ---------- routing + loading for all three sides ---------- */
function route(){const h=new URLSearchParams(location.hash.slice(1));const id=h.get('s'),rid=h.get('r');
 if(id&&D&&byId(id)){if(SIDE!=='strat'){SIDE='strat';doors();}CUR=byId(id);CURR=null;SEC=h.get('v')||'ov';document.body.classList.add('det');renderDet();window.scrollTo(0,0);return;}
 if(rid&&RB&&rbById(rid)){if(SIDE!=='robots'){SIDE='robots';doors();}CURR=rbById(rid);CUR=null;RSEC=h.get('v')||'ov';document.body.classList.add('det');renderRobot();window.scrollTo(0,0);return;}
 const bid=h.get('b'),sid=h.get('studio'),pid=h.get('p'),aid=h.get('ai');
 if(aid&&RB){if(SIDE!=='robots'){SIDE='robots';doors();}CURB=null;CUR=null;CURR=null;document.body.classList.add('det');window.scrollTo(0,0);
  if(aid==='new'){AISTU=h.get('studio')||AISTU;renderAINew();}else{if(!AIJ||AIJ.id!==aid){$('det').innerHTML='<div class="skel"></div>';}aiOpen(aid);}return;}
 if(h.get('mk')&&RB){if(SIDE!=='robots'){SIDE='robots';doors();}CURB=null;CUR=null;CURR=null;if(!MK)MK={type:'exit',rule:JSON.parse(JSON.stringify(MKDEF.exit)),name:'',prev:null,err:''};document.body.classList.add('det');mkRender();mkPreview();window.scrollTo(0,0);return;}
 if(pid&&RB&&pById(pid)){if(SIDE!=='robots'){SIDE='robots';doors();}CURP=pById(pid);CURB=null;CUR=null;CURR=null;document.body.classList.add('det');renderPiece();window.scrollTo(0,0);return;}
 if(sid&&!aid){if(SIDE!=='robots'){SIDE='robots';doors();}CURB=null;CUR=null;CURR=null;document.body.classList.add('det');if(!STU||STU.id!==sid){$('det').innerHTML='<div class="skel"></div>';openStudio(sid);}else renderStudio();window.scrollTo(0,0);return;}
 if(bid&&RB&&bById(bid)){if(SIDE!=='robots'){SIDE='robots';doors();}CURB=bById(bid);CUR=null;CURR=null;document.body.classList.add('det');renderB();window.scrollTo(0,0);return;}
 if(h.has('zt')&&RB){if(SIDE!=='robots'){SIDE='robots';doors();}head();CURB=null;CUR=null;CURR=null;document.body.classList.add('det');if(h.get('zt'))ZT.rid=h.get('zt');renderZT();ztLoadMk().then(()=>{if(new URLSearchParams(location.hash.slice(1)).has('zt'))renderZT();});window.scrollTo(0,0);return;}
 if(h.get('new')&&RB){if(SIDE!=='robots'){SIDE='robots';doors();}CURB=null;CUR=null;CURR=null;if(!NEWD)NEWD={parent:(h.get('new')!=='1'&&bById(h.get('new')))?h.get('new'):'owl',parts:{},name:''};document.body.classList.add('det');renderNew();window.scrollTo(0,0);return;}
 if((id&&!D)||((rid||bid||pid||aid||h.get('new')||h.get('mk')||h.has('zt'))&&!RB)){load();return;}
 NAV=0;NEWD=null;MK=null;clearTimeout(AIT);document.body.classList.remove('det');CUR=null;CURR=null;CURB=null;head();paint();}

 '<div class="eyebrow">'+T('Offre Stratégie','Strategy plan')+'</div><h3 style="margin-top:8px">'+T('Le labo : voir comment le robot est construit, et construire le vôtre','The lab: see how the robot is built, and build your own')+'</h3><ul>'+
 '<li><i>✓</i><span><b>'+T('Toutes les stratégies','Every strategy')+'</b> — '+T('de l\'idée à l\'argent réel, avec leurs résultats','from idea to real money, with their results')+'</span></li>'+

 '<button class="cta" onclick="location.href=\'./#offres\'">'+T('Voir l\'offre Stratégie','See the Strategy plan')+'</button></div>';
async function getJ(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});return r.json();}
async function load(){try{
 const h=new URLSearchParams(location.hash.slice(1));
 const needS=SIDE==='strat'||h.get('s')||SIDE==='robots',needR=SIDE==='robots'||h.get('r')||h.get('b')||h.get('p')||h.get('new')||h.get('mk')||h.get('ai')||h.has('zt'),needT=SIDE==='team';
 const [s,r,t]=await Promise.all([needS?getJ('strategies_data'):null,needR?getJ('robots_data'):null,needT?getJ('team_data'):null]);
 let s2=s;if(SIDE==='robots'&&r&&!r.err&&s&&s.err)s2=null;
 if([s2,r,t].some(x=>x&&x.err)){$('top').innerHTML='';$('list').innerHTML=LOCK;return;}
 const first=(s2&&!D)||(r&&!RB)||(t&&!TM);if(s2)D=s2;if(r)RB=r;if(t)TM=t;{const _n=new Date();$('livet').textContent=String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0');}
 // a refresh never moves the reader: lists redraw, an open strategy or robot keeps its place
 if(document.body.classList.contains('det')){if(CUR)CUR=byId(CUR.id)||CUR;if(CURR)CURR=rbById(CURR.id)||CURR;
  if(CURB){const nb=bById(CURB.id);if(nb&&nb.stage!==CURB.stage){CURB=nb;renderB();}else if(nb)CURB=nb;}
  if(first)route();return;}
 const q=$('q'),typing=q&&document.activeElement===q;
 if(first)route();else paint();
 if(typing){const q2=$('q');if(q2){q2.focus();q2.setSelectionRange(Q.length,Q.length);}}
}catch(e){$('livet').textContent=T('Hors ligne','Offline');}}
window.addEventListener('hashchange',route);
$('back').onclick=e=>{e.preventDefault();if(document.body.classList.contains('det')){if(NAV>0){NAV--;history.back();}else{history.replaceState(null,'',location.pathname+location.search);route();}return;}
 if(history.length>1)history.back();else location.href='./';};
if(EN){document.documentElement.lang='en';}
doors();head();load();setInterval(()=>{if(!document.hidden)load();},60000);
