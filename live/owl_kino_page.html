<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('owlTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* 2026-10-19 (owner): "Kino et toi" - what Kino pursues with the member, what it remembers (they can make it forget),
   the lab's playbook; for the owner also Kino's mind (lessons it wrote itself, self-model, journal). Same tokens as the
   Atelier. Data: kino_data; forget: POST kino_forget. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;--border:#1f2a38;--border2:#2b3a4d;
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;--accent:#3b82f6;--accent-soft:#8fc6ff;--up:#2ecc71;--up-soft:#8df0bb;
 --down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;--sh:0 18px 50px rgba(0,0,0,.45)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-theme]){}}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#fff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;--text:#10161f;
 --text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--sh:0 18px 50px rgba(20,40,70,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;
 background:radial-gradient(45% 55% at 15% 20%,rgba(167,139,250,.16),transparent 70%),radial-gradient(45% 50% at 85% 10%,rgba(59,130,246,.15),transparent 70%);filter:blur(12px)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--border2);background:var(--surface);display:grid;place-items:center;color:var(--text);text-decoration:none;flex:none}
.ib svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px;margin:18px 0 22px}
.orb{width:68px;height:68px;border-radius:22px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:0 14px 36px rgba(109,92,246,.45);font-size:34px}
.hero h1{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.02em}.hero p{margin:4px 0 0;color:var(--muted2);font-size:.92rem;line-height:1.45}
.card{border-radius:22px;border:1px solid var(--border2);background:var(--surface);padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card h2{margin:0 0 10px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);display:flex;align-items:center;gap:8px}
.card h2 i{font-style:normal;color:var(--violet-soft)}
.goal b{display:block;font-size:1.05rem;line-height:1.45}.goal small{display:block;color:var(--muted);margin-top:8px;font-size:.84rem;line-height:1.45}
.goal .nx{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:.88rem;color:var(--text2)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:.9rem;line-height:1.45;color:var(--text2)}
.it span{flex:1}.it button{flex:none;border:0;background:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 2px}
.it button:hover{color:var(--down-soft)}
.sub{color:var(--muted);font-size:.8rem;margin:-4px 0 10px;line-height:1.45}
.empty{color:var(--muted);font-size:.88rem;padding:6px 2px}
.mind .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.mind .row{grid-template-columns:1fr}}
.pill{border-radius:16px;padding:12px;border:1px solid var(--border);background:var(--surface2)}
.pill b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.pill ul{margin:0;padding-left:18px;font-size:.86rem;line-height:1.5;color:var(--text2)}
.mood{margin-top:10px;font-size:.9rem;color:var(--text2);font-style:italic}
.jr{border-left:2px solid var(--violet);padding:4px 0 4px 12px;margin:10px 0}.jr b{font-size:.78rem;color:var(--muted2)}.jr p{margin:4px 0 0;font-size:.9rem;line-height:1.55;color:var(--text2)}
.badge{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(232,197,90,.14);color:var(--warn);border:1px solid rgba(232,197,90,.35)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#3b82f6,#6d5cf6);text-decoration:none}
</style></head><body>
<div class="wrap">
 <header><a class="ib" href="atelier" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a></header>
 <div class="hero"><div class="orb">🦉</div><div><h1>Kino</h1><p id="hs">Ton compagnon de trading. Ce qu'il vise avec toi, ce qu'il retient, ce qu'il apprend.</p></div></div>
 <a class="cta" href="kinoday" style="margin:0 0 14px;background:rgba(124,92,255,.18)">☀️ La journée de Kino →</a>
 <div id="main"><div class="empty">Chargement…</div></div>
 <a class="cta" href="atelier">Parler à Kino</a>
</div>
<script>
const B=location.pathname.replace(/kino\/?$/,'');let EN=false;try{EN=localStorage.getItem('owlLang')==='en';}catch(e){}
const T=(f,e)=>EN?e:f,$=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;
async function load(){try{D=await (await fetch(B+'kino_data',{cache:'no-store'})).json();}catch(e){$('main').innerHTML='<div class="empty">'+T('Hors ligne.','Offline.')+'</div>';return;}paint();}
function paint(){let h='';const g=D.goal||{};
 h+='<div class="card goal"><h2><i>◎</i>'+T('Ce qu’on vise ensemble','What we are aiming at')+'</h2>'+(g.goal?'<b>'+esc(g.goal)+'</b>'+(g.why?'<small>'+esc(g.why)+'</small>':'')+(g.next?'<div class="nx">'+T('Prochaine étape : ','Next step: ')+esc(g.next)+'</div>':''):'<div class="empty">'+T('Kino se fixe un objectif avec toi après vos premières conversations.','Kino sets a goal with you after your first conversations.')+'</div>')+'</div>';
 const PT=D.path||[];
 if(PT.length){const done=PT.filter(x=>x.date).length,nx=PT.find(x=>!x.date);
  h+='<div class="card"><h2><i>➶</i>'+T('Ton parcours','Your path')+' · '+done+'/'+PT.length+'</h2><div class="list">'+PT.map(x=>'<div class="it"'+(x.date?'':' style="opacity:.55"')+'><span>'+(x.date?'✅ ':(nx&&nx.k===x.k?'👉 ':'◻️ '))+esc(x.label)+(x.date?' <small style="color:var(--muted)">· '+esc(x.date)+'</small>':'')+'</span></div>').join('')+'</div></div>';}
 const PR=D.portrait||{};
 h+='<div class="card"><h2><i>◐</i>'+T('Ce que Kino a compris de toi','What Kino understood about you')+'</h2>'+(PR.text?'<div class="it" style="display:block"><span>'+esc(PR.text)+'</span></div>'+(PR.date?'<p class="sub" style="margin-top:6px">'+esc(PR.date)+'</p>':''):'<p class="sub">'+T('Kino l’écrit quand il te connaît un peu mieux.','Kino writes it once it knows you a bit better.')+'</p>')+
  '<textarea id="fix" rows="2" maxlength="400" placeholder="'+T('Il se trompe ? Corrige-le ici…','Wrong? Correct it here…')+'" style="width:100%;margin-top:10px;font:inherit;font-size:.9rem;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:10px 12px"></textarea>'+
  '<div style="display:flex;gap:8px"><button class="cta" style="flex:1" onclick="fixIt()">'+T('Envoyer la correction','Send the correction')+'</button><button class="cta" style="flex:1;background:var(--surface3)" onclick="redo()">'+T('Réécrire','Rewrite')+'</button></div></div>';
 const N=D.notes||[],MA=D.memory_all||{};const row=(k,i,t,fx)=>'<div class="it"><span>'+esc(t)+'</span>'+(fx?'<button onclick="memFix(\''+k+'\','+i+')" aria-label="Corriger">✎</button>':'')+'<button onclick="memDel(\''+k+'\','+i+')" aria-label="Oublier">✕</button></div>';const sec=(lab,k,L,fx)=>L&&L.length?'<div class="sub" style="margin:12px 0 4px"><b>'+lab+'</b></div><div class="list">'+L.map((t,i)=>row(k,i,t,fx)).join('')+'</div>':'';h+='<div class="card"><h2><i>✎</i>'+T('Ce que Kino retient de toi','What Kino remembers about you')+'</h2><p class="sub">'+T('C’est sa mémoire de toi. ✎ pour corriger (il le saura), ✕ pour qu’il oublie.','This is its memory of you. ✎ to correct it (it will know), ✕ to make it forget.')+'</p>'+(N.length?'<div class="list">'+N.map((n,i)=>row('note',i,n,true)).join('')+'</div>':'<div class="empty">'+T('Rien encore.','Nothing yet.')+'</div>')+sec(T('Tes consignes (comment il travaille avec toi)','Your instructions (how it works with you)'),'standing',MA.standing,true)+sec(T('Vos moments partagés','Your shared moments'),'moment',MA.moments,false)+sec(T('Vos blagues','Your running jokes'),'joke',MA.jokes,false)+sec(T('Tes décisions (il y repense avec toi après 1 semaine et 1 mois)','Your decisions (it looks back with you after 1 week and 1 month)'),'decision',MA.decisions,true)+'</div>';  const F=D.feed||{};
 if(F.items&&F.items.length)h+='<div class="card"><h2><i>◈</i>'+T('Ce que le nid teste','What the nest is testing')+'</h2><p class="sub">'+esc(F.title||'')+(F.date?' · '+esc(F.date):'')+'</p><div class="list">'+F.items.map(x=>'<div class="it" style="display:block"><b style="display:block;color:var(--text)">'+esc(x.title)+'</b><span style="display:block;margin-top:3px">'+esc(x.detail)+'</span>'+(x.kino?'<span style="display:block;margin-top:6px;color:var(--violet-soft)">🦉 '+esc(x.kino)+'</span>':'')+'</div>').join('')+'</div></div>';
 const P=D.playbook||[];
 h+='<div class="card"><h2><i>✦</i>'+T('Le carnet du labo','The lab’s notebook')+'</h2><p class="sub">'+T('Ce que Kino a appris de tous les tests du labo (anonyme). Des pistes, pas des promesses.','What Kino learned from every test in the lab (anonymous). Leads, not promises.')+'</p>'+
  (P.length?'<div class="list">'+P.map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div>':'<div class="empty">'+T('Le carnet se remplit chaque nuit.','The notebook fills up every night.')+'</div>')+'</div>';
 /* 2026-10-19 (owner next-list item 1): Kino's own robot - its project, pretend money on live prices, for everyone */
 if(D.my_robot){const R=D.my_robot,S=R.sum||{};
  h+='<div class="card"><h2><i>🤖</i>'+T('Le robot de Kino','Kino’s own robot')+' <span class="badge">'+T('argent fictif','pretend money')+'</span></h2>'+
   '<p class="sub">'+esc(R.name||'')+' · '+esc(R.market||'')+' · '+T('né le ','born ')+esc(R.born||'')+'. '+T('Kino l’a construit lui-même et le fait trader sur les vrais prix en direct, en argent fictif. Il le fait évoluer comme toi le tien.','Kino built it itself and runs it on live prices with pretend money. It improves it like you do yours.')+'</p>'+
   '<div class="row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0"><div class="pill"><b>'+(S.trades||0)+'</b><br><small>trades</small></div><div class="pill"><b>'+(S.won_pct!=null?S.won_pct+' %':'—')+'</b><br><small>'+T('gagnés','won')+'</small></div><div class="pill"><b>'+((S.sum_r||0)>=0?'+':'')+(S.sum_r||0)+' R</b><br><small>'+T('résultat','result')+'</small></div></div>'+
   (R.open?'<div class="it"><span>● '+T('Un trade fictif est ouvert en ce moment','A pretend trade is open right now')+'</span></div>':'')+
   '<div class="list">'+(R.pieces||[]).filter(Boolean).map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div>'+
   ((R.diary||[]).length?'<p class="sub" style="margin:10px 0 4px"><b>'+T('Son carnet','Its diary')+'</b></p>'+R.diary.slice().reverse().map(d=>'<div class="jr"><b>'+esc(d.date)+'</b><p>'+esc(d.text)+'</p></div>').join(''):'')+
   ((R.changes||[]).length?'<p class="sub" style="margin:10px 0 4px"><b>'+T('Ce qu’il a changé','What it changed')+'</b></p><div class="list">'+R.changes.slice().reverse().map(c=>'<div class="it"><span><b>'+esc(c.date)+'</b> · '+esc(c.what)+(c.why?' — <i>'+esc(c.why)+'</i>':'')+'</span></div>').join('')+'</div>':'')+'</div>';}
 if(D.admin&&D.mind){const M=D.mind,S=M.self||{},PE=M.personality||{};
  /* 2026-10-19 (owner next-list item 7): more of the mind for its creator */
  const MM=D.mind_more||{};
  /* 2026-10-21 (owner: "Kino's life only visible to me admin") */
  if(D.life){const Lf=D.life,sc=Lf.score||{},dt=t=>new Date(t*1000).toLocaleDateString(EN?'en-GB':'fr-FR',{day:'numeric',month:'short'});
   h+='<div class="card"><h2><i>✦</i>'+T('Sa vie · visible par toi seul','His life · only you see this')+'</h2>'+
    '<p class="sub">'+T('Ses paris sur les marchés : ','His market bets: ')+'<b>'+(sc.right||0)+'/'+(sc.n||0)+'</b>'+T(' justes',' right')+(sc.by?' · '+Object.entries(sc.by).map(([k,v])=>esc(k)+' '+esc(v)).join(' · '):'')+'</p>'+
    (Lf.lessons||[]).map(x=>'<div class="it"><span>💡 '+esc(x)+'</span></div>').join('')+
    ((Lf.journal||[]).length?'<p class="sub" style="margin:12px 0 4px"><b>'+T('Son carnet de vie','His life journal')+'</b></p>'+Lf.journal.slice(0,14).map(x=>'<div class="jr"><b>'+dt(x.t)+' · '+esc(x.kind)+'</b><p>'+esc(x.text)+'</p></div>').join(''):'')+
    ((Lf.human||[]).length?'<p class="sub" style="margin:12px 0 4px"><b>'+T('Ce que les humains lui ont appris','What humans taught him')+'</b></p>'+Lf.human.map(x=>'<div class="jr"><b>'+esc(x.q)+'</b><p>'+esc(x.a)+'</p></div>').join(''):'')+
    ((Lf.open_questions||[]).length?'<p class="sub" style="margin:12px 0 4px"><b>'+T('Les questions qu’il creuse','The questions he is digging into')+'</b></p>'+Lf.open_questions.map(q=>'<div class="it"><span>❓ '+esc(q)+'</span></div>').join(''):'')+
    (Object.keys(Lf.habits||{}).length?'<p class="sub" style="margin:12px 0 4px"><b>'+T('Les heures qui bougent (mesuré)','The hours that move (measured)')+'</b></p>'+Object.entries(Lf.habits).map(([s_,L_])=>'<div class="it"><span><b>'+esc(s_)+'</b> · '+L_.map(z=>z.h+'h UTC ×'+String(z.x).replace('.',EN?'.':',')).join(' · ')+'</span></div>').join(''):'')+'</div>';}
  if(D.kino_report){const R=D.kino_report,cl=R.calls||{};
   h+='<div class="card"><h2><i>✓</i>'+T('Son bulletin · 7 derniers jours','His report card · last 7 days')+'</h2><div class="list">'+
    [[T('Messages','Messages'),R.msgs],[T('Venus de lui-même','On his own'),R.own_pct+' %'],[T('Finissent par une question','End with a question'),R.q_pct+' %'],[T('Demandent la permission','Ask permission'),R.perm_pct+' %'],
     [T('Promesses tenues','Promises kept'),R.kept],[T('Réponses en retard (réveillé)','Late answers (woken up)'),R.missed],[T('Se corrige lui-même','Corrects himself'),R.corrections],[T('Notes vocales','Voice notes'),R.voice_notes],
     [T('Appels','Calls'),(cl.n||0)+' · '+(cl.min||0)+' min · '+(cl.usd||0)+' $ · '+(cl.deleg||0)+T(' questions au cerveau',' brain questions')],
     [T('Coût du cerveau','Brain cost'),R.brain_usd==null?'—':R.brain_usd+' $'],[T('Coût voix haute','Read-aloud cost'),R.tts_usd==null?'—':R.tts_usd+' $'],[T('Minutes vendues · coûts · marge','Minutes sold · costs · margin'),R.money?R.money.sold+' $ · '+R.money.cost+' $ · '+R.money.margin+' $':'—']]
     .map(r=>'<div class="it"><span>'+esc(r[0])+'</span><b>'+esc(String(r[1]))+'</b></div>').join('')+'</div></div>';
   const RV=R.review||{},IT=RV.items||{};if(RV.t)h+='<div class="card"><h2><i>✎</i>'+T('Sa relecture de la nuit','His night self-review')+'</h2><div class="list">'+
    ((RV.habits_fr||RV.habits||[]).length?(RV.habits_fr||RV.habits).map(x=>'<div class="it"><span>• '+esc(x)+'</span></div>').join(''):'<div class="it"><span>'+T('Rien à corriger hier.','Nothing to fix yesterday.')+'</span></div>')+
    [['twice',T('Dit deux fois','Said twice')],['permission',T('Permission demandée','Asked permission')],['menu',T('Menu proposé','Offered a menu')],['late_promises',T('Promesses en retard','Late promises')]].map(z=>(IT[z[0]]||[]).length?'<div class="it"><span><b>'+z[1]+'</b><br><small>'+IT[z[0]].map(esc).join('<br>')+'</small></span></div>':'').join('')+'</div></div>';}
  if(MM.mood&&MM.mood.why)h+='<div class="card"><h2><i>☀</i>'+T('Son humeur','Its mood')+'</h2><div class="mood">'+(['😔','😕','😐','🙂','😄'][(MM.mood.level|0)+2]||'😐')+' « '+esc(MM.mood.why)+' »</div></div>';
  if(MM.exp_now&&MM.exp_now.running){const E=MM.exp_now.results||{},f=k=>{const x=E[k]||{};return (x.kino_msgs||0)+' '+T('messages','messages')+' · '+(x.answered||0)+' '+T('réponses','replies')+' · 👍 '+(x.liked||0)+' · 👎 '+(x.disliked||0);};
   h+='<div class="card"><h2><i>⚗</i>'+T('Où en est son test','How its test is going')+' · '+MM.exp_now.days+' '+T('j','d')+'</h2><div class="list"><div class="it"><span><b>A</b> · '+f('a')+'</span></div><div class="it"><span><b>B</b> · '+f('b')+'</span></div></div>'+
    ((MM.exp_log||[]).length?'<p class="sub" style="margin:10px 0 4px"><b>'+T('Ses tests passés','Past tests')+'</b></p><div class="list">'+MM.exp_log.slice().reverse().map(x=>'<div class="it"><span><b>'+esc(x.date)+'</b> · '+T('gardé ','kept ')+esc(x.kept)+' — '+esc(x.lesson||'')+'</span></div>').join('')+'</div>':'')+'</div>';}
  if((MM.projects||[]).length)h+='<div class="card"><h2><i>◎</i>'+T('Ce sur quoi il travaille pour les membres','What it works on for members')+'</h2><div class="list">'+MM.projects.map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div><p class="sub" style="margin-top:8px">'+T('Idées de nuit inventées jusqu’ici : ','Night ideas so far: ')+(MM.night_ideas||0)+'</p></div>';
  if(MM.inner){const I=MM.inner,sc=I.score||{},md=I.mood||{};let q='';q+='<div class="it"><span><b>'+T('Humeur de fond','Background mood')+'</b> · '+esc(md.label||'')+' ('+((md.v||0)>0?'+':'')+(md.v||0)+')'+((md.why||[]).length?'<br><small style="color:var(--muted)">'+esc(md.why.slice(-2).join(' · '))+'</small>':'')+'</span></div>';q+='<div class="it"><span><b>'+T('Intuitions marché','Market hunches')+'</b> · '+(sc.right||0)+'/'+(sc.n||0)+T(' justes',' right')+'</span></div>';(I.feelings||[]).slice(0,4).forEach(f=>q+='<div class="it"><span>'+esc(f.kind)+' '+Math.round(f.v*100)+'% · <small>'+esc(f.why||'')+'</small></span></div>');(I.thoughts||[]).slice(0,6).forEach(t=>q+='<div class="it"><span><small style="color:var(--muted)">'+esc(t.kind)+' · '+Math.round((t.now||0)*100)+'%</small><br>'+esc(t.text)+(t.measure?'<br><small>'+esc(t.measure)+'</small>':'')+'</span></div>');(I.questions||[]).slice(-5).forEach(x=>q+='<div class="it"><span>? '+esc(x.q)+(x.finding?'<br><small>→ '+esc(x.finding)+'</small>':'')+'</span></div>');(I.notes||[]).slice(-2).forEach(n=>q+='<div class="it"><span>✎ '+esc(n.text)+'</span></div>');h+='<div class="card"><h2><i>✺</i>'+T('Sa vie intérieure','Its inner life')+'</h2><p class="sub">'+T('Ce qu’il ressent, ce qui lui trotte dans la tête, ses questions et ses paris.','What it feels, what is on its mind, its questions and bets.')+'</p><div class="list">'+q+'</div></div>';}
  if((MM.wishes||[]).length)h+='<div class="card"><h2><i>✋</i>'+T('Ce qui lui a manqué (à toi de choisir)','What it lacked (your call)')+'</h2><p class="sub">'+T('Kino note ce qu’il n’a pas pu faire pour aider un membre. Le chiffre = combien de fois.','Kino notes what it could not do to help a member. The number = how many times.')+'</p><div class="list">'+MM.wishes.map(w=>'<div class="it"><span><b>×'+(w.n||1)+'</b> · '+esc(w.text)+'</span></div>').join('')+'</div></div>';
  if((MM.fixes||[]).length)h+='<div class="card"><h2><i>✓</i>'+T('Ses corrections (il se relit)','Its corrections (it re-reads itself)')+'</h2><div class="list">'+MM.fixes.map(x=>'<div class="it"><span><small style="color:var(--muted)">'+esc(x.said)+'</small><br>→ '+esc(x.fix)+'</span></div>').join('')+'</div></div>';
  h+='<div class="card"><h2><i>✦</i>'+T('Ta direction pour Kino','Your direction for Kino')+' <span class="badge">'+T('créateur','creator')+'</span></h2><p class="sub">'+T('Qui il doit être. Il grandit seul, mais toujours dans cette direction (les membres ne le règlent pas).','Who it should be. It grows by itself, always within this direction (members cannot tune it).')+'</p>'+
   '<textarea id="dir" rows="4" maxlength="800" style="width:100%;font:inherit;font-size:.9rem;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:10px 12px;resize:vertical">'+esc(M.creator||'')+'</textarea>'+
   '<button class="cta" style="margin-top:8px" onclick="saveDir()">'+T('Enregistrer','Save')+'</button></div>';
  if(PE.traits||PE.expressions)h+='<div class="card"><h2><i>☺</i>'+T('Sa personnalité (il la fait grandir lui-même)','Its personality (it grows it itself)')+'</h2><div class="list">'+(PE.traits||[]).map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div>'+((PE.expressions||[]).length?'<p class="sub" style="margin-top:10px">'+T('Ses expressions : ','Its phrases: ')+(PE.expressions||[]).map(esc).join(' · ')+'</p>':'')+'</div>';
  (D.reports||[]).forEach(r=>{const L=(t,a)=>a&&a.length?'<p class="sub" style="margin:10px 0 4px"><b>'+t+'</b></p><div class="list">'+a.map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div>':'';
   h+='<div class="card"><h2><i>✉</i>'+T('Rapport de la semaine','Weekly report')+' · '+esc(r.date)+'</h2><b style="font-size:1rem">'+esc(r.title)+'</b><p class="sub" style="margin-top:6px">'+esc(r.members||'')+'</p>'+
    L(T('Ce qu’ils voulaient','What they wanted'),r.topics)+L(T('Où ils bloquent','Where they struggle'),r.struggles)+L(T('Ce qui a plu','What landed'),r.liked)+L(T('Idées qui émergent','Emerging ideas'),r.ideas)+
    (r.me?'<p class="sub" style="margin:10px 0 4px"><b>'+T('Kino sur lui-même','Kino about itself')+'</b></p><div class="it"><span>'+esc(r.me)+'</span></div>':'')+L(T('Suggestions pour l’app','Suggestions for the app'),r.suggestions)+'</div>';});
  h+='<div class="card mind"><h2><i>◉</i>'+T('L’esprit de Kino','Kino’s mind')+' <span class="badge">'+T('toi seul','owner only')+'</span></h2>'+
   '<div class="row"><div class="pill"><b>'+T('Ses forces','Strengths')+'</b><ul>'+(S.strengths||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="pill"><b>'+T('Ses faiblesses','Weaknesses')+'</b><ul>'+(S.weaknesses||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>'+
   (S.working_on?'<div class="it" style="margin-top:10px"><span><b>'+T('Il travaille sur : ','Working on: ')+'</b>'+esc(S.working_on)+'</span></div>':'')+(S.mood?'<div class="mood">« '+esc(S.mood)+' »</div>':'')+'</div>';
  if(M.exp&&M.exp.a)h+='<div class="card"><h2><i>⚗</i>'+T('Son expérience sur lui-même','Its experiment on itself')+'</h2><div class="list"><div class="it"><span><b>A</b> · '+esc(M.exp.a)+'</span></div><div class="it"><span><b>B</b> · '+esc(M.exp.b)+'</span></div></div><p class="sub" style="margin-top:8px">'+T('La moitié des conversations chacune ; il garde ce qui marche le mieux.','Half the conversations each; it keeps what works best.')+'</p></div>';
  if((M.opinions||[]).length)h+='<div class="card"><h2><i>✧</i>'+T('Ses opinions (formées lentement)','Its opinions (formed slowly)')+'</h2><div class="list">'+M.opinions.map(o=>'<div class="it"><span><b>'+esc(o.topic)+'</b> : '+esc(o.view)+' <small style="color:var(--muted)">('+esc(o.confidence)+')</small></span></div>').join('')+'</div></div>';
  h+='<div class="card"><h2><i>⚑</i>'+T('Les leçons qu’il s’est écrites','Lessons it wrote itself')+'</h2>'+((M.lessons||[]).length?'<div class="list">'+M.lessons.map(x=>'<div class="it"><span>'+esc(x)+'</span></div>').join('')+'</div>':'<div class="empty">—</div>')+'</div>';
  h+='<div class="card"><h2><i>☾</i>'+T('Son journal','Its journal')+'</h2>'+((M.journal||[]).length?M.journal.slice().reverse().map(j=>'<div class="jr"><b>'+esc(j.date)+'</b><p>'+esc(j.text)+'</p></div>').join(''):'<div class="empty">—</div>')+'</div>';}
 $('main').innerHTML=h;}
async function saveDir(){const t=($('dir')||{}).value||'';try{await fetch(B+'kino_directive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});alert(T('Enregistré. Kino en tiendra compte dès son prochain message.','Saved. Kino follows it from its next message.'));}catch(e){}}
async function fixIt(){const t=($('fix')||{}).value||'';if(!t.trim())return;await fetch(B+'kino_correct',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});alert(T('Merci, Kino s’en souviendra.','Thanks, Kino will remember.'));$('fix').value='';}
async function redo(){const b=event&&event.target;if(b){b.disabled=true;b.textContent='…';}try{await fetch(B+'kino_portrait',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}catch(e){}load();}
async function memDel(k,i){if(!confirm(T('Kino oubliera cette information. Sûr ?','Kino will forget this. Sure?')))return;try{await fetch(B+'kino_mem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:k,i:i,act:'del'})});}catch(e){}load();}
async function memFix(k,i){const t=prompt(T('Ce qui est vrai :','What is true:'));if(!t||!t.trim())return;try{await fetch(B+'kino_mem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:k,i:i,act:'fix',text:t.trim()})});}catch(e){}load();}
async function forget(i){if(!confirm(T('Kino oubliera cette information. Sûr ?','Kino will forget this. Sure?')))return;
 try{await fetch(B+'kino_forget',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({i:i})});}catch(e){}load();}
load();
</script></body></html>
