<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graphique custom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a111c;color:#cfe3f5;overflow:hidden;
 font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
 padding:12px 96px 6px 14px;position:relative;z-index:3}
#back{text-decoration:none;color:#9fc2de;font-size:1.35rem;
 line-height:1;padding:2px 8px 2px 0}
#hd h1{font-size:1rem;font-weight:700;letter-spacing:.01em}
/* Owner 2026-09-17: three separate pills spent ~80px on their own borders,
   padding and gaps, and the last one was clipped on a 390px phone. One
   strip, divided into segments: the chrome is paid for once. The weather
   segment is the only one allowed to shrink. */
/* #hdrow is the row: always its own line (basis 100%), and it claims back
   the 96px the header reserves for the price, because the price sits on
   the line ABOVE. #hdstrip is the visible pill and only as wide as its
   contents. (owner 2026-09-17) */
#hdrow{display:flex;flex:0 0 100%;min-width:0;margin-right:-82px}
#hdstrip{display:inline-flex;align-items:stretch;min-width:0;max-width:100%;
 border-radius:99px;overflow:hidden;
 background:rgba(127,179,224,.06);
 border:1px solid rgba(127,179,224,.18);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hdstrip:empty,#hdrow:empty{display:none}
#hdstrip .seg{display:flex;align-items:center;gap:5px;
 padding:4px 10px;font-size:.6rem;font-weight:700;
 letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
 flex:0 0 auto;border-left:1px solid rgba(127,179,224,.16)}
#hdstrip .seg:first-child{border-left:0}
#meteo{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#autobadge{padding:4px 8px}
#meteo i,#trbadge i{font-style:normal;font-size:1rem;line-height:1;
 filter:drop-shadow(0 0 5px currentColor)}
#meteo.busy i{animation:mtp 1.6s ease-in-out infinite}
@keyframes mtp{0%,100%{opacity:1;transform:scale(1)}
 50%{opacity:.55;transform:scale(1.18)}}
.badge{font-size:.6rem;color:#7fb3e0;
 background:rgba(127,179,224,.08);
 border:1px solid rgba(127,179,224,.22);border-radius:99px;
 padding:3px 10px;text-transform:uppercase;letter-spacing:.07em;
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cv{display:block;width:100vw;height:calc(100vh - 48px);
 touch-action:none;cursor:grab;overscroll-behavior:none}
/* two rows, not one: the P&L sits above the buttons so its width never
   competes with them. Measured: past $100 a single row pushed the trade
   button off the edge (owner 2026-09-16). */
#botbar{position:fixed;left:0;right:0;bottom:14px;z-index:41;
 display:flex;flex-direction:column;align-items:center;gap:8px;
 padding:0 12px;pointer-events:none}
#botrow{display:flex;align-items:center;width:100%;pointer-events:none}
#botrow>*{pointer-events:auto;flex:none}
#botbar>*{pointer-events:auto}
#mtopen{margin-left:auto}
#backlive{display:none;font-size:.72rem;font-weight:800;color:#0a111c;
 background:#e8c55a;border:0;border-radius:99px;padding:8px 14px;
 letter-spacing:.04em;box-shadow:0 4px 14px rgba(232,197,90,.35)}
/* one line, never wrapping. The number is the thing you must be able to
   read, so it never shrinks or clips; the meta yields first and then
   disappears entirely (owner 2026-09-16). */
#pnl{max-width:100%;display:none;
 align-items:baseline;justify-content:center;gap:7px;
 padding:8px 13px;border-radius:14px;backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);white-space:nowrap;
 background:rgba(13,22,36,.6);border:1px solid rgba(127,179,224,.2);
 transition:box-shadow .6s,border-color .6s}
#pnl b{flex:none;font-size:1.05rem;font-variant-numeric:tabular-nums;
 line-height:1.1;white-space:nowrap;transition:transform .15s}
#pnl span{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;font-size:.6rem;color:#5f7185;letter-spacing:.04em;
 text-transform:uppercase}
#pnl.win{border-color:rgba(46,204,113,.45);
 box-shadow:0 0 24px rgba(46,204,113,.22)}
#pnl.win b{color:#2ecc71}
#pnl.loss{border-color:rgba(255,92,92,.45);
 box-shadow:0 0 24px rgba(255,92,92,.22)}
#pnl.loss b{color:#ff5c5c}
#px{position:fixed;top:12px;right:14px;font-size:1rem;z-index:4;
 font-variant-numeric:tabular-nums;color:#e8c55a;font-weight:800;
 transition:transform .18s ease,color .18s ease}
#livedot{position:fixed;width:10px;height:10px;border-radius:50%;
 background:#e8c55a;display:none;pointer-events:none;z-index:2;
 animation:ldp 1.2s ease-out infinite}
@keyframes ldp{0%{box-shadow:0 0 0 0 rgba(232,197,90,.55)}
 100%{box-shadow:0 0 0 12px rgba(232,197,90,0)}}
#aura{position:fixed;inset:0;pointer-events:none;z-index:1;
 opacity:0;transition:opacity 1s}
#aura.choc{opacity:1;animation:chocp 2.4s ease-in-out infinite}
@keyframes chocp{
 0%,100%{box-shadow:inset 0 0 16px 0 rgba(232,197,90,.05)}
 50%{box-shadow:inset 0 0 28px 3px rgba(232,197,90,.13)}}
</style></head><body>
<div id="aura"></div>
<div id="hd">
<a id="back" href="#">&#8592;</a>
<h1>BTCUSD &middot; M1</h1>
<span class="badge">filtre silence</span>
<span id="hdrow"><span id="hdstrip"><span class="seg" id="trbadge"
 style="display:none"></span><span class="seg" id="autobadge"
 style="display:none;color:#8df0bb"
 title="Mode automatique : le robot gere les entrees"><i>&#129302;</i></span><span
 class="seg" id="meteo"
 style="display:none"></span></span></span>
</div>
<span id="px"></span>

<div id="botbar">
<div id="pnl"><b>--</b><span></span></div>
<div id="botrow"><button id="backlive">&#9654; EN DIRECT</button>
<button id="adstop" style="display:none;padding:11px 15px;border-radius:14px;
 border:1px solid rgba(255,92,92,.5);background:rgba(255,92,92,.14);
 color:#ff8c8c;font-weight:800;font-size:.8rem">&#128721;</button>
<button id="mtopen" style="display:none;
 padding:11px 16px;border-radius:14px;border:0;background:#1f6feb;color:#fff;
 font-weight:800;font-size:.8rem;box-shadow:0 6px 18px rgba(31,111,235,.4)">
 &#128200; Trader</button></div></div>
<div id="livedot"></div>
<canvas id="cv"></canvas>
<script>window.BUILD='%%BUILD%%';</script>
<div id="mtbar" style="position:fixed;left:0;right:0;bottom:0;z-index:40;
 background:linear-gradient(180deg,rgba(8,14,22,.94),rgba(8,14,22,.995));
 border-top:1px solid #1e3346;padding:8px 10px 10px;display:none">
 <div style="display:flex;align-items:flex-start;gap:8px">
  <div style="flex:1;min-width:0">
   <div id="mtline1" style="font-size:.8rem;color:#cfe3f5;line-height:1.45;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
   <div id="mtline2" style="font-size:.68rem;color:#7e93a8;line-height:1.45;
    margin-top:1px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis"></div>
  </div>
  <button id="mtcancel" title="Fermer l'outil" style="flex:none;width:28px;
   height:28px;padding:0;border-radius:9px;border:1px solid #27394c;
   background:#121b25;color:#7e93a8;font-size:.9rem;line-height:1">
   &#10005;</button>
 </div>
 <div style="display:flex;gap:7px;margin-top:8px;align-items:stretch">
  <!-- the destructive button keeps its distance from the primary one -->
  <button id="mtpend" title="Programmer l'entree" style="flex:none;width:46px;
   padding:11px 0;border-radius:12px;border:1px solid #33475c;
   background:#16202c;color:#e8c55a;font-size:1rem;line-height:1">
   &#9202;</button>
  <button id="mtflip" title="Inverser le sens" style="flex:none;width:46px;
   padding:11px 0;border-radius:12px;border:1px solid #33475c;
   background:#16202c;color:#cfe3f5;font-size:1rem;line-height:1">
   &#8645;</button>
  <button id="mtclose" title="Fermer la position" style="display:none;
   flex:none;width:46px;padding:11px 0;border-radius:12px;
   border:1px solid #6d2230;background:#2a1116;color:#ff8a8a;
   font-size:1rem;line-height:1;margin-right:9px">&#10005;</button>
  <button id="mtgo" style="flex:1;padding:12px;border-radius:12px;border:0;
   background:#2563eb;color:#fff;font-weight:800;font-size:.86rem">
   Confirmer</button>
 </div>
</div>

<script>
const tok=location.pathname.split('/').filter(x=>x)[0];
document.getElementById('back').onclick=(e)=>{e.preventDefault();
 if(history.length>1)history.back();else location.href='/'+tok;};
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let D=null,lastPx=null,SCALE=null;
let viewOff=0,cwG=7,vzoom=1,vz=null,voff=0;
const SHOW_H1=false;   // owner 2026-09-16: hidden, to revisit later  // voff = vertical pan
let MT=null,MS=null,MTdrag=null,MSerr=null,MTy=null,MTlock=null;  // assisted manual trading
const mtbar=document.getElementById('mtbar');
const mtopen=document.getElementById('mtopen');
let drag=null;
cv.addEventListener('pointerdown',e=>{
 if(MTdrag)return;                 // a SL/TP line has the pointer
 e.preventDefault();
 drag={x:e.clientX,off:viewOff,v:0,px:e.clientX,
  y:e.clientY,voff:voff,t:performance.now()};
 cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
 if(MTdrag){drag=null;return;}
 if(!drag)return;
 e.preventDefault();
 const now=performance.now();
 drag.v=(e.clientX-drag.px)/Math.max(8,now-drag.t);
 drag.px=e.clientX;drag.t=now;
 viewOff=drag.off+(e.clientX-drag.x)/Math.max(3,cwG);
 if(SCALE){const ppp=(SCALE.hi-SCALE.lo)/Math.max(1,SCALE.plot);
  voff=drag.voff+(e.clientY-drag.y)*ppp;}});
const endDrag=()=>{
 if(MTdrag){drag=null;return;}
 if(!drag)return;
 let v=drag.v*16/Math.max(3,cwG);   // px/frame -> candles/frame
 drag=null;
 const glide=()=>{
  if(Math.abs(v)<0.02||drag)return;
  viewOff+=v;v*=0.94;
  requestAnimationFrame(glide);};
 glide();};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
document.getElementById('backlive').onclick=()=>{viewOff=0;voff=0;vzoom=1;};
let LA=null,LT=null;   // live candle: animated state + target
const born={dot:{},bos:{},cand:{}};
const seen={dot:new Set(),bos:new Set(),cand:0,first:true};
function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}
function digest(d){
 const now=performance.now();
 (d.dots||[]).forEach(x=>{const k=x[0]+'_'+x[2];
  if(!seen.dot.has(k)){seen.dot.add(k);
   born.dot[k]=seen.first?-1e9:now;}});
 (d.marks||[]).forEach(m=>{if(m[2]!=='bos')return;
  const k=m[0]+'_'+m[3];
  if(!seen.bos.has(k)){seen.bos.add(k);
   born.bos[k]=seen.first?-1e9:now;}});
 const cs=d.candles||[];
 if(cs.length){const lt=cs[cs.length-1][0];
  if(lt!==seen.cand){seen.cand=lt;
   born.cand[lt]=seen.first?-1e9:now;}}
 if(d.live){
  if(!LT||LT[0]!==d.live[0]){
   // a fresh candle: born at its open, then fills toward reality
   LA=seen.first
    ?{o:d.live[1],h:d.live[2],l:d.live[3],c:d.live[4]}
    :{o:d.live[1],h:d.live[1],l:d.live[1],c:d.live[1]};
  }
  LT=d.live.slice();
 }else{LA=null;LT=null;}
 seen.first=false;
}
function draw(){
 if(!D||!D.candles||!D.candles.length)return;
 const now=performance.now();
 const dpr=window.devicePixelRatio||1;
 const W=cv.clientWidth,Hh=cv.clientHeight;
 // 2026-09-16: the backing store was only resized when the WIDTH
 // changed. On a phone the address bar hides and shows, which changes
 // the HEIGHT only - the buffer kept its old size and the strip below
 // the new height was never cleared, leaving a ghost of the previous
 // frame (a second BOS tag at the bottom).
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(Hh*dpr)){
  cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);}
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
 // --- trend atmosphere ---
 if(D.trend===1){
  const g=ctx.createLinearGradient(0,Hh,0,Hh*0.55);
  g.addColorStop(0,'rgba(46,204,113,.06)');
  g.addColorStop(1,'rgba(46,204,113,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
 }else if(D.trend===-1){
  const g=ctx.createLinearGradient(0,0,0,Hh*0.45);
  g.addColorStop(0,'rgba(255,92,92,.06)');
  g.addColorStop(1,'rgba(255,92,92,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
 }
 const N=Math.min(D.candles.length,Math.max(60,Math.floor(W/7)));
 const maxOff=Math.max(0,D.candles.length-N);
 if(viewOff>maxOff)viewOff=maxOff;
 if(viewOff<0)viewOff=0;
 const end=D.candles.length-Math.round(viewOff);
 const cs=D.candles.slice(Math.max(0,end-N),end);
 const atLive=viewOff<0.5;
 document.getElementById('backlive').style.display=
  (atLive&&!voff&&vzoom===1)?'none':'block';
 if(LA&&LT){
  const f=0.14;               // smooth fill, ~half-life 300ms
  LA.o=LT[1];
  LA.c+=(LT[4]-LA.c)*f;
  LA.h+=(LT[2]-LA.h)*f;
  LA.l+=(LT[3]-LA.l)*f;
 }
 // 2026-09-16: the scale fits the CANDLES. A far-away structure level
 // used to be forced in, which squashed every candle into a strip at the
 // bottom. Levels outside the window are shown as edge markers instead.
 let lo=Infinity,hi=-Infinity;
 for(const c of cs){if(c[2]>hi)hi=c[2];if(c[3]<lo)lo=c[3];}
 if(LT&&atLive){hi=Math.max(hi,LT[2]);lo=Math.min(lo,LT[3]);}
 const span0=hi-lo;
 // Owner 2026-09-18: "where is the BOS indicator gone on the chart". The
 // range was built from the CANDLES alone, so the main structure's two
 // borders could sit outside it and fall back to a small arrow at the
 // edge - easy to miss, and the chart exists to show exactly those two
 // levels. They now pull the view, under the same sanity limit used for a
 // position's stop: a border more than 1.5 ranges away is left at the edge
 // rather than squashing the candles into a line.
 [D.next_bos,D.invalid].forEach(v=>{
  if(!v||!isFinite(v))return;
  if(Math.abs(v-(D.px||(hi+lo)/2))>span0*1.5)return;
  hi=Math.max(hi,v);lo=Math.min(lo,v);});
 // an open position matters: its entry always, its stop/target only if
 // they are not absurdly far compared with what price is doing
 (D.trades||[]).forEach(t=>{
  if(t[2]>0){hi=Math.max(hi,t[2]);lo=Math.min(lo,t[2]);}
  [t[3],t[4]].forEach(v=>{if(v>0&&Math.abs(v-t[2])<span0*1.5){
   hi=Math.max(hi,v);lo=Math.min(lo,v);}});});
 // the lines you are dragging pull the view, but only up to a limit:
 // they used to be free to stretch it, and since the edge push speed is
 // a share of the visible range, the two fed each other and the scale
 // ran away exponentially (2026-09-16).
 const cmid=(hi+lo)/2,climb=Math.max(span0,1)*2.5;
 if(MT){[MT.sl,MT.tp,MT.entry].forEach(v=>{
  if(!v||!isFinite(v))return;
  hi=Math.max(hi,Math.min(v,cmid+climb));
  lo=Math.min(lo,Math.max(v,cmid-climb));});}
 const pad=(hi-lo)*0.06||1;hi+=pad;lo-=pad;
 if(vzoom!==1){const mid=(hi+lo)/2,half=(hi-lo)/2*vzoom;
  hi=mid+half;lo=mid-half;}
 if(voff){hi+=voff;lo+=voff;}
 // 2026-09-16: dragging a line used to move the scale, which moved the
 // mapping, which made the line jump away from the finger. Hold the
 // window still for as long as a line is held.
 if(MTdrag&&MTlock&&isFinite(MTlock.hi)&&MTlock.hi>MTlock.lo){
  hi=MTlock.hi;lo=MTlock.lo;}
 // the trade panel is an opaque overlay: keep the plot above it
 const TOPP=8,BOTP=MT?((mtbar.offsetHeight||140)+12):26;
 const PLOT=Math.max(60,Hh-TOPP-BOTP);
 const px=v=>(hi-v)/(hi-lo)*PLOT+TOPP;
 SCALE={hi:hi,lo:lo,Hh:Hh,W:W,top:TOPP,bot:BOTP,plot:PLOT,span0:span0};
 const cw=W/(N+9);
 cwG=cw;
 const bw=Math.max(2,Math.min(9,cw*0.62));
 if(vzoom!==1||vz){
  ctx.save();ctx.globalAlpha=vz?.5:.28;ctx.fillStyle='#7fb3e0';
  ctx.fillRect(W-2,TOPP,2,PLOT);
  ctx.globalAlpha=1;ctx.font='bold 9px system-ui';
  ctx.fillStyle='#7fb3e0';
  const z='x'+(1/vzoom).toFixed(1);
  ctx.fillText(z,W-ctx.measureText(z).width-6,TOPP+PLOT-6);
  ctx.restore();}
 // Owner 2026-09-18: a build stamp, bottom-left. Twice today we argued
 // about whether an indicator was broken when the phone was simply running
 // an older page. Now both of us can see which one it is at a glance.
 ctx.save();ctx.globalAlpha=.45;ctx.font='9px system-ui';
 ctx.fillStyle='#5f7185';
 ctx.fillText('v'+(window.BUILD||'?'),6,TOPP+PLOT-6);
 ctx.restore();
 // --- price ticks, right edge only ---
 ctx.font='10px system-ui';
 for(let g2=0;g2<5;g2++){
  const v=lo+pad+(hi-lo-2*pad)*g2/4;
  const y=px(v);
  ctx.strokeStyle='rgba(255,255,255,.14)';
  ctx.beginPath();ctx.moveTo(W-5,y);ctx.lineTo(W,y);ctx.stroke();
  ctx.fillStyle='#55677d';
  const s=v.toFixed(0);
  ctx.fillText(s,W-8-ctx.measureText(s).width,y-3);}
 // --- trade zones (behind candles) ---
 const usedY=[];
 const tag=(y0,txt,col,bg)=>{
  let y=Math.max(12,Math.min(Hh-12,y0));
  while(usedY.some(u=>Math.abs(u-y)<17))y+=17;
  if(y>Hh-12)y=Math.max(12,Math.min(...usedY)-17);
  usedY.push(y);
  ctx.font='bold 9px system-ui';
  const w=ctx.measureText(txt).width+10;
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(W-w-4,y-8,w,16,8);ctx.fill();
  ctx.fillStyle=col;ctx.fillText(txt,W-w+1,y+3.5);};
 (D.trades||[]).forEach(t=>{
  const yE=px(t[2]);
  if(t[3]>0){const y=px(t[3]);
   const a=Math.min(yE,y),b=Math.max(yE,y);
   const g=ctx.createLinearGradient(0,a,0,b);
   g.addColorStop(0,'rgba(255,92,92,.02)');
   g.addColorStop(1,'rgba(255,92,92,.11)');
   ctx.fillStyle=g;ctx.fillRect(0,a,W,b-a);}
  if(t[4]>0){const y=px(t[4]);
   const a=Math.min(yE,y),b=Math.max(yE,y);
   const g=ctx.createLinearGradient(0,b,0,a);
   g.addColorStop(0,'rgba(46,204,113,.02)');
   g.addColorStop(1,'rgba(46,204,113,.11)');
   ctx.fillStyle=g;ctx.fillRect(0,a,W,b-a);}
 });
 // The internal engine reads raw M1 while the chart draws the
 // silence-filtered candles, so an internal dot or event often falls on a
 // minute that is not drawn. Snap it to the nearest drawn candle instead of
 // dropping it - 22 of 30 internal dots were vanishing (2026-09-16).
 const xnear=t=>{
  if(xoft[t]!==undefined)return xoft[t];
  if(!xts.length)return undefined;
  if(t<xts[0]||t>xts[xts.length-1])return undefined;
  let lo=0,hi=xts.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;
   if(xts[mid]<t)lo=mid+1;else hi=mid;}
  const a=xts[Math.max(0,lo-1)],b=xts[lo];
  return xoft[(t-a<=b-t)?a:b];
 };
 // --- candles: rounded, depth fade, glow on the recent ---
 const xoft={};
 const xts=[];                      // drawn candle times, ascending
 ctx.lineCap='round';
 cs.forEach((c,i)=>{
  const x=Math.round(cw*(i+1))+0.5;   // crisp pixel-centred wick
  xoft[c[0]]=x;xts.push(c[0]);
  const up=c[5]===1;
  const col=up?'#2ecc71':'#ff5c5c';
  const age=(cs.length-1-i)/Math.max(1,cs.length-1);
  let al=1-age*0.62;
  let sy=1;
  const bt=born.cand[c[0]];
  if(bt!==undefined){const k=ease((now-bt)/320);
   sy=0.55+0.45*k;}
  ctx.globalAlpha=al;
  if(i>=cs.length-9){ctx.shadowColor=col;ctx.shadowBlur=6;}
  ctx.strokeStyle=col;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,px(c[2]));ctx.lineTo(x,px(c[3]));
  ctx.stroke();
  const y1=px(Math.max(c[1],c[4])),y2=px(Math.min(c[1],c[4]));
  const hgt=Math.max(1.5,(y2-y1)*sy);
  const cym=(y1+y2)/2;
  const gb=ctx.createLinearGradient(0,cym-hgt/2,0,cym+hgt/2);
  if(up){gb.addColorStop(0,'#49e58c');gb.addColorStop(1,'#1da65a');}
  else{gb.addColorStop(0,'#d64848');gb.addColorStop(1,'#ff7a7a');}
  ctx.fillStyle=gb;
  ctx.beginPath();

function p2y(v){if(!SCALE)return null;

function mtClamp(v){
 if(!isFinite(v))return MS&&MS.px?MS.px:0;
 const p=(MS&&MS.px)?MS.px:v;
 return Math.round(Math.min(p*1.5,Math.max(p*0.5,v))*100)/100;
}
function mtRR(){return (MS&&MS.rr>0)?MS.rr:0.8;}
function antiLevel(dd){
 // the anticipated break in direction dd, whichever structure offers one.
 // Internal first: it is the nearer level. Only levels whose pullback is
 // confirmed count - an unconfirmed one is just the current extreme.
 if(!D)return null;
 const c=[[D.int_bos,D.int_bos_dir,D.int_bos_ready],
          [D.int_flip_bos,D.int_flip_bos_dir,D.int_flip_bos_ready],
          [D.next_bos,D.bos_dir,D.bos_ready],
          [D.flip_bos,D.flip_bos_dir,D.flip_bos_ready]];
 for(let i=0;i<c.length;i++)
  if(c[i][0]&&c[i][1]===dd&&c[i][2])return c[i][0];
 return null;
}
function intLevel(dd,px){
 // The internal structure's stop level for a trade in direction dd.
 // The protected dot (int_inv) when the engine still holds one; after a
 // CHoCH consumes it, the most recent internal dot on the stop side - a
 // buy stops under a low dot, a sell above a high dot. Pass px to demand
 // the level sit on the usable side of price.
 const ok=v=>!!v&&(px===undefined||
  ((dd===1&&v<px-10)||(dd===-1&&v>px+10)));
 if(!D)return null;
 if(ok(D.int_inv))return D.int_inv;
 const ds=D.int_dots||[],want=(dd===1)?1:-1;
 // The protective level of an internal LEG: the lowest low for a buy, the
 // highest high for a sell. Dots of one kind sit in contiguous runs, one
 // run per leg, so walk the runs newest first and take the first whose
 // extreme is usable. The most recent single dot is the wrong answer - it
 // lands on a minor wiggle inside the leg (owner 2026-09-16).
 const runs=[];
 for(let i=0;i<ds.length;i++){
  if(ds[i][2]!==want)continue;
  if(runs.length&&runs[runs.length-1].end===i-1){
   runs[runs.length-1].end=i;runs[runs.length-1].v.push(ds[i][1]);}
  else runs.push({end:i,v:[ds[i][1]]});}
 for(let r=runs.length-1;r>=0;r--){
  const v=runs[r].v.filter(ok);
  if(!v.length)continue;
  return (want===1)?Math.min.apply(null,v):Math.max.apply(null,v);}
 return null;
}
function mtLot(dist,against){
 if(!MS)return{lot:0.02,bul:0};
 const base=MS.base_lot||0.02;
 // against the structure: half the base lot, never any bullet
 if(against)return{lot:(MS.counter_lot||0.01),bul:0,half:true};
 if(!(MS.debt>0.5)||!(MS.chest>0.5)||!(dist>0))return{lot:base,bul:0};
 const r1=Math.max(dist*0.01,0.01);
 let bul;
 if(MS.jar){
  // the same arithmetic the desk uses: stake part of the jar, and never
  // buy more recovery than the tab needs (owner 2026-09-16)
  const byB=Math.floor((MS.chest*(MS.jar_stake||0.5))/r1);
  const g1=(MS.rr||0.8)*dist*0.01;
  const byD=g1>0?Math.ceil(MS.debt/g1):0;
  bul=Math.max(0,Math.min(MS.max_extra||3,byB,byD));
 }else bul=Math.min(MS.max_extra||3,Math.floor((MS.chest||0)/r1));

function mtCalc(){
 if(!MT||!MS||!MS.px)return null;
 const mkt=MS.px,ref=MT.entry||mkt,sl=MT.sl,tp=MT.tp;
 let d=0;
 if(tp>ref&&sl<ref)d=1; else if(tp<ref&&sl>ref)d=-1;
 if(MT.edit){
  // editing an open position: direction and lot are the position's, the
  // only question is whether the two new levels are legal
  // measure from the position's ENTRY, which is what its own SL/TP tags
  // use. Measuring from market made the two disagree by the open P&L
  // (owner 2026-09-16).
  const base=MT.e0||mkt;
  const dist=Math.abs(base-sl),rew=Math.abs(base-tp),L=MT.lot||0.01;
  let bad='';
  if(MT.d===1&&!(sl<mkt&&tp>mkt))bad='achat: SL sous le prix, TP au-dessus';
  else if(MT.d===-1&&!(tp<mkt&&sl>mkt))bad='vente: TP sous le prix, SL au-dessus';
  else if(Math.min(dist,rew)<=(MS.s_min_dist||10))bad='SL ou TP trop pres du marche';
  const nr=Math.abs((MT.e0||mkt)-sl)*L,
        or_=MT.sl0?Math.abs((MT.e0||mkt)-MT.sl0)*L:null;
  if(!bad&&MS.max_risk>0&&nr>MS.max_risk&&(or_===null||nr>or_))
   bad='risque $'+nr.toFixed(2)+' > '+Math.round((MS.max_risk_pct||0.1)*100)+
       '% du solde ($'+MS.max_risk.toFixed(2)+')';
  return{d:MT.d,px:mkt,mkt:mkt,sl:sl,tp:tp,dist:dist,rew:rew,lot:L,bul:0,
   against:false,inner:false,half:false,edit:true,
   risk:dist*L,gain:rew*L,rr:dist>0?rew/dist:0,kind:'MODIF',bad:bad};}
 const dist=Math.abs(ref-sl),rew=Math.abs(tp-ref);
 const against=(MS.trend!==0&&d!==0&&d!==MS.trend);
 // riding the INTERNAL structure: the stop sits nearer to the internal
 // level than to the main diamond. Half lot, same as counter-trend.
 const ilv=(d!==0)?intLevel(d):null;
 const inner=!!(ilv&&D&&D.invalid&&
  Math.abs(sl-ilv)<Math.abs(sl-D.invalid));
 const L=mtLot(dist,against||inner);
 let kind='MARCHE',bad='';
 if(MT.entry){
  const stopSide=(d===1)?(ref>mkt):(ref<mkt);
  kind=(d===1?'BUY ':'SELL ')+(stopSide?'STOP':'LIMIT');
  if(Math.abs(ref-mkt)<=(MS.s_min_dist||10))
   bad='entree trop pres du marche';
 }
 if(!bad&&(against||inner)&&MS.counter_ok===false)
  bad=(against?'à contre-sens':'petite structure')+
      ' impossible a cette taille de lot';
 if(!bad)bad=(d===0?'mets le SL et le TP de part et d’autre de l’entree'
      :(dist<=(MS.s_min_dist||10)?'stop trop proche':''));
 // the desk refuses a trade risking more than 10% of the balance - say so
 // here rather than letting the refusal arrive after Confirmer
 if(!bad&&MS.max_risk>0&&dist*L.lot>MS.max_risk)
  bad='risque $'+(dist*L.lot).toFixed(2)+' > '+
      Math.round((MS.max_risk_pct||0.1)*100)+'% du solde ($'+
      MS.max_risk.toFixed(2)+') - rapproche le SL';
 return{d:d,px:ref,mkt:mkt,sl:sl,tp:tp,dist:dist,rew:rew,lot:L.lot,bul:L.bul,
  against:against,inner:inner,half:!!L.half,
  risk:dist*L.lot,gain:rew*L.lot,rr:dist>0?rew/dist:0,kind:kind,bad:bad};
}

   body:(c.edit?'modify=1':'d='+c.d)+
    '&sl='+c.sl.toFixed(2)+'&tp='+c.tp.toFixed(2)+
    (MT.entry?'&entry='+MT.entry.toFixed(2):'')});
  const j=await r.json();
  g.textContent=j.ok?'Envoye':'Refuse';
  if(j.ok){MT=null;setTimeout(()=>{mtbar.style.display='none';
   mtopen.style.display='block';delete g.dataset.busy;g.textContent='Confirmer';g.disabled=false;
   document.getElementById('botbar').style.bottom='18px';},1400);}
  else{alert(j.err||'refus');delete g.dataset.busy;g.textContent='Confirmer';g.disabled=false;}
 }catch(e){delete g.dataset.busy;g.textContent='Confirmer';g.disabled=false;alert('reseau');}
};
const MTGRAB=38;                 // finger-sized catch zone
const AXIS=64;                   // right strip = vertical zoom
cv.addEventListener('pointerdown',e=>{
 const r0=cv.getBoundingClientRect();
 const x0=e.clientX-r0.left,y0=e.clientY-r0.top;
 // a line handle wins over the axis; otherwise the axis zooms
 const nearLine=MT&&SCALE&&Math.min(
   Math.abs(y0-p2y(MT.sl)),Math.abs(y0-p2y(MT.tp)),
   MT.entry?Math.abs(y0-p2y(MT.entry)):1e9)<=MTGRAB;
 if(!nearLine&&x0>cv.clientWidth-AXIS){
  vz={y:y0,z:vzoom,t:performance.now()};
  drag=null;cv.setPointerCapture(e.pointerId);
  e.preventDefault();e.stopImmediatePropagation();return;}
 if(!MT)return;
 const r=r0,y=y0;
 const ys=p2y(MT.sl),yt=p2y(MT.tp);
 if(ys===null||yt===null)return;
 const cand=[['sl',Math.abs(y-ys)],['tp',Math.abs(y-yt)]];
 if(MT.entry)cand.push(['entry',Math.abs(y-p2y(MT.entry))]);
 cand.sort((a,b)=>a[1]-b[1]);
 if(cand[0][1]>MTGRAB)return;
 MTdrag=cand[0][0];
 MTlock=SCALE?{hi:SCALE.hi,lo:SCALE.lo}:null;
 drag=null;                      // cancel any pan the chart had started
 cv.setPointerCapture(e.pointerId);
 e.preventDefault();
 e.stopImmediatePropagation();   // the pan listener must not see this
 mtRender();
},true);
const MTEDGE=64;                // hold here and the line keeps going
let MTlast=0;                   // timestamp of the last push tick
cv.addEventListener('pointermove',e=>{
 if(vz){
  const r=cv.getBoundingClientRect(),y=e.clientY-r.top;
  vzoom=Math.max(0.25,Math.min(8,vz.z*Math.exp((y-vz.y)/240)));
  e.preventDefault();e.stopImmediatePropagation();return;}
 if(!MT||!MTdrag)return;
 const r=cv.getBoundingClientRect(),y=e.clientY-r.top;
 MTy=y;
 const plotBot=SCALE?SCALE.top+SCALE.plot:0;
 const inEdge=SCALE&&(y>plotBot-MTEDGE||y<MTEDGE);
 if(!inEdge){const v=y2p(y);
  if(v&&isFinite(v)){MT[MTdrag]=mtClamp(v);mtRender();}}
 e.preventDefault();
 e.stopImmediatePropagation();
},true);
function mtEdgePush(){
 const now=performance.now();
 const dt=Math.min(50,now-(MTlast||now));MTlast=now;
 if(!MT||!MTdrag||MTy===null||!SCALE)return;
 let dir=0,depth=0;
 const pb=SCALE.top+SCALE.plot;
 if(MTy>pb-MTEDGE){dir=-1;depth=(MTy-(pb-MTEDGE))/MTEDGE;}
 else if(MTy<MTEDGE){dir=1;depth=(MTEDGE-MTy)/MTEDGE;}
 if(!dir)return;
 depth=Math.min(1,Math.max(0,depth));
 // points per SECOND, frame-rate independent, very gentle at the lip
 // so the last few points can be placed exactly
 const base=Math.max(SCALE.span0||0,1);      // candles only, stable
 const perSec=base*(0.05+0.55*depth*depth);
 const step=dir*perSec*dt/1000;
 const before=MT[MTdrag];
 MT[MTdrag]=mtClamp(before+step);
 const moved=MT[MTdrag]-before;              // 0 once the clamp bites
 if(MTlock){MTlock.hi+=moved;MTlock.lo+=moved;}
 mtRender();
}
const mtRelease=e=>{
 if(vz){
  // a quick tap on the axis with no travel resets the scale
  if(performance.now()-vz.t<280&&Math.abs(vzoom/vz.z-1)<0.04)vzoom=1;
  vz=null;try{cv.releasePointerCapture(e.pointerId);}catch(x){}
  e.stopImmediatePropagation();return;}
 if(!MTdrag)return;
 MTdrag=null;drag=null;MTy=null;MTlock=null;
 try{cv.releasePointerCapture(e.pointerId);}catch(x){}
 e.stopImmediatePropagation();
};
cv.addEventListener('pointerup',mtRelease,true);
cv.addEventListener('pointercancel',mtRelease,true);
async function mtLoad(){
 try{const r=await fetch('/'+tok+'/manual_state',{cache:'no-store'});
  if(r.status===404){MSerr='Cette page n’a pas le droit de trader ce compte.';
   mtopen.style.display='none';return;}
  if(r.ok){MS=await r.json();MSerr=null;
   if(!MS.acct){MSerr='Le service de trading manuel est arrete.';
    mtopen.style.display='none';return;}
   if((Date.now()/1000-(MS.updated||0))>90)
    MSerr='Donnees figees depuis '+Math.round(Date.now()/1000-MS.updated)+'s.';
   if(MT)mtRender();
   // Owner 2026-09-17: in AUTO the robot owns the entries, so the tool
   // that opens one is hidden - a hand entry would take the slot the robot
   // is waiting for, and the desk refuses it anyway. Changing or closing a
   // live trade stays available.
   const hasPos=!!(MS.open&&MS.open.length);
   const hasOrd=!!(MS.pending&&MS.pending.length);
   mtopen.innerHTML=hasPos?'&#9999;&#65039; Modifier SL/TP'
    :(hasOrd?'&#9999;&#65039; Modifier l’ordre':'&#128200; Trader');
   const canOpen=MS.auto?(hasPos||hasOrd):true;
   mtopen.style.display=(MT||!canOpen)?'none':'block';
   return;}
  mtopen.style.display='none';
 }catch(e){MSerr='Reseau indisponible.';}
}
mtLoad();setInterval(mtLoad,3000);
</script></body></html>
