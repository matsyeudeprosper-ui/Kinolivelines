<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graphique custom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a111c;color:#cfe3f5;overflow:hidden;
 font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
 padding:12px 96px 6px 14px;position:relative;z-index:3}
#back{text-decoration:none;color:#9fc2de;font-size:1.35rem;
 line-height:1;padding:2px 8px 2px 0}
#hd h1{font-size:1rem;font-weight:700;letter-spacing:.01em}
.badge{font-size:.6rem;color:#7fb3e0;
 background:rgba(127,179,224,.08);
 border:1px solid rgba(127,179,224,.22);border-radius:99px;
 padding:3px 10px;text-transform:uppercase;letter-spacing:.07em;
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cv{display:block;width:100vw;height:calc(100vh - 48px);
 touch-action:none;cursor:grab;overscroll-behavior:none}
#backlive{position:fixed;left:14px;bottom:18px;z-index:41;
 display:none;font-size:.72rem;font-weight:800;color:#0a111c;
 background:#e8c55a;border:0;border-radius:99px;padding:8px 14px;
 letter-spacing:.04em;box-shadow:0 4px 14px rgba(232,197,90,.35)}
#pnl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
 z-index:4;display:none;text-align:center;padding:9px 20px 7px;
 border-radius:18px;backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);
 background:rgba(13,22,36,.55);border:1px solid rgba(127,179,224,.2);
 transition:box-shadow .6s,border-color .6s}
#pnl b{font-size:1.35rem;font-variant-numeric:tabular-nums;
 display:block;line-height:1.15;transition:transform .15s}
#pnl span{font-size:.62rem;color:#5f7185;letter-spacing:.05em;
 text-transform:uppercase}
#pnl.win{border-color:rgba(46,204,113,.45);
 box-shadow:0 0 24px rgba(46,204,113,.22)}
#pnl.win b{color:#2ecc71}
#pnl.loss{border-color:rgba(255,92,92,.45);
 box-shadow:0 0 24px rgba(255,92,92,.22)}
#pnl.loss b{color:#ff5c5c}
#px{position:fixed;top:12px;right:14px;font-size:1rem;z-index:4;
 font-variant-numeric:tabular-nums;color:#e8c55a;font-weight:800;
 transition:transform .18s ease,color .18s ease}
#livedot{position:fixed;width:10px;height:10px;border-radius:50%;
 background:#e8c55a;display:none;pointer-events:none;z-index:2;
 animation:ldp 1.2s ease-out infinite}
@keyframes ldp{0%{box-shadow:0 0 0 0 rgba(232,197,90,.55)}
 100%{box-shadow:0 0 0 12px rgba(232,197,90,0)}}
#aura{position:fixed;inset:0;pointer-events:none;z-index:1;
 opacity:0;transition:opacity 1s}
#aura.choc{opacity:1;animation:chocp 2.4s ease-in-out infinite}
@keyframes chocp{
 0%,100%{box-shadow:inset 0 0 16px 0 rgba(232,197,90,.05)}
 50%{box-shadow:inset 0 0 28px 3px rgba(232,197,90,.13)}}
</style></head><body>
<div id="aura"></div>
<div id="hd">
<a id="back" href="#">&#8592;</a>
<h1>BTCUSD &middot; M1</h1>
<span class="badge">filtre silence</span>
<span class="badge" id="trbadge" style="display:none"></span>
<span class="badge" id="meteo" style="display:none"></span>
</div>
<span id="px"></span>
<div id="pnl"><b>--</b><span></span></div>
<button id="backlive">&#9654; EN DIRECT</button>
<div id="livedot"></div>
<canvas id="cv"></canvas>
<div id="mtbar" style="position:fixed;left:0;right:0;bottom:0;z-index:40;
 background:linear-gradient(180deg,rgba(8,14,22,.92),rgba(8,14,22,.99));
 border-top:1px solid #1e3346;padding:6px 10px 10px;display:none">
 <div id="mtinfo" style="display:flex;gap:8px;flex-wrap:wrap;
  font-size:.72rem;color:#9fb6cc;margin-bottom:6px;line-height:1.5"></div>
 <div style="display:flex;gap:8px">
  <button id="mtpend" style="flex:1;padding:11px;border-radius:12px;
   border:1px solid #33475c;background:#16202c;color:#e8c55a;
   font-weight:700;font-size:.82rem">&#9202; En attente</button>
  <button id="mtflip" style="flex:1;padding:11px;border-radius:12px;
   border:1px solid #33475c;background:#16202c;color:#cfe3f5;
   font-weight:700;font-size:.82rem">&#8645; Inverser</button>
  <button id="mtcancel" style="flex:1;padding:11px;border-radius:12px;
   border:1px solid #33475c;background:#16202c;color:#9fb6cc;
   font-weight:700;font-size:.82rem">Annuler</button>
  <button id="mtgo" style="flex:2;padding:11px;border-radius:12px;border:0;
   background:#2563eb;color:#fff;font-weight:800;font-size:.82rem">
   Confirmer</button>
 </div>
</div>
<button id="mtopen" style="display:none;position:fixed;right:12px;bottom:14px;z-index:39;
 padding:11px 16px;border-radius:14px;border:0;background:#1f6feb;color:#fff;
 font-weight:800;font-size:.8rem;box-shadow:0 6px 18px rgba(31,111,235,.4)">
 &#128200; Trader</button>
<script>
const tok=location.pathname.split('/').filter(x=>x)[0];
document.getElementById('back').onclick=(e)=>{e.preventDefault();
 if(history.length>1)history.back();else location.href='/'+tok;};
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let D=null,lastPx=null,SCALE=null;
let viewOff=0,cwG=7,vzoom=1,vz=null;   // vz = axis-drag in progress
let MT=null,MS=null,MTdrag=null,MSerr=null,MTy=null;  // assisted manual trading
const mtbar=document.getElementById('mtbar');
const mtopen=document.getElementById('mtopen');
let drag=null;
cv.addEventListener('pointerdown',e=>{
 if(MTdrag)return;                 // a SL/TP line has the pointer
 e.preventDefault();
 drag={x:e.clientX,off:viewOff,v:0,px:e.clientX,
  t:performance.now()};
 cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
 if(MTdrag){drag=null;return;}
 if(!drag)return;
 e.preventDefault();
 const now=performance.now();
 drag.v=(e.clientX-drag.px)/Math.max(8,now-drag.t);
 drag.px=e.clientX;drag.t=now;
 viewOff=drag.off+(e.clientX-drag.x)/Math.max(3,cwG);});
const endDrag=()=>{
 if(MTdrag){drag=null;return;}
 if(!drag)return;
 let v=drag.v*16/Math.max(3,cwG);   // px/frame -> candles/frame
 drag=null;
 const glide=()=>{
  if(Math.abs(v)<0.02||drag)return;
  viewOff+=v;v*=0.94;
  requestAnimationFrame(glide);};
 glide();};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
document.getElementById('backlive').onclick=()=>{viewOff=0;};
let LA=null,LT=null;   // live candle: animated state + target
const born={dot:{},bos:{},cand:{}};
const seen={dot:new Set(),bos:new Set(),cand:0,first:true};
function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}
function digest(d){
 const now=performance.now();
 (d.dots||[]).forEach(x=>{const k=x[0]+'_'+x[2];
  if(!seen.dot.has(k)){seen.dot.add(k);
   born.dot[k]=seen.first?-1e9:now;}});
 (d.marks||[]).forEach(m=>{if(m[2]!=='bos')return;
  const k=m[0]+'_'+m[3];
  if(!seen.bos.has(k)){seen.bos.add(k);
   born.bos[k]=seen.first?-1e9:now;}});
 const cs=d.candles||[];
 if(cs.length){const lt=cs[cs.length-1][0];
  if(lt!==seen.cand){seen.cand=lt;
   born.cand[lt]=seen.first?-1e9:now;}}
 if(d.live){
  if(!LT||LT[0]!==d.live[0]){
   // a fresh candle: born at its open, then fills toward reality
   LA=seen.first
    ?{o:d.live[1],h:d.live[2],l:d.live[3],c:d.live[4]}
    :{o:d.live[1],h:d.live[1],l:d.live[1],c:d.live[1]};
  }
  LT=d.live.slice();
 }else{LA=null;LT=null;}
 seen.first=false;
}
function draw(){
 if(!D||!D.candles||!D.candles.length)return;
 const now=performance.now();
 const dpr=window.devicePixelRatio||1;
 const W=cv.clientWidth,Hh=cv.clientHeight;
 if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=Hh*dpr;}
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,W,Hh);
 // --- trend atmosphere ---
 if(D.trend===1){
  const g=ctx.createLinearGradient(0,Hh,0,Hh*0.55);
  g.addColorStop(0,'rgba(46,204,113,.06)');
  g.addColorStop(1,'rgba(46,204,113,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
 }else if(D.trend===-1){
  const g=ctx.createLinearGradient(0,0,0,Hh*0.45);
  g.addColorStop(0,'rgba(255,92,92,.06)');
  g.addColorStop(1,'rgba(255,92,92,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
 }
 const N=Math.min(D.candles.length,Math.max(60,Math.floor(W/7)));
 const maxOff=Math.max(0,D.candles.length-N);
 if(viewOff>maxOff)viewOff=maxOff;
 if(viewOff<0)viewOff=0;
 const end=D.candles.length-Math.round(viewOff);
 const cs=D.candles.slice(Math.max(0,end-N),end);
 const atLive=viewOff<0.5;
 document.getElementById('backlive').style.display=
  atLive?'none':'block';
 if(LA&&LT){
  const f=0.14;               // smooth fill, ~half-life 300ms
  LA.o=LT[1];
  LA.c+=(LT[4]-LA.c)*f;
  LA.h+=(LT[2]-LA.h)*f;
  LA.l+=(LT[3]-LA.l)*f;
 }
 let lo=Infinity,hi=-Infinity;
 for(const c of cs){if(c[2]>hi)hi=c[2];if(c[3]<lo)lo=c[3];}
 if(LT&&atLive){hi=Math.max(hi,LT[2]);lo=Math.min(lo,LT[3]);}
 (D.trades||[]).forEach(t=>{[t[2],t[3],t[4]].forEach(v=>{
  if(v>0){hi=Math.max(hi,v);lo=Math.min(lo,v);}});});
 if(MT){hi=Math.max(hi,MT.sl,MT.tp);lo=Math.min(lo,MT.sl,MT.tp);}
 if(D.trend===1||D.trend===-1){
  const tds0=(D.dots||[]).filter(x=>x[2]===(D.trend===1?1:-1));
  if(tds0.length){
   const pv=tds0[tds0.length-1][1];
   hi=Math.max(hi,pv);lo=Math.min(lo,pv);
  }
 }
 const pad=(hi-lo)*0.06||1;hi+=pad;lo-=pad;
 if(vzoom!==1){const mid=(hi+lo)/2,half=(hi-lo)/2*vzoom;
  hi=mid+half;lo=mid-half;}
 // the trade panel is an opaque overlay: keep the plot above it
 const TOPP=8,BOTP=MT?((mtbar.offsetHeight||140)+12):26;
 const PLOT=Math.max(60,Hh-TOPP-BOTP);
 const px=v=>(hi-v)/(hi-lo)*PLOT+TOPP;
 SCALE={hi:hi,lo:lo,Hh:Hh,W:W,top:TOPP,bot:BOTP,plot:PLOT};
 const cw=W/(N+9);
 cwG=cw;
 const bw=Math.max(2,Math.min(9,cw*0.62));
 if(vzoom!==1||vz){
  ctx.save();ctx.globalAlpha=vz?.5:.28;ctx.fillStyle='#7fb3e0';
  ctx.fillRect(W-2,TOPP,2,PLOT);
  ctx.globalAlpha=1;ctx.font='bold 9px system-ui';
  ctx.fillStyle='#7fb3e0';
  const z='x'+(1/vzoom).toFixed(1);
  ctx.fillText(z,W-ctx.measureText(z).width-6,TOPP+PLOT-6);
  ctx.restore();}
 // --- price ticks, right edge only ---
 ctx.font='10px system-ui';
 for(let g2=0;g2<5;g2++){
  const v=lo+pad+(hi-lo-2*pad)*g2/4;
  const y=px(v);
  ctx.strokeStyle='rgba(255,255,255,.14)';
  ctx.beginPath();ctx.moveTo(W-5,y);ctx.lineTo(W,y);ctx.stroke();
  ctx.fillStyle='#55677d';
  const s=v.toFixed(0);
  ctx.fillText(s,W-8-ctx.measureText(s).width,y-3);}
 // --- trade zones (behind candles) ---
 const usedY=[];
 const tag=(y0,txt,col,bg)=>{
  let y=Math.max(12,Math.min(Hh-12,y0));
  while(usedY.some(u=>Math.abs(u-y)<17))y+=17;
  if(y>Hh-12)y=Math.max(12,Math.min(...usedY)-17);
  usedY.push(y);
  ctx.font='bold 9px system-ui';
  const w=ctx.measureText(txt).width+10;
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(W-w-4,y-8,w,16,8);ctx.fill();
  ctx.fillStyle=col;ctx.fillText(txt,W-w+1,y+3.5);};
 (D.trades||[]).forEach(t=>{
  const yE=px(t[2]);
  if(t[3]>0){const y=px(t[3]);
   const a=Math.min(yE,y),b=Math.max(yE,y);
   const g=ctx.createLinearGradient(0,a,0,b);
   g.addColorStop(0,'rgba(255,92,92,.02)');
   g.addColorStop(1,'rgba(255,92,92,.11)');
   ctx.fillStyle=g;ctx.fillRect(0,a,W,b-a);}
  if(t[4]>0){const y=px(t[4]);
   const a=Math.min(yE,y),b=Math.max(yE,y);
   const g=ctx.createLinearGradient(0,b,0,a);
   g.addColorStop(0,'rgba(46,204,113,.02)');
   g.addColorStop(1,'rgba(46,204,113,.11)');
   ctx.fillStyle=g;ctx.fillRect(0,a,W,b-a);}
 });
 // --- candles: rounded, depth fade, glow on the recent ---
 const xoft={};
 ctx.lineCap='round';
 cs.forEach((c,i)=>{
  const x=Math.round(cw*(i+1))+0.5;   // crisp pixel-centred wick
  xoft[c[0]]=x;
  const up=c[5]===1;
  const col=up?'#2ecc71':'#ff5c5c';
  const age=(cs.length-1-i)/Math.max(1,cs.length-1);
  let al=1-age*0.62;
  let sy=1;
  const bt=born.cand[c[0]];
  if(bt!==undefined){const k=ease((now-bt)/320);
   sy=0.55+0.45*k;}
  ctx.globalAlpha=al;
  if(i>=cs.length-9){ctx.shadowColor=col;ctx.shadowBlur=6;}
  ctx.strokeStyle=col;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,px(c[2]));ctx.lineTo(x,px(c[3]));
  ctx.stroke();
  const y1=px(Math.max(c[1],c[4])),y2=px(Math.min(c[1],c[4]));
  const hgt=Math.max(1.5,(y2-y1)*sy);
  const cym=(y1+y2)/2;
  const gb=ctx.createLinearGradient(0,cym-hgt/2,0,cym+hgt/2);
  if(up){gb.addColorStop(0,'#49e58c');gb.addColorStop(1,'#1da65a');}
  else{gb.addColorStop(0,'#d64848');gb.addColorStop(1,'#ff7a7a');}
  ctx.fillStyle=gb;
  ctx.beginPath();
  ctx.roundRect(x-bw/2,cym-hgt/2,bw,hgt,Math.min(2,bw/3));
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
 });
 // --- structure spine through the dots ---
 const dpts=(D.dots||[]).map(d=>({x:xoft[d[0]],y:px(d[1])}))
  .filter(p=>p.x!==undefined);
 if(dpts.length>1){
  ctx.strokeStyle=D.trend===-1?'rgba(255,150,120,.35)'
   :'rgba(79,216,200,.35)';
  ctx.lineWidth=1.6;
  ctx.shadowColor=D.trend===-1?'#ff9678':'#4fd8c8';
  ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(dpts[0].x,dpts[0].y);
  for(let i=1;i<dpts.length;i++){
   const mx=(dpts[i-1].x+dpts[i].x)/2;
   ctx.quadraticCurveTo(dpts[i-1].x,dpts[i-1].y,mx,
    (dpts[i-1].y+dpts[i].y)/2);
   ctx.quadraticCurveTo(dpts[i].x,dpts[i].y,dpts[i].x,dpts[i].y);}
  ctx.stroke();
  ctx.shadowBlur=0;
 }
 // --- marks: choc = dashed line + open circle, bos = arrow ---
 (D.marks||[]).forEach(m=>{
  const x=xoft[m[0]];
  if(x===undefined)return;
  const up=m[3]===1;
  const col=up?'#2ecc71':'#ff5c5c';
  const y=px(m[1]);
  const isC=m[2]==='choch';
  ctx.strokeStyle=col;
  ctx.lineWidth=isC?1:2;
  if(isC)ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(x-20,y);ctx.lineTo(x+20,y);ctx.stroke();
  ctx.setLineDash([]);ctx.lineWidth=1;
  if(isC){ctx.beginPath();ctx.arc(x,y,3.5,0,6.3);ctx.stroke();}
  else{
   const s=5,dy2=up?-7:7;
   ctx.fillStyle=col;
   ctx.beginPath();
   ctx.moveTo(x,y+dy2+(up?-s:s));
   ctx.lineTo(x-s,y+dy2+(up?s*0.6:-s*0.6));
   ctx.lineTo(x+s,y+dy2+(up?s*0.6:-s*0.6));
   ctx.closePath();ctx.fill();
   const bt=born.bos[m[0]+'_'+m[3]];
   if(bt!==undefined){const k=(now-bt)/700;
    if(k>=0&&k<=1){ctx.globalAlpha=1-k;
     ctx.strokeStyle=col;
     ctx.beginPath();ctx.arc(x,y,6+34*ease(k),0,6.3);ctx.stroke();
     ctx.globalAlpha=1;}}
  }
 });
 // --- FLIP LINE: the trend's protected dot = where the CHoCH
 //     fires; a close beyond this price wounds the trend ---
 if(D.trend===1||D.trend===-1){
  const side=D.trend===1?1:-1;
  const tds=(D.dots||[]).filter(x=>x[2]===side);
  if(tds.length){
   const pd=tds[tds.length-1];
   const y=px(pd[1]);
   const col=side===1?'#4fd8c8':'#ffb86b';
   ctx.strokeStyle=col;
   ctx.globalAlpha=0.55;
   ctx.setLineDash([8,5]);
   ctx.lineWidth=1.2;
   ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
   ctx.setLineDash([]);
   ctx.globalAlpha=1;
   // small diamond at the right edge marks it as the trigger
   ctx.fillStyle=col;
   ctx.beginPath();
   ctx.moveTo(W-14,y-5);ctx.lineTo(W-9,y);
   ctx.lineTo(W-14,y+5);ctx.lineTo(W-19,y);
   ctx.closePath();ctx.fill();
  }
 }
 // --- glowing dots with birth bloom ---
 (D.dots||[]).forEach(d=>{
  const x=xoft[d[0]];
  if(x===undefined)return;
  const isLow=d[2]===1;
  const y=px(d[1])+(isLow?9:-9);
  const col=isLow?'#4fd8c8':'#ffb86b';
  let sc=1;
  const bt=born.dot[d[0]+'_'+d[2]];
  if(bt!==undefined){const k=(now-bt)/450;
   if(k>=0&&k<1)sc=0.2+0.8*ease(k)+0.35*Math.sin(Math.min(1,k)*3.14);}
  const g=ctx.createRadialGradient(x,y,0,x,y,11*sc);
  g.addColorStop(0,col);
  g.addColorStop(0.35,col+'88');
  g.addColorStop(1,col+'00');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,11*sc,0,6.3);ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y,3*sc,0,6.3);ctx.fill();
  ctx.fillStyle='#ffffff';ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(x,y,1.2*sc,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
 });
 // --- trade entry ribbons + tags ---
 (D.trades||[]).forEach(t=>{
  const man=t[6]==='m';
  const yE=px(t[2]);
  const pcol=t[5]>=0?'rgba(46,204,113,':'rgba(255,92,92,';
  ctx.strokeStyle=man?'rgba(232,197,90,.9)':'rgba(127,179,224,.85)';
  ctx.setLineDash([7,4]);
  ctx.shadowColor=pcol+'1)';ctx.shadowBlur=7;
  ctx.beginPath();ctx.moveTo(0,yE);ctx.lineTo(W,yE);ctx.stroke();
  ctx.shadowBlur=0;ctx.setLineDash([]);
  ctx.fillStyle=t[0]===1?'#2ecc71':'#ff5c5c';
  const s=5;
  ctx.beginPath();
  if(t[0]===1){ctx.moveTo(8,yE-2-s);ctx.lineTo(8-s,yE-2+s*0.6);
   ctx.lineTo(8+s,yE-2+s*0.6);}
  else{ctx.moveTo(8,yE+2+s);ctx.lineTo(8-s,yE+2-s*0.6);
   ctx.lineTo(8+s,yE+2-s*0.6);}
  ctx.closePath();ctx.fill();
  tag(yE,(man?'✋ ':'\u{1F916} ')+
   (t[0]===1?'▲ ':'▼ ')+t[1].toFixed(2)+
   (t[5]>=0?'  +$':'  -$')+Math.abs(t[5]).toFixed(2),
   '#cfe3f5',man?'rgba(232,197,90,.28)':'rgba(127,179,224,.25)');
 });
 // SL/TP levels drawn ONCE per unique price (several positions
 // often share them - no duplicate lines or clipped double tags)
 const lv={};
 (D.trades||[]).forEach(t=>{
  if(t[3]>0){const k='S'+t[3].toFixed(0);
   (lv[k]=lv[k]||['S',t[3],0])[2]+=Math.abs(t[2]-t[3])*t[1];}
  if(t[4]>0){const k='T'+t[4].toFixed(0);
   (lv[k]=lv[k]||['T',t[4],0])[2]+=Math.abs(t[4]-t[2])*t[1];}});
 Object.values(lv).forEach(([k,v,amt])=>{
  const y=px(v);
  const isS=k==='S';
  ctx.strokeStyle=isS?'rgba(255,92,92,.75)':'rgba(46,204,113,.75)';
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();

function y2p(y){if(!SCALE)return null;
 return SCALE.hi-(y-SCALE.top)/SCALE.plot*(SCALE.hi-SCALE.lo);}
function p2y(v){if(!SCALE)return null;
 return (SCALE.hi-v)/(SCALE.hi-SCALE.lo)*SCALE.plot+SCALE.top;}
function mtLot(dist,against){
 if(!MS)return{lot:0.02,bul:0};
 const base=MS.base_lot||0.02;
 // against the structure: half the base lot, never any bullet
 if(against)return{lot:(MS.counter_lot||0.01),bul:0,half:true};
 if(!(MS.debt>0.5)||!(dist>0))return{lot:base,bul:0};
 const r1=Math.max(dist*0.01,0.01);
 const bul=Math.min(MS.max_extra||3,Math.floor((MS.chest||0)/r1));
 return{lot:Math.round((base+bul*0.01)*100)/100,bul:bul};
}
function mtCalc(){
 if(!MT||!MS||!MS.px)return null;
 const mkt=MS.px,ref=MT.entry||mkt,sl=MT.sl,tp=MT.tp;
 let d=0;
 if(tp>ref&&sl<ref)d=1; else if(tp<ref&&sl>ref)d=-1;
 const dist=Math.abs(ref-sl),rew=Math.abs(tp-ref);
 const against=(MS.trend!==0&&d!==0&&d!==MS.trend);
 const L=mtLot(dist,against);
 let kind='MARCHE',bad='';
 if(MT.entry){
  const stopSide=(d===1)?(ref>mkt):(ref<mkt);
  kind=(d===1?'BUY ':'SELL ')+(stopSide?'STOP':'LIMIT');
  if(Math.abs(ref-mkt)<=(MS.s_min_dist||10))
   bad='entree trop pres du marche';
 }
 if(!bad&&against&&MS.counter_ok===false)
  bad='contre-tendance impossible a cette taille de lot';
 if(!bad)bad=(d===0?'mets le SL et le TP de part et d’autre de l’entree'
      :(dist<=(MS.s_min_dist||10)?'stop trop proche':''));
 return{d:d,px:ref,mkt:mkt,sl:sl,tp:tp,dist:dist,rew:rew,lot:L.lot,bul:L.bul,
  against:against,half:!!L.half,
  risk:dist*L.lot,gain:rew*L.lot,rr:dist>0?rew/dist:0,kind:kind,bad:bad};
}

   Math.abs(y0-p2y(MT.sl)),Math.abs(y0-p2y(MT.tp)),
   MT.entry?Math.abs(y0-p2y(MT.entry)):1e9)<=MTGRAB;
 if(!nearLine&&x0>cv.clientWidth-AXIS){
  vz={y:y0,z:vzoom,t:performance.now()};
  drag=null;cv.setPointerCapture(e.pointerId);
  e.preventDefault();e.stopImmediatePropagation();return;}

 const ys=p2y(MT.sl),yt=p2y(MT.tp);
 if(ys===null||yt===null)return;
 const cand=[['sl',Math.abs(y-ys)],['tp',Math.abs(y-yt)]];
 if(MT.entry)cand.push(['entry',Math.abs(y-p2y(MT.entry))]);
 cand.sort((a,b)=>a[1]-b[1]);
 if(cand[0][1]>MTGRAB)return;
 MTdrag=cand[0][0];
 drag=null;                      // cancel any pan the chart had started
 cv.setPointerCapture(e.pointerId);
 e.preventDefault();
 e.stopImmediatePropagation();   // the pan listener must not see this
 mtRender();
},true);
const MTEDGE=64;                // hold here and the line keeps going
let MTlast=0;                   // timestamp of the last push tick
cv.addEventListener('pointermove',e=>{
 if(vz){
  const r=cv.getBoundingClientRect(),y=e.clientY-r.top;
  vzoom=Math.max(0.25,Math.min(8,vz.z*Math.exp((y-vz.y)/240)));
  e.preventDefault();e.stopImmediatePropagation();return;}
 if(!MT||!MTdrag)return;
 const r=cv.getBoundingClientRect(),y=e.clientY-r.top;
 MTy=y;
 const plotBot=SCALE?SCALE.top+SCALE.plot:0;
 const inEdge=SCALE&&(y>plotBot-MTEDGE||y<MTEDGE);
 if(!inEdge){const v=y2p(y);
  if(v){MT[MTdrag]=Math.round(v*100)/100;mtRender();}}
 e.preventDefault();
 e.stopImmediatePropagation();
},true);
function mtEdgePush(){
 const now=performance.now();
 const dt=Math.min(50,now-(MTlast||now));MTlast=now;
 if(!MT||!MTdrag||MTy===null||!SCALE)return;
 let dir=0,depth=0;
 const pb=SCALE.top+SCALE.plot;
 if(MTy>pb-MTEDGE){dir=-1;depth=(MTy-(pb-MTEDGE))/MTEDGE;}
 else if(MTy<MTEDGE){dir=1;depth=(MTEDGE-MTy)/MTEDGE;}
 if(!dir)return;
 depth=Math.min(1,Math.max(0,depth));
 // points per SECOND, frame-rate independent, very gentle at the lip
 // so the last few points can be placed exactly
 const perSec=(SCALE.hi-SCALE.lo)*(0.008+0.09*depth*depth);
 MT[MTdrag]=Math.round((MT[MTdrag]+dir*perSec*dt/1000)*100)/100;
 mtRender();
}
const mtRelease=e=>{
 if(vz){
  // a quick tap on the axis with no travel resets the scale
  if(performance.now()-vz.t<280&&Math.abs(vzoom/vz.z-1)<0.04)vzoom=1;
  vz=null;try{cv.releasePointerCapture(e.pointerId);}catch(x){}
  e.stopImmediatePropagation();return;}
 if(!MTdrag)return;
 MTdrag=null;drag=null;MTy=null;
 try{cv.releasePointerCapture(e.pointerId);}catch(x){}
 e.stopImmediatePropagation();
};
cv.addEventListener('pointerup',mtRelease,true);
cv.addEventListener('pointercancel',mtRelease,true);
async function mtLoad(){
 try{const r=await fetch('/'+tok+'/manual_state',{cache:'no-store'});
  if(r.status===404){MSerr='Cette page n’a pas le droit de trader ce compte.';
   mtopen.style.display='none';return;}
  if(r.ok){MS=await r.json();MSerr=null;
   if(!MS.acct){MSerr='Le service de trading manuel est arrete.';
    mtopen.style.display='none';return;}
   if((Date.now()/1000-(MS.updated||0))>90)
    MSerr='Donnees figees depuis '+Math.round(Date.now()/1000-MS.updated)+'s.';
   if(MT)mtRender();
   mtopen.style.display=MT?'none':'block';
   return;}
  mtopen.style.display='none';
 }catch(e){MSerr='Reseau indisponible.';}
}
mtLoad();setInterval(mtLoad,3000);
</script></body></html>
