<style>
/* 2026-10-26 (owner: "the Kino panel style on all pages - Kino accessible from anywhere, knowing where the user is"):
   injected by owl_app_server._send into every member page that has Kino (same rule as the old floating button) */
#kpgtab{position:fixed;right:0;top:50%;z-index:9998;transform:translateY(-50%);border:0;border-radius:12px 0 0 12px;
 padding:10px 5px 12px 7px;background:linear-gradient(160deg,#6d5cf6,#3b82f6);color:#fff;font:800 11px Inter,system-ui,sans-serif;
 letter-spacing:.1em;box-shadow:-4px 6px 18px rgba(0,0,0,.35);opacity:.8;cursor:pointer;display:flex;flex-direction:column;
 align-items:center;gap:6px;transition:opacity .2s,transform .3s}

#kpgpn{position:fixed;z-index:9999;background:#0b0f14;display:flex;flex-direction:column;box-shadow:0 0 44px rgba(0,0,0,.55);
 transition:transform .34s cubic-bezier(.2,.85,.25,1);will-change:transform}
#kpgpn .h{display:flex;align-items:center;gap:8px;padding:8px 10px 7px 14px;flex:none;border-bottom:1px solid #1f2a38;touch-action:none;user-select:none}
#kpgpn .g{display:none}
#kpgpn .t{flex:1;min-width:0;font:800 13px Inter,system-ui,sans-serif;color:#e7eef7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kpgpn .t small{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-weight:700;font-size:10.5px;color:#8df0bb}
#kpgpn .t small i{width:7px;height:7px;border-radius:50%;background:#2ecc71;animation:kpgP 1.8s infinite}
@keyframes kpgP{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}70%{box-shadow:0 0 0 7px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
#kpgpn .b{flex:none;width:32px;height:32px;border-radius:10px;border:1px solid #2a3a4d;background:#172130;color:#cfd8e3;display:grid;
 place-items:center;font-size:14px;cursor:pointer;text-decoration:none}
#kpgpn iframe{flex:1;width:100%;border:0;background:#0b0f14}
#kpgpn .w{flex:1;display:grid;place-items:center;color:#7e93a8;font:13px Inter,system-ui,sans-serif;padding:20px;text-align:center}
@media (min-width:760px){#kpgpn{top:0;right:0;bottom:0;width:min(430px,42vw);border-left:1px solid rgba(109,92,246,.4);transform:translateX(105%)}#kpgpn.on{transform:none}}
@media (max-width:759px){#kpgpn{left:0;right:0;bottom:0;height:66vh;border-radius:18px 18px 0 0;border-top:1px solid rgba(109,92,246,.5);transform:translateY(105%)}
 #kpgpn.on{transform:none}#kpgpn .h{flex-wrap:wrap;padding-top:6px}
 #kpgpn .g{display:block;flex-basis:100%;height:4px;margin:0 auto 6px;max-width:40px;border-radius:4px;background:rgba(255,255,255,.22)}}
#kpgpn.drag{transition:none}
@media (max-width:759px){#kpgpn{height:52vh;transition:transform .34s cubic-bezier(.2,.85,.25,1),height .28s ease}
 #kpgpn.big{height:calc(100vh - 140px)}
 body.kp-nav #kpgpn{bottom:calc(66px + env(safe-area-inset-bottom,0px));border-radius:18px;left:8px;right:8px;border:1px solid rgba(109,92,246,.5);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
 body.kp-nav #kpgpn:not(.on){transform:translateY(calc(100% + 90px))}}
#kpgbig .x{display:none}#kpgpn.big #kpgbig .o{display:none}#kpgpn.big #kpgbig .x{display:inline}
/* one Kino entry per page (owner 2026-10-27: "2 Kino widgets is too much"): the pages' own launchers give way to the panel */
#kfab,#askkino{display:none!important}
.kface,.kpres{display:block;width:100%;height:100%}.kblink{animation:kblk 5.2s infinite;transform-origin:50px 50px}@keyframes kblk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}@media (prefers-reduced-motion:reduce){.kblink{animation:none}}</style>
<button id="kpgtab" aria-label="Kino" title="Kino"><span class="o" style="width:22px;height:22px;display:block"><canvas class="kpres"></canvas></span><span class="l">KINO</span></button>
<div id="kpgpn" aria-hidden="true"><div class="h" id="kpgh"><div class="g"></div>
 <div class="t"><span style="width:22px;height:22px;display:inline-block;vertical-align:-6px;margin-right:6px"><canvas class="kpres"></canvas></span>Kino<small><i></i><span>avec toi</span></small></div>
 <button class="b" id="kpgbig" aria-label="Agrandir" title="Agrandir / réduire"><span class="o">⤢</span><span class="x">⤡</span></button>
 <a class="b" id="kpgfull" href="#" aria-label="Plein écran" title="Plein écran">↗</a>
 <button class="b" id="kpgx" aria-label="Fermer" title="Fermer">✕</button></div>
 <div class="w" id="kpgw">…</div></div>
<script>
(function(){
try{if(window.top!==window)return;}catch(e){return;}
var TOK='__TOK__',B='/'+TOK+'/',P=document.getElementById('kpgpn'),TB=document.getElementById('kpgtab'),K={on:false,id:null,last:'',sent:0,acts:[],off:false,y0:null,h0:0};
function open(on){K.on=!!on;P.classList.toggle('on',K.on);P.setAttribute('aria-hidden',K.on?'false':'true');TB.classList.toggle('hid',K.on);
 try{if(K.on)sessionStorage.setItem('kpgOpen','1');else sessionStorage.removeItem('kpgOpen');}catch(e){}
 if(!K.on){P.style.transform='';return;}send(true);if(K.id)return;
 fetch(B+'chart_chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:document.documentElement.lang==='en'?'en':'fr'})})
 .then(function(r){return r.json();}).then(function(j){var w=document.getElementById('kpgw');
  if(!j.ok||!j.id){w.textContent=j.err==='strategy'?'Kino est inclus dans la formule Stratégie.':'Kino est occupé, réessaie dans un instant.';return;}
  K.id=j.id;document.getElementById('kpgfull').href=B+'atelier?c='+encodeURIComponent(j.id);
  var f=document.createElement('iframe');f.title='Kino';f.allow='microphone; autoplay';f.src=B+'atelier?embed=1&c='+encodeURIComponent(j.id);w.replaceWith(f);})
 .catch(function(){document.getElementById('kpgw').textContent='Hors ligne.';});}
TB.onclick=function(){open(true);};
window.kinoPanel=function(on){open(on===undefined?!K.on:on);};   /* the shell's Kino buttons */
if(document.getElementById('knav'))document.body.classList.add('kp-nav');else document.addEventListener('DOMContentLoaded',function(){if(document.getElementById('knav'))document.body.classList.add('kp-nav');});
document.getElementById('kpgbig').onclick=function(){var b=!P.classList.contains('big');P.classList.toggle('big',b);try{sessionStorage.setItem('kpgBig',b?'1':'');}catch(e){}};
try{if(sessionStorage.getItem('kpgBig'))P.classList.add('big');if(sessionStorage.getItem('kpgOpen'))setTimeout(function(){if(!K.on)open(true);},300);}catch(e){}document.getElementById('kpgx').onclick=function(){open(false);};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&K.on)open(false);});
var H=document.getElementById('kpgh');
H.addEventListener('pointerdown',function(e){if(window.innerWidth>=760||e.target.closest('.b'))return;K.y0=e.clientY;K.h0=P.offsetHeight;P.classList.add('drag');H.setPointerCapture(e.pointerId);});
H.addEventListener('pointermove',function(e){if(K.y0===null)return;var dy=e.clientY-K.y0;if(dy>0)P.style.transform='translateY('+dy+'px)';else{P.style.transform='';P.style.height=Math.min(window.innerHeight*.94,K.h0-dy)+'px';}});
function end(e){if(K.y0===null)return;var dy=e.clientY-K.y0;K.y0=null;P.classList.remove('drag');P.style.transform='';if(dy>K.h0*.3)open(false);}
H.addEventListener('pointerup',end);H.addEventListener('pointercancel',end);
/* where he is and what he does - the page, what is on his screen, his last taps. Never what he types, never a password. */
function txt(el){return (el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();}
document.addEventListener('click',function(e){var t=e.target&&e.target.closest&&e.target.closest('button,a,[role=tab],[onclick],summary,label,.tab,.chip');
 if(!t||P.contains(t)||t===TB)return;var w=txt(t).slice(0,48)||t.getAttribute('aria-label')||t.title||'';if(!w)return;
 K.acts.push([Math.round(Date.now()/1000),w]);if(K.acts.length>8)K.acts.shift();},true);
function seen(){var vh=window.innerHeight,out=[],n=0,L=document.body.querySelectorAll('h1,h2,h3,h4,p,li,td,th,b,strong,label,button,small,span,div');
 for(var i=0;i<L.length&&n<700&&out.join(' ').length<1400;i++){var el=L[i];if(P.contains(el)||TB.contains(el))continue;if(el.children.length>2)continue;
  var r=el.getBoundingClientRect();if(r.bottom<0||r.top>vh||r.width<2||r.height<2)continue;n++;var s=txt(el);if(s.length<2||s.length>160)continue;
  if(out.indexOf(s)<0)out.push(s);}
 var h1=document.querySelector('h1,h2');var sc=document.documentElement;var pct=Math.round(100*(sc.scrollTop||document.body.scrollTop)/Math.max(1,(sc.scrollHeight-vh)));
 return {path:location.pathname.replace('/'+TOK,'')||'/',q:location.search.slice(0,60),hash:location.hash.slice(0,40),title:document.title.slice(0,80),
  head:h1?txt(h1).slice(0,80):'',view:out.join(' | ').slice(0,1500),scroll:pct,acts:K.acts.slice()};}
function send(force){if(K.off||document.visibilityState!=='visible')return;var o=seen(),s=JSON.stringify([o.path,o.hash,o.view,o.acts]),now=Date.now();
 if(!force&&s===K.last&&now-K.sent<45000)return;K.last=s;K.sent=now;
 fetch(B+'page_seen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:o,panel:K.on})})
 .then(function(r){return r.json();}).then(function(j){if(j&&j.err==='strategy')K.off=true;}).catch(function(){});}
setInterval(function(){send(false);},5000);setTimeout(function(){send(true);},1500);
/* day one: a new member's first visit - Kino comes to say hello by himself, once */
if('__FIRST__'==='1'){try{if(!localStorage.getItem('kpgFirst:'+TOK)){localStorage.setItem('kpgFirst:'+TOK,'1');setTimeout(function(){if(!K.on)open(true);},3500);}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')send(true);});
})();
</script>

<!-- kino_presence.js (inlined, keep in sync) -->
<script>/* kino_presence.js (2026-11-02, owner: "a consciousness-style glowing effect, reacting, alive" - chose Synapse).
   Kino has no face: a bright core with points of thought orbiting it, linking up when they meet. One shared loop draws
   every <canvas class="kpres"> on the page (sizes from CSS, added at any time). It reacts to what Kino is doing:
     KinoPresence.set("rest" | "think" | "speak" | "worry")   or   <html data-kstate="...">
   rest = slow breathing; think = faster orbits; speak = pulses like a voice; worry = amber and restless.
   Paused while the tab is hidden; one still frame when the viewer asked for reduced motion. */
(function(){
 if(window.KinoPresence)return;
 var ST={rest:{sp:.35,amp:.06,c1:[124,108,255],c2:[34,211,238]},think:{sp:1.25,amp:.13,c1:[150,130,255],c2:[34,211,238]},
  speak:{sp:.75,amp:.1,c1:[124,108,255],c2:[80,230,255],voice:1},worry:{sp:.9,amp:.16,c1:[232,177,70],c2:[255,120,90],jit:1}};
 var want='rest',cur={sp:.35,amp:.06,c1:[124,108,255],c2:[34,211,238],voice:0,jit:0};
 function R(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
 function L(a,b,t){return a+(b-a)*t;}
 function state(){var s=document.documentElement.getAttribute('data-kstate');if(ST[s])return s;if(document.querySelector('.m.ai.typing,.m.ai.live,#livebub'))return 'speak';return want;}
 function blend(){var t=ST[state()];cur.sp=L(cur.sp,t.sp,.04);cur.amp=L(cur.amp,t.amp,.04);
  cur.c1=cur.c1.map(function(v,i){return L(v,t.c1[i],.04);});cur.c2=cur.c2.map(function(v,i){return L(v,t.c2[i],.04);});
  cur.voice=L(cur.voice,t.voice||0,.06);cur.jit=L(cur.jit,t.jit||0,.06);}
 function voice(t){return cur.voice*(.5+.5*Math.abs(Math.sin(t*7.3)*Math.sin(t*3.1+1)*Math.cos(t*11.7)));}
 function draw(x,w,t){var c=w/2,r=w*.34,ph=t*cur.sp,v=voice(t),i,j;x.clearRect(0,0,w,w);
  var halo=x.createRadialGradient(c,c,0,c,c,r*1.4);halo.addColorStop(0,R(cur.c1,.28+v*.3));halo.addColorStop(1,R(cur.c1,0));x.fillStyle=halo;x.fillRect(0,0,w,w);
  var P=[],n=w>90?18:(w>40?11:8);
  for(i=0;i<n;i++){var a=ph*(.4+(i%5)*.13)+i*2.39,rr=r*(.45+.5*((i*37)%11)/11)*(1+.06*Math.sin(ph*2+i))+cur.jit*Math.sin(t*19+i)*w*.012;P.push([c+Math.cos(a)*rr,c+Math.sin(a)*rr*.92]);}
  x.lineWidth=Math.max(.6,w/180);
  for(i=0;i<P.length;i++)for(j=i+1;j<P.length;j++){var d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]);if(d<r*.55){x.strokeStyle=R(cur.c2,(1-d/(r*.55))*.5);x.beginPath();x.moveTo(P[i][0],P[i][1]);x.lineTo(P[j][0],P[j][1]);x.stroke();}}
  for(i=0;i<P.length;i++){x.fillStyle=R(i%2?cur.c2:cur.c1,.95);x.beginPath();x.arc(P[i][0],P[i][1],Math.max(1,w/90)*(1+v*.6),0,7);x.fill();}
  var core=x.createRadialGradient(c,c,0,c,c,r*.38*(1+v*.4));core.addColorStop(0,'rgba(255,255,255,.95)');core.addColorStop(.4,R(cur.c2,.7));core.addColorStop(1,R(cur.c1,0));
  x.fillStyle=core;x.beginPath();x.arc(c,c,r*.4*(1+v*.4),0,7);x.fill();}
 var still=false;try{still=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){}
 function frame(ms){var t=still?2:ms/1000;blend();
  var L2=document.querySelectorAll('canvas.kpres'),dpr=Math.min(2,window.devicePixelRatio||1);
  for(var k=0;k<L2.length;k++){var cv=L2[k],b=cv.getBoundingClientRect(),s=Math.round(Math.min(b.width,b.height));
   if(!s||b.bottom<0||b.top>innerHeight)continue;
   if(cv.width!==Math.round(s*dpr)){cv.width=cv.height=Math.round(s*dpr);}
   var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);draw(x,s,t);}
  if(!still&&!document.hidden)requestAnimationFrame(frame);}
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&!still)requestAnimationFrame(frame);});
 window.KinoPresence={set:function(s){if(ST[s])want=s;if(still)requestAnimationFrame(frame);},state:function(){return state();}};
 requestAnimationFrame(frame);
 if(still)new MutationObserver(function(){requestAnimationFrame(frame);}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
