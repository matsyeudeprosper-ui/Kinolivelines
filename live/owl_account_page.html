:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;--border:#1f2a38;--border2:#2b3a4d;

:root[data-theme="light"]{--bg:#f3f6fa;--surface:#fff;--surface2:#f6f8fc;--surface3:#eef2f8;--border:#e3e8f0;--border2:#d5dce7;
 --text:#121722;--text2:#3b4658;--muted:#6a7588}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.wrap{max-width:640px;margin:0 auto;padding:22px 16px 24px}
h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 18px}
.me{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px}
.ini{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex:0 0 52px}
.me b{font-size:17px;display:block}.me small{color:var(--muted)}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 4px 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--border)}
.card>.row:first-child{border-top:0}
.row .l{display:flex;align-items:center;gap:12px}.row .ic{width:34px;height:34px;border-radius:10px;background:var(--surface3);display:grid;place-items:center;flex:0 0 34px}
.row .ic svg{width:18px;height:18px;color:var(--text2)}.row .t{font-weight:600}.row .s{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.chev{color:var(--muted);font-size:20px}
.plan{display:flex;justify-content:space-between;align-items:flex-start}.plan b{font-size:19px}.plan small{display:block;color:var(--muted);margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--grad)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:12px;font-weight:700;background:var(--grad);color:#fff;font-size:14px}
.btn.g{background:var(--surface3);color:var(--text)}
.bal{font-size:30px;font-weight:800;letter-spacing:-.02em}.pos{color:var(--up)}.neg{color:var(--down)}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid #2ecc7166;color:var(--up);font-weight:600}
.seg{display:flex;background:var(--surface3);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.out{color:var(--down)}
.foot{margin:24px 4px 0;font-size:12px;color:var(--muted);line-height:1.6}.foot a{text-decoration:underline}
/* 2026-11-02 (owner: "users must not reach the old design any more"): plans, codes and notifications live here now */
#sh{position:fixed;inset:0;z-index:80;display:none;background:rgba(3,6,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sh.on{display:block}
#sh .p{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--surface);border-top:1px solid var(--border2);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:shUp .25s ease-out}
@media (min-width:700px){#sh .p{left:50%;right:auto;width:520px;transform:translateX(-50%);bottom:24px;border-radius:22px;border:1px solid var(--border2)}}
@keyframes shUp{from{opacity:0;transform:translateY(30px)}to{opacity:1}}
#sh .g{width:40px;height:4px;border-radius:4px;background:var(--border2);margin:0 auto 12px}
#sh h3{margin:2px 0 6px;font-size:19px}#sh p{color:var(--text2);font-size:14px;margin:0 0 12px}
.pl{display:block;width:100%;text-align:left;border:1px solid var(--border2);background:var(--surface2);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer}
.pl.cur{border-color:#7c6cff88;background:linear-gradient(135deg,#7c6cff14,#22d3ee0d)}
.pl .h{display:flex;justify-content:space-between;align-items:baseline}.pl b{font-size:16px}.pl .pr{font-size:18px;font-weight:800}.pl .pr small{font-size:12px;color:var(--muted);font-weight:600}
.pl ul{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--text2)}.pl li{padding:2px 0}.pl li:before{content:"✓ ";color:var(--up);font-weight:800}
.pl .tg{font-size:11px;font-weight:800;color:#b4a9ff;margin-left:8px}
.in{width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);padding:13px;font:600 16px Inter,system-ui,sans-serif;margin-bottom:10px}
.in.code{letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:20px}
.bt{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:700 15px Inter,system-ui,sans-serif;cursor:pointer;margin-top:6px;background:var(--grad,linear-gradient(135deg,#7c6cff,#22d3ee));color:#fff}
.bt.gh{background:var(--surface3);color:var(--text)}
.msg{font-size:13.5px;margin:6px 0;color:var(--text2)}.msg.bad{color:#ff8a8a}.msg.ok{color:#7ff0b0}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--surface3);border:1px solid var(--border2);flex:none;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#2ecc71}.sw.on:after{transform:translateX(18px)}

  try{const r=await fetch(B+'buy',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'pkg='+encodeURIComponent(k)});const j=await r.json();
   if(j.ok&&j.url){m.textContent=T('La page de paiement s’ouvre.','The payment page opens.');try{window.open(j.url,'_blank');}catch(e){location.href=j.url;}}
   else{m.className='msg bad';m.textContent=j.err==='not ready'?T('Le paiement n’est pas encore ouvert. Demande à Kino.','Payments are not open yet. Ask Kino.'):T('Le paiement n’a pas pu démarrer. Réessaie dans un instant.','The payment could not start. Try again in a moment.');}}
  catch(e){m.className='msg bad';m.textContent=T('Hors ligne.','Offline.');}});
 $('shp').querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{const m=$('pmsg');m.className='msg';m.textContent=T('Je prépare le paiement…','Preparing the payment…');
  try{const r=await fetch(B+'msg_pack_buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack:b.dataset.pack})});const j=await r.json();
   if(j.ok&&(j.url||j.invoice_url)){const u=j.url||j.invoice_url;m.textContent=T('La page de paiement s’ouvre.','The payment page opens.');try{window.open(u,'_blank');}catch(e){location.href=u;}}
   else{m.className='msg bad';m.textContent=T('Le paiement n’a pas pu démarrer.','The payment could not start.');}}catch(e){m.className='msg bad';m.textContent=T('Hors ligne.','Offline.');}});}
function codeSheet(){sheet('<h3>'+T('Entrer un code','Enter a code')+'</h3><p>'+T('Le code reçu sur Telegram : il active ou renouvelle ta formule.','The code you received on Telegram: it activates or renews your plan.')+'</p>'+
  '<input class="in code" id="cin" maxlength="8" autocomplete="one-time-code" placeholder="ABC123"><div id="cmt"></div><div class="msg" id="cmsg"></div>'+
  '<button class="bt" id="cgo">'+T('Activer','Activate')+'</button><button class="bt gh" data-x>'+T('Fermer','Close')+'</button>');
 setTimeout(()=>{try{$('cin').focus();}catch(e){}},200);
 $('cgo').onclick=async()=>{const code=$('cin').value.trim().toUpperCase(),m=$('cmsg'),b=$('cgo');m.className='msg';
  if(code.length<6){m.className='msg bad';m.textContent=T('Entre le code complet.','Enter the full code.');return;}
  let extra='';const ml=$('ml');if(ml){if(!ml.value||!$('ms').value||!$('mp').value){m.className='msg bad';m.textContent=T('Les trois champs sont nécessaires.','All three fields are needed.');return;}
   extra='&mt5_login='+encodeURIComponent(ml.value)+'&mt5_server='+encodeURIComponent($('ms').value)+'&mt5_password='+encodeURIComponent($('mp').value);}
  b.disabled=true;b.textContent='…';let j=null;
  try{const r=await fetch(B+'activate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'code='+encodeURIComponent(code)+extra});j=await r.json();}catch(e){}
  b.disabled=false;b.textContent=T('Activer','Activate');
  if(j&&!j.ok&&j.need==='mt5'){$('cmt').innerHTML='<p>'+T('Ce code met le robot sur ton propre compte MT5. Dis-moi lequel, une seule fois.','This code puts the robot on your own MT5 account. Tell me which one, once.')+'</p>'+
    '<input class="in" id="ml" inputmode="numeric" placeholder="'+T('Numéro de compte MT5','MT5 account number')+'"><input class="in" id="ms" placeholder="Exness-MT5Real30"><input class="in" id="mp" type="password" placeholder="'+T('Mot de passe principal du compte','Account main password')+'">';
   m.textContent='';return;}
  if(j&&j.ok){m.className='msg ok';m.textContent=T('C’est fait : ta formule est active.','Done: your plan is active.');setTimeout(()=>location.reload(),1500);}
  /* 2026-11-02 (owner: "why is the activation code not working on Valère's account?"): the raw "bad code" / "too many tries"
     read like a broken panel - each case in plain words */
  else{m.className='msg bad';const E=(j&&j.err)||'';
   m.textContent=E==='bad code'?T('Ce code n’est pas valable : il a déjà servi, il a plus de 7 jours, ou une lettre est fausse. Demande-en un nouveau.','This code is not valid: already used, older than 7 days, or a letter is wrong. Ask for a new one.')
    :E==='too many tries'?T('Trop d’essais d’affilée : attends 10 minutes, puis réessaie une seule fois.','Too many tries in a row: wait 10 minutes, then try once more.')
    :E==='plein'?T('Plus de place pour le trading automatique en ce moment. Demande au propriétaire.','No place left for automatic trading right now. Ask the owner.')
    :T('Le code n’a pas pu être vérifié. Réessaie dans un instant.','The code could not be checked. Try again in a moment.');}};}
document.addEventListener('click',e=>{const a=e.target.closest('[data-sh]');if(!a)return;e.preventDefault();if(a.dataset.sh==='plans')plansSheet();else codeSheet();});
/* ---- notifications: the same subscription as the old dashboard ---- */
async function nsetup(){const sw=$('nsw');if(!sw)return;
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){$('nst').textContent=T('Pas disponible sur ce navigateur','Not available on this browser');sw.style.display='none';return;}
 let reg=null;try{reg=await navigator.serviceWorker.getRegistration(B)||await navigator.serviceWorker.register(B+'sw.js',{scope:B});}catch(e){}
 const s=reg?await reg.pushManager.getSubscription().catch(()=>null):null;sw.classList.toggle('on',!!s);
 sw.onclick=async()=>{if(!reg)return;const cur=await reg.pushManager.getSubscription().catch(()=>null);
  if(cur){await fetch(B+'push_unsub',{method:'POST',body:JSON.stringify(cur)}).catch(()=>null);await cur.unsubscribe().catch(()=>null);sw.classList.remove('on');return;}
  if(await Notification.requestPermission()!=='granted'){$('nst').textContent=T('Refusé par le téléphone : autorise-les dans ses réglages.','Refused by the phone: allow them in its settings.');return;}
  const kr=await fetch(B+'push_key').then(r=>r.json()).catch(()=>null);if(!kr||!kr.key)return;
  const conv=x=>{const p='='.repeat((4-x.length%4)%4),b=atob((x+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)));};
  const ns=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:conv(kr.key)}).catch(()=>null);
  if(!ns){$('nst').textContent=T('Impossible sur cet appareil.','Not possible on this device.');return;}
  await fetch(B+'push_sub',{method:'POST',body:JSON.stringify(ns)}).catch(()=>null);sw.classList.add('on');};}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{EN=b.dataset.l==='en';try{localStorage.setItem('owlLang',EN?'en':'fr');}catch(e){}paint();});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const l=b.dataset.t==='light';if(l)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');
 try{localStorage.setItem('owlTheme',l?'light':'dark');}catch(e){}paint();});
paint();fetch(B+'home_data',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;if(!localStorage.getItem('owlLang'))EN=d.lang==='en';paint();
 if(location.hash==='#formules'||location.hash==='#plans')plansSheet();else if(location.hash==='#code')codeSheet();}).catch(()=>{});
