<!doctype html><html lang="fr" translate="no" class="notranslate"><head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f14">
<title>L'atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('owlTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* 2026-10-19 (owner): "a real dedicated space where the user interacts with the AI and the AI builds all the robot's
   pieces, even pieces that don't exist ... human-like conversation ... premium, professional and personal".
   Phone: the chat fills the screen, the robot's blueprint is a strip on top (tap = the full blueprint in a panel).
   Desktop: chat on the left, the blueprint always open on the right. Same tokens as the Robots pages. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;
 --border:#1f2a38;--border2:#2b3a4d;--hl:inset 0 1px 0 rgba(255,255,255,.04);
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;
 --accent:#3b82f6;--accent-soft:#8fc6ff;--accent-bg:rgba(59,130,246,.14);
 --up:#2ecc71;--up-soft:#8df0bb;--down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;
 --r:16px;--r-lg:24px;--ok-bg:rgba(46,204,113,.12);--sh:0 18px 50px rgba(0,0,0,.45);--me1:#3b82f6;--me2:#6d5cf6}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;
 --text:#10161f;--text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--accent-bg:rgba(59,130,246,.1);--ok-bg:rgba(46,204,113,.14);--sh:0 18px 50px rgba(20,40,70,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;
 background:radial-gradient(45% 55% at 12% 20%,rgba(167,139,250,.13),transparent 70%),radial-gradient(45% 50% at 88% 10%,rgba(59,130,246,.15),transparent 70%);filter:blur(12px)}
button{font-family:inherit;color:inherit}a{color:var(--accent-soft)}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto}
@media(min-width:960px){.app{grid-template-columns:minmax(0,1fr) 400px;gap:0}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}
/* header */
header{flex:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none;text-decoration:none;cursor:pointer}
.ib svg{width:19px;height:19px}
.ttl{flex:1;min-width:0;cursor:pointer}.ttl b{display:flex;align-items:center;gap:6px;font-size:1.12rem;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b svg{width:13px;height:13px;opacity:.5;flex:none}
.ttl small{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;width:40px;height:40px;flex:none;cursor:pointer;border:0;background:none;padding:0}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3.2}.ring .bg{stroke:var(--border2)}.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;font-weight:800}
@media(min-width:960px){.ring{display:none}}
/* blueprint strip (phone) */
.strip{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent)}
.strip::-webkit-scrollbar{display:none}
@media(min-width:960px){.strip{display:none}}
.sp{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--surface);border-radius:99px;padding:6px 10px 6px 7px;font-size:.74rem;font-weight:700;color:var(--muted2);cursor:pointer;transition:all .3s}
.sp i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-style:normal;font-size:.62rem}
.sp.owl i{background:var(--surface3);color:var(--muted)}
.sp.set{color:var(--text);border-color:rgba(59,130,246,.45);background:linear-gradient(135deg,var(--accent-bg),var(--surface))}.sp.set i{background:var(--accent);color:#fff}
.sp.new{color:var(--text);border-color:rgba(167,139,250,.5);background:linear-gradient(135deg,rgba(167,139,250,.16),var(--surface))}.sp.new i{background:var(--violet);color:#fff}
.sp.empty{border-style:dashed;opacity:.65}
.sp.flash{animation:flash 1.2s}@keyframes flash{0%{box-shadow:0 0 0 0 rgba(167,139,250,.7)}100%{box-shadow:0 0 0 12px rgba(167,139,250,0)}}
/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 28px;scroll-behavior:smooth;overscroll-behavior:contain}
.day{text-align:center;font-size:.68rem;color:var(--muted);margin:10px 0;letter-spacing:.04em}
.m{display:flex;gap:9px;margin:10px 0;align-items:flex-end;animation:pop .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.av{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(109,92,246,.35)}
.av svg{width:18px;height:18px;color:#fff}
.bub{max-width:min(560px,82%);padding:11px 14px;border-radius:18px;font-size:.95rem;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.m.ai .bub{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;box-shadow:var(--hl)}
.m.me{justify-content:flex-end}.m.me .bub{background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(59,130,246,.25)}
.m.ai.err .bub{border-color:rgba(255,92,92,.35)}
.bub b{font-weight:800}.bub code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.82em;background:var(--surface3);border-radius:6px;padding:1px 5px}
.m.me .bub code{background:rgba(255,255,255,.18)}
.sys{display:flex;justify-content:center;margin:8px 0}.sys span{font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.sys svg{width:13px;height:13px}
.att{margin:2px 0 0 39px;display:grid;gap:8px;max-width:min(560px,82%)}
/* a piece the AI just made */
.made{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(167,139,250,.4);background:linear-gradient(135deg,rgba(167,139,250,.14),var(--surface) 70%);padding:11px 13px;cursor:pointer;animation:pop .4s both}
.made:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.6s .2s 1}
@keyframes shine{to{transform:translateX(100%)}}
.made .k{font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--violet-soft);display:flex;align-items:center;gap:6px}
.made .k svg{width:12px;height:12px}
.made b{display:block;font-size:.92rem;margin-top:3px}.made p{margin:3px 0 0;font-size:.82rem;color:var(--text2);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0 39px}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:99px;padding:9px 13px;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;animation:pop .35s both}
.chip:hover{border-color:var(--accent);background:var(--accent-bg)}.chip:active{transform:scale(.97)}
.cta{display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px;border:1px solid rgba(46,204,113,.4);background:linear-gradient(135deg,rgba(46,204,113,.14),var(--surface) 75%);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.cta .ci{flex:none;width:38px;height:38px;border-radius:12px;background:var(--up);display:grid;place-items:center;color:#05210f;box-shadow:0 6px 18px rgba(46,204,113,.35)}.cta .ci svg{width:19px;height:19px}
.cta b{display:block;font-size:.95rem}.cta small{color:var(--muted);font-size:.78rem}
/* test running / result */
.run{border-radius:18px;border:1px solid var(--border2);background:var(--surface);padding:13px 14px;position:relative;overflow:hidden}
.run b{font-size:.92rem}.run small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.run .pb{height:4px;border-radius:99px;background:var(--border2);margin-top:10px;overflow:hidden}.run .pb i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--violet));animation:slide 1.6s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.res{border-radius:20px;border:1px solid var(--border2);background:var(--surface);padding:14px;box-shadow:var(--hl)}
.res .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.res .lab{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.res .net{font-size:2rem;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.res .vs{font-size:.8rem;color:var(--muted);text-align:right}.res .vs b{display:block;font-size:.95rem;color:var(--text2)}
.res svg.cv{width:100%;height:70px;margin:8px 0 4px;display:block}
.res .q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.res .q div{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}.res .q b{display:block;font-size:.95rem;font-weight:800}.res .q span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res .leg{display:flex;gap:12px;font-size:.7rem;color:var(--muted);margin-top:6px}.res .leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}
.pos{color:var(--up-soft)}.neg{color:var(--down-soft)}
/* typing */
.live .bub .caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--violet);animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
.m.ai.cont{margin-bottom:4px}
.m.me .bub{position:relative}.m.me.rx{margin-bottom:16px}.react{position:absolute;left:-10px;bottom:-14px;font-size:.9rem;line-height:1;padding:4px 6px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.fl{font-size:.74rem;margin-top:6px;color:#ffd0d0}.fl a{color:#fff;font-weight:800}
.typing .bub{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.84rem}
/* 2026-10-19 evening: the builder works after the quick reply - a light line, the member can keep typing */
.bld{display:flex;align-items:center;gap:9px;margin:2px 0 10px 39px;color:var(--muted);font-size:.78rem}
.bld .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--violet);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sp.mk{color:var(--text);border-color:rgba(232,197,90,.45);background:linear-gradient(135deg,rgba(232,197,90,.13),var(--surface))}.sp.mk i{background:#e8c55a;color:#2a2000}
.mkp{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:11px 13px;border-radius:14px;border:1px solid rgba(232,197,90,.35);background:linear-gradient(135deg,rgba(232,197,90,.10),var(--surface));color:var(--text);cursor:pointer;text-align:left;font:inherit}
.mkp small{display:block;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.mkp b{font-size:.95rem}.mkp em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.8rem}
.mkl{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:10px}
.mkr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;text-align:left}
.mkr.on{border-color:#e8c55a}.mkr span{flex:1;font-weight:700}.mkr small{color:var(--muted);font-size:.72rem}.mkr .rd{color:var(--up-soft);font-weight:800}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent-soft);opacity:.4;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* welcome */
.hello{padding:18px 4px 6px;text-align:center}
.hello .orb{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:0 14px 40px rgba(109,92,246,.45),inset 0 1px 0 rgba(255,255,255,.3);animation:float 4s ease-in-out infinite}
.hello .orb svg{width:36px;height:36px;color:#fff}@keyframes float{50%{transform:translateY(-5px)}}
.hello h2{margin:0;font-size:1.45rem;font-weight:900;letter-spacing:-.025em}.hello p{margin:8px auto 0;max-width:420px;color:var(--muted2);font-size:.9rem;line-height:1.5}
.ideas{display:grid;gap:8px;margin:16px 0 6px}
@media(min-width:620px){.ideas{grid-template-columns:1fr 1fr}}
.idea{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:12px 13px;cursor:pointer;font:inherit;color:var(--text);transition:border-color .15s,transform .15s}
.idea:hover{border-color:var(--border2)}.idea:active{transform:scale(.985)}
.idea small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-soft);margin-bottom:3px}.idea span{font-size:.86rem;color:var(--text2);line-height:1.4}
/* composer */
.comp{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border2);background:var(--surface);border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--sh);transition:border-color .2s}
.cbox:focus-within{border-color:rgba(59,130,246,.6)}
.cbox textarea{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:.96rem;resize:none;max-height:140px;min-height:24px;padding:8px 0;outline:none;line-height:1.4}
.cbox textarea::placeholder{color:var(--muted)}
.send{flex:none;width:40px;height:40px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.send:disabled{opacity:.35;box-shadow:none}.send:active{transform:scale(.94)}.send svg{width:18px;height:18px}
.hint{font-size:.68rem;color:var(--muted);text-align:center;margin-top:6px}
/* blueprint panel (desktop column / phone sheet) */
.bp{display:none;border-left:1px solid var(--border);background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(8px);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
@media(min-width:960px){.bp{display:block}}
.bph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bph h3{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);flex:1}
.bpn{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;margin:0 0 4px;cursor:pointer}.bpu{font-size:.82rem;color:var(--muted2);line-height:1.45;margin:0 0 14px}
.slot{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,transform .15s;position:relative}
.slot:hover{border-color:var(--border2)}.slot:active{transform:scale(.99)}
.slot .sk{display:flex;align-items:center;gap:7px;font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.slot .sk em{font-style:normal;margin-left:auto;font-size:.6rem;letter-spacing:.06em;border-radius:99px;padding:3px 7px}
.tg-owl{color:var(--muted);background:var(--surface3)}.tg-new{color:var(--violet-soft);background:rgba(167,139,250,.16)}.tg-set{color:var(--accent-soft);background:var(--accent-bg)}.tg-f{color:var(--warn);background:rgba(232,197,90,.12)}
.slot b{display:block;font-size:.9rem;margin-top:4px}.slot p{margin:3px 0 0;font-size:.8rem;color:var(--text2);line-height:1.45}
.slot.new{border-color:rgba(167,139,250,.4)}.slot.flash{animation:flash 1.2s}
.fx{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.74rem;color:var(--warn);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.bpbtn{width:100%;margin-top:10px;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,var(--up),#22a85a);color:#05210f;box-shadow:0 10px 26px rgba(46,204,113,.3)}
.bpbtn:disabled{opacity:.4;box-shadow:none}
.bpsec{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.emptybp{border:1px dashed var(--border2);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:.84rem;line-height:1.5}
/* sheet */
.sh{position:fixed;inset:0;z-index:50;display:none}.sh.on{display:block}
.sh .bd{position:absolute;inset:0;background:rgba(3,6,10,.55);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--border2);border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}}
.sh .gr{width:42px;height:5px;border-radius:99px;background:var(--border2);margin:4px auto 12px}
.sh h4{margin:0 0 4px;font-size:1.1rem;font-weight:800}.sh .sub{color:var(--muted);font-size:.82rem;margin:0 0 12px;line-height:1.45}
.fld{margin:10px 0}.fld label{display:block;font-size:.72rem;font-weight:700;color:var(--muted2);margin-bottom:5px;letter-spacing:.02em}
.fld textarea,.fld input{width:100%;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:.9rem;outline:none}
.fld textarea{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.82rem;min-height:64px;resize:vertical}
.fld textarea:focus,.fld input:focus{border-color:var(--accent)}
.ok{font-size:.78rem;margin-top:6px;min-height:1.2em}.ok.g{color:var(--up-soft)}.ok.r{color:var(--down-soft)}
.btn{border:1px solid var(--border2);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.9rem;cursor:pointer;width:100%;margin-top:8px}
.btn.pri{background:linear-gradient(135deg,var(--me1),var(--me2));border:0;color:#fff}.btn.dan{color:var(--down-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hl{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--text)}

   TTS_A.play().then(()=>{TTS_OK=true;}).catch(()=>{if(!TTS_A.error){SPEAKING=false;speak0(text,then);}});return;}catch(e){TTS_OK=false;}}
