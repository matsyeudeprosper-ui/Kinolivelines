<!doctype html><html lang="fr" translate="no" class="notranslate"><head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f14">
<title>L'atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('owlTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* 2026-10-19 (owner): "a real dedicated space where the user interacts with the AI and the AI builds all the robot's
   pieces, even pieces that don't exist ... human-like conversation ... premium, professional and personal".
   Phone: the chat fills the screen, the robot's blueprint is a strip on top (tap = the full blueprint in a panel).
   Desktop: chat on the left, the blueprint always open on the right. Same tokens as the Robots pages. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;
 --border:#1f2a38;--border2:#2b3a4d;--hl:inset 0 1px 0 rgba(255,255,255,.04);
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;
 --accent:#3b82f6;--accent-soft:#8fc6ff;--accent-bg:rgba(59,130,246,.14);
 --up:#2ecc71;--up-soft:#8df0bb;--down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;
 --r:16px;--r-lg:24px;--ok-bg:rgba(46,204,113,.12);--sh:0 18px 50px rgba(0,0,0,.45);--me1:#3b82f6;--me2:#6d5cf6}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;
 --text:#10161f;--text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--accent-bg:rgba(59,130,246,.1);--ok-bg:rgba(46,204,113,.14);--sh:0 18px 50px rgba(20,40,70,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;
 background:radial-gradient(45% 55% at 12% 20%,rgba(167,139,250,.13),transparent 70%),radial-gradient(45% 50% at 88% 10%,rgba(59,130,246,.15),transparent 70%);filter:blur(12px)}
button{font-family:inherit;color:inherit}a{color:var(--accent-soft)}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto}
@media(min-width:960px){.app{grid-template-columns:minmax(0,1fr) 400px;gap:0}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}
/* header */
header{flex:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none;text-decoration:none;cursor:pointer}
.ib svg{width:19px;height:19px}
.ttl{flex:1;min-width:0;cursor:pointer}.ttl b{display:flex;align-items:center;gap:6px;font-size:1.12rem;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b svg{width:13px;height:13px;opacity:.5;flex:none}
.ttl small{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;width:40px;height:40px;flex:none;cursor:pointer;border:0;background:none;padding:0}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3.2}.ring .bg{stroke:var(--border2)}.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;font-weight:800}
@media(min-width:960px){.ring{display:none}}
/* blueprint strip (phone) */
.strip{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 18px),transparent)}
.strip::-webkit-scrollbar{display:none}
@media(min-width:960px){.strip{display:none}}
.sp{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--surface);border-radius:99px;padding:6px 10px 6px 7px;font-size:.74rem;font-weight:700;color:var(--muted2);cursor:pointer;transition:all .3s}
.sp i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-style:normal;font-size:.62rem}
.sp.owl i{background:var(--surface3);color:var(--muted)}
.sp.set{color:var(--text);border-color:rgba(59,130,246,.45);background:linear-gradient(135deg,var(--accent-bg),var(--surface))}.sp.set i{background:var(--accent);color:#fff}
.sp.new{color:var(--text);border-color:rgba(167,139,250,.5);background:linear-gradient(135deg,rgba(167,139,250,.16),var(--surface))}.sp.new i{background:var(--violet);color:#fff}
.sp.empty{border-style:dashed;opacity:.65}
.sp.flash{animation:flash 1.2s}@keyframes flash{0%{box-shadow:0 0 0 0 rgba(167,139,250,.7)}100%{box-shadow:0 0 0 12px rgba(167,139,250,0)}}
/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 28px;scroll-behavior:smooth;overscroll-behavior:contain}
.day{text-align:center;font-size:.68rem;color:var(--muted);margin:10px 0;letter-spacing:.04em}
.m{display:flex;gap:9px;margin:10px 0;align-items:flex-end;animation:pop .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.av{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(109,92,246,.35)}
.av svg{width:18px;height:18px;color:#fff}
.bub{max-width:min(560px,82%);padding:11px 14px;border-radius:18px;font-size:.95rem;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.m.ai .bub{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;box-shadow:var(--hl)}
.m.me{justify-content:flex-end}.m.me .bub{background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(59,130,246,.25)}
.m.ai.err .bub{border-color:rgba(255,92,92,.35)}
.bub b{font-weight:800}.bub code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.82em;background:var(--surface3);border-radius:6px;padding:1px 5px}
.m.me .bub code{background:rgba(255,255,255,.18)}
.sys{display:flex;justify-content:center;margin:8px 0}.sys span{font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.sys svg{width:13px;height:13px}
.att{margin:2px 0 0 39px;display:grid;gap:8px;max-width:min(560px,82%)}
/* a piece the AI just made */
.made{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(167,139,250,.4);background:linear-gradient(135deg,rgba(167,139,250,.14),var(--surface) 70%);padding:11px 13px;cursor:pointer;animation:pop .4s both}
.made:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.6s .2s 1}
@keyframes shine{to{transform:translateX(100%)}}
.made .k{font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--violet-soft);display:flex;align-items:center;gap:6px}
.made .k svg{width:12px;height:12px}
.made b{display:block;font-size:.92rem;margin-top:3px}.made p{margin:3px 0 0;font-size:.82rem;color:var(--text2);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0 39px}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:99px;padding:9px 13px;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;animation:pop .35s both}
.chip:hover{border-color:var(--accent);background:var(--accent-bg)}.chip:active{transform:scale(.97)}
.cta{display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px;border:1px solid rgba(46,204,113,.4);background:linear-gradient(135deg,rgba(46,204,113,.14),var(--surface) 75%);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.cta .ci{flex:none;width:38px;height:38px;border-radius:12px;background:var(--up);display:grid;place-items:center;color:#05210f;box-shadow:0 6px 18px rgba(46,204,113,.35)}.cta .ci svg{width:19px;height:19px}
.cta b{display:block;font-size:.95rem}.cta small{color:var(--muted);font-size:.78rem}
/* test running / result */
.run{border-radius:18px;border:1px solid var(--border2);background:var(--surface);padding:13px 14px;position:relative;overflow:hidden}
.run b{font-size:.92rem}.run small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.run .pb{height:4px;border-radius:99px;background:var(--border2);margin-top:10px;overflow:hidden}.run .pb i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--violet));animation:slide 1.6s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.res{border-radius:20px;border:1px solid var(--border2);background:var(--surface);padding:14px;box-shadow:var(--hl)}
.res .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.res .lab{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.res .net{font-size:2rem;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.res .vs{font-size:.8rem;color:var(--muted);text-align:right}.res .vs b{display:block;font-size:.95rem;color:var(--text2)}
.res svg.cv{width:100%;height:70px;margin:8px 0 4px;display:block}
.res .q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.res .q div{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}.res .q b{display:block;font-size:.95rem;font-weight:800}.res .q span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res .leg{display:flex;gap:12px;font-size:.7rem;color:var(--muted);margin-top:6px}.res .leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}
.pos{color:var(--up-soft)}.neg{color:var(--down-soft)}
/* typing */
.live .bub .caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--violet);animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
.m.ai.cont{margin-bottom:4px}
.m.me .bub{position:relative}.m.me.rx{margin-bottom:16px}.react{position:absolute;left:-10px;bottom:-14px;font-size:.9rem;line-height:1;padding:4px 6px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.fl{font-size:.74rem;margin-top:6px;color:#ffd0d0}.fl a{color:#fff;font-weight:800}
.typing .bub{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.84rem}
/* 2026-10-19 evening: the builder works after the quick reply - a light line, the member can keep typing */
.bld{display:flex;align-items:center;gap:9px;margin:2px 0 10px 39px;color:var(--muted);font-size:.78rem}
.bld .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--violet);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sp.mk{color:var(--text);border-color:rgba(232,197,90,.45);background:linear-gradient(135deg,rgba(232,197,90,.13),var(--surface))}.sp.mk i{background:#e8c55a;color:#2a2000}
.mkp{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:11px 13px;border-radius:14px;border:1px solid rgba(232,197,90,.35);background:linear-gradient(135deg,rgba(232,197,90,.10),var(--surface));color:var(--text);cursor:pointer;text-align:left;font:inherit}
.mkp small{display:block;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.mkp b{font-size:.95rem}.mkp em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.8rem}
.mkl{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:10px}
.mkr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;text-align:left}
.mkr.on{border-color:#e8c55a}.mkr span{flex:1;font-weight:700}.mkr small{color:var(--muted);font-size:.72rem}.mkr .rd{color:var(--up-soft);font-weight:800}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent-soft);opacity:.4;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* welcome */
.hello{padding:18px 4px 6px;text-align:center}
.hello .orb{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:0 14px 40px rgba(109,92,246,.45),inset 0 1px 0 rgba(255,255,255,.3);animation:float 4s ease-in-out infinite}
.hello .orb svg{width:36px;height:36px;color:#fff}@keyframes float{50%{transform:translateY(-5px)}}
.hello h2{margin:0;font-size:1.45rem;font-weight:900;letter-spacing:-.025em}.hello p{margin:8px auto 0;max-width:420px;color:var(--muted2);font-size:.9rem;line-height:1.5}
.ideas{display:grid;gap:8px;margin:16px 0 6px}
@media(min-width:620px){.ideas{grid-template-columns:1fr 1fr}}
.idea{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:12px 13px;cursor:pointer;font:inherit;color:var(--text);transition:border-color .15s,transform .15s}
.idea:hover{border-color:var(--border2)}.idea:active{transform:scale(.985)}
.idea small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-soft);margin-bottom:3px}.idea span{font-size:.86rem;color:var(--text2);line-height:1.4}
/* composer */
.comp{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border2);background:var(--surface);border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--sh);transition:border-color .2s}
.cbox:focus-within{border-color:rgba(59,130,246,.6)}
.cbox textarea{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:.96rem;resize:none;max-height:140px;min-height:24px;padding:8px 0;outline:none;line-height:1.4}
.cbox textarea::placeholder{color:var(--muted)}
.send{flex:none;width:40px;height:40px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.send:disabled{opacity:.35;box-shadow:none}.send:active{transform:scale(.94)}.send svg{width:18px;height:18px}
.hint{font-size:.68rem;color:var(--muted);text-align:center;margin-top:6px}
/* blueprint panel (desktop column / phone sheet) */
.bp{display:none;border-left:1px solid var(--border);background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(8px);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
@media(min-width:960px){.bp{display:block}}
.bph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bph h3{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);flex:1}
.bpn{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;margin:0 0 4px;cursor:pointer}.bpu{font-size:.82rem;color:var(--muted2);line-height:1.45;margin:0 0 14px}
.slot{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,transform .15s;position:relative}
.slot:hover{border-color:var(--border2)}.slot:active{transform:scale(.99)}
.slot .sk{display:flex;align-items:center;gap:7px;font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.slot .sk em{font-style:normal;margin-left:auto;font-size:.6rem;letter-spacing:.06em;border-radius:99px;padding:3px 7px}
.tg-owl{color:var(--muted);background:var(--surface3)}.tg-new{color:var(--violet-soft);background:rgba(167,139,250,.16)}.tg-set{color:var(--accent-soft);background:var(--accent-bg)}.tg-f{color:var(--warn);background:rgba(232,197,90,.12)}
.slot b{display:block;font-size:.9rem;margin-top:4px}.slot p{margin:3px 0 0;font-size:.8rem;color:var(--text2);line-height:1.45}
.slot.new{border-color:rgba(167,139,250,.4)}.slot.flash{animation:flash 1.2s}
.fx{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.74rem;color:var(--warn);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 8px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.bpbtn{width:100%;margin-top:10px;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,var(--up),#22a85a);color:#05210f;box-shadow:0 10px 26px rgba(46,204,113,.3)}
.bpbtn:disabled{opacity:.4;box-shadow:none}
.bpsec{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.emptybp{border:1px dashed var(--border2);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:.84rem;line-height:1.5}
/* sheet */
.sh{position:fixed;inset:0;z-index:50;display:none}.sh.on{display:block}
.sh .bd{position:absolute;inset:0;background:rgba(3,6,10,.55);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--border2);border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}}
.sh .gr{width:42px;height:5px;border-radius:99px;background:var(--border2);margin:4px auto 12px}
.sh h4{margin:0 0 4px;font-size:1.1rem;font-weight:800}.sh .sub{color:var(--muted);font-size:.82rem;margin:0 0 12px;line-height:1.45}
.fld{margin:10px 0}.fld label{display:block;font-size:.72rem;font-weight:700;color:var(--muted2);margin-bottom:5px;letter-spacing:.02em}
.fld textarea,.fld input{width:100%;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:.9rem;outline:none}
.fld textarea{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.82rem;min-height:64px;resize:vertical}
.fld textarea:focus,.fld input:focus{border-color:var(--accent)}
.ok{font-size:.78rem;margin-top:6px;min-height:1.2em}.ok.g{color:var(--up-soft)}.ok.r{color:var(--down-soft)}
.btn{border:1px solid var(--border2);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.9rem;cursor:pointer;width:100%;margin-top:8px}
.btn.pri{background:linear-gradient(135deg,var(--me1),var(--me2));border:0;color:#fff}.btn.dan{color:var(--down-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hl{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--text)}

<script>
const B=location.pathname.replace(/atelier\/?$/,'');
try{if(!localStorage.getItem('kinoLangFix1')){localStorage.setItem('kinoLangFix1','1');if(localStorage.getItem('owlLang')==='en'&&sessionStorage.getItem('kinoLangFlip')!=='manual')localStorage.removeItem('owlLang');}}catch(e){}
let EN=false;try{EN=localStorage.getItem('owlLang')==='en';}catch(e){}
const T=(fr,en)=>EN?en:fr;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C=null,CID=null,PIECES=null,POLL=null,LASTN=0,LASTREV=0,SENDING=false,THINK_T=0;
const SL=[['entry',T('Entrée','Entry')],['filters',T('Filtres','Filters')],['stop',T('Stop','Stop')],['exit',T('Sortie','Exit')],['recovery',T('Rattrapage','Recovery')],['money',T('Argent','Money')]];
const TYPE={entry:'entry',filters:'filter',stop:'stop',exit:'exit',recovery:'recovery',money:'money'};
const BUILD=[T('je monte ton robot…','building your robot…'),T('je vérifie les pièces…','checking the pieces…'),T('j’écris les formules…','writing the formulas…'),T('je relis tout…','reading it all over…')];
let MK=null;
const THINK=[T('je réfléchis…','thinking…'),T('je relis ton idée…','reading your idea again…'),T('j’assemble les pièces…','putting the pieces together…'),T('je vérifie les formules…','checking the formulas…'),T('presque fini…','almost done…')];

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200);}
async function getJ(u){const r=await fetch(B+u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});return r.json();}
async function post(fn,body){const r=await fetch(B+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json();}
const ERR={market:T('Ce marché n’est pas chez ton courtier.','That market isn’t at your broker.'),busy:T('Je suis encore en train de répondre, une seconde.','Still answering, one second.'),cap:T('Tu as beaucoup parlé aujourd’hui : on reprend demain.','Lots of chatting today: let’s pick it up tomorrow.'),
 same:T('Pour l’instant c’est encore l’Owl tel quel : change au moins une pièce.','Right now it is still the plain Owl: change at least one piece.'),limit:T('Tu as atteint le nombre maximum de robots.','You reached the maximum number of robots.'),
 state:T('Un test est déjà en route pour ce robot.','A test is already on its way for this robot.'),check:T('Ça ne passe pas les contrôles.','That does not pass the checks.'),missing:T('Conversation introuvable.','Conversation not found.'),strategy:T('L’atelier fait partie de la formule Stratégie.','The workshop is part of the Strategy plan.')};

/* ---------- text */
function md(s){let h=esc(s);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');return h;}
function money(v,d){if(v==null)return '—';const n=+v;return (n>=0?'+':'−')+'$'+Math.abs(n).toFixed(d==null?2:d);}

/* ---------- blueprint */
/* 2026-10-20 (owner: "the visual part of Kino, best version - it must make sense to non-technical people") */
const MKT={BTCUSD:['₿','Bitcoin','Bitcoin'],XAUUSD:['🥇','Or','Gold'],XAGUSD:['🥈','Argent (métal)','Silver'],USTEC:['📈','Nasdaq','Nasdaq'],US30:['🏛️','Dow Jones','Dow Jones'],US500:['📊','S&P 500','S&P 500'],USOIL:['🛢️','Pétrole','Oil'],UKOIL:['🛢️','Pétrole Brent','Brent oil'],EURUSD:['💶','Euro / Dollar','Euro / Dollar'],GBPUSD:['💷','Livre / Dollar','Pound / Dollar'],USDJPY:['💴','Dollar / Yen','Dollar / Yen'],ETHUSD:['⟠','Ethereum','Ethereum'],DE30:['🇩🇪','DAX','DAX'],JP225:['🇯🇵','Nikkei','Nikkei']};
function MKN(sym){const k=String(sym||'BTCUSD').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/M$/,'');const x=MKT[k];return x?[x[0],EN?x[2]:x[1],sym]:['📊',sym||'BTCUSD',sym];}
const STEP={entry:['🎯',T('Quand il entre','When it gets in'),T('Le signal qui ouvre un trade.','The signal that opens a trade.')],
 filters:['🔍',T('Ce qui doit être vrai aussi','What must also be true'),T('Aucune condition en plus : il prend chaque signal.','No extra condition: it takes every signal.')],
 stop:['🛡️',T('Sa protection','Its protection'),T('Où il coupe si le trade tourne mal.','Where it cuts if the trade goes wrong.')],
 exit:['🏁',T('Quand il sort','When it gets out'),T('Comment il encaisse son gain.','How it takes its gain.')],
 recovery:['🔁',T('Après une perte','After a loss'),T('Ce qu’il fait pour se refaire (ou pas).','What it does to make it back (or not).')],
 money:['💰',T('Combien il mise','How much it bets'),T('La taille de chaque trade.','The size of each trade.')]};
const GLS={atr:T('ATR = la taille moyenne d’une bougie ces derniers temps. « Stop à 2 ATR » : le stop est à deux bougies moyennes du prix d’entrée — plus le marché bouge, plus il est large.','ATR = the average size of a candle lately. "Stop at 2 ATR": the stop sits two average candles away from the entry — the more the market moves, the wider it is.'),
 r:T('R = ce que le robot risque sur un trade. « Sortie à 1R » : il sort quand il a gagné autant que ce qu’il risquait.','R = what the robot risks on one trade. "Exit at 1R": it gets out once it has won as much as it risked.'),
 pdh:T('Le plus haut (PDH) ou le plus bas (PDL) atteint hier.','Yesterday’s high (PDH) or low (PDL).'),
 bos:T('BOS = cassure de structure : le prix dépasse son dernier sommet (ou creux) important.','BOS = break of structure: price goes past its last important high (or low).'),
 choch:T('CHoCH = changement de tendance : le prix casse dans l’autre sens.','CHoCH = change of character: price breaks the other way.'),
 rsi:T('RSI = une jauge de 0 à 100 : près de 100 le prix a beaucoup monté récemment, près de 0 il a beaucoup baissé.','RSI = a 0-100 gauge: near 100 price rose a lot lately, near 0 it fell a lot.'),
 ema:T('Moyenne mobile = le prix moyen des dernières bougies : une ligne douce qui suit le prix.','Moving average = the average price of the last candles: a smooth line following price.'),
 pb:T('Repli = un petit retour en arrière du prix avant qu’il reparte dans sa direction.','Pullback = a small step back before price carries on in its direction.'),
 pf:T('Combien le robot gagne pour 1 $ perdu. Au-dessus de 1 : il gagne plus qu’il ne perd.','How much the robot wins for each $1 lost. Above 1: it wins more than it loses.'),
 dip:T('La plus grosse baisse du compte pendant le test, d’un sommet au creux suivant. C’est ce qu’il faut pouvoir supporter.','The biggest drop of the account during the test, from a peak to the next low. That is what you must be able to stand.'),
 luck:T('Le test de chance : on compare ton robot à 100 robots qui entrent au hasard. S’il fait mieux que presque tous, ce n’est pas de la chance.','The luck test: your robot is compared with 100 robots entering at random. If it beats almost all of them, it is not luck.')};
function humanize(t){let h=esc(t||'');
 h=h.replace(/\bATR\b/g,'<span class="gl" data-g="atr">ATR</span>').replace(/\b(\d+(?:[.,]\d+)?)\s?R\b/g,'<span class="gl" data-g="r">$1R</span>')
  .replace(/\b(PDH|PDL)\b/g,'<span class="gl" data-g="pdh">$1</span>').replace(/\bBOS\b/g,'<span class="gl" data-g="bos">BOS</span>').replace(/\bCHoCH\b/gi,'<span class="gl" data-g="choch">CHoCH</span>')
  .replace(/\bRSI\b/g,'<span class="gl" data-g="rsi">RSI</span>').replace(/\b(EMA|SMA)\s?(\d+)?\b/g,(m)=>'<span class="gl" data-g="ema">'+m+'</span>')
  .replace(/\b(pullback|repli)\b/gi,(m)=>'<span class="gl" data-g="pb">'+m+'</span>');
 return h;}
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.gl');if(!g)return;e.stopPropagation();e.preventDefault();const x=GLS[g.dataset.g];if(!x)return;toast(x);const tt=$('toast');clearTimeout(tt._t);tt._t=setTimeout(()=>tt.style.display='none',7000);},true);
function halfV(x){return (x&&typeof x==='object')?(x.net!=null?+x.net:null):(x==null?null:+x);}
function verdictOf(r){const n=+r.net||0,a=halfV(r.first_half),b=halfV(r.later_half);let c,t,s;
 if(n<=0){c='bad';t=T('👎 Il perd de l’argent sur ce test','👎 It loses money on this test');s=T('Tel quel, on ne le garde pas. Kino cherche ce qui cloche.','Not worth keeping as is. Kino looks for what is wrong.');}
 else if(a!=null&&b!=null&&(a<=0||b<=0)){c='mid';t=T('🤔 Fragile','🤔 Fragile');s=T('Une des deux moitiés de la période perd : le gain vient peut-être d’un coup de chance.','One half of the period loses: the gain may be luck.');}
 else{c='good';t=T('👍 Prometteur','👍 Promising');s=T('Il gagne sur les deux moitiés de la période. Prochaine étape : le ','It wins in both halves of the period. Next step: the ')+'<span class="gl" data-g="luck">'+T('test de chance','luck test')+'</span>.';}
 return '<div class="vd '+c+'"><b>'+t+'</b><span>'+s+'</span></div>';}
function slotState(k,s){if(!s)return 'empty';if(Array.isArray(s))return s.some(x=>x&&!x.use)?'new':(s.length?'set':'owl');if(!s.use)return 'new';return (OWL[k]&&OWL[k]===s.use)?'owl':'set';}
let OWL={};
function filled(){const v=C&&C.view;if(!v)return 0;return SL.filter(([k])=>{const s=v[k];return Array.isArray(s)?true:!!s;}).length;}
function changed(){const v=C&&C.view;if(!v)return 0;return SL.filter(([k])=>{const st=slotState(k,v[k]);return st==='set'||st==='new';}).length;}
function nameOf(s){return s?(s.name||s.use||'—'):'—';}
function plainOf(s){if(!s)return '';return s.plain||(EN?(s.plain_en||s.plain_fr):(s.plain_fr||s.plain_en))||'';}
function fxOf(s){const r=s&&s.rule;if(!r)return '';const L=[];
 if(r.event==='formula'||r.kind==='formula'){if(r.buy)L.push(T('achat','buy')+' : '+r.buy);if(r.sell)L.push(T('vente','sell')+' : '+r.sell);}
 if(r.close_buy)L.push(T('sortie achat','close buy')+' : '+r.close_buy);if(r.close_sell)L.push(T('sortie vente','close sell')+' : '+r.close_sell);return L.join('\n');}
function tagOf(st,s){if(st==='new')return '<em class="tg-new">'+T('créée','made')+'</em>';if(st==='owl')return '<em class="tg-owl">'+T('de l’Owl','the Owl’s')+'</em>';return '<em class="tg-set">'+T('choisie','chosen')+'</em>';}
function slotCard(k,lab,s,i){const st=s&&!s.use?'new':((OWL[k]===(s&&s.use)||(k==='filters'&&(OWL.filters||[]).includes(s&&s.use)))?'owl':'set');const fx=fxOf(s),M=STEP[k]||['•',lab,''];
 const bd=!s?'':(st==='new'?'<em class="bdg new">✦ '+T('Nouvelle','New')+'</em>':(st==='owl'?'<em class="bdg owl">'+T('Comme l’Owl','Like the Owl')+'</em>':'<em class="bdg set">'+T('Choisie','Chosen')+'</em>'));
 return '<div class="step '+(s?st:'empty')+(LASTFL&&Date.now()-LASTFL.t<8000&&LASTFL.k.includes(k)?' glow':'')+(C.status==='building'?' bldg':'')+'" data-k="'+k+'"'+(i!=null?' data-i="'+i+'"':'')+' onclick="slotSh(\''+k+'\','+(i==null?'null':i)+')"><div class="si">'+M[0]+'</div><div class="sb"><div class="sk2"><span>'+esc(i!=null?M[1]+' · '+(i+1):M[1])+'</span>'+bd+'</div>'+
  (s?'<b>'+humanize(nameOf(s))+'</b>'+(k==='money'&&C.money_plain?'<p>'+moneyLine()+'</p>':(plainOf(s)?'<p>'+humanize(plainOf(s))+'</p>':'')):'<p class="mut">'+M[2]+' <u>'+T('Toucher pour choisir','Tap to choose')+'</u></p>')+
  (fx?'<details class="fxd" onclick="event.stopPropagation()"><summary>'+T('Voir la règle exacte','See the exact rule')+'</summary><div class="fx">'+esc(fx)+'</div></details>':'')+'</div></div>';}
let BPFULL=false;
function bpHTML(){const v=C&&C.view;if(v&&!BPFULL&&!window.matchMedia('(min-width:960px)').matches)return bpSimple();
 let h='<div class="bph"><h3>'+T('Le plan du robot','The robot’s plan')+'</h3></div>';
 if(!v){return h+'<div class="emptybp">'+T('Raconte ton idée à Kino : le plan se dessine ici, étape par étape, au fil de la conversation.','Tell Kino your idea: the plan draws itself here, step by step, as you talk.')+'</div>';}
 const mk=MKN(v.market||'BTCUSD');
 h+='<div class="bpn" onclick="renameSh()">'+esc(v.name||T('Mon robot','My robot'))+'</div>'+(C.understood?'<div class="bps"><span>💬</span><span>'+humanize(C.understood)+'</span></div>':'')+
  '<button class="mkp" onclick="mkSh()"><span class="mki">'+mk[0]+'</span><span style="flex:1"><small>'+T('Il trade sur','It trades')+'</small><b>'+esc(mk[1])+'</b><i>'+esc(v.market||'BTCUSD')+'</i></span><em>'+T('changer','change')+' ›</em></button>';
 h+=robotStatus();
 h+='<div class="bpsec">'+T('Ses étapes','Its steps')+'</div><div class="steps">';
 SL.forEach(([k,lab])=>{if(k==='filters'){const F=v.filters||[];if(!F.length)h+=slotCard('filters',lab,null,null).replace('onclick="slotSh(\'filters\',null)"','onclick="slotSh(\'filters\',-1)"');

function drawChart(cv,o){if(!cv)return;cv._o=o;const rows=o.rows||[];if(!rows.length)return;

 const up=cssv('--up'),dn=cssv('--down');
 for(let i=a;i<b;i++){if(i>upto)break;const r=rows[i],x=X(i),c=r[4]>=r[1]?up:dn;g.strokeStyle=c;g.fillStyle=c;g.beginPath();g.moveTo(x,Y(r[2]));g.lineTo(x,Y(r[3]));g.stroke();
  const y1=Y(Math.max(r[1],r[4])),y2=Y(Math.min(r[1],r[4]));g.fillRect(x-Math.max(1,cw*.32),y1,Math.max(2,cw*.64),Math.max(1,y2-y1));}

 if(tr){const ie=idxAt(rows,tr.t_in),ix=idxAt(rows,tr.t_out);
  if(upto>=ie){const e2=Math.min(upto,ix),x1=X(ie),x2=X(e2)+cw/2,d=tr.d;
   const zone=(v,col)=>{g.fillStyle=col;g.globalAlpha=.12;g.fillRect(x1,Math.min(Y(tr.entry),Y(v)),x2-x1,Math.abs(Y(v)-Y(tr.entry)));g.globalAlpha=1;};
   if(tr.target!=null)zone(tr.target,up);if(tr.stop!=null)zone(tr.stop,dn);
   const LY={};{const L=[['e',tr.entry],['s',tr.stop],['t',tr.target]].filter(x=>x[1]!=null).map(x=>({k:x[0],y:Y(x[1])})).sort((p,q)=>p.y-q.y);

   const line=(v,col,dash,lab,key)=>{const ly=LY[key]!=null?LY[key]:Y(v);g.strokeStyle=col;g.lineWidth=1.5;g.setLineDash(dash);g.beginPath();g.moveTo(x1,Y(v));g.lineTo(x2,Y(v));g.stroke();g.setLineDash([]);

 g.fillStyle=cssv('--muted');g.font='10px Inter,system-ui';if(n){g.fillText(dm(vis[0][0])+' '+hm(vis[0][0]),2,H-4);const l=hm(vis[n-1][0]);g.fillText(l,W-R-g.measureText(l).width-2,H-4);}}

  h='<h4>💡 '+T('L’idée de départ','The starting idea')+'</h4>'+
   (U.length?'<div class="stq">'+U.map(m=>'<p>« '+esc(String(m.text).slice(0,280))+' »</p>').join('')+'<small>'+T('Tes mots, au début de la conversation','Your words, at the start of the conversation')+'</small></div>':'')+

   (C.idea_ok?'<p class="sub">✅ '+T('Vous êtes d’accord sur cette idée.','You both agreed on this idea.')+'</p>':(C.idea_pending?ideaCardHTML(C.idea_pending,-1):'<div class="kact"><button class="pri" onclick="shClose();ideaYes()">✅ '+T('Oui, c’est bien mon idée','Yes, that is my idea')+'</button></div>'))+

  shOpen(h);return;}
 if(k==='test'){h='<h4>🧪 '+T('Le test','The test')+'</h4>';

 const hl=(p,col,lab,dash)=>{if(p==null||p<lo||p>hi)return;const y=Y(p);g.strokeStyle=col;g.lineWidth=1.2;g.setLineDash(dash||[5,4]);g.beginPath();g.moveTo(0,y);g.lineTo(W-Rr,y);g.stroke();g.setLineDash([]);
  g.font='bold 9px Inter,system-ui';const tw=g.measureText(lab).width+8;g.fillStyle=col;g.globalAlpha=.85;g.fillRect(4,y-8,tw,14);g.globalAlpha=1;g.fillStyle='#fff';g.fillText(lab,8,y+3);};
 (J.levels||[]).forEach(l=>hl(l.p,l.k==='pdh'?'#f59e0b':'#38bdf8',l.k==='pdh'?T('plus haut d’hier','yesterday’s high'):T('plus bas d’hier','yesterday’s low')));
 const kd=J.kdraw||{};(kd.zones||[]).forEach(z=>{const a=Math.max(lo,Math.min(z.from,z.to)),b=Math.min(hi,Math.max(z.from,z.to));if(b<=a)return;g.fillStyle=cssv('--violet');g.globalAlpha=.12;g.fillRect(0,Y(b),W-Rr,Y(a)-Y(b));g.globalAlpha=1;});
 (kd.lines||[]).forEach(l=>hl(l.price,cssv('--violet'),'🦉 '+(l.label||'Kino'),[]));
 if(J.now!=null&&DR.off===0){const y=Y(J.now);if(J.now>=lo&&J.now<=hi){g.fillStyle=cssv('--accent');g.fillRect(W-Rr+1,y-7,Rr-2,14);g.fillStyle='#fff';g.font='bold 9px Inter,system-ui';g.fillText(px(J.now),W-Rr+3,y+3);}}
 if(J.live){g.fillStyle=cssv('--up');g.beginPath();g.arc(10,10,4,0,7);g.fill();g.fillStyle=cssv('--muted');g.font='bold 9px Inter,system-ui';g.fillText(T('EN DIRECT','LIVE'),18,13);}}

function rpBub(h,ms){const b=$('rpbub');if(!b)return;b.innerHTML='<div>'+h+'</div><button class="rpbx" onclick="this.parentNode.classList.remove(\'on\')">✕</button>';b.classList.add('on');clearTimeout(b._t);if(ms)b._t=setTimeout(()=>b.classList.remove('on'),ms);}
function rpUi(){if(!RP)return;const t=rpT();if(t)$('rptm').textContent=new Date(t*1000).toLocaleDateString(EN?'en-GB':'fr-FR',{weekday:'short',timeZone:'UTC'})+' '+dm(t)+' · '+hm(t);const st=rpStats();
 $('rpprog').innerHTML='<b>'+st.days.toFixed(1).replace('.',EN?'.':',')+T(' j',' d')+'</b> · '+st.n+' trades'+(st.n?' · <i class="'+(st.r>=0?'pos':'neg')+'">'+(st.r>=0?'+':'')+st.r.toFixed(1)+'R</i>':'');
 $('rpgo').innerHTML=RP.timer?'⏸':'▶';$('rpsp').textContent=['','×1','×3','×10'][RP.speed]||'×1';$('rplvl').classList.toggle('on',RP.mode==='level');
 const P=RP.pos,pb=$('rppos');if(P){const last=RP.rows[RP.ci][4],r=P.d*(last-P.e)/Math.abs(P.e-P.sl0||1),rr=Math.abs(P.tp-P.e)/Math.abs(P.e-P.sl||1);
  pb.innerHTML='<span class="'+(P.d===1?'b':'s')+'">'+(P.d===1?T('Achat','Buy'):T('Vente','Sell'))+'</span><span>'+px(P.e)+'</span><span class="mut">'+T('gain/risque ','reward/risk ')+rr.toFixed(1)+'</span><b class="'+(r>=0?'pos':'neg')+'">'+(r>=0?'+':'')+r.toFixed(2)+'R</b><button onclick="rpCloseTrade()">'+T('Fermer','Close')+'</button>';pb.classList.add('on');}
 else pb.classList.remove('on');}
function rpSaveBody(){return {market:RP.mk,tfs:RP.tfs,split:RP.split,start:RP.start,cursor:rpT(),speed:RP.speed,trades:RP.trades,pos:RP.pos,notes:RP.notes,levels:RP.levels};}
async function rpSave(closing){if(!RP||!RP.rows.length)return;if(!RP.dirty&&!closing)return;RP.dirty=false;try{await post('replay_save',{id:RP.cid,sess:rpSaveBody(),closing:!!closing});}catch(e){RP.dirty=true;}}
setInterval(()=>{if(RP&&$('rproom')&&$('rproom').classList.contains('on'))rpSave();},8000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&RP&&RP.dirty)rpSave();});
async function rpClose(){rpStop();const el=$('rproom');if(el)el.classList.remove('on');document.body.style.overflow='';if(RP&&RP.rows.length){const f=RP.fresh>=3;await rpSave(true);if(f)rpAsk(true);}load(CID,true);}
function rpPanel(h){const p=$('rppan');p.innerHTML='<div class="rppi"><button class="rpbx" onclick="$(\'rppan\').classList.remove(\'on\')">✕</button>'+h+'</div>';p.classList.add('on');}
function rpNotes(){const N=RP.notes.slice().reverse();rpPanel('<h4>📝 '+T('Mes notes de replay','My replay notes')+'</h4><p class="sub">'+T('Kino les lit et s’en souvient. Écris ce que tu vois, ce que tu attends, ce que tu as appris.','Kino reads them and remembers. Write what you see, what you expect, what you learned.')+'</p>'+
 '<textarea id="rpnt" rows="3" placeholder="'+T('Ex. : le prix revient sur le plus haut d’hier, j’attends une cassure…','E.g. price is back at yesterday’s high, I wait for a break…')+'"></textarea><button class="btn pri" onclick="rpNoteAdd()">'+T('Garder la note','Keep the note')+'</button>'+
 N.map(n=>'<div class="svd"><small>'+rpFmt(n.t)+'</small><p>'+esc(n.text)+'</p></div>').join(''));}
function rpNoteAdd(){const x=$('rpnt'),v=x&&x.value.trim();if(!v)return;RP.notes.push({t:rpT(),text:v});RP.dirty=true;rpSave();rpNotes();toast(T('Note gardée, Kino la lira.','Note kept, Kino will read it.'));}
function rpNoteTrade(){const t=RP.trades[RP.trades.length-1];if(!t)return;rpPanel('<h4>📝 '+T('Pourquoi ce trade ?','Why this trade?')+'</h4><p class="sub">'+(t.d===1?T('Achat','Buy'):T('Vente','Sell'))+' '+px(t.e)+' → '+(t.r>=0?'+':'')+t.r.toFixed(2)+'R</p><textarea id="rpnt" rows="3">'+esc(t.note||'')+'</textarea><button class="btn pri" onclick="rpNoteTradeSave()">'+T('Garder','Keep')+'</button>');}
function rpNoteTradeSave(){const t=RP.trades[RP.trades.length-1],x=$('rpnt');if(t&&x){t.note=x.value.trim().slice(0,300);RP.dirty=true;rpSave();}$('rppan').classList.remove('on');toast(T('Noté.','Noted.'));}
async function rpProg(){const st=rpStats();let L=[];try{L=((await post('replay_list',{})).sessions||[]);}catch(e){}
 rpPanel('<h4>📈 '+T('Ta progression','Your progress')+'</h4><div class="kq"><div><b>'+st.n+'</b><span>trades</span></div><div><b>'+st.wr+' %</b><span>'+T('gagnés','won')+'</span></div><div><b class="'+(st.r>=0?'pos':'neg')+'">'+(st.r>=0?'+':'')+st.r.toFixed(1)+'R</b><span>'+T('au total','in total')+'</span></div></div>'+
  '<canvas id="rpcurve" class="rpcurve"></canvas><p class="sub">'+T('Commencé le ','Started on ')+rpFmt(RP.start)+' · '+st.days.toFixed(1)+T(' jours rejoués',' days replayed')+'</p>'+
  (L.length>1?'<div class="bpsec">'+T('Tes autres projets','Your other projects')+'</div>'+L.filter(x=>x.id!==RP.cid).map(x=>'<div class="svd"><small>'+esc(x.market||'')+' · '+rpFmt(x.cursor||0)+'</small><p><b>'+esc(x.name||'')+'</b> — '+x.stats.n+' trades · '+x.stats.wr+' % · '+(x.stats.r>=0?'+':'')+x.stats.r+'R</p></div>').join(''):'')+
  '<div class="kact"><button onclick="rpRestart()">↺ '+T('Recommencer à une autre date','Start again at another date')+'</button></div>');
 const cv=$('rpcurve');if(cv){const g=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);let c=0;const P=[0].concat(RP.trades.map(t=>c+=t.r));
  const lo=Math.min.apply(null,P),hi=Math.max.apply(null,P),Yc=v=>H-6-(v-lo)/((hi-lo)||1)*(H-12);g.strokeStyle=cssv('--border');g.beginPath();g.moveTo(0,Yc(0));g.lineTo(W,Yc(0));g.stroke();
  g.strokeStyle=c>=0?cssv('--up'):cssv('--down');g.lineWidth=2;g.beginPath();P.forEach((v,i)=>{const x=P.length>1?i/(P.length-1)*W:0;i?g.lineTo(x,Yc(v)):g.moveTo(x,Yc(v));});g.stroke();}}
function rpRestart(){if(RP.pos){toast(T('Ferme d’abord ton trade.','Close your trade first.'));return;}if(!confirm(T('Recommencer à une autre date ? Les trades de cette séance repartent de zéro.','Start again at another date? This session’s trades start again from zero.')))return;$('rppan').classList.remove('on');rpStop();RP.rows=[];rpStartPick();}
function rpAskSh(){if(!RP||!RP.rows.length)return;rpBub('🦉 <b>'+T('Demande à Kino','Ask Kino')+'</b><small>'+T('Il voit ton graphique jusqu’à maintenant, jamais la suite.','He sees your chart up to now, never what comes next.')+'</small><div class="rpq"><input id="rpqi" placeholder="'+T('Ex. : tu entrerais ici ?','E.g. would you enter here?')+'" onkeydown="if(event.key===\'Enter\')rpAsk(false,this.value)"><button onclick="rpAsk(false,$(\'rpqi\').value)" aria-label="'+T('Envoyer','Send')+'">➤</button></div>'+
 '<span class="kact"><button onclick="rpAsk(false,\'\')">👀 '+T('Regarde mon graphique','Look at my chart')+'</button>'+(RP.trades.length?'<button onclick="rpAsk(true)">📊 '+T('Fais le point sur mes trades','Review my trades')+'</button>':'')+'</span>',0);setTimeout(()=>{const i=$('rpqi');if(i)i.focus();},100);}
async function rpAsk(auto,q){if(!RP||!RP.rows.length)return;q=String(q||'').trim();const s=rpUnit(),tf=Object.keys(RTF).find(k=>RTF[k]===s)||'M5',st=rpStats(),marks=[];
 RP.trades.slice(-3).forEach(t=>{marks.push({k:t.d===1?'buy':'sell',t:t.ti,p:t.e});marks.push({k:'exit',t:t.to,p:t.x});});
 if(RP.pos){marks.push({k:RP.pos.d===1?'buy':'sell',t:RP.pos.ti,p:RP.pos.e});marks.push({k:'stop',t:RP.pos.ti,p:RP.pos.sl});}
 RP.levels.slice(-3).forEach(l=>marks.push({k:'line',t:rpT(),p:l.p}));if(!marks.length)marks.push({k:'line',t:rpT(),p:RP.rows[RP.ci][4]});
 const last=RP.rows[RP.ci][4],P=RP.pos,cs=rpAgg(s,RP.ci,10).map(c=>hm(c[0])+' '+px(c[1])+'/'+px(c[2])+'/'+px(c[3])+'/'+px(c[4])).join('; ');
 const note=T('[Salle de replay] Je suis au ','[Replay room] I am at ')+rpFmt(rpT())+' UTC, '+RP.tfs.slice(0,RP.split).join('+')+' · '+st.n+' trades, '+st.wr+' %, '+(st.r>=0?'+':'')+st.r.toFixed(1)+'R. '+
  T('Prix maintenant : ','Price now: ')+px(last)+'. '+(P?T('Trade ouvert : ','Open trade: ')+(P.d===1?T('achat','buy'):T('vente','sell'))+' '+px(P.e)+', stop '+px(P.sl)+', '+T('cible ','target ')+px(P.tp)+', '+(P.d*(last-P.e)/Math.abs(P.e-P.sl0||1)).toFixed(2)+'R. ':'')+
  T('Dernières bougies ','Last candles ')+tf+' ('+T('heure o/h/b/c','time o/h/l/c')+') : '+cs+'. ';
 const ask_=(
  auto?T('Fais-moi le point sur mes derniers trades.','Review my last trades.'):(q||T('Qu’est-ce que tu vois sur mon graphique ?','What do you see on my chart?')));
 try{const j=await post('chat_show',{id:RP.cid,market:RP.mk,tf:tf,marks:marks.slice(0,12),note:'📈 '+ask_,ctx:note,upto:rpT()});if(!j.ok){toast(ERR[j.err]||T('Kino est occupé, réessaie dans un instant.','Kino is busy, try again in a moment.'));return;}}catch(e){return;}
 RP.fresh=0;RP.askT=Date.now()/1000;if(!auto)rpBub('🦉 '+T('Kino regarde ton graphique…','Kino is looking at your chart…'),0);clearTimeout(POLL);POLL=setTimeout(()=>load(CID),1500);}
setInterval(()=>{if(!RP||!RP.askT||!C||C.id!==RP.cid)return;const m=(C.msgs||[]).filter(m=>m.role==='ai'&&(m.t||0)>=RP.askT-2).pop();
 if(m&&m.text){RP.askT=0;if($('rproom')&&$('rproom').classList.contains('on'))rpBub('🦉 '+md(String(m.text).slice(0,600))+'<span class="kact"><button onclick="rpClose()">💬 '+T('Répondre dans la conversation','Reply in the conversation')+'</button></span>',0);}
 else if(Date.now()/1000-RP.askT<90){if(!RP._pl||Date.now()-RP._pl>2500){RP._pl=Date.now();load(CID);}}else RP.askT=0;},1500);
function rpCardHTML(m){const st=m.stats||{};return '<div class="att"><div class="rpcard"><div class="rpci">'+'📈'+'</div><div class="rpcb"><b>'+T('Salle de replay','Replay room')+' · '+esc(m.market||'')+'</b><span>'+T('Tu t’es arrêté au ','You stopped at ')+'<b>'+rpFmt(m.cursor||0)+'</b></span>'+
 '<small>'+String(st.days||0).replace('.',EN?'.':',')+T(' jours rejoués · ',' days replayed · ')+(st.n||0)+' trades'+(st.n?' · '+st.wr+' % · '+(st.r>=0?'+':'')+st.r+'R':'')+'</small></div><button class="btn pri" onclick="rpOpen()">'+T('Reprendre','Resume')+'</button></div></div>';}
window.addEventListener('resize',()=>{if(RP&&$('rproom')&&$('rproom').classList.contains('on'))rpDraw();});

</script>
<div id="call" role="dialog" aria-label="Appel avec Kino"><div><div class="ctm" id="ctm">0:00</div><div class="cav" id="cav" onclick="callTap()">🦉</div><div class="cn">Kino</div><div class="cst" id="cst"></div><div class="ctx" id="ctx"></div></div>
<button class="chg" onclick="callEnd()" aria-label="Raccrocher">✆</button></div>
<div id="fsc"><div class="fh"><button onclick="fsClose()" aria-label="Fermer">✕</button><b id="fst"></b><button onclick="fsZoom(1)" aria-label="Zoomer">＋</button><button onclick="fsZoom(-1)" aria-label="Dézoomer">－</button><button onclick="fsPlay()" aria-label="Rejouer">▶</button></div><canvas id="fcv"></canvas><div class="fz" id="fzh">Pince pour zoomer · glisse pour te déplacer</div></div>
</body></html>
