/* 2026-10-19 (owner): "a real dedicated space where the user interacts with the AI and the AI builds all the robot's
   pieces, even pieces that don't exist ... human-like conversation ... premium, professional and personal".

 --r:16px;--r-lg:24px;--ok-bg:rgba(46,204,113,.12);--sh:0 18px 50px rgba(0,0,0,.45);--me1:#3b82f6;--me2:#6d5cf6}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

 background:radial-gradient(45% 55% at 12% 20%,rgba(167,139,250,.13),transparent 70%),radial-gradient(45% 50% at 88% 10%,rgba(59,130,246,.15),transparent 70%);filter:blur(12px)}

<symbol id="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/></symbol>
</defs></svg>
<div class="app">
 <div class="col">
  <header>
   <a class="ib" href="robots" id="bk" aria-label="Retour"><svg><use href="#back"/></svg></a>
   <div class="ttl" id="ttl" onclick="renameSh()"><b><span id="tn">L'atelier</span><svg><use href="#pen"/></svg></b><small id="ts">Construis ton robot en parlant</small></div>
   <button class="ib" onclick="histSh()" aria-label="Mes conversations"><svg><use href="#hist"/></svg></button>
   <button class="ring" onclick="bpSh()" aria-label="Le plan du robot"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" id="rf" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"/></svg><b id="rn">0/6</b></button>
  </header>
  <div class="strip" id="strip"></div>
  <div class="chat" id="chat"></div>
  <div class="comp">
   <div class="cbox"><textarea id="tx" rows="1" placeholder="Écris ton idée…" maxlength="1500"></textarea><button class="send" id="sd" onclick="send()" disabled aria-label="Envoyer"><svg><use href="#send"/></svg></button></div>
   <div class="hint" id="hint">Un test sur le passé ne promet rien pour la suite. Aucun argent n'est engagé.</div>
  </div>
 </div>
 <aside class="bp" id="bp"></aside>
</div>
<div class="sh" id="sh"><div class="bd" onclick="shClose()"></div><div class="pn" id="pn"></div></div>
<div class="toast" id="toast"></div>
<script>
const B=location.pathname.replace(/atelier\/?$/,'');
let EN=false;try{EN=localStorage.getItem('owlLang')==='en';}catch(e){}
const T=(fr,en)=>EN?en:fr;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C=null,CID=null,PIECES=null,POLL=null,LASTN=0,LASTREV=0,SENDING=false,THINK_T=0;
const SL=[['entry',T('Entrée','Entry')],['filters',T('Filtres','Filters')],['stop',T('Stop','Stop')],['exit',T('Sortie','Exit')],['recovery',T('Rattrapage','Recovery')],['money',T('Argent','Money')]];
const TYPE={entry:'entry',filters:'filter',stop:'stop',exit:'exit',recovery:'recovery',money:'money'};
const THINK=[T('je réfléchis…','thinking…'),T('je relis ton idée…','reading your idea again…'),T('j’assemble les pièces…','putting the pieces together…'),T('je vérifie les formules…','checking the formulas…'),T('presque fini…','almost done…')];

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200);}
async function getJ(u){const r=await fetch(B+u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});return r.json();}
async function post(fn,body){const r=await fetch(B+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json();}
const ERR={busy:T('Je suis encore en train de répondre, une seconde.','Still answering, one second.'),cap:T('Tu as beaucoup parlé aujourd’hui : on reprend demain.','Lots of chatting today: let’s pick it up tomorrow.'),
 same:T('Pour l’instant c’est encore l’Owl tel quel : change au moins une pièce.','Right now it is still the plain Owl: change at least one piece.'),limit:T('Tu as atteint le nombre maximum de robots.','You reached the maximum number of robots.'),
 state:T('Un test est déjà en route pour ce robot.','A test is already on its way for this robot.'),check:T('Ça ne passe pas les contrôles.','That does not pass the checks.'),missing:T('Conversation introuvable.','Conversation not found.'),strategy:T('L’atelier fait partie de la formule Stratégie.','The workshop is part of the Strategy plan.')};

/* ---------- text */
function md(s){let h=esc(s);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');return h;}
function money(v,d){if(v==null)return '—';const n=+v;return (n>=0?'+':'−')+'$'+Math.abs(n).toFixed(d==null?2:d);}

/* ---------- blueprint */
function slotState(k,s){if(!s)return 'empty';if(Array.isArray(s))return s.some(x=>x&&!x.use)?'new':(s.length?'set':'owl');if(!s.use)return 'new';return (OWL[k]&&OWL[k]===s.use)?'owl':'set';}
let OWL={};
function filled(){const v=C&&C.view;if(!v)return 0;return SL.filter(([k])=>{const s=v[k];return Array.isArray(s)?true:!!s;}).length;}
function changed(){const v=C&&C.view;if(!v)return 0;return SL.filter(([k])=>{const st=slotState(k,v[k]);return st==='set'||st==='new';}).length;}
function nameOf(s){return s?(s.name||s.use||'—'):'—';}
function plainOf(s){if(!s)return '';return s.plain||(EN?(s.plain_en||s.plain_fr):(s.plain_fr||s.plain_en))||'';}
function fxOf(s){const r=s&&s.rule;if(!r)return '';const L=[];
 if(r.event==='formula'||r.kind==='formula'){if(r.buy)L.push(T('achat','buy')+' : '+r.buy);if(r.sell)L.push(T('vente','sell')+' : '+r.sell);}
 if(r.close_buy)L.push(T('sortie achat','close buy')+' : '+r.close_buy);if(r.close_sell)L.push(T('sortie vente','close sell')+' : '+r.close_sell);return L.join('\n');}
function tagOf(st,s){if(st==='new')return '<em class="tg-new">'+T('créée','made')+'</em>';if(st==='owl')return '<em class="tg-owl">'+T('de l’Owl','the Owl’s')+'</em>';return '<em class="tg-set">'+T('choisie','chosen')+'</em>';}
function slotCard(k,lab,s,i){const st=s&&!s.use?'new':((OWL[k]===(s&&s.use)||(k==='filters'&&(OWL.filters||[]).includes(s&&s.use)))?'owl':'set');const fx=fxOf(s);
 return '<div class="slot '+(st==='new'?'new':'')+'" data-k="'+k+'"'+(i!=null?' data-i="'+i+'"':'')+' onclick="slotSh(\''+k+'\','+(i==null?'null':i)+')"><div class="sk">'+esc(lab)+(fx?'<em class="tg-f" style="margin-left:6px">'+T('formule','formula')+'</em>':'')+tagOf(st,s)+'</div><b>'+esc(nameOf(s))+'</b>'+(plainOf(s)?'<p>'+esc(plainOf(s))+'</p>':'')+(fx?'<div class="fx">'+esc(fx)+'</div>':'')+'</div>';}
function bpHTML(){const v=C&&C.view;
 let h='<div class="bph"><h3>'+T('Le plan du robot','The robot’s blueprint')+'</h3></div>';
 if(!v){return h+'<div class="emptybp">'+T('Le robot apparaît ici dès que l’IA a compris ton idée. Chaque pièce se remplit en direct.','The robot shows up here as soon as the AI gets your idea. Each piece fills in live.')+'</div>';}
 h+='<div class="bpn" onclick="renameSh()">'+esc(v.name||T('Mon robot','My robot'))+'</div>'+(C.understood?'<p class="bpu">'+esc(C.understood)+'</p>':'');
 SL.forEach(([k,lab])=>{if(k==='filters'){h+='<div class="bpsec">'+lab+' · '+(v.filters||[]).length+'</div>';(v.filters||[]).forEach((f,i)=>h+=slotCard('filters',lab+' '+(i+1),f,i));
   h+='<button class="btn" style="margin:0 0 8px" onclick="slotSh(\'filters\',-1)">+ '+T('Ajouter un filtre','Add a filter')+'</button>';}
  else{if(k==='entry')h+='<div class="bpsec">'+T('Les pièces','The pieces')+'</div>';h+=slotCard(k,lab,v[k],null);}});
 const t=C.test||{},busy=t.state==='queued';
 h+='<button class="bpbtn" onclick="runTest()" '+(busy||C.status==='thinking'?'disabled':'')+'>'+(busy?T('Test en cours…','Test running…'):(t.state==='done'?T('Retester ce robot','Test this robot again'):T('Tester ce robot · ~5 min','Test this robot · ~5 min')))+'</button>';
 if(C.robot_id)h+='<a class="btn" style="display:block;text-align:center;text-decoration:none;color:var(--text)" href="mesrobots">'+T('Voir dans Mes robots','See it in My robots')+'</a>';
 return h;}
function paintBP(flash){$('bp').innerHTML=bpHTML();const v=C&&C.view;
 // strip
 let s='';SL.forEach(([k,lab])=>{const val=v?v[k]:null;let st=v?slotState(k,val):'empty';if(k==='filters'&&v)st=(val||[]).some(x=>!x.use)?'new':((JSON.stringify((val||[]).map(x=>x.use))===JSON.stringify(OWL.filters||[]))?'owl':'set');
  const n=k==='filters'&&v?(val||[]).length:'';s+='<button class="sp '+st+'" data-k="'+k+'" onclick="bpSh(\''+k+'\')"><i>'+(st==='new'?'✦':(st==='empty'?'':(n!==''?n:'✓')))+'</i>'+esc(lab)+'</button>';});
 $('strip').innerHTML=s;
 const f=v?changed():0,tot=6;$('rn').textContent=(v?filled():0)+'/6';$('rf').style.strokeDashoffset=String(100.5*(1-(v?filled():0)/tot));
 if(v){$('tn').textContent=v.name||T('Mon robot','My robot');$('ts').textContent=C.understood||T('Construit avec l’IA','Built with the AI');}
 if(flash&&flash.length)setTimeout(()=>flash.forEach(k=>document.querySelectorAll('[data-k="'+k+'"]').forEach(e=>{e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');})),60);}

/* ---------- chat */
function resultCard(r){const pos=(r.net||0)>=0,wr=r.win_rate!=null?Math.round(r.win_rate*100):null;
 const cv=(()=>{const A=(r.curve||[]),O=(r.owl_curve||[]);if(A.length<2&&O.length<2)return '';
  const days=[...new Set([...A.map(x=>x[0]),...O.map(x=>x[0])])].sort();const fill=L=>{const m={};L.forEach(x=>m[x[0]]=+x[1]);let v=0;return days.map(d=>(v=(d in m)?m[d]:v));};
  const a=fill(A),o=fill(O),all=[0,...a,...o],mn=Math.min(...all),mx=Math.max(...all),W=300,H=70,sx=i=>days.length>1?i*W/(days.length-1):0,sy=v=>H-4-(v-mn)/((mx-mn)||1)*(H-8);
  const pth=L=>L.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  return '<svg class="cv" viewBox="0 0 300 70" preserveAspectRatio="none"><line x1="0" x2="300" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="var(--border2)" stroke-dasharray="3 4"/><path d="'+pth(o)+'" fill="none" stroke="var(--muted)" stroke-width="1.6" opacity=".7"/><path d="'+pth(a)+'" fill="none" stroke="'+(pos?'var(--up)':'var(--down)')+'" stroke-width="2.4" stroke-linejoin="round"/></svg>';})();
 return '<div class="res"><div class="top"><div><div class="lab">'+T('Résultat du test','Test result')+' · '+(r.days||42)+T(' jours',' days')+'</div><div class="net '+(pos?'pos':'neg')+'">'+money(r.net)+'</div></div><div class="vs">'+T('l’Owl','the Owl')+'<b>'+money(r.owl_net)+'</b></div></div>'+cv+
  '<div class="leg"><span><i style="background:'+(pos?'var(--up)':'var(--down)')+'"></i>'+T('ton robot','your robot')+'</span><span><i style="background:var(--muted)"></i>'+T('l’Owl','the Owl')+'</span></div>'+
  '<div class="q"><div><b>'+(r.trades==null?'—':r.trades)+'</b><span>trades</span></div><div><b>'+(wr==null?'—':wr+' %')+'</b><span>'+T('gagnés','won')+'</span></div><div><b class="neg">'+(r.dip==null?'—':'−$'+Math.round(r.dip))+'</b><span>'+T('pire baisse','worst dip')+'</span></div><div><b>'+(r.profit_factor==null?'—':(+r.profit_factor).toFixed(2))+'</b><span>'+T('gain/perte','gain/loss')+'</span></div></div></div>';}
function msgHTML(m,i,last){
 if(m.role==='user')return '<div class="m me"><div class="bub">'+md(m.text)+'</div></div>';
 if(m.role==='edit')return '<div class="sys"><span><svg><use href="#pen"/></svg>'+esc(m.text)+'</span></div>';
 if(m.role==='test'){const t=C.test||{};if(t.state==='queued'&&last)return '<div class="att" style="margin-left:39px"><div class="run"><b>'+T('Test en cours sur 42 jours de vrais prix','Testing on 42 days of real prices')+'</b><small>'+(t.ahead?T(t.ahead+' test(s) avant le tien · ',t.ahead+' test(s) before yours · '):'')+T('environ 5 minutes, je te préviens ici','about 5 minutes, I’ll tell you here')+'</small><div class="pb"><i></i></div></div></div>';
  return '<div class="sys"><span><svg><use href="#flask"/></svg>'+esc(m.text)+'</span></div>';}
 if(m.role==='result')return '<div class="att" style="margin-left:39px">'+resultCard(m.result||{})+'</div>';
 let h='<div class="m ai'+(m.err?' err':'')+'"><div class="av"><svg><use href="#owl"/></svg></div><div class="bub">'+md(m.text)+'</div></div>';
 if(m.made&&m.made.length)h+='<div class="att">'+m.made.map(p=>'<div class="made" onclick="bpSh(\''+esc(p.slot==='filters'?'filters':p.slot)+'\')"><div class="k"><svg><use href="#spark"/></svg>'+T('Nouvelle pièce','New piece')+' · '+esc((SL.find(x=>x[0]===p.slot||x[0]===p.slot+'s')||[0,p.slot])[1])+'</div><b>'+esc(p.name)+'</b>'+(p.plain?'<p>'+esc(p.plain)+'</p>':'')+'</div>').join('')+'</div>';
 if(last&&m.ready&&C.view&&!(C.test&&C.test.state==='queued'))h+='<div class="att"><button class="cta" onclick="runTest()"><span class="ci"><svg><use href="#play"/></svg></span><span><b>'+T('Tester ce robot','Test this robot')+'</b><small>'+T('42 jours de vrais prix · environ 5 min · sans argent','42 days of real prices · about 5 min · no money')+'</small></span></button></div>';
 if(last&&m.chips&&m.chips.length&&C.status!=='thinking')h+='<div class="chips">'+m.chips.map(c=>'<button class="chip" onclick="chip(this)">'+esc(c)+'</button>').join('')+'</div>';
 return h;}
function welcome(){return '<div class="hello"><div class="orb"><svg><use href="#owl"/></svg></div><h2>'+T('Construis ton robot en parlant','Build your robot by talking')+'</h2><p>'+T('Explique ton idée comme à un ami. Je la traduis en pièces, j’invente celles qui n’existent pas encore, et on la teste sur de vrais prix.','Explain your idea like you would to a friend. I turn it into pieces, invent the ones that don’t exist yet, and we test it on real prices.')+'</p>'+
 '<div class="ideas">'+[[T('Croisement','Crossover'),T('J’achète quand la moyenne rapide passe au-dessus de la lente, dans le sens de la tendance d’une heure.','I buy when the fast average crosses above the slow one, with the one-hour trend.')],
  [T('Rebond','Bounce'),T('Je vends quand le RSI est au-dessus de 75 et que le prix touche le haut des bandes de Bollinger.','I sell when the RSI is above 75 and price touches the upper Bollinger band.')],
  [T('Cassure du jour','Day breakout'),T('J’entre quand le prix casse le plus haut d’hier, pendant la session de Londres seulement.','I enter when price breaks yesterday’s high, during the London session only.')],
  [T('L’Owl, en mieux','The Owl, better'),T('Pars de l’Owl, mais je veux moins de trades et une sortie qui laisse courir les gains.','Start from the Owl, but I want fewer trades and an exit that lets winners run.')]].map(x=>'<button class="idea" onclick="useIdea(this)"><small>'+esc(x[0])+'</small><span>'+esc(x[1])+'</span></button>').join('')+'</div></div>';}
function paintChat(force){const el=$('chat'),M=(C&&C.msgs)||[];const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<120;
 let h='';const fresh=M.filter(m=>m.role==='user').length===0&&!C.robot_id;
 if(fresh)h+=welcome();
 M.forEach((m,i)=>{if(fresh&&i===0)return;h+=msgHTML(m,i,i===M.length-1);});
 if(C&&C.status==='thinking')h+='<div class="m ai typing"><div class="av"><svg><use href="#owl"/></svg></div><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span id="thk">'+THINK[THINK_T%THINK.length]+'</span></div></div>';
 el.innerHTML=h;if(force||atBottom||M.length!==LASTN)el.scrollTop=el.scrollHeight;LASTN=M.length;
 $('sd').disabled=!($('tx').value.trim())||(C&&C.status==='thinking');}
function chip(b){$('tx').value=b.textContent;send();}
function useIdea(b){$('tx').value=b.querySelector('span').textContent;autosize();$('tx').focus();$('sd').disabled=false;}

/* ---------- load / poll */
async function load(id,force){try{const j=await getJ('chat_get?id='+encodeURIComponent(id));if(j.err){toast(ERR[j.err]||j.err);return;}
 const flash=[];if(C&&C.view&&j.view){SL.forEach(([k])=>{if(JSON.stringify(C.view[k])!==JSON.stringify(j.view[k]))flash.push(k);});}
 C=j;CID=j.id;paintChat(force);if(force||(j.rev||0)!==LASTREV||!$('bp').innerHTML)paintBP(flash);LASTREV=j.rev||0;
 const t=j.test||{};const wait=j.status==='thinking'?2200:(t.state==='queued'?8000:0);clearTimeout(POLL);if(wait)POLL=setTimeout(()=>load(CID),wait);}catch(e){clearTimeout(POLL);POLL=setTimeout(()=>load(CID),6000);}}
async function start(robot){const j=await post('chat_start',{lang:EN?'en':'fr',robot:robot||undefined});if(!j.ok){toast(ERR[j.err]||j.err||T('Impossible pour le moment.','Not possible right now.'));return;}
 history.replaceState(null,'','?c='+j.id);LASTN=0;LASTREV=-1;await load(j.id,true);}
async function send(){const t=$('tx').value.trim();if(!t||SENDING||!CID)return;if(C&&C.status==='thinking'){toast(ERR.busy);return;}SENDING=true;
 C.msgs.push({role:'user',text:t});C.status='thinking';$('tx').value='';autosize();paintChat(true);
 try{const j=await post('chat_send',{id:CID,text:t});if(!j.ok){C.msgs.pop();C.status='ready';paintChat(true);$('tx').value=t;toast(ERR[j.err]||j.err);}else{clearTimeout(POLL);POLL=setTimeout(()=>load(CID),1800);}}
 catch(e){C.status='ready';paintChat();toast(T('Hors ligne.','Offline.'));}SENDING=false;}
async function runTest(){if(!CID)return;shClose();const j=await post('chat_test',{id:CID});if(!j.ok){toast(ERR[j.err]||(String(j.err||'').startsWith('piece:')?T('Une pièce n’a pas pu être enregistrée.','A piece could not be saved.'):j.err));return;}load(CID,true);}
setInterval(()=>{THINK_T++;const e=$('thk');if(e)e.textContent=THINK[THINK_T%THINK.length];},2600);

/* ---------- sheets */
function shOpen(h){$('pn').innerHTML='<div class="gr"></div>'+h;$('sh').classList.add('on');if(!history.state||!history.state.sh)history.pushState({sh:1},'');}
function shClose(){if($('sh').classList.contains('on')){$('sh').classList.remove('on');if(history.state&&history.state.sh)history.back();}}
window.addEventListener('popstate',()=>{$('sh').classList.remove('on');});
function bpSh(k){if(window.matchMedia('(min-width:960px)').matches){const e=k&&document.querySelector('#bp [data-k="'+k+'"]');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}return;}
 shOpen(bpHTML());if(k)setTimeout(()=>{const e=document.querySelector('#pn [data-k="'+k+'"]');if(e)e.scrollIntoView({block:'center'});},80);}
async function pieces(){if(PIECES)return PIECES;try{const j=await getJ('robots_data');PIECES=((j.builder||{}).pieces)||[];}catch(e){PIECES=[];}return PIECES;}
function ask(t){shClose();$('tx').value=t;autosize();$('tx').focus();$('sd').disabled=false;}
async function slotSh(k,i){if(!C||!C.view)return;const lab=(SL.find(x=>x[0]===k)||[0,k])[1];
 const s=k==='filters'?((i!=null&&i>=0)?(C.view.filters||[])[i]:null):C.view[k];const typ=TYPE[k];const r=s&&s.rule;
 let h='<h4>'+esc(lab)+(s?' · '+esc(nameOf(s)):'')+'</h4><p class="sub">'+esc(plainOf(s)||T('Choisis une pièce, écris une formule, ou demande à l’IA.','Pick a piece, write a formula, or ask the AI.'))+'</p>';
 h+='<button class="btn pri" onclick="ask(\''+(k==='filters'&&!s?T('Ajoute un filtre : ','Add a filter: '):T('Change '+({entry:'l’entrée',filters:'ce filtre',stop:'le stop',exit:'la sortie',recovery:'le rattrapage',money:'l’argent'}[k])+' : ','Change the '+({entry:'entry',filters:'filter',stop:'stop',exit:'exit',recovery:'recovery',money:'money'}[k])+': '))+'\')">'+T('Demander à l’IA','Ask the AI')+'</button>';
 const formulaKind=typ==='entry'||typ==='filter'||typ==='stop';
 if(formulaKind){const fb=r&&(r.event==='formula'||r.kind==='formula')?(r.buy||''):'',fs=r&&(r.event==='formula'||r.kind==='formula')?(r.sell||''):'';
  h+='<div class="bpsec">'+T('Écrire la formule moi-même','Write the formula myself')+'</div><div class="fld"><label>'+(typ==='stop'?T('Prix du stop à l’achat','Stop price for a buy'):T('À l’achat, quand…','To buy, when…'))+'</label><textarea id="fb" oninput="chk(\''+typ+'\')" placeholder="'+(typ==='stop'?'close - 2 * atr(14)':'cross_up(ema(close, 9), ema(close, 21))')+'">'+esc(fb)+'</textarea></div>'+
   '<div class="fld"><label>'+(typ==='stop'?T('Prix du stop à la vente','Stop price for a sell'):T('À la vente, quand…','To sell, when…'))+'</label><textarea id="fs" oninput="chk(\''+typ+'\')" placeholder="'+(typ==='stop'?'close + 2 * atr(14)':'cross_down(ema(close, 9), ema(close, 21))')+'">'+esc(fs)+'</textarea></div><div class="ok" id="fok"></div>'+
   '<button class="btn" id="fsv" onclick="saveFx(\''+k+'\','+(i==null?'null':i)+')" disabled>'+T('Utiliser cette formule','Use this formula')+'</button>';}
 if(typ==='exit'&&r){h+='<div class="bpsec">'+T('Régler la sortie','Tune the exit')+'</div><div class="row2"><div class="fld"><label>'+T('Objectif (× le risque)','Target (× risk)')+'</label><input id="xt" inputmode="decimal" value="'+(r.target==null?'':r.target)+'"></div><div class="fld"><label>'+T('Durée max (min)','Max time (min)')+'</label><input id="xm" inputmode="numeric" value="'+(r.time_min==null?'':r.time_min)+'"></div></div>'+
  '<div class="fld"><label>'+T('Sortie achat quand… (formule, optionnel)','Close a buy when… (formula, optional)')+'</label><textarea id="xb" oninput="chkX()">'+esc(r.close_buy||'')+'</textarea></div><div class="fld"><label>'+T('Sortie vente quand…','Close a sell when…')+'</label><textarea id="xs" oninput="chkX()">'+esc(r.close_sell||'')+'</textarea></div><div class="ok" id="xok"></div>'+
  '<button class="btn" onclick="saveX()">'+T('Enregistrer la sortie','Save the exit')+'</button>';}
 const P=(await pieces()).filter(p=>p.type===typ&&p.status!=='pending'&&p.status!=='to_build');
 if(P.length){h+='<div class="bpsec">'+T('Ou prendre une pièce qui existe','Or take an existing piece')+'</div>'+P.slice(0,24).map(p=>'<button class="pk'+(s&&s.use===p.id?' on':'')+'" onclick="usePiece(\''+k+'\','+(i==null?'null':i)+',\''+esc(p.id)+'\')"><b>'+esc(EN?(p.name_en||p.name_fr):(p.name_fr||p.id))+'</b><small>'+esc(EN?(p.plain_en||p.plain_fr||''):(p.plain_fr||''))+'</small></button>').join('');}
 if(k==='filters'&&i!=null&&i>=0)h+='<button class="btn dan" onclick="rmFilter('+i+')">'+T('Enlever ce filtre','Remove this filter')+'</button>';
 shOpen(h);if(formulaKind)chk(typ);}
let CHKT=null;
function chk(typ){clearTimeout(CHKT);CHKT=setTimeout(async()=>{const b=$('fb').value.trim(),s=$('fs').value.trim(),o=$('fok'),sv=$('fsv');if(!b&&!s){o.textContent='';o.className='ok';sv.disabled=true;return;}
 const rule=typ==='entry'?{event:'formula',buy:b||null,sell:s||null}:{kind:'formula',buy:b||null,sell:s||null};
 try{const j=await post('chat_check',{type:typ,rule});if(j.ok){o.className='ok g';o.textContent='✓ '+T('La formule est valide.','The formula is valid.');sv.disabled=false;sv._rule=j.rule;}else{o.className='ok r';o.textContent=String(j.err||'').replace(/^formula: /,'');sv.disabled=true;}}catch(e){}},350);}
async function saveFx(k,i){const sv=$('fsv');if(!sv._rule)return;const nm=k==='entry'?T('Mon entrée','My entry'):(k==='stop'?T('Mon stop','My stop'):T('Mon filtre','My filter'));
 edit({slot:k,index:i==null?undefined:(i<0?undefined:i),piece:{rule:sv._rule,name:nm,plain:''}});}
function chkX(){}
async function saveX(){const r=JSON.parse(JSON.stringify(C.view.exit.rule||{}));const t=$('xt').value.trim().replace(',','.'),m=$('xm').value.trim();
 r.target=t===''?null:+t;r.time_min=m===''?null:+m;r.close_buy=$('xb').value.trim()||null;r.close_sell=$('xs').value.trim()||null;
 edit({slot:'exit',piece:{rule:r,name:(C.view.exit.name||T('Ma sortie','My exit')),plain:''}},'xok');}
async function usePiece(k,i,id){edit({slot:k,index:i==null?undefined:(i<0?undefined:i),piece:{use:id}});}
async function rmFilter(i){edit({slot:'filters',index:i,remove:true});}
async function edit(b,okid){b.id=CID;const j=await post('chat_edit',b);if(!j.ok){const msg=(ERR[j.err]||j.err)+(j.why?' '+j.why.join(' · '):'');const o=okid&&$(okid);if(o){o.className='ok r';o.textContent=msg;}else toast(msg);return;}shClose();load(CID,true);}
function renameSh(){if(!C||!C.view)return;shOpen('<h4>'+T('Le nom du robot','The robot’s name')+'</h4><div class="fld"><input id="nm" maxlength="30" value="'+esc(C.view.name||'')+'"></div><button class="btn pri" onclick="edit({slot:\'name\',name:$(\'nm\').value})">'+T('Renommer','Rename')+'</button>');setTimeout(()=>$('nm')&&$('nm').focus(),100);}
async function histSh(){let L=[];try{L=(await getJ('chat_list')).chats||[];}catch(e){}
 shOpen('<h4>'+T('Mes conversations','My conversations')+'</h4><p class="sub">'+T('Chaque conversation construit un robot. Reprends-en une quand tu veux.','Each conversation builds a robot. Pick one back up whenever you like.')+'</p><button class="btn pri" style="margin:0 0 12px" onclick="shClose();start()">+ '+T('Nouveau robot','New robot')+'</button>'+
  (L.length?L.map(c=>'<button class="hl" onclick="openChat(\''+esc(c.id)+'\')"><b>'+esc(c.name||T('Idée en cours','Idea in progress'))+'</b><small>'+esc(c.understood||c.last||'')+'</small></button>').join(''):'<div class="emptybp">'+T('Rien encore.','Nothing yet.')+'</div>'));}
function openChat(id){shClose();history.replaceState(null,'','?c='+id);LASTN=0;LASTREV=-1;C=null;load(id,true);}

/* ---------- composer */
const tx=$('tx');function autosize(){tx.style.height='auto';tx.style.height=Math.min(140,tx.scrollHeight)+'px';}
tx.addEventListener('input',()=>{autosize();$('sd').disabled=!tx.value.trim()||(C&&C.status==='thinking');});
tx.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.matchMedia('(min-width:700px)').matches){e.preventDefault();send();}});
document.documentElement.lang=EN?'en':'fr';tx.placeholder=T('Écris ton idée…','Write your idea…');$('hint').textContent=T('Un test sur le passé ne promet rien pour la suite. Aucun argent n’est engagé.','A past test promises nothing for the future. No money is involved.');
$('tn').textContent=T('L’atelier','The workshop');$('ts').textContent=T('Construis ton robot en parlant','Build your robot by talking');

/* ---------- boot */
(()=>{const q=new URLSearchParams(location.search);if(q.get('c'))load(q.get('c'),true);else start(q.get('robot'));
 getJ('robots_data').then(j=>{PIECES=((j.builder||{}).pieces)||[];const owl=((j.builder||{}).robots||[]).find(r=>r.id==='owl');OWL=(owl&&(owl.resolved||owl.parts))||{};if(C)paintBP();}).catch(()=>{});})();
</script></body></html>
