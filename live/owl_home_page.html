<!doctype html>
<html lang="fr" translate="no" class="notranslate"><head>
<meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Kino</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="/icon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('owlTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* 2026-11-01 (owner: "the focus is not the Owl anymore, it's Kino"): the member's home.
   2026-11-02 (owner: "is that the best home screen ever? redesign it to look its best"): one glance answers the three
   questions a member opens the app with - how is my money, is my robot working, what does Kino have for me - then
   everything else is one tap away. Money card first (balance, period switch, the real curve, the robot's true state),
   Kino second (his latest words, unread dot, quick asks), icon shortcuts, robots as swipeable cards. Data: home_data. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;--border:#1f2a38;--border2:#2b3a4d;
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--accent:#7c6cff;--accent2:#22d3ee;--up:#2ecc71;--down:#ff6b6b;--warn:#e8c55a;
 --grad:linear-gradient(135deg,#7c6cff,#22d3ee);--sh:0 18px 50px rgba(0,0,0,.45)}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#fff;--surface2:#f6f8fc;--surface3:#eef2f8;--border:#e3e8f0;--border2:#d5dce7;
 --text:#121722;--text2:#3b4658;--muted:#6a7588;--sh:0 12px 34px rgba(20,30,50,.10)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.hello{font-size:13px;color:var(--muted)}.hello b{display:block;font-size:20px;color:var(--text);letter-spacing:-.02em}
.plan{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--border2);color:var(--text2);background:var(--surface)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--up)}.neg{color:var(--down)}
/* the money card */
.money{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 14px;background:
 radial-gradient(120% 90% at 100% 0%,#7c6cff26,transparent 60%),radial-gradient(90% 70% at 0% 100%,#22d3ee14,transparent 60%),var(--surface);
 border:1px solid var(--border);box-shadow:var(--sh)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.state{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 10px 5px 9px;border-radius:99px;
 border:1px solid var(--border2);background:var(--surface2);white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.state.on{color:var(--up);border-color:#2ecc7155}.state.on i{background:var(--up);animation:pl 1.8s infinite}
.state.off{color:var(--text2)}.state.end{color:var(--warn);border-color:#e8c55a55}.state.end i{background:var(--warn)}
@keyframes pl{0%{box-shadow:0 0 0 0 #2ecc7188}70%{box-shadow:0 0 0 7px #2ecc7100}100%{box-shadow:0 0 0 0 #2ecc7100}}
.bal{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:10px 0 4px}
.bal small{font-size:22px;color:var(--muted);font-weight:700;margin-left:3px}
.chg{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.chg span.p{font-size:12.5px;color:var(--muted);font-weight:500}
.spark{display:block;width:100%;height:78px;margin:12px 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:13px;background:var(--surface2);border:1px solid var(--border)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{padding:10px 11px;border-radius:13px;background:var(--surface2);border:1px solid var(--border)}
.stat b{display:block;font-size:15px;font-weight:700}.stat span{font-size:11.5px;color:var(--muted)}
.renew{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:11px 12px;border-radius:14px;
 background:#e8c55a12;border:1px solid #e8c55a44;font-size:13px;color:var(--text2)}
.renew a{flex:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--grad);color:#fff}
/* Kino */
.kino{position:relative;margin-top:14px;border-radius:22px;padding:16px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.kino:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.who{display:flex;align-items:center;gap:12px}
.av{position:relative;width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:22px;flex:0 0 44px}
.av em{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:#ff5c7a;border:2px solid var(--surface);display:none}
.av.new em{display:block}
.who b{font-size:16px}.st{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
.when{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;align-self:flex-start}
.msg{margin:12px 0 12px;color:var(--text);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;
 background:var(--grad);color:#fff;font-weight:700;font-size:15px;border:0;box-shadow:0 10px 28px #7c6cff40;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:8px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;white-space:nowrap}
/* shortcuts */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border-radius:16px;background:var(--surface);border:1px solid var(--border);
 font-size:12px;font-weight:600;color:var(--text2);text-align:center}
.tile svg{width:22px;height:22px;stroke:var(--accent2)}
.tile:active,.card:active,.rc:active{transform:scale(.98)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 2px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2 a{text-transform:none;letter-spacing:0;color:var(--accent2);font-weight:600;font-size:13px}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.goal{font-size:14.5px;color:var(--text)}
.empty{color:var(--muted);font-size:14px}.empty b{color:var(--text)}
/* robots, swipeable */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rc{flex:0 0 78%;max-width:300px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:15px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.rc.solo{flex-basis:100%;max-width:none}
.rh{display:flex;align-items:center;gap:10px}.ri{width:34px;height:34px;border-radius:11px;background:var(--surface3);display:grid;place-items:center;flex:0 0 34px}
.ri svg{width:18px;height:18px;stroke:var(--text2)}
.rn{font-weight:700;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rs{font-size:12.5px;color:var(--muted)}
.rv{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tag{align-self:flex-start;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border2);color:var(--muted);white-space:nowrap}
.tag.k{border-color:#7c6cff66;color:#b4a9ff}.tag.on{border-color:#2ecc7166;color:var(--up)}
/* the robot built with Kino: where it stands and the one thing to do next */
.myr{display:block;position:relative;overflow:hidden;border-radius:20px;padding:16px;background:radial-gradient(100% 80% at 100% 0%,#22d3ee18,transparent 60%),var(--surface);border:1px solid var(--border)}
.myr .rh{margin-bottom:12px}.myr .rn{font-size:16px}
.mst{display:flex;gap:4px;margin:4px 0 6px}.mst i{flex:1;height:5px;border-radius:99px;background:var(--surface3)}.mst i.d{background:var(--grad)}.mst i.c{background:#22d3ee55}
.msl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.mnx{margin-top:12px;padding:11px 12px;border-radius:13px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;color:var(--text2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.mnx b{flex:none;color:var(--accent2);font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #22d3ee44;border-top-color:var(--accent2);animation:spn 1s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spn{to{transform:rotate(360deg)}}
/* 2026-11-02 (owner: "what if the user has many robots? what is he in the app for?"): every robot on one board */
.board{border-radius:20px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.bsum{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 4px}
.bsum span{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
.bsum span.me{color:#ffb4c2;border-color:#ff5c7a66;background:#ff5c7a14}
.brow{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--border)}
.brow:first-of-type{border-top:0}
.brow .ri{width:36px;height:36px}
.bmain{flex:1;min-width:0}
.bn{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdots{display:flex;gap:3px;margin:5px 0 4px}.bdots i{width:14px;height:4px;border-radius:9px;background:var(--surface3)}.bdots i.d{background:var(--grad)}.bdots i.c{background:#22d3ee66}
.bnx{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnx.me{color:#ffb4c2;font-weight:600}
.bres{text-align:right;flex:none}.bres b{display:block;font-size:15px}.bres small{font-size:11px;color:var(--muted)}
.badd{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-top:1px solid var(--border);font-weight:700;font-size:14px;color:var(--accent2)}
.alinks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.alinks a{text-align:center;padding:9px 4px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text2)}
.cap{font-size:11.5px;color:var(--muted);margin-top:2px}
.planrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--grad)}
.skel{color:transparent!important;background:var(--surface3);border-radius:8px;animation:sk 1.2s infinite}
@keyframes sk{50%{opacity:.5}}
.foot{margin:26px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.6}.foot a{text-decoration:underline}
</style></head><body>
<div class="wrap">
 <div class="top"><div class="hello"><span id="hi">Bonjour</span><b id="nm">&nbsp;</b></div><a class="plan" id="plan" href="?classic=1#offres">&nbsp;</a></div>

 <div id="acct"><div class="money"><div class="lbl skel" style="width:40%">…</div><div class="bal skel" style="width:60%">…</div><div class="spark skel"></div></div></div>

 <section class="kino" id="kino">
  <div class="who"><div class="av" id="kav">🦉<em></em></div><div><b>Kino</b><div class="st"><span class="dot"></span><span id="status">…</span></div></div><span class="when" id="when"></span></div>
  <div class="msg" id="msg"><span class="skel">Kino réfléchit à ce qu’il va te dire…</span></div>
  <a class="cta" id="talk" href="atelier"><span id="talk-t">Parler à Kino</span> <span aria-hidden="true">→</span></a>
  <div class="chips" id="chips"></div>
 </section>


 <h2><span id="h-board">Tes robots</span><a href="mesrobots" id="h-board-all">Tout voir</a></h2>
 <div class="board" id="board"><div class="brow"><div class="bmain"><div class="bn skel">…</div></div></div></div>

 <div class="tiles" id="tiles"></div>

 <h2><span id="h-rob">Tes robots</span><a href="mesrobots" id="h-rob-all">Tout voir</a></h2>
 <div class="rail" id="robots"><div class="rc solo skel" style="height:110px"></div></div>

 <h2><span id="h-goal">Ce qu’il poursuit avec toi</span></h2>
 <div class="card" id="goal"><div class="goal skel">…</div></div>

 <h2><span id="h-pick">Créés par Kino</span><a href="place" id="h-pick-all">La place</a></h2>
 <div class="rail" id="picks"><div class="rc solo skel" style="height:110px"></div></div>

 <h2><span id="h-plan">Ta formule</span></h2>
 <div class="card" id="plancard"><div class="skel">…</div></div>

 <div class="foot" id="foot"></div>
</div>

<script>
const B=location.pathname.replace(/home\/?$/,'');
let EN=false;const T=(f,e)=>EN?e:f;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(t){if(!t)return'';const m=Math.round((Date.now()/1000-t)/60);
 if(m<1)return T('à l’instant','just now');if(m<60)return T('il y a '+m+' min',m+' min ago');const h=Math.round(m/60);
 if(h<24)return T('il y a '+h+' h',h+' h ago');const d=Math.round(h/24);return T('il y a '+d+' j',d+' d ago');}
function money(v){if(v==null)return'—';const n=Number(v);return(n>=0?'+':'−')+'$'+Math.abs(n).toFixed(2);}
const cls=v=>Number(v||0)>=0?'pos':'neg';
const ICO={today:'<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
 live:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',perf:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>',
 wealth:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/>',
 robot:'<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg>';
let D=null,PER='month';
function spark(cv){if(!cv||cv.length<2)return '';const W=320,H=78,p=4,mn=Math.min(...cv),mx=Math.max(...cv),r=(mx-mn)||1;
 const pts=cv.map((v,i)=>[p+i*(W-2*p)/(cv.length-1),p+(H-2*p)*(1-(v-mn)/r)]);const up=cv[cv.length-1]>=cv[0];
 const c=up?'#2ecc71':'#ff6b6b',l=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const last=pts[pts.length-1];
 return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0" stop-color="'+c+'" stop-opacity=".28"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+l+' L'+last[0].toFixed(1)+' '+H+' L'+p+' '+H+' Z" fill="url(#sg)"/><path d="'+l+'" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
  '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="'+c+'"/></svg>';}
function moneyCard(){const A=D.account;const el=document.getElementById('acct');
 if(!A){el.innerHTML='';return;}
 const S=A.since||{},start=Number(A.balance||0)-Number(S.net||0);
 const P={day:[A.today,T('aujourd’hui','today')],week:[A.week,T('cette semaine','this week')],month:[A.month,T('ce mois-ci','this month')],
  all:[S.net,S.days?T('en '+S.days+' jours','in '+S.days+' days'):T('depuis le début','since the start')]}[PER];
 const pct=PER==='all'&&start>0?' ('+(S.net>=0?'+':'−')+Math.abs(100*S.net/start).toFixed(1)+' %)':'';
 const st=A.ended?['end',T('Période terminée','Period ended')]:A.auto?['on',(A.robot||'Robot')+T(' · actif',' · running')]:['off',(A.robot||'Robot')+T(' · en pause',' · paused')];
 const b=Number(A.balance||0).toFixed(2).split('.');
 const wr=S.n?Math.round(100*(S.won||0)/S.n):null;
 const LM=A.last_month;const mN=LM?new Date(LM.ym+'-15').toLocaleDateString(EN?'en':'fr',{month:'long'}):'';
 el.innerHTML='<div class="money"><div class="mtop"><span class="lbl">'+(A.real?T('Ton compte réel','Your live account'):T('Ton compte démo','Your demo account'))+(A.broker?' · '+esc(A.broker):'')+'</span>'+
  '<a class="state '+st[0]+'" href="'+B+'robot?id=owl&tab=live"><i></i>'+esc(st[1])+'</a></div>'+
  '<div class="bal num">$'+b[0]+'<small>.'+b[1]+'</small></div>'+
  '<div class="chg num"><span class="'+cls(P[0])+'">'+money(P[0])+pct+'</span><span class="p">'+esc(P[1])+'</span></div>'+
  '<div class="cap">'+T('Tout l’argent du compte, quel que soit le robot qui trade dessus.','All the money in the account, whichever robot trades on it.')+'</div>'+
  spark(A.curve)+
  '<div class="seg" role="tablist">'+[['day',T('Jour','Day')],['week',T('Semaine','Week')],['month',T('Mois','Month')],['all',T('Début','Start')]]
   .map(x=>'<button role="tab" data-p="'+x[0]+'" class="'+(x[0]===PER?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'+
  '<div class="stats">'+
   '<div class="stat"><b class="num '+cls(A.month)+'">'+money(A.month)+'</b><span>'+T('Ce mois','This month')+'</span></div>'+
   '<div class="stat"><b class="num '+(LM?cls(LM.net):'')+'">'+(LM?money(LM.net):'—')+'</b><span>'+(LM?esc(mN.charAt(0).toUpperCase()+mN.slice(1)):T('Mois dernier','Last month'))+'</span></div>'+
   '<div class="stat"><b class="num">'+(wr==null?'—':wr+' %')+'</b><span>'+T('Trades gagnants','Winning trades')+'</span></div></div>'+
  (A.ended?'<div class="renew"><span>'+T('Ta période Automatique est terminée : le robot ne trade plus pour toi.','Your Automatic period has ended: the robot no longer trades for you.')+'</span><a href="'+B+'?classic=1#home">'+T('Renouveler','Renew')+'</a></div>':'')+
  (A.open?'<div class="renew" style="background:#2ecc710f;border-color:#2ecc7144"><span>'+A.open+' '+T('trade(s) en cours','open trade(s)')+'</span><a href="'+B+'?classic=1#marche">'+T('Voir','See')+'</a></div>':'')+
  '<div class="alinks"><a href="'+B+'robot?id=owl&tab=perf">'+T('Performance','Performance')+'</a><a href="'+B+'robot?id=owl&tab=live">'+T('En direct','Live')+'</a><a href="'+B+'wealth">'+T('Patrimoine','Wealth')+'</a></div>'+
  '</div>';
 el.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>{PER=x.dataset.p;try{localStorage.setItem('homePer',PER);}catch(e){}moneyCard();});}
async function load(){
 let d;try{d=await (await fetch(B+'home_data',{cache:'no-store'})).json();}catch(e){setTimeout(load,4000);return;}

 {const A0=d.account||{};let sv=null;try{sv=localStorage.getItem('homePer');}catch(e){}
