  +(Q?'<div class="leg"><span><i style="background:'+c+'"></i>'+esc(n1)+'</span><span><i style="background:var(--muted)"></i>'+esc(n2)+'</span></div>':'');}

// the robot's Bitcoin test; the Owl's own result is any child's parent result
function testOf(r){if(r.test&&r.test.robot)return {a:r.test.robot,p:r.test.parent_result||null,ctl:r.test.ctl||null,days:r.test.days,win:r.test.window_utc};
 if(r.id==='owl'){const c=(BL().robots||[]).find(x=>x.parent==='owl'&&x.test&&x.test.parent_result);if(c)return {a:c.test.parent_result,p:null,ctl:c.test.parent_ctl||null,days:c.test.days,win:c.test.window_utc};}

function verdict(a,c){if(!a||a.trades==null)return {k:'gy',i:'?',c:'var(--border2)',sh:T('Pas de résultat','No result'),t:T('Pas de résultat','No result'),s:''};
 if(a.trades<20)return {k:'gy',i:'?',c:'var(--muted)',sh:T('Trop peu','Too few'),t:T('Trop peu de trades pour conclure','Too few trades to conclude'),s:T('Moins de 20 trades : le résultat peut encore être de la chance.','Under 20 trades: the result can still be luck.')};
 const hv=(a.first_half||0)>0&&(a.later_half||0)>0,pc=c&&c.pct!=null?Math.round(c.pct):null,ns=c&&c.seeds?c.seeds:100,nb=pc!=null?Math.round(pc/100*ns):0;
 if(a.net<=0)return {k:'rd',i:'✕',c:'var(--down)',sh:T('Perd','Loses'),t:T('Perd sur ce marché','Loses on this market'),s:T('Sur la période testée, le robot a perdu de l’argent ici.','Over the tested period, the robot lost money here.')};
 if(pc!=null&&pc<95)return {k:'or',i:'!',c:'var(--warn)',sh:T('Pas prouvé','Not proven'),t:T('Gagne, mais pas mieux que le hasard','Wins, but no better than chance'),s:T('Des entrées au hasard font aussi bien ou mieux '+(ns-nb)+' fois sur '+ns+'. Il en faut moins de 5 sur 100 pour y croire.','Random entries do as well or better '+(ns-nb)+' times out of '+ns+'. It takes fewer than 5 in 100 to trust it.')};
 // a pass on fewer than 40 draws is checked again on 40 before it is called solid (gold 10-17: 19/20, then 36/40)
 if(pc!=null&&ns<40)return {k:'or',i:'!',c:'var(--warn)',sh:T('À confirmer','To confirm'),t:T('Passe de justesse : à confirmer','Passes narrowly: to confirm'),s:T('Mieux que '+nb+' tirages au hasard sur '+ns+'. Avec si peu de tirages, un seul de plus peut tout changer : on confirme sur 40 avant de dire « solide ».','Better than '+nb+' random draws out of '+ns+'. With so few draws one more can change everything: we confirm on 40 before saying "solid".')};
 if(pc!=null)return {k:'gr',i:'✓',c:'var(--up)',sh:T('Solide','Solid'),t:hv?T('Bat le hasard et gagne sur les deux moitiés','Beats chance and wins in both halves'):T('Bat le hasard','Beats chance'),s:(pc>=100?T('Mieux que les '+ns+' tirages au hasard','Better than all '+ns+' random draws'):T('Mieux que '+nb+' tirages au hasard sur '+ns,'Better than '+nb+' random draws out of '+ns))+(hv?'':T(', mais une des deux moitiés perd.',', but one of the two halves loses.'))};
 return {k:'or',i:'!',c:'var(--warn)',sh:T('À contrôler','To check'),t:T('Gagne, hasard pas encore contrôlé','Wins, chance not checked yet'),s:T('Le contrôle contre des entrées au hasard n’est pas encore fait : on ne dit pas « solide » avant.','The check against random entries is not done yet: we do not say "solid" before that.')};}
function markets(r){const t=testOf(r),R=[];if(t)R.push({sym:'BTCUSD',a:t.a,ctl:t.ctl,days:t.days||42,fills:'ticks',win:t.win});

 const fh=+a.first_half||0,lh=+a.later_half||0;

 const v=verdict(a,t.ctl);if(false&&t.ctl)O.push([v.k==='gr'?'i-ok':'i-w',v.k==='gr'?'✓':'!',v.k==='gr'?T('Bat le hasard sur Bitcoin','Beats chance on Bitcoin'):T('Pas prouvé contre le hasard','Not proven against chance'),v.s]);
 else if(false)O.push(['i-i','?',T('Hasard pas encore contrôlé','Chance not checked yet'),T('Le test contre des entrées au hasard dira si ce gain est plus que de la chance.','The test against random entries will tell if this gain is more than luck.')]);

const stOf=r=>(['real','demo'].includes(r.stage)&&(r.running===false||r.running===0))?[T('Au repos','Resting'),'off']:(ST[r.stage]||ST.tested);

// the luck-check block of one market: done / running / a button (only where the robot wins and has 20+ trades)
function ctlBlock(r,sym,a,ctl){const conf=!!(ctl&&ctl.pct!=null&&ctl.pct>=95&&(ctl.seeds||0)<40);if(ctl&&ctl.pct!=null&&!conf)return '';if(!a||(a.net||0)<=0||(a.trades||0)<20)return '';const j=ctlJob(r.id,sym);

  +'<div style="margin-top:14px">'+chart2(a.curve,m.b&&m.b.curve,rName(r),r.parent?rName(byId(r.parent)):'')+'</div>'
  +'<div class="vb '+v.k+'"><i>'+v.i+'</i><div><b>'+v.t+'</b>'+(v.s?'<p>'+v.s+'</p>':'')+'</div></div>'
  +'<div class="g2"><div><b class="'+cl(a.net)+'">'+money(a.net,0)+'</b><span>'+T('sur le test','over the test')+'</span></div><div><b class="'+cl(p30(m))+'">'+money(p30(m),0)+'</b><span>'+T('par 30 j','per 30 d')+'</span></div><div><b>'+num(a.trades||0)+'</b><span>trades</span></div>'
  +'<div><b>'+(a.profit_factor!=null?num(a.profit_factor,2):'—')+'</b><span>'+T('gain / perte','profit factor')+'</span></div><div><b class="neg">'+(a.cc_dd!=null?'−$'+num(a.cc_dd,0):'—')+'</b><span>'+T('plus forte baisse','worst dip')+'</span></div><div><b>'+(m.ctl&&m.ctl.pct!=null?Math.round(m.ctl.pct)+' / 100':'—')+'</b><span>'+T('contre le hasard','vs chance')+'</span></div></div>'
  +'<div class="grp">'+T('Les deux moitiés','The two halves')+'</div>'+hb(T('1re moitié','1st half'),fh)+hb(T('2e moitié','2nd half'),lh)
  +ctlBlock(r,m.sym,a,m.ctl)
  +(staleMk(m)&&canAct(r)?'<button class="btn sec full" data-act="remk" data-id="'+esc(id)+'" data-s="'+esc(m.sym)+'">'+T('Re-tester ce marché','Re-test this market')+'</button>':'')
  +'<p class="note">'+(m.win?fdl(m.win[0])+' → '+fdl(m.win[1])+' · ':'')+T('compte de $200, lot qui suit le solde.','$200 account, lot follows the balance.')+'</p>'
  +'<button class="btn sec full" data-act="tab" data-id="'+esc(id)+'" data-tab="mk">‹ '+T('Tous les marchés','All markets')+'</button>','m:'+id);}
async function post(path,body){const r=await fetch(B+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}
const ERR={strategy:T('Avec la formule Stratégie.','With the Strategy plan.'),busy:T('Un contrôle tourne déjà. Réessayez plus tard.','A check is already running. Try later.'),done:T('Déjà contrôlé.','Already checked.'),not_winning:T('Il faut un gain et au moins 20 trades.','It needs a gain and at least 20 trades.'),not_yours:T('Ce robot n’est pas à vous.','This robot is not yours.'),market:T('Données du marché pas prêtes.','Market data not ready.')};
async function act(path,body,ok,el){if(el)el.disabled=true;try{const j=await post(path,body);if(j.ok){toast(ok);await load();if(SHEET&&SHEET.startsWith('r:'))detail(SHEET.slice(2));}else{toast(ERR[j.err]||T('Pas possible pour l’instant.','Not possible right now.'));if(el)el.disabled=false;}}catch(e){toast(T('Pas de connexion.','No connection.'));if(el)el.disabled=false;}}
// live against the test: the Owl's real trades on a real-money account of the nest vs what the test predicted for them
function liveVsTest(){const L=(BL().live_vs_test||[]).filter((z,i,A)=>i===0||z.trades!==A[i-1].trades||z.actual!==A[i-1].actual);if(!L.length)return '';const z=L[L.length-1],g=(z.actual||0)-(z.expected||0),pt=z.trades?g/z.trades:0;
 return '<div class="grp">'+T('En vrai contre le test','Live against the test')+'</div><div class="card" style="padding:14px 16px">'
  +chart2(L.map(q=>[q.d,q.actual]),L.map(q=>[q.d,q.expected]),T('En vrai','Live'),T('Ce que le test prévoyait','What the test predicted'))
  +'<div class="g2"><div><b>'+num(z.trades)+'</b><span>'+T('vrais trades','real trades')+'</span></div><div><b class="'+cl(z.expected)+'">'+money(z.expected,0)+'</b><span>'+T('prévu','predicted')+'</span></div><div><b class="'+cl(z.actual)+'">'+money(z.actual,0)+'</b><span>'+T('réel','real')+'</span></div></div>'
  +'<p class="note">'+T('Les mêmes trades, rejoués par le test et faits en vrai sur un compte en argent réel du nid. Écart : ','The same trades, replayed by the test and made for real on a real-money account of the nest. Gap: ')+'<b class="'+cl(pt)+'">'+money(pt,2)+T(' par trade',' per trade')+'</b>'+(pt>=0?T(' en faveur du vrai.',' in favour of live.'):T(' : le vrai fait moins bien que le test.',': live does worse than the test.'))+'</p></div>';}
// compare two robots: curves, numbers, markets per 30 days
function cmpPick(id){const L=(BL().robots||[]).filter(x=>x.id!==id&&!x.archived&&testOf(x));
 openSh('<h2>'+T('Comparer avec…','Compare with…')+'</h2><div class="card" style="padding:4px 16px;margin-top:12px">'+(L.length?L.map(x=>'<div class="pk" data-act="cmpgo" data-id="'+esc(id)+'" data-s="'+esc(x.id)+'">'+avatar(x.id)+'<span class="rl"><b>'+esc(rName(x))+'</b><small>'+money(testOf(x).a.net,0)+' · '+num(testOf(x).a.trades||0)+' trades</small></span><span class="btn ghost" style="margin:0">›</span></div>').join(''):'<div class="row"><span class="rl"><small>'+T('Aucun autre robot testé.','No other tested robot.')+'</small></span></div>')+'</div>','cmp');}
function cmpShow(a,b){const A=byId(a),Bb=byId(b),ta=testOf(A),tb=testOf(Bb);if(!ta||!tb)return;const ma=markets(A),mb=markets(Bb),syms=[...new Set(ma.concat(mb).filter(m=>m.a).map(m=>m.sym))];
 const row=(l,x,y,f,hi)=>{const bx=hi==null?'':(hi?(x>y?' class="pos"':''):(x<y?' class="pos"':''));const by=hi==null?'':(hi?(y>x?' class="pos"':''):(y<x?' class="pos"':''));return '<tr><td>'+l+'</td><td'+bx+'>'+f(x)+'</td><td'+by+'>'+f(y)+'</td></tr>';};
 const pa=ta.a,pb=tb.a,g=m=>m?p30(m):null;
 openSh('<h2>'+esc(rName(A))+' · '+esc(rName(Bb))+'</h2><div style="margin-top:12px">'+chart2(pa.curve,pb.curve,rName(A),rName(Bb))+'</div>'
  +'<table class="cmpt"><tr><th></th><th>'+esc(rName(A))+'</th><th>'+esc(rName(Bb))+'</th></tr>'
  +row(T('Bitcoin, test','Bitcoin, test'),pa.net,pb.net,v=>money(v,0),true)+row('Trades',pa.trades,pb.trades,v=>num(v),null)+row(T('Gagnés','Won'),pa.win_rate,pb.win_rate,v=>v==null?'—':Math.round(v*100)+' %',true)
  +row(T('Gain / perte','Profit factor'),pa.profit_factor,pb.profit_factor,v=>v==null?'—':num(v,2),true)+row(T('Plus forte baisse','Worst dip'),pa.cc_dd,pb.cc_dd,v=>v==null?'—':'−$'+num(v,0),false)
  +syms.filter(s=>s!=='BTCUSD').map(s=>row(esc(mkName(s))+T(' / 30 j',' / 30 d'),g(ma.find(m=>m.sym===s&&m.a)),g(mb.find(m=>m.sym===s&&m.a)),v=>v==null?'—':money(v,0),true)).join('')+'</table>'
  +'<p class="note">'+T('En vert, le meilleur des deux sur chaque ligne. Même test, mêmes prix, même compte de départ.','In green, the better of the two on each line. Same test, same prices, same start account.')+'</p>'
  +'<button class="btn sec full" data-act="cmp" data-id="'+esc(a)+'">‹ '+T('Choisir un autre','Pick another')+'</button>','cmp2');}
// combine pockets: proven robot x market pairs, their summed curve, the dip and the shock day
let CB=null,CBALL=false;
function pockets(){const O=[];(BL().robots||[]).filter(r=>!r.archived).forEach(r=>markets(r).filter(m=>m.a&&m.a.curve&&m.a.curve.length>1).forEach(m=>{const v=verdict(m.a,m.ctl);O.push({k:r.id+'@'+m.sym,r,m,v});}));return O;}
function combineSh(){const O=pockets(),show=O.filter(o=>CBALL||o.v.k==='gr');if(!CB)CB=new Set(O.filter(o=>o.v.k==='gr').map(o=>o.k));
 const sel=O.filter(o=>CB.has(o.k));let res='';
 if(sel.length){const ds=[...new Set([].concat(...sel.map(o=>o.m.a.curve.map(q=>q[0]))))].sort();const S=sel.map(o=>align(o.m.a.curve,ds)),tot=ds.map((d,i)=>S.reduce((s,a)=>s+a[i],0));
  const sumDd=S.reduce((s,a)=>s+mdd(a),0),cDd=mdd(tot),shock=sel.reduce((s,o)=>s+Math.abs(Math.min(0,o.m.a.worst||0)),0),p30t=sel.reduce((s,o)=>s+(p30(o.m)||0),0);
  res=chart2(ds.map((d,i)=>[d,tot[i]]),null,'','')
   +'<div class="g2"><div><b class="'+cl(p30t)+'">'+money(p30t,0)+'</b><span>'+T('par 30 j','per 30 d')+'</span></div><div><b class="neg">−$'+num(cDd,0)+'</b><span>'+T('baisse ensemble','dip together')+'</span></div><div><b class="neg">−$'+num(shock,0)+'</b><span>'+T('pire jour possible','worst day possible')+'</span></div></div>'
   +(sel.length>1?'<p class="note">'+T('Séparées, leurs baisses s’additionnent à ','Apart, their dips add up to ')+'<b>−$'+num(sumDd,0)+'</b>'+T(' ; ensemble, la baisse est de ','; together the dip is ')+'<b>−$'+num(cDd,0)+'</b>'+(cDd<sumDd?T(' : les poches se compensent en partie.',': the pockets partly offset each other.'):T(' : elles baissent en même temps.',': they fall at the same time.'))+'</p>':'')
   +'<p class="note">'+T('« Pire jour possible » = chaque poche perd son pire trade le même jour. Chaque poche part de $200 ; les fenêtres de test ne sont pas toutes les mêmes (Bitcoin 42 j, autres marchés 60 j).','"Worst day possible" = each pocket loses its worst trade on the same day. Each pocket starts at $200; the test windows are not all the same (Bitcoin 42 d, other markets 60 d).')+'</p>';}
 else res='<div class="r0" style="margin:0">'+T('Choisissez au moins une poche.','Pick at least one pocket.')+'</div>';
 openSh('<h2>'+T('Combiner des poches','Combine pockets')+'</h2><p class="p">'+T('Une poche = un robot sur un marché, avec son propre argent. Par défaut, seules les poches « solides » (qui battent le hasard) sont proposées.','A pocket = one robot on one market, with its own money. By default only "solid" pockets (that beat chance) are offered.')+'</p>'
  +'<div style="margin-top:14px">'+res+'</div><div class="grp">'+T('Poches','Pockets')+' <em>'+show.length+'</em></div><div class="card" style="padding:4px 16px">'
  +(show.length?show.map(o=>'<div class="pk'+(CB.has(o.k)?' on':'')+'" data-act="cbt" data-id="'+esc(o.k)+'"><span class="bx">'+(CB.has(o.k)?'✓':'')+'</span>'+mkBadge(o.m.sym)+'<span class="rl"><b>'+esc(rName(o.r))+' · '+esc(mkName(o.m.sym,o.m.name))+'</b><small><span style="color:'+o.v.c+'">●</span> '+o.v.sh+' · '+money(p30(o.m),0)+T(' par 30 j',' per 30 d')+'</small></span></div>').join(''):'<div class="row"><span class="rl"><small>'+T('Aucune poche solide pour l’instant.','No solid pocket yet.')+'</small></span></div>')+'</div>'
  +'<div class="tg"><span>'+T('Montrer aussi les poches non prouvées','Also show unproven pockets')+'</span><span class="sw'+(CBALL?' on':'')+'" data-act="cball"></span></div>'
  +(CBALL?'<p class="note" style="color:var(--warn)">'+T('Les poches non prouvées peuvent gagner par chance : elles servent à voir, pas à décider.','Unproven pockets can win by luck: they are for looking, not for deciding.')+'</p>':''),'cb');}
async function runTest(id,el){el.disabled=true;try{const r=await fetch(B+'robot_test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const j=await r.json();
 if(j.ok){toast(T('Test lancé : environ 5 minutes.','Test started: about 5 minutes.'));closeSh();load();}else{toast(j.err==='strategy'?T('Avec la formule Stratégie.','With the Strategy plan.'):T('Pas possible pour l’instant.','Not possible right now.'));el.disabled=false;}}catch(e){toast(T('Pas de connexion.','No connection.'));el.disabled=false;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(a==='combine'){combineSh();return;}if(a==='cbt'){CB.has(id)?CB.delete(id):CB.add(id);const y=$('sh').querySelector('.pn').scrollTop;combineSh();$('sh').querySelector('.pn').scrollTop=y;return;}
 if(a==='cball'){CBALL=!CBALL;combineSh();return;}
 if(a==='cmp'){cmpPick(id);return;}if(a==='cmpgo'){cmpShow(id,el.dataset.s);return;}
 if(a==='ctl'){act('robot_control',{id:id,sym:el.dataset.s,again:el.dataset.again?1:0},T('Contrôle demandé : il démarre dès que le serveur a de la place.','Check requested: it starts as soon as the server has room.'),el);return;}
 if(a==='retest'){act('robot_test',{id:id,again:1},T('Re-test lancé : environ 5 minutes.','Re-test started: about 5 minutes.'),el);return;}
 if(a==='remk'){act('robot_test_market',{id:id,sym:el.dataset.s},T('Re-test du marché lancé.','Market re-test started.'),el);return;}
 if(a==='arch'){const r=byId(id);act('robot_update',{id:id,archived:!r.archived},r.archived?T('Robot remis dans la liste.','Robot back in the list.'):T('Robot archivé : il garde son historique.','Robot archived: it keeps its history.'),el);return;}
 if(a==='close')closeSh();else if(a==='detail')detail(id,'res');else if(a==='tab')detail(id,el.dataset.tab);else if(a==='mkd')mkDetail(id,el.dataset.s);else if(a==='test')runTest(id,el);});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');F=c.dataset.f;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSh();});
if(EN){$('h1').textContent='My robots';$('h1s').textContent='Their tests, their markets, their progress';const C=document.querySelectorAll('.chip');['All','Tested','To test','Live','Archived'].forEach((t,i)=>{if(C[i])C[i].textContent=t;});document.title='My robots';}
load();
</script></body></html>
