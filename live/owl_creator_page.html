<style>
/* 2026-10-17 (owner): the creators / YouTubers dashboard - its own page, more serious than the simple referral:
   recurring revenue, subscribers, months left, a 6-month chart, the payout, the rules. Same tokens as the nest. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;--border:#1f2a38;--border2:#2b3a4d;--hl:inset 0 1px 0 rgba(255,255,255,.04);
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;--accent:#3b82f6;--accent-soft:#8fc6ff;--accent-bg:rgba(59,130,246,.14);
 --up:#2ecc71;--up-soft:#8df0bb;--down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;--gold:#f5c04a;--r:16px;--r-lg:24px;--ok-bg:rgba(46,204,113,.12);--sh:0 18px 50px rgba(0,0,0,.45)}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;--text:#10161f;--text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--accent-bg:rgba(59,130,246,.1);--ok-bg:rgba(46,204,113,.14);--sh:0 18px 50px rgba(20,40,70,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:56px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;background:radial-gradient(45% 55% at 15% 20%,rgba(245,192,74,.12),transparent 70%),radial-gradient(45% 50% at 85% 10%,rgba(167,139,250,.14),transparent 70%);filter:blur(12px)}
a{color:var(--accent-soft)}button{font-family:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px}.hrow{display:flex;align-items:center;gap:12px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none;text-decoration:none;cursor:pointer}
.ttl{flex:1;min-width:0}h1{font-size:1.35rem;font-weight:800;letter-spacing:-.015em;margin:0}.ttl div{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:5px 10px;white-space:nowrap}
.badge.ok{color:var(--up-soft);background:var(--ok-bg);border:1px solid rgba(46,204,113,.35)}.badge.wait{color:var(--warn);background:rgba(232,197,90,.12);border:1px solid rgba(232,197,90,.35)}.badge.no{color:var(--down-soft);background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.35)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,rgba(245,192,74,.16),var(--surface) 60%);border:1px solid rgba(245,192,74,.35);border-radius:var(--r-lg);padding:20px 18px;box-shadow:var(--hl);animation:rise .45s both}
.hero .eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.hero h2{margin:6px 0 4px;font-size:1.5rem;font-weight:900;letter-spacing:-.02em;line-height:1.15}.hero p{margin:0;color:var(--text2);font-size:.92rem;line-height:1.5}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.kpi div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;box-shadow:var(--hl);animation:rise .45s both}
.kpi b{display:block;font-size:1.45rem;font-weight:900;letter-spacing:-.02em}.kpi span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.kpi small{display:block;font-size:.72rem;color:var(--muted2);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--hl);padding:18px 16px;margin-top:12px;animation:rise .45s both}
.card h3{margin:0;font-size:1rem;font-weight:800}.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9fc2de}
.note{font-size:.8rem;color:var(--muted);line-height:1.5;margin:8px 0 0}.p{font-size:.9rem;color:var(--text2);line-height:1.55;margin:6px 0 0}
.btn{appearance:none;border:0;border-radius:13px;padding:12px 16px;font-size:.88rem;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.gold{background:linear-gradient(135deg,var(--gold),#e08a2e);color:#1a1200;box-shadow:0 8px 24px rgba(245,192,74,.25)}.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}.btn.full{width:100%;margin-top:12px;padding:14px}.btn:active{transform:scale(.98)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:14px}.chart div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.chart i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--gold),rgba(245,192,74,.3));min-height:4px}.chart b{font-size:.68rem;font-weight:800;margin-bottom:4px}.chart small{font-size:.62rem;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.row:first-child{border-top:0}
.av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff}
.row .rl{flex:1;min-width:0}.row .rl b{display:block;font-size:.92rem}.row .rl small{font-size:.74rem;color:var(--muted)}.row .rr{text-align:right;font-weight:800}.row .rr small{display:block;font-size:.66rem;color:var(--muted);font-weight:600}
.bar{height:5px;border-radius:99px;background:var(--border2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--violet))}
.ring{width:72px;height:72px;flex:none;position:relative}.ring svg{width:72px;height:72px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:900}
.steps{display:grid;gap:10px;margin-top:12px}.steps div{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px}.steps i{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:900;background:rgba(245,192,74,.16);color:var(--gold)}.steps b{display:block;font-size:.9rem}.steps small{font-size:.78rem;color:var(--muted2);line-height:1.45}
.empty{text-align:center;padding:22px 12px;color:var(--muted2);font-size:.9rem;line-height:1.55}
label{display:block;font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:13px;color:var(--text);padding:12px 13px;font-size:1rem;font-family:inherit}input:focus{outline:none;border-color:var(--accent)}
.pos{color:var(--up-soft)}.code{display:flex;align-items:center;gap:10px;margin-top:12px;background:rgba(0,0,0,.25);border:1px dashed rgba(245,192,74,.5);border-radius:16px;padding:12px 14px}.code b{flex:1;font-size:1.2rem;font-weight:900;letter-spacing:.12em}.code small{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;display:block;font-weight:700}
details.dt{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:0 16px;box-shadow:var(--hl)}
details.dt summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 0;cursor:pointer;font-weight:800;font-size:.95rem}details.dt summary::-webkit-details-marker{display:none}
details.dt summary i{margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}details.dt[open] summary i{transform:rotate(-135deg)}details.dt[open] summary{border-bottom:1px solid var(--border)}details.dt>*:last-child{margin-bottom:16px}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--surface3);border:1px solid var(--border2);border-radius:16px;padding:12px 14px;font-size:.9rem;z-index:50;display:none;box-shadow:var(--sh)}
.sk{color:var(--muted);font-size:.9rem;padding:20px 0;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<header><div class="hrow">
 <a href="parrainage" class="ib" aria-label="Retour"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
 <div class="ttl"><h1 id="h1">Programme cr&eacute;ateurs</h1><div id="h1s">YouTube, TikTok, Telegram, blog</div></div>
 <span id="st" class="badge wait" style="display:none"></span>
</div></header>
<div id="main"><div class="sk">Chargement&hellip;</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const B=location.pathname.replace(/createur\/?$/,'');
let EN=false;try{EN=localStorage.getItem('owlLang')==='en';}catch(e){}
const T=(fr,en)=>EN?en:fr;
if(EN){document.getElementById('h1').textContent='Creator programme';}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>{if(!t)return '';const d=new Date(t*1000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
const usd=v=>'$'+(+v||0).toFixed(2);
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h;};
const PLAN={family:'Automatique',manual:'Signal',strategy:T('Stratégie','Strategy')};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200);}
async function api(path,body){const r=await fetch(B+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});return r.json();}
let D=null;
async function load(){try{D=await api('referral_data');}catch(e){$('main').innerHTML='<div class="empty">'+T('La page ne répond pas pour l’instant.','The page is not answering right now.')+'</div>';return;}render();}
function ring(pct){const c=2*Math.PI*31;return '<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="31" fill="none" stroke="var(--border2)" stroke-width="7"/><circle cx="36" cy="36" r="31" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-pct/100)).toFixed(1)+'"/></svg><b>'+pct+' %</b></div>';}
function chart(series){const M=EN?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
 const now=new Date();const S=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const f=(series||[]).find(x=>x.m===k);S.push({m:k,usd:f?f.usd:0});}
 const mx=Math.max(...S.map(x=>x.usd),1);
 return '<div class="chart">'+S.map(x=>'<div><b>'+(x.usd?usd(x.usd):'')+'</b><i style="height:'+Math.max(4,Math.round(78*x.usd/mx))+'px"></i><small>'+M[parseInt(x.m.slice(5,7),10)-1]+'</small></div>').join('')+'</div>';}
function rules(I){return '<details class="dt"><summary><span>'+T('Les règles','The rules')+'</span><i></i></summary><div class="steps">'
 +'<div><i>1</i><span><b>'+T(I.pct+' % de chaque mois payé',I.pct+' % of every paid month')+'</b><small>'+T('Par chaque abonné venu avec votre lien, quelle que soit la formule, pendant ses '+I.months+' premiers mois payés.','By every subscriber who came with your link, whatever the plan, for their first '+I.months+' paid months.')+'</small></span></div>'
 +'<div><i>2</i><span><b>'+T('Un lien, une règle','One link, one rule')+'</b><small>'+T('Votre lien de parrainage devient votre lien créateur. Les 50 % du premier mois ne s’ajoutent pas : c’est l’un ou l’autre.','Your referral link becomes your creator link. The 50 % first month does not stack: it is one or the other.')+'</small></span></div>'
 +'<div><i>3</i><span><b>'+T('Versé en USDT dès $100','Paid in USDT from $100')+'</b><small>'+T('Une fois par mois, à votre adresse, avec une notification à chaque versement.','Once a month, to your address, with a notification at each payout.')+'</small></span></div>'
 +'<div><i>4</i><span><b>'+T('Ce que vous montrez','What you show')+'</b><small>'+T('La démo et ses vrais résultats, bons comme mauvais ; aucun gain promis. Signal et Stratégie ; Automatique est sur invitation et ne se présente pas comme une offre publique.','The demo and its real results, good and bad; no promised gains. Signal and Strategy; Automatic is by invitation and is not presented as a public offer.')+'</small></span></div></div></details>';}
function render(){const d=D,I=d.inf||{};const st=d.public?'public':(I.status||'none');const sb=$('st');
 if(st==='approved'){sb.className='badge ok';sb.textContent=T('approuvé','approved');sb.style.display='';}else if(st==='pending'){sb.className='badge wait';sb.textContent=T('en attente','pending');sb.style.display='';}else if(st==='refused'){sb.className='badge no';sb.textContent=T('non validé','not approved');sb.style.display='';}
 let h='';
 if(st==='public'){h='<div class="hero"><div class="eyebrow">'+T('Programme créateurs','Creator programme')+'</div><h2>'+T(I.pct+' % de chaque mois payé par vos abonnés.',I.pct+' % of every month your subscribers pay.')+'</h2><p>'+T('Ouvrez un compte, envoyez la vidéo où vous parlez d’OwlNest, et touchez '+I.pct+' % pendant les '+I.months+' premiers mois de chaque abonné venu avec votre lien.','Open an account, send the video where you talk about OwlNest, and earn '+I.pct+' % for the first '+I.months+' months of every subscriber who came with your link.')+'</p><a class="btn gold full" href="/offres">'+T('Ouvrir un compte','Open an account')+'</a></div>'+rules(I);$('main').innerHTML=h;return;}
 if(st==='approved'){const F=(d.friends||[]).filter(f=>f.paid);const pct=Math.min(100,Math.round(100*(d.cash||0)/(d.payout_min||100)));
  h='<div class="hero"><div class="eyebrow">'+T('Tableau de bord','Dashboard')+'</div><h2>'+T(I.pct+' % de chaque mois payé par vos abonnés.',I.pct+' % of every month your subscribers pay.')+'</h2><p>'+T('Pendant leurs '+I.months+' premiers mois. Approuvé le '+fd(I.reviewed_t)+'.','For their first '+I.months+' months. Approved on '+fd(I.reviewed_t)+'.')+'</p>'
   +'<div class="code"><span><small>'+T('Votre lien','Your link')+'</small><b style="font-size:.9rem;letter-spacing:0;word-break:break-all">'+esc(d.link)+'</b></span><button class="btn sec" style="flex:none" data-act="copy">'+T('Copier','Copy')+'</button></div></div>';
  h+='<div class="kpi"><div><b>'+(I.active_users||0)+'</b><span>'+T('abonnés actifs','active subscribers')+'</span><small>'+T('payé ces 35 derniers jours','paid in the last 35 days')+'</small></div><div><b class="pos">'+usd(I.expected)+'</b><span>'+T('attendu le mois prochain','expected next month')+'</span><small>'+T('si tous renouvellent','if all renew')+'</small></div><div><b class="pos">'+usd(I.this_month)+'</b><span>'+T('ce mois','this month')+'</span></div><div><b class="pos">'+usd(I.recurring)+'</b><span>'+T('en tout','in all')+'</span><small>'+(d.signed||0)+' '+T('inscrits','signed up')+'</small></div></div>';
  h+='<div class="card"><div class="eyebrow">'+T('6 derniers mois','Last 6 months')+'</div>'+chart(I.series)+'</div>';
  h+='<div class="card"><div style="display:flex;gap:14px;align-items:center">'+ring(pct)+'<div style="flex:1;min-width:0"><div class="eyebrow">'+T('À recevoir','To receive')+'</div><b style="font-size:1.5rem;font-weight:900;display:block;margin-top:2px">'+usd(d.cash)+'</b><small style="color:var(--muted2);font-size:.78rem">'+(d.due?'<span class="pos">'+T('Seuil atteint : versé au prochain tour mensuel.','Threshold reached: paid at the next monthly round.')+'</span>':T('versé en USDT dès $'+Math.round(d.payout_min),'paid in USDT from $'+Math.round(d.payout_min)))+'</small></div></div><button class="btn sec full" data-act="addr">'+(d.payout_addr?T('Mon adresse USDT','My USDT address'):T('Donner mon adresse USDT','Give my USDT address'))+'</button></div>';
  h+='<div class="card" style="padding:4px 16px"><div class="row" style="border-top:0;padding-top:14px"><span class="rl"><b>'+T('Mes abonnés','My subscribers')+'</b><small>'+T('venus avec votre lien, mois payés sur '+I.months,'came with your link, months paid out of '+I.months)+'</small></span></div>'
   +(F.length?F.map((f,i)=>'<div class="row"><span class="av" style="background:linear-gradient(135deg,hsl('+hue(f.label+i)+' 60% 50%),hsl('+((hue(f.label+i)+50)%360)+' 60% 40%))">'+esc(f.label)+'</span><span class="rl"><b>'+esc(PLAN[f.plan]||T('Membre','Member'))+' · '+T('depuis le ','since ')+fd(f.since)+'</b><small>'+f.months+' '+T('mois payé'+(f.months>1?'s':''),'month'+(f.months>1?'s':'')+' paid')+' · '+(f.months_left>0?f.months_left+' '+T('restant'+(f.months_left>1?'s':''),'left'):T('terminé','done'))+'</small><div class="bar"><i style="width:'+Math.round(100*Math.min(I.months,f.months)/I.months)+'%"></i></div></span><span class="rr pos">+'+usd(f.usd)+'<small>'+T('dernier ','last ')+fd(f.paid_t)+'</small></span></div>').join('')
   :'<div class="empty">'+T('Personne n’a encore payé avec votre lien. Mettez-le sous votre vidéo et dans votre description.','Nobody has paid with your link yet. Put it under your video and in your description.')+'</div>')+'</div>';
  h+='<div class="card" style="padding:14px 16px"><div class="eyebrow">'+T('Votre contenu','Your content')+'</div><p class="note" style="margin-top:6px"><a href="'+esc(I.video)+'" target="_blank" rel="noopener">'+T('La vidéo validée','The approved video')+'</a> · <a href="'+esc(I.channel)+'" target="_blank" rel="noopener">'+T('votre chaîne','your channel')+'</a></p></div>'+rules(I);}
 else if(st==='pending'){h='<div class="hero"><div class="eyebrow">'+T('Programme créateurs','Creator programme')+'</div><h2>'+T('Demande envoyée.','Application sent.')+'</h2><p>'+T('Le Owl regarde votre vidéo et valide à la main, en général sous 48 h. Vous serez prévenu ici et par notification. En attendant, votre lien fonctionne déjà en parrainage simple.','The Owl watches your video and approves by hand, usually within 48 h. You will be told here and by notification. Meanwhile your link already works as a simple referral.')+'</p><p class="note"><a href="'+esc(I.video)+'" target="_blank" rel="noopener">'+T('la vidéo envoyée','the video sent')+'</a> · '+fd(I.applied_t)+'</p></div>'+rules(I);}
 else{h='<div class="hero"><div class="eyebrow">'+T('Programme créateurs','Creator programme')+'</div><h2>'+T('Vous parlez d’OwlNest à votre audience ?','Do you talk about OwlNest to your audience?')+'</h2><p>'+T('Montrez-nous la vidéo où vous en parlez. Une fois validée, vous touchez <b>'+I.pct+' % de chaque mois payé</b> par vos abonnés, pendant leurs '+I.months+' premiers mois, au lieu de 50 % une seule fois.','Show us the video where you talk about it. Once approved, you earn <b>'+I.pct+' % of every month</b> your subscribers pay, for their first '+I.months+' months, instead of 50 % once.')+'</p>'
   +(st==='refused'?'<p class="note" style="color:var(--warn)">'+T('Dernière demande non validée','Last application not approved')+(I.review_note?' : '+esc(I.review_note):'')+'. '+T('Vous pouvez en envoyer une autre.','You may send another.')+'</p>':'')
   +'<label>'+T('Votre chaîne','Your channel')+'</label><input id="ich" placeholder="https://youtube.com/@..." value="'+esc(I.channel||'')+'"><label>'+T('La vidéo qui parle d’OwlNest','The video that mentions OwlNest')+'</label><input id="ivd" placeholder="https://youtu.be/...">'
   +'<label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--text2);font-weight:500;margin-top:12px"><input type="checkbox" id="iok" style="width:18px;height:18px;margin:2px 0 0;flex:none"><span>'+T('Je ne promets aucun gain : je montre la démo et ses vrais résultats, bons comme mauvais. Je présente Signal et Stratégie ; Automatique est sur invitation.','I promise no gains: I show the demo and its real results, good and bad. I present Signal and Strategy; Automatic is by invitation.')+'</span></label>'
   +'<button class="btn gold full" data-act="apply">'+T('Envoyer ma demande','Send my application')+'</button></div>'+rules(I);}
 if(I.pending&&I.pending.length){h+='<div class="card" style="border-color:rgba(232,197,90,.4)"><div class="eyebrow">'+T('À valider · propriétaire','To review · owner')+'</div>'+I.pending.map(p=>'<div class="row"><span class="rl"><b>'+esc(p.name)+'</b><small><a href="'+esc(p.video)+'" target="_blank" rel="noopener">'+T('vidéo','video')+'</a> · <a href="'+esc(p.channel)+'" target="_blank" rel="noopener">'+T('chaîne','channel')+'</a> · '+fd(p.applied_t)+'</small></span><span class="rr" style="display:flex;gap:6px"><button class="btn" style="padding:8px 12px" data-act="approve" data-uid="'+esc(p.uid)+'">✓</button><button class="btn sec" style="padding:8px 12px" data-act="refuse" data-uid="'+esc(p.uid)+'">✗</button></span></div>').join('')+'</div>';}
 $('main').innerHTML=h;}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 if(a==='copy'){try{await navigator.clipboard.writeText(D.link);toast(T('Lien copié.','Link copied.'));}catch(x){prompt(T('Votre lien :','Your link:'),D.link);}}
 else if(a==='apply'){if(!$('iok').checked){toast(T('Cochez la case : pas de gain promis.','Tick the box: no gains promised.'));return;}const r=await api('inf_apply',{channel:$('ich').value,video:$('ivd').value});if(r.ok){toast(T('Demande envoyée.','Application sent.'));load();}else toast({channel:T('Le lien de votre chaîne.','Your channel link.'),video:T('Le lien de la vidéo.','The video link.'),already:T('Déjà approuvé.','Already approved.')}[r.err]||T('Pas possible.','Not possible.'));}
 else if(a==='approve'||a==='refuse'){const note=a==='refuse'?(prompt(T('Un mot pour le créateur (facultatif) :','A word for the creator (optional):'),'')||''):'';const r=await api('inf_review',{uid:el.dataset.uid,approve:a==='approve',note:note});toast(r.ok?(a==='approve'?T('Approuvé.','Approved.'):T('Refusé.','Refused.')):T('Pas possible.','Not possible.'));if(r.ok)load();}
 else if(a==='addr'){const v=prompt(T('Votre adresse USDT (TRC20 ou ERC20) :','Your USDT address (TRC20 or ERC20):'),D.payout_addr||'');if(v===null)return;const r=await api('wallet_addr',{addr:v});toast(r.ok?T('Adresse enregistrée.','Address saved.'):T('Pas possible.','Not possible.'));if(r.ok)load();}});
