 const P=a.map((v,i)=>x(i)+','+y(v));const up=a[a.length-1]>=0,c=up?'var(--up)':'var(--down)';const iMax=a.indexOf(Math.max(...a)),iMin=a.indexOf(Math.min(...a));
 return '<div class="big"><div class="bv"><b class="'+cl(a[a.length-1])+'">'+money(a[a.length-1])+'</b><small>'+T('cumul&eacute; jour par jour','day by day')+'</small></div><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="bg1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".32"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'

 +'<circle cx="'+x(iMax)+'" cy="'+y(a[iMax])+'" r="3.5" fill="var(--up)"/><circle cx="'+x(iMin)+'" cy="'+y(a[iMin])+'" r="3.5" fill="var(--down)"/><circle cx="'+x(a.length-1)+'" cy="'+y(a[a.length-1])+'" r="4" fill="'+c+'" stroke="var(--bg)" stroke-width="2"/></svg>'
