<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* 2026-10-17 (owner): "La place des robots" - robots built by members, tested on real ticks, followed on your own
   account; the creator's earnings and the referral cagnotte live here too. Same tokens as Les coulisses. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;
 --border:#1f2a38;--border2:#2b3a4d;--hl:inset 0 1px 0 rgba(255,255,255,.04);
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;
 --accent:#3b82f6;--accent-soft:#8fc6ff;--accent-bg:rgba(59,130,246,.14);
 --up:#2ecc71;--up-soft:#8df0bb;--down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;
 --r:16px;--r-lg:24px;--hero1:#0d2236;--hero2:#103a5c}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#ffffff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;
 --text:#10161f;--text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--accent-bg:rgba(59,130,246,.1);--hero1:#dbe7f5;--hero2:#c9dcf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px}
a{color:var(--accent-soft)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));border-radius:0 0 var(--r-lg) var(--r-lg);padding:14px 16px 22px;margin-bottom:16px}
.hero .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero .top a{color:var(--text2);text-decoration:none;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.hero h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.hero p{margin:8px 0 0;color:var(--text2);font-size:.93rem;line-height:1.5;max-width:460px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border2);background:var(--surface);color:var(--text2);border-radius:99px;padding:8px 13px;font-size:.84rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-soft)}
.sect{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--hl);padding:16px;margin-top:12px}
.card h3{margin:0;font-size:1.08rem;letter-spacing:-.01em}
.by{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted2);font-size:.82rem}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.c{background:rgba(167,139,250,.14);color:var(--violet-soft);border:1px solid rgba(167,139,250,.35)}
.badge.p{background:var(--accent-bg);color:var(--accent-soft);border:1px solid rgba(59,130,246,.35)}
.badge.g{background:rgba(46,204,113,.12);color:var(--up-soft);border:1px solid rgba(46,204,113,.35)}
.badge.w{background:rgba(232,197,90,.12);color:var(--warn);border:1px solid rgba(232,197,90,.35)}
.badge.r{background:rgba(255,92,92,.12);color:var(--down-soft);border:1px solid rgba(255,92,92,.35)}
.blurb{color:var(--text2);font-size:.92rem;line-height:1.5;margin:10px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.facts div{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 10px;min-width:0}
.facts span{display:block;font-size:.64rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts b{display:block;font-size:1rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mk span{font-size:.74rem;border-radius:99px;padding:4px 9px;border:1px solid var(--border2);color:var(--muted2)}
.mk span.ok{border-color:rgba(46,204,113,.4);color:var(--up-soft)}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.price{font-weight:900;font-size:1.05rem}.price small{font-weight:600;color:var(--muted);font-size:.78rem}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}.btn.ghost{background:none;color:var(--accent-soft);padding:8px 6px}
.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.5;cursor:default}
.up{color:var(--up-soft)}.dn{color:var(--down-soft)}
.empty{color:var(--muted2);font-size:.9rem;line-height:1.55;padding:6px 2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:.92rem}.kv:first-child{border-top:0}.kv span{color:var(--muted2)}.kv b{text-align:right}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;font-weight:900;letter-spacing:.14em;background:var(--surface2);border:1px dashed var(--border2);border-radius:16px;padding:14px;text-align:center;margin-top:10px}
.cag{display:flex;align-items:baseline;gap:8px;margin-top:10px}.cag b{font-size:1.6rem}.cag span{color:var(--muted2)}
label{display:block;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:13px;color:var(--text);padding:12px 13px;font-size:1rem;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}textarea{min-height:72px;resize:vertical}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{flex:1;min-width:64px;text-align:center;border:1px solid var(--border2);border-radius:12px;padding:10px 6px;font-weight:700;cursor:pointer;background:var(--surface2)}.opt.on{border-color:var(--accent);color:var(--accent-soft);background:var(--accent-bg)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:.92rem}
.sw{width:46px;height:26px;border-radius:99px;background:var(--border2);position:relative;cursor:pointer;flex:none}.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .15s}.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.h{color:var(--muted2);font-size:.8rem;line-height:1.5;margin-top:6px}
#sh{position:fixed;inset:0;z-index:40;display:none}#sh.on{display:block}
#sh .dim{position:absolute;inset:0;background:rgba(3,6,10,.6)}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;max-height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--border2);padding:8px 16px 28px}
@media(min-width:700px){#sh .pn{left:50%;right:auto;width:560px;margin-left:-280px}}
#sh .grab{width:42px;height:5px;border-radius:99px;background:var(--border2);margin:4px auto 12px}
#sh h2{margin:0 0 6px;font-size:1.2rem}#sh .close{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:1.2rem}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--surface3);border:1px solid var(--border2);border-radius:16px;padding:12px 14px;font-size:.9rem;z-index:50;display:none;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.sk{color:var(--muted);font-size:.9rem;padding:20px 0;text-align:center}
.hist{font-size:.84rem;color:var(--muted2)}.hist div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)}
</style></head><body>
<div class="hero"><div class="wrap">
 <div class="top"><a id="back" href="#">&larr; Robots</a></div>
 <h1>La place des robots</h1>
 <p>Des robots construits par des membres, test&eacute;s sur de vrais prix. Suivez-en un sur votre compte, ou publiez le v&ocirc;tre et gagnez du temps d&#8217;abonnement.</p>
</div></div>
<div class="wrap">
 <div class="chips" id="chips">
  <button class="chip on" data-f="all">Tous</button><button class="chip" data-f="free">Gratuits</button><button class="chip" data-f="paid">Payants</button><button class="chip" data-f="mine_broker">Gagnent chez mon courtier</button>
 </div>
 <div id="list"><div class="sk">Chargement&hellip;</div></div>
 <div id="mysub"></div>
 <div id="creator"></div>
 <div id="ref"></div>
</div>
<div id="sh"><div class="dim" onclick="closeSh()"></div><div class="pn"><div class="grab"></div><button class="close" onclick="closeSh()" aria-label="Fermer">&times;</button><div id="shb"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const B=location.pathname.replace(/place\/?$/,'');
document.getElementById('back').href=B+'robots';
let D=null,F='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>{v=Number(v||0);return (v<0?'-':(v>0?'+':''))+'$'+Math.abs(v).toFixed(2);};
const price=v=>Number(v||0)?('$'+Number(v).toFixed(0)+'<small> / mois</small>'):'Gratuit';
const fd=t=>{if(!t)return '';const d=new Date(t*1000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200);}
function openSh(h){$('shb').innerHTML=h;$('sh').classList.add('on');document.body.style.overflow='hidden';}
function closeSh(){$('sh').classList.remove('on');document.body.style.overflow='';}
async function api(path,body){const r=await fetch(B+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});return r.json();}
async function load(){try{D=await api('place_data');}catch(e){$('list').innerHTML='<div class="empty">La place ne r&eacute;pond pas pour l&#8217;instant. R&eacute;essayez dans un instant.</div>';return;}render();}
function pkgName(p){return {family:'Automatique',manual:'Signal',strategy:'Stratégie'}[p]||p;}
function cardHtml(x){
 const t=x.test||{},net=Number(t.net||0),mine=x.mine;
 const atb=x.at_my_broker;
 const btn=x.following?'<button class="btn sec" onclick="unfollowSh()">Je suis ce robot &middot; arr&ecirc;ter</button>'
  :(x.paused?'<button class="btn sec" disabled>En pause</button>'
  :(D.me.auto?'<button class="btn" onclick="followSh(\''+esc(x.id)+'\')">Suivre ce robot</button>'
  :'<a class="btn" style="text-decoration:none;display:inline-block" href="/offres">Suivre &middot; avec Automatique</a>'));
 const inspire=(x.open_recipe&&(D.me.strategy||D.me.admin))?'<a class="btn ghost" href="'+B+'robots?parent='+encodeURIComponent(x.id)+'">S&#8217;en inspirer</a>':'';
 return '<div class="card" data-id="'+esc(x.id)+'">'
  +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div><h3>'+esc(x.name)+'</h3>'
  +'<div class="by">par <b>'+esc(x.alias||'?')+'</b> <span class="badge c">Cr&eacute;ateur</span>'+(mine?' <span class="badge p">le v&ocirc;tre</span>':'')+(x.paused?' <span class="badge w">en pause</span>':'')+'</div></div>'
  +'<div class="price">'+price(x.price_usd)+'</div></div>'
  +(x.blurb?'<p class="blurb">'+esc(x.blurb)+'</p>':'')
  +'<div class="facts"><div><span>R&eacute;sultat '+(t.days||42)+' j</span><b class="'+(net>=0?'up':'dn')+'">'+usd(net)+'</b></div>'
  +'<div><span>Trades</span><b>'+(t.trades??'&mdash;')+'</b></div><div><span>Pire creux</span><b>'+(t.mtm_dd!=null?'-$'+Number(t.mtm_dd).toFixed(0):'&mdash;')+'</b></div></div>'
  +(x.markets&&x.markets.length?'<div class="mk"><span class="ok">Bitcoin</span>'+x.markets.map(m=>'<span class="'+(m.pays?'ok':'')+'" title="'+usd(m.net)+'">'+esc(m.name||m.sym)+(m.pays?' &check;':'')+'</span>').join('')+'</div>':'')
  +(atb?'<div class="h">Chez votre courtier : <b class="'+(atb.est>0?'up':'dn')+'">'+usd(atb.est)+'</b> sur 42 jours'+(atb.pays?'':' &mdash; ne gagne pas &agrave; ce co&ucirc;t')+'</div>':'')
  +'<div class="row">'+btn+inspire+'<span style="margin-left:auto;color:var(--muted2);font-size:.82rem">'+(x.followers||0)+' abonn&eacute;'+(x.followers>1?'s':'')+'</span></div></div>';
}
function render(){
 const L=(D.listings||[]).filter(x=>F==='all'||(F==='free'&&x.free)||(F==='paid'&&!x.free)||(F==='mine_broker'&&x.at_my_broker&&x.at_my_broker.pays));
 $('list').innerHTML=L.length?L.map(cardHtml).join(''):'<div class="empty">'+(F==='mine_broker'?'Aucun robot ne gagne au co&ucirc;t de votre courtier pour l&#8217;instant.':'Aucun robot sur la place pour l&#8217;instant. Le premier publi&eacute; appara&icirc;tra ici.')+'</div>';
 // my subscription
 const s=D.sub;
 $('mysub').innerHTML=s?'<div class="sect">Mon abonnement</div><div class="card"><div class="kv"><span>Robot suivi</span><b>'+esc(s.name||s.rid)+'</b></div><div class="kv"><span>Jusqu&#8217;au</span><b>'+fd(s.until)+'</b></div><div class="kv"><span>Prix</span><b>'+(Number(s.price_usd)?'$'+Number(s.price_usd).toFixed(0)+' / mois':'Gratuit')+'</b></div>'
  +'<div class="h">&Agrave; la fin du mois, sans renouvellement, votre compte revient sur le robot du nid (l&#8217;Owl). Vous &ecirc;tes pr&eacute;venu 2 jours avant.</div>'
  +(Number(s.price_usd)?'<button class="btn full" onclick="followSh(\''+esc(s.rid)+'\',true)">Renouveler 30 jours</button>':'')+'<button class="btn sec full" onclick="unfollowSh()">Arr&ecirc;ter et revenir &agrave; l&#8217;Owl</button></div>':'';
 // creator
 if(D.me.strategy||D.me.admin||(D.mine&&D.mine.length)){
  const listed=(D.mine||[]).map(m=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3>'+esc(m.name)+'</h3><div class="by">'+(m.hidden?'<span class="badge r">retir&eacute;</span>':(m.paused?'<span class="badge w">en pause &middot; test n&eacute;gatif</span>':'<span class="badge g">sur la place</span>'))+'</div></div><div class="price">'+price(m.price_usd)+'</div></div>'
   +'<div class="facts"><div><span>Abonn&eacute;s</span><b>'+m.followers+'</b></div><div><span>Gagn&eacute;</span><b class="up">'+usd(m.earned_usd)+'</b></div><div><span>Depuis</span><b>'+fd(m.published_at)+'</b></div></div>'
   +'<div class="row"><button class="btn sec" onclick="publishSh(\''+esc(m.id)+'\')">Modifier</button>'+(m.hidden?'':'<button class="btn ghost" onclick="unpublish(\''+esc(m.id)+'\')">Retirer</button>')+'</div></div>').join('');
  const cand=(D.my_robots||[]).map(r=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h3>'+esc(r.name)+'</h3><div class="by">'+(r.test&&r.test.net!=null?'<span class="'+(r.test.net>0?'up':'dn')+'">'+usd(r.test.net)+'</span> sur 42 jours':'pas encore test&eacute;')+'</div></div>'
   +(r.can?'<button class="btn" onclick="publishSh(\''+esc(r.id)+'\')">Publier</button>':'<span class="badge w" title="'+esc(r.why)+'">'+esc(r.why)+'</span>')+'</div></div>').join('');
  $('creator').innerHTML='<div class="sect">Mes robots sur la place</div>'+(listed||'')+(cand||'')+((!listed&&!cand)?'<div class="empty">Construisez un robot dans l&#8217;atelier (Robots &rsaquo; Construire). Une fois test&eacute; et positif sur 42 jours, vous pourrez le publier ici.</div>':'')
   +'<div class="h" style="margin-top:8px">Un robot publi&eacute; rapporte 70 % de chaque mois pay&eacute; par un abonn&eacute;, en temps d&#8217;abonnement dans votre cagnotte. Il est mis en pause si son test devient n&eacute;gatif.</div>';
 }else{$('creator').innerHTML='<div class="sect">Cr&eacute;er un robot</div><div class="card"><h3>Votre robot, sur la place</h3><p class="blurb">Avec Strat&eacute;gie, vous construisez un robot &agrave; partir de pi&egrave;ces simples, vous le testez sur de vrais prix, et vous le publiez ici. Chaque abonn&eacute; vous rapporte du temps d&#8217;abonnement.</p><a class="btn full" style="text-decoration:none;display:block;text-align:center" href="/offres">D&eacute;couvrir Strat&eacute;gie</a></div>';}
 // referral + wallet
 const R=D.ref||{},W=D.wallet||{};
 $('ref').innerHTML='<div class="sect">Parrainage et cagnotte</div><div class="card"><h3>Invitez un ami, gagnez du temps</h3>'
  +'<p class="blurb">Votre ami entre ce code &agrave; son inscription. Il re&ccedil;oit 7 jours de plus ; vous recevez 20 % de chacun de ses paiements, en temps d&#8217;abonnement, tant qu&#8217;il reste.</p>'
  +'<div class="code" id="code">'+esc(R.code||'')+'</div>'
  +'<div class="row"><button class="btn" onclick="share()">Partager</button><button class="btn sec" onclick="copyLink()">Copier le lien</button></div>'
  +'<div class="kv" style="margin-top:12px"><span>Amis inscrits avec votre code</span><b>'+(R.friends||[]).length+'</b></div><div class="kv"><span>Mois cr&eacute;dit&eacute;s</span><b>'+(R.credited||0)+'</b></div></div>'
  +'<div class="card"><h3>Ma cagnotte</h3><div class="cag"><b>$'+Number(W.usd||0).toFixed(2)+'</b><span>= '+(W.days||0)+' jour'+(W.days>1?'s':'')+' de '+pkgName(W.pkg)+'</span></div>'
  +'<div class="h">Elle se remplit avec vos parrainages'+(D.me.strategy||D.me.admin?' et vos robots suivis':'')+'. Elle se d&eacute;pense en jours d&#8217;abonnement, ou pour suivre un robot payant.</div>'
  +(W.days>0?'<button class="btn full" onclick="useWallet('+W.days+')">Ajouter '+W.days+' jour'+(W.days>1?'s':'')+' &agrave; mon abonnement</button>':'')
  +((W.history||[]).length?'<div class="hist" style="margin-top:12px">'+W.history.slice(-5).reverse().map(h=>'<div><span>'+fd(h.t)+' &middot; '+esc(h.kind==='referral'?'parrainage':(h.kind==='robot'?'robot suivi':(h.kind==='time'?'jours ajoutés':'abonnement robot')))+'</span><b class="'+(h.usd>=0?'up':'dn')+'">'+usd(h.usd)+'</b></div>').join('')+'</div>':'')
  +'</div>';
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');F=c.dataset.f;render();});
function share(){const R=D.ref||{};const txt='OwlNest : un robot qui trade le Bitcoin, et tout ce qu’il fait en direct. Mon code : '+R.code+' (7 jours offerts). '+R.link;
 if(navigator.share){navigator.share({title:'OwlNest',text:txt,url:R.link}).catch(()=>{});}else{copyLink();}}
function copyLink(){const R=D.ref||{};try{navigator.clipboard.writeText(R.link+'  code '+R.code);toast('Lien et code copiés.');}catch(e){prompt('Votre lien :',R.link);}}
async function useWallet(days){openSh('<h2>Ajouter '+days+' jour'+(days>1?'s':'')+'</h2><p class="blurb">Votre cagnotte devient '+days+' jour'+(days>1?'s':'')+' de '+pkgName(D.wallet.pkg)+', ajout&eacute;s &agrave; la fin de votre p&eacute;riode actuelle.</p><label>Combien de jours ?</label><input id="wd" type="number" min="1" max="'+days+'" value="'+days+'"><button class="btn full" onclick="useWalletGo()">Ajouter</button>');}
async function useWalletGo(){const n=parseInt($('wd').value||'0',10);const r=await api('wallet_use',{days:n});closeSh();if(r.ok){toast('+'+r.days+' jour'+(r.days>1?'s':'')+' · jusqu’au '+r.until);load();}else toast(r.err||'Pas possible pour l’instant.');}
function followSh(rid,renew){const x=(D.listings||[]).find(y=>y.id===rid);if(!x)return;const p=Number(x.price_usd||0),w=Number((D.wallet||{}).usd||0);
 const cur=D.me.current_robot_name||'l’Owl';
 let pay='';
 if(p>0){pay='<label>Paiement</label><div class="opts">'+(w>=p?'<div class="opt on" data-p="wallet" onclick="pick(this)">Ma cagnotte ($'+w.toFixed(2)+')</div>':'<div class="opt" style="opacity:.5">Cagnotte ($'+w.toFixed(2)+')</div>')+'<div class="opt'+(w>=p?'':' on')+'" data-p="crypto" onclick="pick(this)">En crypto</div></div><div class="h">$'+p.toFixed(0)+' pour 30 jours. 70 % vont au cr&eacute;ateur, en temps d&#8217;abonnement.</div>';}
 openSh('<h2>'+(renew?'Renouveler':'Suivre')+' &laquo; '+esc(x.name)+' &raquo;</h2><p class="blurb">'+(renew?'30 jours de plus sur votre compte.':'Ce robot va trader votre compte &agrave; la place de <b>'+esc(cur)+'</b>, avec les m&ecirc;mes freins et le m&ecirc;me rattrapage. Si un trade est ouvert, le changement attend qu&#8217;il se termine.')+'</p>'
  +(x.at_my_broker?'<div class="h">Chez votre courtier, sur 42 jours : <b class="'+(x.at_my_broker.est>0?'up':'dn')+'">'+usd(x.at_my_broker.est)+'</b></div>':'')
  +pay+'<label>Mot de passe de votre compte</label><input id="fpw" type="password" autocomplete="current-password" placeholder="pour confirmer le changement"><div class="h">Le mot de passe de trading ou celui de votre application, comme pour tout changement de robot.</div>'
  +'<button class="btn full" onclick="followGo(\''+esc(rid)+'\')">'+(p>0?'Payer et suivre':'Suivre maintenant')+'</button>');}
function pick(el){el.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}
async function followGo(rid){const pw=($('fpw')||{}).value||'';const o=document.querySelector('#shb .opt.on');const pay=o?o.dataset.p:'free';
 const b=document.querySelector('#shb .btn');b.disabled=true;b.textContent='Un instant…';
 const r=await api('place_follow',{id:rid,pay:pay,pwd:pw});
 if(r.ok&&r.url){window.location.href=r.url;return;}
 closeSh();
 if(r.ok){toast(r.pending?'C’est noté : le robot change dès que le trade en cours se termine.':'Le robot tourne sur votre compte.');load();}
 else toast({pwd:'Mot de passe incorrect.',not_allowed:'Ce robot ne peut pas tourner sur ce compte.',wallet:'Cagnotte insuffisante.',paused:'Ce robot est en pause.',no_bot:'Ce compte n’a pas de robot.',no_auto:'Il faut Automatique pour suivre un robot.'}[r.err]||('Pas possible : '+(r.err||'?')));}
function unfollowSh(){openSh('<h2>Revenir &agrave; l&#8217;Owl</h2><p class="blurb">Votre compte reprend le robot du nid. Les jours restants de l&#8217;abonnement ne sont pas rembours&eacute;s.</p><label>Mot de passe de votre compte</label><input id="fpw" type="password"><button class="btn full" onclick="unfollowGo()">Arr&ecirc;ter et revenir &agrave; l&#8217;Owl</button>');}
async function unfollowGo(){const pw=($('fpw')||{}).value||'';const r=await api('place_unfollow',{pwd:pw});closeSh();if(r.ok){toast('Retour à l’Owl.');load();}else toast(r.err==='pwd'?'Mot de passe incorrect.':('Pas possible : '+(r.err||'?')));}
function publishSh(rid){const cur=(D.mine||[]).find(m=>m.id===rid)||{};const r=(D.my_robots||[]).find(m=>m.id===rid)||{};const name=cur.name||r.name||rid;
 const P=[0,9,19,29,49];
 openSh('<h2>Publier &laquo; '+esc(name)+' &raquo;</h2><p class="blurb">Dites-le simplement : qui vous &ecirc;tes, ce que fait le robot, et son prix par mois. Les membres le verront avec son vrai r&eacute;sultat sur 42 jours.</p>'
  +'<label>Votre nom d&#8217;auteur</label><input id="pa" maxlength="24" placeholder="ex. Mike" value="'+esc(cur.alias||D.ref.alias||'')+'"><div class="h">Ce nom appara&icirc;t sur la place, jamais votre identifiant.</div>'
  +'<label>Une phrase sur le robot</label><textarea id="pb" maxlength="160" placeholder="ex. Il attend les cassures franches et vise petit, tous les jours.">'+esc(cur.blurb||'')+'</textarea>'
  +'<label>Prix par mois</label><div class="opts" id="pp">'+P.map(p=>'<div class="opt'+((cur.price_usd||0)==p?' on':'')+'" data-v="'+p+'" onclick="pick(this)">'+(p?'$'+p:'Gratuit')+'</div>').join('')+'</div><div class="h">Vous gardez 70 % de chaque mois pay&eacute;, en temps d&#8217;abonnement.</div>'
  +'<div class="tg"><span>Les autres peuvent partir de ma recette</span><div class="sw'+(cur.open_recipe?' on':'')+'" id="por" onclick="this.classList.toggle(\'on\')"></div></div><div class="h">Un membre Strat&eacute;gie pourra copier les pi&egrave;ces et les modifier chez lui. Votre robot reste le v&ocirc;tre.</div>'
  +'<button class="btn full" onclick="publishGo(\''+esc(rid)+'\')">Publier sur la place</button>');}
async function publishGo(rid){const o=document.querySelector('#pp .opt.on');const r=await api('place_publish',{id:rid,alias:$('pa').value,blurb:$('pb').value,price:o?Number(o.dataset.v):0,open_recipe:$('por').classList.contains('on')});closeSh();if(r.ok){toast('Publié sur la place.');load();}else toast(r.err||'Pas possible.');}
async function unpublish(rid){if(!confirm('Retirer ce robot de la place ? Les abonnés en cours finissent leur mois.'))return;const r=await api('place_unpublish',{id:rid});if(r.ok){toast('Retiré.');load();}else toast(r.err||'Pas possible.');}
load();
</script></body></html>
