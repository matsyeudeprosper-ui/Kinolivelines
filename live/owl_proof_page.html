<script>
const tok=location.pathname.split('/')[1];
const EN=(()=>{try{return localStorage.getItem('owlLang')==='en';}catch(e){return false;}})();
const tx=(fr,en)=>EN?en:fr;
document.getElementById('back').onclick=e=>{e.preventDefault();if(history.length>1)history.back();else location.href='/'+tok+'/';};
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const money=(v,sign)=>{const a=Math.abs(v);return (v<0?'−':(sign&&v>0?'+':''))+'$'+(a>=1000?a.toFixed(0):a.toFixed(2));};
const pct=(v,sign,d)=>(v<0?'−':(sign&&v>0?'+':''))+Math.abs(v).toFixed(d===undefined?(Math.abs(v)<10?1:0):d)+' %';
const num=(v,d)=>v===null||v===undefined||!isFinite(v)?'—':v.toFixed(d===undefined?2:d).replace('.',EN?'.':',');
const sgn=v=>v>0.004?'pos':(v<-0.004?'neg':'neu');
const dfmt=t=>{const d=new Date(t*1000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
const ICON={ov:'<path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.4 6.7 19.1l1-5.8-4.2-4.1 5.9-.9z"/>',
 re:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 te:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',
 me:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
 gm:'<path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/>'};
const svgI=(k,s)=>'<svg width="'+(s||15)+'" height="'+(s||15)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg>';

/* ------------------------------------------------------------ the numbers */
// every metric from a list of trade results (net, after the broker's costs); won = net > 0
function stats(P,bal0){
 const n=P.length,W=P.filter(x=>x>0),L=P.filter(x=>x<=0);
 const gw=W.reduce((a,b)=>a+b,0),gl=-L.reduce((a,b)=>a+b,0),net=gw-gl;
 let cum=0,pk=0,mdd=0,mddPct=0,ws=0,ls=0,mws=0,mls=0,eqPk=bal0||0;
 P.forEach(p=>{cum+=p;pk=Math.max(pk,cum);mdd=Math.max(mdd,pk-cum);
  const eq=(bal0||0)+cum;eqPk=Math.max(eqPk,eq);if(eqPk>0)mddPct=Math.max(mddPct,(eqPk-eq)/eqPk*100);
  if(p>0){ws++;ls=0;}else{ls++;ws=0;}mws=Math.max(mws,ws);mls=Math.max(mls,ls);});
 const avgW=W.length?gw/W.length:0,avgL=L.length?gl/L.length:0,mean=n?net/n:0;

  rf:mdd>0?net/mdd:null,curDD:pk-cum,ret:bal0?100*net/bal0:null,sqn:sd>0?Math.sqrt(n)*mean/sd:null};}

function fresh(){const T=J.test||{};const ok=T.rules_current!==false,at=T.rebuilt_at||(T.generated_at?Date.parse(T.generated_at)/1000:0);
 const when=at?dfmt(at)+' '+new Date(at*1000).toLocaleTimeString(EN?'en-GB':'fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
 return '<div class="card" style="padding:14px 16px;border-color:'+(ok?'rgba(46,204,113,.3)':'rgba(232,197,90,.4)')+'"><div style="display:flex;gap:12px;align-items:center">'+
  '<div style="width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:'+(ok?'var(--ok-bg)':'var(--mid-bg)')+';color:'+(ok?'var(--up)':'var(--warn)')+'">'+(ok?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>':'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>')+'</div>'+
  '<div style="min-width:0"><b style="font-size:.88rem">'+(ok?tx('À jour avec les règles du robot','Up to date with the robot’s rules'):tx('Règles modifiées : backtest en cours de mise à jour','Rules changed: backtest being updated'))+'</b>'+
  '<div style="font-size:.74rem;color:var(--muted);margin-top:2px">'+tx('Refait le '+when+' · refait tout seul dès qu’une règle change, vérifié toutes les 30 min','Rebuilt '+when+' · rebuilt by itself whenever a rule changes, checked every 30 min')+'</div></div></div></div>';}
function vsReal(compact){const F=J.fidelity;if(!F)return '';const R=F.real,Bk=F.backtest,cov=Math.round(100*F.matched/F.real_n);
 const row=(l,a,b)=>'<div class="l">'+l+'</div><div class="r">'+a+'</div><div class="r">'+b+'</div>';
 return '<div class="card"><h2>'+tx('Backtest contre réel','Backtest vs real')+'<span class="badge b-'+(cov>=70?'ok':(cov>=50?'mid':'bad'))+'">'+cov+tx('\u202f% des trades retrouvés','\u202f% of trades found')+'</span></h2>'+
  '<div class="sub">'+tx('Le même compte réel, les mêmes jours, les mêmes prix du courtier, les règles qu’il suivait : on rejoue, puis on compare au relevé.','The same real account, the same days, the same broker prices, the rules it was running: we replay, then compare with the statement.')+'</div>'+
  '<div class="cmp"><div class="h"></div><div class="h r">'+tx('réel','real')+'</div><div class="h r">backtest</div>'+
   row('Trades',R.n,Bk.n)+row(tx('Réussite','Win rate'),pct(R.wr,false,0),pct(Bk.wr,false,0))+row('Profit factor',num(R.pf),num(Bk.pf))+
   row(tx('Résultat','Result'),'<span class="'+sgn(R.net)+'">'+money(R.net,true)+'</span>','<span class="'+sgn(Bk.net)+'">'+money(Bk.net,true)+'</span>')+row(tx('Baisse max','Max drawdown'),pct(-R.dd_pct),pct(-Bk.dd_pct))+'</div>'+
  (compact?'':'<div class="grid2" style="margin-top:12px">'+tile('',tx('Trades retrouvés','Trades found'),F.matched+' / '+F.real_n,F.matched_1s+tx(' fermés à la même seconde',' closed in the same second'))+
   tile('',tx('Sur ces trades communs','On those shared trades'),money(F.paired_pnl_real,true)+tx(' réel',' real'),money(F.paired_pnl_backtest,true)+tx(' en backtest',' in backtest'))+'</div>')+
  '<div class="note">'+tx('Le backtest trouve les mêmes entrées que le robot, mais il est plus sévère sur l’argent : il gagne moins par trade et prend '+F.engine_only+' trades que le vrai robot a refusés. Le réel fait donc mieux que le backtest : un backtest positif est une estimation prudente.','The backtest finds the robot’s entries but is harsher on money: it earns less per trade and takes '+F.engine_only+' trades the real robot refused. Real trading therefore does better than the backtest: a positive backtest is a cautious estimate.')+
  ' <span style="color:var(--muted)">'+tx('Période ','Period ')+F.period_utc[0].slice(0,10)+' → '+F.period_utc[1].slice(0,10)+tx(', mise à jour chaque nuit.',', updated every night.')+'</span></div></div>';}
function go(t){TAB=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();scrollTo({top:0,behavior:'smooth'});}
function render(){tabs();const m=$('main');
 m.innerHTML='<div class="pane on">'+({ov:ovPane,re:rePane,te:tePane,me:mePane}[TAB])()+'</div>';wire(m);
 const R=J.real;
 if(TAB==='ov'&&R){const S=realSeries(R);line($('c-spark'),S,{h:66,color:'#8df0bb',fmtY:v=>'',tip:p=>dfmt(p[0])+' · <b>'+money(p[1])+'</b>'});
  $('c-spark').querySelectorAll('text').forEach(t=>t.remove());}
 if(TAB==='re'&&R){const S=realSeries(R);line($('c-real'),S,{h:190,fmtX:dfmt,fmtY:v=>'$'+v.toFixed(0),marks:[{x:R.filter_since,label:tx('filtre','filter')}],tip:p=>dfmt(p[0])+' · <b>'+money(p[1])+'</b>'});
  drawView(R);$('vseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;$('vseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawView(R);});
  $('opentrades').onclick=tradesPanel;$('openrules').onclick=rulesPanel;}
 if(TAB==='te'&&J.test&&J.test.rows){const r=J.test.rows[COST]||{},B=J.test.balance;
  const toS=c=>(c||[]).map(([d,v])=>[Date.parse(d+'T23:59:00Z')/1000,B+v]);
  line($('c-test'),toS(r.today.curve),{h:190,fmtX:dfmt,fmtY:v=>'$'+v.toFixed(0),ref:toS(r.no_filter.curve),tip:p=>dfmt(p[0])+' · <b>'+money(p[1])+'</b>'});
  $('cost').querySelectorAll('button').forEach(b=>b.onclick=()=>{COST=b.dataset.c;render();});}
}
async function load(){
 try{const r=await fetch('rentabilite_data?t='+Date.now(),{cache:'no-store'});J=await r.json();}catch(e){J=null;}
 if(!J||J.err){$('main').innerHTML='<div class="card"><div class="sub">'+tx('Impossible de charger les chiffres. Réessayez dans un instant.','Could not load the numbers. Try again in a moment.')+'</div></div>';return;}
 const R=J.real;$('hsub').textContent=tx('La stratégie, mesurée','The strategy, measured')+(R?' · '+tx('compte réel depuis le ','real account since ')+dfmt(R.start):'');
 $('h1').textContent=tx('Rentabilité','Profitability');$('livet').textContent=tx('En direct','Live');
 $('foot').innerHTML=tx('Chiffres mis à jour en continu depuis le relevé du courtier. Les performances passées ne préjugent pas des performances futures. Le trading comporte un risque de perte en capital.','Figures updated continuously from the broker statement. Past performance does not predict future performance. Trading carries a risk of capital loss.');
 const h=(location.hash||'').slice(1);if(['ov','re','te','me'].includes(h))TAB=h;render();}
let _w=innerWidth,_rt=null;addEventListener('resize',()=>{if(innerWidth===_w)return;_w=innerWidth;clearTimeout(_rt);_rt=setTimeout(()=>{if(J)render();},150);});
load();setInterval(()=>{if(document.visibilityState==='visible'&&!$('sh').classList.contains('on'))load();},120000);
</script>

<!-- 2026-10-13 (owner): calm pages - the tabs wrap instead of running off the screen, and on a phone a LONG card
     (taller than about half a screen; never the first two) becomes one line that opens it in a sheet.
     The cards are kept whole, so their buttons keep working. Same idea as the Robots pages. -->
<style>
.tabs{flex-wrap:wrap!important;overflow:visible!important}
.tabs .tab{flex:1 1 auto!important;justify-content:center}
.cf-row{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--hl)}
.cf-row .i{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-bg,rgba(59,130,246,.14));color:var(--accent-soft,#8fc6ff)}
.cf-row .i svg{width:18px;height:18px}
.cf-row .t{flex:1;min-width:0}.cf-row b{display:block;font-size:.95rem}.cf-row small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.74rem;color:var(--muted2,#a9b8c8);margin-top:2px;line-height:1.35}
.cf-row .c{flex:none;color:var(--muted,#8a9bb0)}
#cfsh{position:fixed;inset:0;z-index:60;display:none}#cfsh.on{display:block}
#cfsh .xd{position:absolute;inset:0;background:rgba(3,6,10,.55);opacity:0;transition:opacity .25s}#cfsh.open .xd{opacity:1}
#cfsh .xp{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--border2);padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.45)}
#cfsh.open .xp{transform:none}
@media(min-width:700px){#cfsh .xp{left:50%;right:auto;width:600px;margin-left:-300px}}
#cfsh .xg{width:42px;height:5px;border-radius:99px;background:var(--border2);margin:4px auto 12px}
#cfsh .xh{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}
#cfsh .xh b{flex:1;font-size:1.15rem;font-weight:900;color:var(--text)}
#cfsh .xh button{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:1.1rem}
#cfsh .xb .card{margin-bottom:0}
</style>
<script>
(function(){
 const $=id=>document.getElementById(id);
 const EN=(()=>{try{return localStorage.getItem('owlLang')==='en';}catch(e){return false;}})();
 const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let OPEN=0,CUR=null;const STORE={};
 function sh(){let s=$('cfsh');if(s)return s;s=document.createElement('div');s.id='cfsh';
  s.innerHTML='<div class="xd"></div><div class="xp" role="dialog" aria-modal="true"><div class="xg"></div><div class="xh"><b id="cfsh-t"></b><button id="cfsh-x" aria-label="'+(EN?'Close':'Fermer')+'">×</button></div><div class="xb" id="cfsh-b"></div></div>';
  document.body.appendChild(s);s.querySelector('.xd').onclick=close;$('cfsh-x').onclick=close;return s;}
 function open(k){const f=STORE[k];if(!f)return;const s=sh();CUR=k;$('cfsh-t').textContent=f[0];$('cfsh-b').innerHTML=f[1];s.querySelector('.xp').scrollTop=0;s.classList.add('on');document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('open')));if(!OPEN){OPEN=1;try{history.pushState({cfsh:1},'');}catch(e){}}}
 function hide(){const s=$('cfsh');if(!s)return;s.classList.remove('open');document.body.style.overflow='';OPEN=0;CUR=null;setTimeout(()=>{if(!OPEN)s.classList.remove('on');},330);}
 function close(){if(OPEN&&history.state&&history.state.cfsh)history.back();else hide();}
 window.addEventListener('popstate',()=>{if(OPEN)hide();});
 window.cfOpen=open;
 function fold(){const m=$('main');if(!m||window.innerWidth>=900)return;
  const cards=[...m.querySelectorAll('.card')].filter(c=>!c.parentElement.closest('.card')&&!c.closest('#cfsh'));let i=0;
  cards.forEach(c=>{i++;if(i<=2||c.offsetHeight<440)return;const hd=c.querySelector('h2,h3,.lbl,.ttl,.eyebrow');if(!hd)return;
   const t=hd.cloneNode(true);t.querySelectorAll('.bd,.badge,button,a,.hint,span[class*=pill]').forEach(e=>e.remove());let title=t.textContent.trim().replace(/\s+/g,' ');if(!title||title.length>70)return;
   title=title.charAt(0)+title.slice(1).toLowerCase();
   const sub=(c.querySelector('.sub,p,.note')||{}).textContent||'';const k='cf'+title;STORE[k]=[title,c.outerHTML];
   const b=document.createElement('button');b.className='cf-row';b.type='button';
   b.innerHTML='<span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="t"><b>'+esc(title)+'</b>'+(sub.trim()?'<small>'+esc(sub.trim().slice(0,110))+'</small>':'')+'</span><span class="c">›</span>';
   b.onclick=()=>open(k);c.replaceWith(b);if(OPEN&&CUR===k){const x=$('cfsh-b');if(x)x.innerHTML=STORE[k][1];}});}
 // the tab highlight follows a wrapped tab onto its line
 function ind(){const b=document.querySelector('.tabs .tab.on'),i=$('tabind');if(!b||!i)return;i.style.top=b.offsetTop+'px';i.style.height=b.offsetHeight+'px';i.style.bottom='auto';}
 let busy=0;const mo=new MutationObserver(()=>{if(busy)return;busy=1;setTimeout(()=>{try{fold();ind();}catch(e){}busy=0;},60);});
 function start(){const m=$('main');if(m)mo.observe(m,{childList:true,subtree:true});const tb=$('tabs');if(tb)mo.observe(tb,{attributes:true,subtree:true,attributeFilter:['class']});try{fold();ind();}catch(e){}}
 window.addEventListener('resize',()=>{try{ind();}catch(e){}});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
