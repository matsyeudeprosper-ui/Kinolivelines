<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<style>
/* 2026-11-08 (owner: "the trading app's look is not bad, just polish it - a WhatsApp feel but not a copy") */
:root{--bg:#0b0f14;--bar:#0f1620;--surface:#141d29;--surface2:#1a2533;--border:#1f2a38;--ink:#e8eef5;--mut:#8a9bb0;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bar);position:relative;z-index:2}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--vio) 70%,transparent);opacity:.7}
.av{width:46px;height:46px;border-radius:50%;background:url(/kinochat.png) center/cover;flex:none;position:relative;box-shadow:0 0 0 2px var(--bar),0 0 0 4px #22c55e88,0 4px 18px rgba(109,92,246,.45)}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bar)}
.who{flex:1;min-width:0}.who b{display:block;font-size:18px;font-weight:700;color:var(--acc);letter-spacing:.2px}.who b i{font-style:normal;font-size:14px;margin-left:4px}
.who small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small.typ{color:var(--acc)}
.ib{background:none;border:0;color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.ib:active{background:#ffffff14}.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#srch input{flex:1;padding:10px 14px;border-radius:22px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:15px system-ui;outline:none}
main{flex:1;overflow-y:auto;padding:12px 12px 8px;
 background:radial-gradient(circle at 20px 30px,#ffffff1c 1.2px,transparent 1.6px) 0 0/86px 86px,
  radial-gradient(circle at 60px 70px,#8b7dff30 1px,transparent 1.5px) 0 0/86px 86px,
  radial-gradient(circle at 45px 12px,#22c55e26 1px,transparent 1.5px) 0 0/120px 120px,
  radial-gradient(120% 55% at 50% 0%,rgba(109,92,246,.10),transparent 60%),var(--bg)}
.day{text-align:center;margin:14px 0 10px}.day span{background:var(--surface2);color:var(--mut);font-size:12px;font-weight:600;padding:5px 12px;border-radius:10px;box-shadow:0 1px 3px #0006}
.m{display:flex;margin:3px 0}.m.me{justify-content:flex-end}.m.gap{margin-top:10px}
.b{max-width:82%;padding:9px 12px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--border);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;position:relative;box-shadow:0 2px 8px #0005}
.m:not(.me) .b{border-left:3px solid var(--acc);border-bottom-left-radius:6px}
.m:not(.me):not(.gap) .b{border-top-left-radius:8px}
.me .b{background:linear-gradient(135deg,var(--me1),var(--me2));border:0;color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(59,130,246,.22)}
.m.me:not(.gap) .b{border-top-right-radius:8px}
.b a{color:#a5b4fc}.me .b a{color:#fff;text-decoration:underline}
.b .t{float:right;margin:8px 0 -3px 12px;font-size:11px;color:#ffffff70;white-space:nowrap}.me .b .t{color:#ffffffb0}
.tk{margin-left:4px;letter-spacing:-4px;padding-right:4px}.tk.rd{color:#7dd3fc}
.b img{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:-3px -5px 5px}
.doc{display:flex;gap:10px;align-items:center;background:#ffffff12;border-radius:10px;padding:8px 10px;margin:-2px -4px 4px}.doc i{font-style:normal;font-size:26px}.doc small{display:block;color:#ffffffa0;font-size:12px}
.au{display:flex;align-items:center;gap:8px;min-width:180px}.au button{width:36px;height:36px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:14px}
.au span{flex:1;height:18px;background:repeating-linear-gradient(90deg,#ffffff70 0 2px,transparent 2px 5px);opacity:.8;border-radius:2px}
.hl{background:#facc1566;border-radius:3px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
footer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--bg)}
.box{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface2);border:1px solid var(--border);border-radius:26px;padding:2px 4px;box-shadow:0 4px 14px #0006}
.box .ib{width:42px;height:44px;color:var(--mut)}
textarea{flex:1;min-width:0;width:100%;resize:none;border:0;background:none;color:var(--ink);font:16px/1.35 Inter,system-ui;padding:12px 4px;max-height:140px;outline:none}
textarea::placeholder{color:var(--mut)}
#go{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc2),#059669);color:#fff;flex:none;cursor:pointer;touch-action:none;user-select:none;display:grid;place-items:center;box-shadow:0 6px 18px rgba(16,185,129,.35);transition:transform .15s}
#go svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#go.rec{background:var(--red);transform:scale(1.18);box-shadow:0 0 0 10px #ef444433}
#menu{position:fixed;top:62px;right:10px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 34px #000a;display:none;z-index:20;min-width:240px;overflow:hidden;padding:6px 0}
#menu.on{display:block;animation:pop .14s ease-out}#menu button{display:flex;gap:12px;width:100%;text-align:left;padding:13px 18px;border:0;background:none;color:var(--ink);font:15.5px Inter,system-ui}
#menu button:active{background:#ffffff10}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
#atm{position:fixed;left:10px;right:10px;bottom:84px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:18px 8px;display:none;z-index:20;box-shadow:0 12px 34px #000a;grid-template-columns:repeat(3,1fr);gap:6px}
#atm.on{display:grid;animation:pop .14s ease-out}#atm button{background:none;border:0;color:var(--ink);font:13px Inter,system-ui;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
#atm i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px}
.sh{position:fixed;inset:0;background:#000a;display:none;z-index:30;align-items:flex-end}.sh.on{display:flex}
.shc{background:var(--surface);width:100%;max-height:85%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 20px max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--border);animation:up .2s ease-out}
.shc:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.shc h3{margin:0 0 10px}.shc p{color:var(--mut)}.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;font:600 16px Inter,system-ui;margin-top:12px;cursor:pointer}
.btn.g{background:none;border:1px solid var(--border);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.dl{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);color:var(--ink);text-decoration:none}
.tour{text-align:center}.tour .ti{font-size:46px}.tour .dots2{margin:14px 0}.tour .dots2 i{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--border);margin:0 3px;transition:width .2s}.tour .dots2 i.on{background:var(--acc);width:18px}
#call{position:fixed;inset:0;background:radial-gradient(80% 50% at 50% 30%,#2a2170,#0b0f14);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#call.on{display:flex}#call .av{width:130px;height:130px;animation:pulse 2s infinite}#call .av:after{display:none}#call h2{margin:10px 0 0;font-size:26px}#call p{color:var(--mut);margin:0;min-height:22px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #8b7dff55,0 0 40px #8b7dff55}50%{box-shadow:0 0 0 18px #8b7dff00,0 0 60px #8b7dff88}}
#call .hang{width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;margin-top:44px;cursor:pointer;box-shadow:0 8px 24px #ef444466}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000e;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:50;max-width:88%;text-align:center}
.empty{color:var(--mut);text-align:center;margin-top:30vh}
</style></head><body>
<header>
 <div class="av"></div>
 <div class="who"><b>Kino<i>✦</i></b><small id="st">…</small></div>
 <button class="ib" id="callb" aria-label="Appeler"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2z"/></svg></button>
 <button class="ib" id="menub" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
</header>
<div id="srch"><input id="sq" type="search" autocomplete="off"><button class="ib" id="sx">✕</button></div>
<main id="chat"><div class="empty"><div class="dots"><span></span><span></span><span></span></div></div></main>
<footer>
 <div class="box">
  <button class="ib" id="att" aria-label="Joindre"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <textarea id="tx" rows="1"></textarea>
  <button class="ib" id="cam" aria-label="Photo"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
 </div>
 <button id="go" aria-label="Envoyer"></button>
</footer>
<div id="atm"></div>
<input type="file" id="fdoc" accept="image/*,.pdf,.docx,.txt,.md,.csv" hidden>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden>
<input type="file" id="fimg" accept="image/*" hidden>
<div id="menu"></div>
<div class="sh" id="sh"><div class="shc" id="shc"></div></div>
<div id="call"><div class="av"></div><h2>Kino</h2><p id="cst"></p><p id="ctm"></p><button class="hang" id="hang">✆</button></div>
<div id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var B=location.pathname.replace(/kinochat\/?$/,'');           // /<token>/
try{localStorage.setItem('kcLink',location.pathname.replace(/\/+$/,''))}catch(e){}
var L='';try{L=localStorage.getItem('owlLang')||''}catch(e){}
var EN=L?L==='en':!/^fr/i.test(navigator.language||'fr');document.documentElement.lang=EN?'en':'fr';
function T(f,e){return EN?e:f}
var SEND_I='<svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',MIC_I='<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>',LASTAI=0;
var CID=null,C=null,SIG='',POLL=null,FAST=0,SENDING=false,PEND=[],QRY='';
$('tx').placeholder=T('Écris à Kino…','Write to Kino…');$('sq').placeholder=T('Chercher dans la conversation','Search the conversation');
function toast(s,ms){var t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},ms||2600)}
function getJ(u){return fetch(B+u+(u.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()})}
function post(fn,b){return fetch(B+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function md(s){s=esc(s);s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g,'$1<i>$2</i>');
 s=s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
 if(QRY){var q=QRY.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp('('+esc(q)+')(?![^<]*>)','gi'),'<span class="hl">$1</span>')}return s}
function hm(t){var d=new Date((t||0)*1000);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dayOf(t){var d=new Date((t||0)*1000),n=new Date(),y=new Date(Date.now()-864e5);
 if(d.toDateString()===n.toDateString())return T('Aujourd’hui','Today');if(d.toDateString()===y.toDateString())return T('Hier','Yesterday');
 return d.toLocaleDateString(EN?'en-GB':'fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function shown(m){if(m.role==='user'||m.role==='image'||m.role==='doc')return true;return m.role==='ai'&&(m.text||'').trim()}
function bubble(m,i,prev){var me=m.role!=='ai',gap=!prev||((prev.role!=='ai')!==me),inner='';
 if(m.role==='image'){var u=B+'chat_img?id='+encodeURIComponent(CID)+'&f='+encodeURIComponent(m.file||'');inner='<a href="'+u+'" target="_blank"><img src="'+u+'" loading="lazy" alt=""></a>'+(m.text?md(m.text):'')}
 else if(m.role==='doc')inner='<div class="doc"><i>📄</i><span><b>'+esc(m.name||'document')+'</b><small>'+esc((m.kind||'').toUpperCase())+(m.size?' · '+Math.max(1,Math.round(m.size/1024))+' Ko':'')+'</small></span></div>'+(m.note?md(m.note):'');
 else if(m.audio)inner='<div class="au"><button data-au="'+esc(m.audio)+'">▶</button><span></span></div>'+(m.text?'<small style="color:#ffffffa0">'+md(m.text)+'</small>':'');
 else inner=md(m.text||'');
 return '<div class="m'+(me?' me':'')+(gap?' gap':'')+'" data-i="'+i+'"><div class="b">'+inner+'<span class="t">'+hm(m.t)+(me?'<span class="tk'+(m.t<=LASTAI?' rd':'')+'">✓✓</span>':'')+'</span></div></div>'}
function paint(force){var ch=$('chat'),M=(C&&C.msgs||[]).filter(shown),sig=M.length+'|'+(C&&C.status)+'|'+(C&&C.draft||'').length+'|'+PEND.length+'|'+QRY;
 if(!force&&sig===SIG)return;SIG=sig;LASTAI=0;(C&&C.msgs||[]).forEach(function(m){if(m.role==='ai'&&m.t>LASTAI)LASTAI=m.t});var atEnd=ch.scrollHeight-ch.scrollTop-ch.clientHeight<120,h='',lastDay='',prev=null;
 var list=QRY?M.filter(function(m){return ((m.text||'')+' '+(m.name||'')).toLowerCase().indexOf(QRY.toLowerCase())>=0}):M;
 list.forEach(function(m,i){var d=dayOf(m.t);if(d!==lastDay){h+='<div class="day"><span>'+d+'</span></div>';lastDay=d;prev=null}h+=bubble(m,i,prev);prev=m});
 if(!QRY)PEND.forEach(function(p){h+='<div class="m me gap"><div class="b">'+md(p)+'<span class="t">🕓</span></div></div>'});
 var th=C&&C.status==='thinking';
 if(!QRY&&th)h+='<div class="m gap"><div class="b">'+(C.draft?md(C.draft)+' ':'')+'<span class="dots"><span></span><span></span><span></span></span></div></div>';
 if(!h)h='<div class="empty">'+(QRY?T('Rien trouvé.','Nothing found.'):'')+'</div>';
 ch.innerHTML=h;$('st').textContent=th?T('écrit…','typing…'):(C&&{happy:T('de bonne humeur ☀️','in a good mood ☀️'),sleepy:T('somnole 😴','half asleep 😴'),worried:T('un peu soucieux','a bit worried')}[C.km])||T('en ligne','online');$('st').className=th?'typ':'';
 if(atEnd||force)ch.scrollTop=ch.scrollHeight}
function load(force){if(!CID)return Promise.resolve();return getJ('chat_get?id='+encodeURIComponent(CID)+'&ui='+(EN?'en':'fr')).then(function(j){if(j&&!j.err){C=j;
  if(PEND.length){var mine=(C.msgs||[]).filter(function(m){return m.role==='user'}).map(function(m){return (m.text||'').trim()});PEND=PEND.filter(function(p){return mine.indexOf(p.trim())<0})}
  paint(force)}}).catch(function(){})}
function loop(){clearTimeout(POLL);var fast=(C&&C.status==='thinking')||FAST>Date.now();
 POLL=setTimeout(function(){if(document.visibilityState==='visible')load().then(loop);else loop()},fast?1500:12000)}
function boot(){getJ('chat_list').then(function(j){var L=(j&&j.chats||[]).filter(function(c){return !c.archived});
  if(L.length){CID=L[0].id;return load(true).then(function(){post('chat_open',{id:CID}).catch(function(){})})}
  return post('chat_start',{app:'kinochat',lang:EN?'en':'fr'}).then(function(s){if(s&&s.ok){CID=s.id;FAST=Date.now()+60000;return load(true)}
   toast(T('Impossible d’ouvrir la conversation.','Could not open the conversation.'))})}).then(function(){loop();tourMaybe()}).catch(function(){toast(T('Hors ligne.','Offline.'))})}
// ---- writing
var tx=$('tx'),go=$('go');
function auto(){tx.style.height='auto';tx.style.height=Math.min(140,tx.scrollHeight)+'px';go.innerHTML=tx.value.trim()?SEND_I:MIC_I}
tx.addEventListener('input',auto);
tx.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
function send(){var t=tx.value.trim();if(!t||!CID)return;tx.value='';auto();PEND.push(t);paint(true);FAST=Date.now()+90000;
 var tries=[0,1500,3500,6000],k=0;(function go1(){post('chat_send',{id:CID,text:t}).then(function(j){
   if(j&&j.ok===false){PEND=PEND.filter(function(p){return p!==t});paint(true);
    toast(j.err==='cap'?T('Tu as atteint la limite de messages de ton offre.','You reached your plan’s message limit.'):j.err==='busy'?T('Kino répond encore, un instant…','Kino is still answering, one moment…'):T('Pas parti, réessaie.','Not sent, try again.'));if(j.err==='busy'){tx.value=t;auto()}}
   load().then(loop)}).catch(function(){k++;if(k<tries.length)setTimeout(go1,tries[k]);else{PEND=PEND.filter(function(p){return p!==t});paint(true);tx.value=t;auto();toast(T('Hors ligne : ton message est resté dans la case.','Offline: your message stayed in the box.'))}})})()}
// ---- the round button: tap = send, hold = voice message
var rec=null,chunks=[],t0=0,holdT=null,held=false;
go.addEventListener('pointerdown',function(e){if(tx.value.trim())return;held=false;try{go.setPointerCapture(e.pointerId)}catch(x){}
 holdT=setTimeout(function(){held=true;if(!window.MediaRecorder||!navigator.mediaDevices){toast(T('Vocal impossible ici.','Voice messages not available here.'));return}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(ms){chunks=[];rec=new MediaRecorder(ms);
   rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data)};
   rec.onstop=function(){ms.getTracks().forEach(function(t){t.stop()});vmSend((Date.now()-t0)/1000,rec.mimeType)};rec.start(250);t0=Date.now();go.classList.add('rec');
   tx.placeholder='🔴 '+T('Je t’écoute… relâche pour envoyer','Recording… release to send');try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}})
  .catch(function(){toast(T('Autorise le micro pour les vocaux.','Allow the microphone for voice messages.'))})},350)});
function up(){clearTimeout(holdT);if(rec&&rec.state==='recording'){rec.stop();go.classList.remove('rec');tx.placeholder=T('Écris à Kino…','Write to Kino…')}}
['pointerup','pointercancel'].forEach(function(ev){go.addEventListener(ev,up)});

function vmSend(dur,mime){if(dur<0.8||!chunks.length){toast(T('Trop court.','Too short.'));return}var fr=new FileReader();toast(T('J’envoie ton vocal…','Sending your voice message…'));
 fr.onload=function(){post('chat_audio',{id:CID,data:fr.result,dur:dur}).then(function(j){if(j&&j.ok){FAST=Date.now()+90000;load(true).then(loop)}else toast(T('Le vocal n’est pas parti, réessaie.','The voice message did not go, try again.'))}).catch(function(){toast(T('Hors ligne.','Offline.'))})};
 fr.readAsDataURL(new Blob(chunks,{type:mime||'audio/webm'}))}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-au]');if(!b)return;var a=window._au;
 if(a&&a._b===b&&!a.paused){a.pause();b.textContent='▶';return}if(a){a.pause();a._b.textContent='▶'}
 a=window._au=new Audio(B+'chat_aud?id='+encodeURIComponent(CID)+'&f='+encodeURIComponent(b.dataset.au));a._b=b;b.textContent='❚❚';a.onended=function(){b.textContent='▶'};a.play().catch(function(){b.textContent='▶'})});
// ---- pictures and documents
var ATM=[['🖼️',T('Galerie','Gallery'),'#8b5cf6','fimg'],['📸',T('Appareil photo','Camera'),'#ec4899','fcam'],['📄',T('Document','Document'),'#3b82f6','fdoc']];
$('atm').innerHTML=ATM.map(function(x){return '<button data-f="'+x[3]+'"><i style="background:'+x[2]+'">'+x[0]+'</i>'+x[1]+'</button>'}).join('');
$('atm').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;$('atm').classList.remove('on');$(b.dataset.f).click()};
$('att').onclick=function(e){e.stopPropagation();$('atm').classList.toggle('on')};$('cam').onclick=function(){$('fcam').click()};
$('fimg').onchange=function(){var f=this.files&&this.files[0];this.value='';if(f&&CID)sendImg(f)};
$('fdoc').onchange=$('fcam').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f||!CID)return;if(/^image\//.test(f.type||''))sendImg(f);else sendDoc(f)};
function sendImg(f){var url=URL.createObjectURL(f),im=new Image();im.onload=function(){var sc=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');
  cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  var q=.85,d=cv.toDataURL('image/jpeg',q);while(d.length>2500000&&q>.4){q-=.15;d=cv.toDataURL('image/jpeg',q)}
  var note=tx.value.trim();tx.value='';auto();toast(T('J’envoie ta photo…','Sending your photo…'));
  post('chat_image',{id:CID,data:d,note:note}).then(function(j){if(j&&j.ok){FAST=Date.now()+90000;load(true).then(loop)}else{if(note){tx.value=note;auto()}toast(j&&j.err==='busy'?T('Kino répond encore, un instant…','Kino is still answering…'):T('Photo refusée.','Photo refused.'))}}).catch(function(){toast(T('Hors ligne.','Offline.'))})};
 im.onerror=function(){toast(T('Image illisible.','Unreadable image.'))};im.src=url}
function sendDoc(f){var nm=f.name||'document';if(/\.doc$/i.test(nm)){toast(T('Ancien format Word : enregistre-le en .docx ou en PDF.','Old Word format: save it as .docx or PDF.'),4000);return}
 if(f.size>8000000){toast(T('Document trop lourd (8 Mo max).','Document too big (8 MB max).'));return}
 var r=new FileReader();r.onload=function(){var note=tx.value.trim();tx.value='';auto();toast(T('J’envoie ton document…','Sending your document…'));
  post('chat_doc',{id:CID,data:r.result,name:nm,note:note}).then(function(j){if(j&&j.ok){FAST=Date.now()+90000;load(true).then(loop)}else toast(T('Document refusé (PDF, Word .docx ou texte).','Document refused (PDF, Word .docx or text).'),4000)}).catch(function(){toast(T('Hors ligne.','Offline.'))})};r.readAsDataURL(f)}
// ---- menu: only what a chat needs
function shOpen(h){$('shc').innerHTML=h;$('sh').classList.add('on')}function shClose(){$('sh').classList.remove('on')}

 ['🖼️',T('Photos et documents','Photos and documents'),media],
 ['👥',T('Inviter un ami','Invite a friend'),invite],

 ['🚪',T('Me déconnecter','Sign out'),function(){try{localStorage.removeItem('kcLink')}catch(e){}location.href='/kinochat?out=1'}]];
$('menu').innerHTML=MENU.map(function(x,i){return '<button data-k="'+i+'">'+x[0]+'&nbsp; '+x[1]+'</button>'}).join('');
$('menub').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('on')};
$('menu').onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;$('menu').classList.remove('on');MENU[+b.dataset.k][2]()};
document.addEventListener('click',function(e){if(!e.target.closest('#menu'))$('menu').classList.remove('on');if(!e.target.closest('#atm'))$('atm').classList.remove('on')});
$('sq').oninput=function(){QRY=this.value.trim().length>1?this.value.trim():'';paint(true)};
$('sx').onclick=function(){$('srch').classList.remove('on');$('sq').value='';QRY='';paint(true)};
function media(){var M=(C&&C.msgs)||[],im=M.filter(function(m){return m.role==='image'&&m.file}),dc=M.filter(function(m){return m.role==='doc'});
 var h='<h3>'+T('Photos et documents','Photos and documents')+'</h3>';
 if(!im.length&&!dc.length)h+='<p>'+T('Rien encore. Envoie une photo avec 📷 ou un document avec 📎.','Nothing yet. Send a photo with 📷 or a document with 📎.')+'</p>';
 if(im.length)h+='<div class="grid">'+im.map(function(m){var u=B+'chat_img?id='+encodeURIComponent(CID)+'&f='+encodeURIComponent(m.file);return '<a href="'+u+'" target="_blank"><img src="'+u+'" loading="lazy" alt=""></a>'}).join('')+'</div>';
 h+=dc.map(function(m){return '<div class="dl">📄 <span><b>'+esc(m.name||'document')+'</b><br><small style="color:var(--mut)">'+dayOf(m.t)+'</small></span></div>'}).join('');
 shOpen(h+'<button class="btn g" onclick="this.closest(\'.sh\').classList.remove(\'on\')">'+T('Fermer','Close')+'</button>')}
function invite(){var link=location.origin+'/kinochat',txt=T('Je parle avec Kino, une IA sympa et très utile. Essaie : ','I talk with Kino, a friendly and really useful AI. Try it: ')+link;
 if(navigator.share){navigator.share({title:'Kino Chat',text:txt,url:link}).catch(function(){});return}
 shOpen('<h3>'+T('Inviter un ami','Invite a friend')+'</h3><p>'+T('Envoie-lui ce lien :','Send them this link:')+'</p><p style="color:var(--ink);word-break:break-all">'+esc(link)+'</p><button class="btn" id="cpy">'+T('Copier le lien','Copy the link')+'</button>');
 $('cpy').onclick=function(){try{navigator.clipboard.writeText(txt).then(function(){toast(T('Copié','Copied'))})}catch(e){}}}
// ---- the tour of what Kino can do (once per phone)
function tourGo(){var S=[
['👋',T('Kino, ton compagnon et assistant IA','Kino, your AI companion and assistant'),T('Parle-lui de tout, à toute heure. Il se souvient de ce que tu lui dis : tu ne repars jamais de zéro.','Talk to him about anything, any time. He remembers what you tell him, so you never start from zero.')],
['💼',T('Un collègue toujours disponible','A coworker on call'),T('Un e-mail, une lettre, un CV, un post à écrire ; un plan à préparer ; une recherche sur le web ; un document ou une photo à lire (📎 ou 📷).','An email, a letter, a CV or a post to write; a plan to prepare; a web search; a document or a photo to read (📎 or 📷).')],
['🏪',T('Pour ton activité','For your business'),T('Avec l’équipe Kinoverse, Kino crée des sites web et gère réseaux sociaux et publicités. Demande-lui simplement.','With the Kinoverse team, Kino builds websites and runs social media and ads. Just ask him.')],
['📞',T('Écris, parle ou appelle','Write, talk or call'),T('Écris, garde le doigt sur 🎤 pour un vocal, ou appelle-le avec 📞 (5 minutes offertes chaque mois).','Write, hold 🎤 for a voice message, or call him with 📞 (5 free minutes every month).')],
['📈',T('Et si tu trades','And if you trade'),T('Il construit et teste des robots de trading avec toi, sur le même compte que l’app OwlNest.','He builds and tests trading robots with you, on the same account as the OwlNest app.')]];
 var k=0;function p(){shOpen('<div class="tour"><div class="ti">'+S[k][0]+'</div><h3>'+S[k][1]+'</h3><p>'+S[k][2]+'</p><div class="dots2">'+S.map(function(_,i){return '<i class="'+(i===k?'on':'')+'"></i>'}).join('')+'</div><button class="btn" id="tn">'+(k<S.length-1?T('Suivant','Next'):T('C’est parti','Let’s go'))+'</button></div>');
  $('tn').onclick=function(){k++;if(k<S.length)p();else shClose()}}p()}

// ---- call (live voice, the same call as the trading app's chat)
var LV=null;
function cst(s){$('cst').textContent=s}
$('callb').onclick=function(){if(!CID||LV)return;if(!window.RTCPeerConnection||!navigator.mediaDevices){toast(T('Appel impossible avec ce navigateur.','Calls are not possible in this browser.'));return}
 $('call').classList.add('on');cst(T('J’appelle Kino…','Calling Kino…'));$('ctm').textContent='';
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(ms){
  var pc=new RTCPeerConnection(),au=new Audio();au.autoplay=true;pc.ontrack=function(e){au.srcObject=e.streams[0];au.play().catch(function(){})};
  ms.getTracks().forEach(function(t){pc.addTrack(t,ms)});var dc=pc.createDataChannel('oai-events');LV={pc:pc,ms:ms,au:au,t0:0,tr:[],cid:CID};
  dc.onmessage=function(e){try{var v=JSON.parse(e.data),t=v.type||'';if(/input_audio_transcription\.completed$/.test(t)&&v.transcript)LV.tr.push((EN?'Member: ':'Membre : ')+v.transcript.trim());
   else if(/(output_audio_transcript|audio_transcript)\.done$/.test(t)&&v.transcript)LV.tr.push('Kino: '+v.transcript.trim())}catch(x){}};
  return pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){return new Promise(function(ok){if(pc.iceGatheringState==='complete')return ok();var t=setTimeout(ok,2500);
   pc.addEventListener('icegatheringstatechange',function(){if(pc.iceGatheringState==='complete'){clearTimeout(t);ok()}})})})
  .then(function(){return post('live_session',{id:CID,sdp:pc.localDescription.sdp,cont:0,tr:''})}).then(function(j){
   if(!j||!j.ok){callKill();cst(j&&j.err==='nominutes'?T('Tu n’as plus de minutes d’appel ce mois-ci.','You have no call minutes left this month.'):j&&j.err==='livecap'?T('Plus d’appel possible aujourd’hui.','No more calls today.'):T('L’appel ne passe pas pour le moment. Écris-moi !','The call is not going through right now. Write to me!'));setTimeout(function(){$('call').classList.remove('on')},3500);return}
   LV.max=j.max_min||20;return pc.setRemoteDescription({type:'answer',sdp:j.sdp}).then(function(){LV.t0=Date.now();cst(T('En ligne avec Kino','On the line with Kino'));
    LV.tick=setInterval(function(){if(!LV)return;var s=Math.floor((Date.now()-LV.t0)/1000);$('ctm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=LV.max*60)hang()},500)})})})
 .catch(function(){callKill();cst(T('Autorise le micro pour appeler Kino.','Allow the microphone to call Kino.'));setTimeout(function(){$('call').classList.remove('on')},3500)})};
function callKill(){if(!LV)return;clearInterval(LV.tick);try{LV.pc.close()}catch(e){}try{LV.ms.getTracks().forEach(function(t){t.stop()})}catch(e){}var L=LV;LV=null;return L}
function hang(){var L=callKill();$('call').classList.remove('on');if(!L||!L.t0)return;var mins=(Date.now()-L.t0)/60000;
 post('live_end',{id:L.cid,min:+mins.toFixed(2),why:'hangup',transcript:L.tr.join('\n').slice(-12000)}).then(function(){load(true)}).catch(function(){})}
$('hang').onclick=hang;
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&CID){load();post('chat_open',{id:CID}).catch(function(){})}});
go.innerHTML=MIC_I;
boot();
})();
