<!doctype html><html lang="fr" translate="no" class="notranslate"><head>
<meta charset="utf-8">
<meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>La journée de Kino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('owlTheme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* 2026-10-19 (owner): "Kino et toi" - what Kino pursues with the member, what it remembers (they can make it forget),
   the lab's playbook; for the owner also Kino's mind (lessons it wrote itself, self-model, journal). Same tokens as the
   Atelier. Data: kino_data; forget: POST kino_forget. */
:root{--bg:#0b0f14;--surface:#121a25;--surface2:#172130;--surface3:#1d2a3b;--border:#1f2a38;--border2:#2b3a4d;
 --text:#e8eef4;--text2:#c6d3df;--muted:#8a9bb0;--muted2:#a9b8c8;--accent:#3b82f6;--accent-soft:#8fc6ff;--up:#2ecc71;--up-soft:#8df0bb;
 --down:#ff5c5c;--down-soft:#ff9a9a;--warn:#e8c55a;--violet:#a78bfa;--violet-soft:#c4b5fd;--sh:0 18px 50px rgba(0,0,0,.45)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-theme]){}}
:root[data-theme="light"]{--bg:#f3f6fa;--surface:#fff;--surface2:#f6f8fb;--surface3:#eef2f7;--border:#dfe6ee;--border2:#cfd8e3;--text:#10161f;
 --text2:#2b3745;--muted:#64748b;--muted2:#4b5868;--sh:0 18px 50px rgba(20,40,70,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;pointer-events:none;z-index:0;
 background:radial-gradient(45% 55% at 15% 20%,rgba(167,139,250,.16),transparent 70%),radial-gradient(45% 50% at 85% 10%,rgba(59,130,246,.15),transparent 70%);filter:blur(12px)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--border2);background:var(--surface);display:grid;place-items:center;color:var(--text);text-decoration:none;flex:none}
.ib svg{width:20px;height:20px}
.hero{display:flex;align-items:center;gap:16px;margin:18px 0 22px}
.orb{width:68px;height:68px;border-radius:22px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cf6,#3b82f6);box-shadow:0 14px 36px rgba(109,92,246,.45);font-size:34px}
.hero h1{margin:0;font-size:1.7rem;font-weight:900;letter-spacing:-.02em}.hero p{margin:4px 0 0;color:var(--muted2);font-size:.92rem;line-height:1.45}
.card{border-radius:22px;border:1px solid var(--border2);background:var(--surface);padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card h2{margin:0 0 10px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);display:flex;align-items:center;gap:8px}
.card h2 i{font-style:normal;color:var(--violet-soft)}
.goal b{display:block;font-size:1.05rem;line-height:1.45}.goal small{display:block;color:var(--muted);margin-top:8px;font-size:.84rem;line-height:1.45}
.goal .nx{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:.88rem;color:var(--text2)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:.9rem;line-height:1.45;color:var(--text2)}
.it span{flex:1}.it button{flex:none;border:0;background:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 2px}
.it button:hover{color:var(--down-soft)}
.sub{color:var(--muted);font-size:.8rem;margin:-4px 0 10px;line-height:1.45}
.empty{color:var(--muted);font-size:.88rem;padding:6px 2px}
.mind .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.mind .row{grid-template-columns:1fr}}
.pill{border-radius:16px;padding:12px;border:1px solid var(--border);background:var(--surface2)}
.pill b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.pill ul{margin:0;padding-left:18px;font-size:.86rem;line-height:1.5;color:var(--text2)}
.mood{margin-top:10px;font-size:.9rem;color:var(--text2);font-style:italic}
.jr{border-left:2px solid var(--violet);padding:4px 0 4px 12px;margin:10px 0}.jr b{font-size:.78rem;color:var(--muted2)}.jr p{margin:4px 0 0;font-size:.9rem;line-height:1.55;color:var(--text2)}
.badge{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(232,197,90,.14);color:var(--warn);border:1px solid rgba(232,197,90,.35)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#3b82f6,#6d5cf6);text-decoration:none}
.tl{position:relative;margin-left:8px;border-left:2px solid rgba(124,92,255,.35);padding-left:14px}.ev{position:relative;margin:0 0 12px}.ev:before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:#7c5cff}.ev small{display:block;color:var(--muted,#8a94a6);font-size:.74rem;margin-bottom:2px}.ev .ms{display:block;color:var(--muted,#8a94a6);font-size:.78rem;margin-top:3px}.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:9px;background:rgba(124,92,255,.15);margin-left:6px}.adopt{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:#7c5cff;color:#fff;font-weight:700;font-size:.95rem}.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.stat div{flex:1;min-width:0;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);text-align:center}.stat b{display:block;font-size:1.05rem}
</style></head><body>
<div class="wrap">
 <header><a class="ib" href="kino" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a></header>
 <div class="hero"><div class="orb">🦉</div><div><h1 id="h1">La journée de Kino</h1><p id="hs"></p></div></div>
 <div id="main"><div class="empty">Chargement…</div></div>
 <a class="cta" href="atelier" id="cta">Parler à Kino</a>
</div>
<script>
const B=location.pathname.replace(/kinoday\/?$/,'');let EN=false;try{EN=localStorage.getItem('owlLang')==='en';}catch(e){}
const T=(f,e)=>EN?e:f,$=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={hunch:['👀',T('Intuition','Hunch')],hunch_check:['🎯',T('Intuition vérifiée','Hunch checked')],bet:['🎲',T('Pari','Bet')],question:['❓',T('Question','Question')],
 finding:['💡',T('Trouvaille','Finding')],dream:['🌙',T('Rêve','Dream')],daydream:['☁️',T('Rêverie','Daydream')],link:['🔗',T('Lien','Link')],cross:['✨',T('Idée','Idea')],
 realise:['💭',T('Réflexion','Thought')],memory:['📌',T('Souvenir','Memory')],care:['🤍',T('Pensée pour toi','Thinking of you')],own_robot:['🤖',T('Mon robot','My robot')],
 gut:['🫀',T('Ressenti','Gut feeling')],attached:['🤍',T('Pensée','Thought')]};
let D=null;
async function load(){try{D=await (await fetch(B+'kino_day',{cache:'no-store'})).json();}catch(e){$('main').innerHTML='<div class="empty">'+T('Hors ligne.','Offline.')+'</div>';return;}paint();}
function hm(t){return new Date(t*1000).toLocaleTimeString(EN?'en-GB':'fr-FR',{hour:'2-digit',minute:'2-digit'});}
function paint(){let h='';const md=D.mood||{},rb=D.robot||{},sc=D.score||{};
 $('h1').textContent=T('La journée de Kino','Kino’s day');$('cta').textContent=T('Parler à Kino','Talk to Kino');
 $('hs').textContent=(D.status?(EN?D.status.en:D.status.fr)+' · ':'')+T('Humeur : ','Mood: ')+(md.label||'')+'. '+T('Ce qu’il a vu, parié, cherché aujourd’hui.','What he saw, bet on and looked for today.');
 const F=(D.feelings||[]).slice(0,3);
 if(F.length)h+='<div class="card"><h2><i>☺</i>'+T('Comment il se sent','How he feels')+'</h2><div class="list">'+F.map(f=>'<div class="it"><span>'+esc(f.why||f.kind)+'</span></div>').join('')+'</div></div>';
 h+='<div class="card"><h2><i>🤖</i>'+T('Son robot · ','His robot · ')+esc(rb.name||'')+'</h2><div class="stat"><div><b>'+((rb.today||{}).n||0)+'</b>'+T('trades aujourd’hui','trades today')+'</div><div><b>'+(((rb.today||{}).r||0)>0?'+':'')+((rb.today||{}).r||0)+' R</b>'+T('aujourd’hui','today')+'</div><div><b>'+(((rb.all||{}).r||0)>0?'+':'')+((rb.all||{}).r||0)+' R</b>'+T('depuis sa naissance','since birth')+'</div></div>'+
  '<p class="sub" style="margin-top:8px">'+T('Argent fictif, sur ','Pretend money, on ')+esc(rb.market||'')+(rb.open?T(' · un trade en cours',' · a trade open'):'')+(rb.adopted?' · '+rb.adopted+T(' adoption(s)',' adoption(s)'):'')+'</p>'+
  (rb.mine?'<p class="sub">'+T('Tu l’as déjà adopté.','You already adopted it.')+'</p>':'<button class="adopt" onclick="adopt()">'+T('Adopter son robot','Adopt his robot')+'</button>')+'</div>';
 (D.research||[]).forEach(r=>{h+='<div class="card"><h2><i>🔬</i>'+T('Sa recherche pour toi','His research for you')+'</h2><b>'+esc(r.goal)+'</b><div class="list">'+(r.steps||[]).map(x=>'<div class="it"><span>'+({done:'✓',dropped:'✗',doing:'⏳'}[x.state]||'○')+' '+esc(x.text)+(x.note?' <small>· '+esc(x.note)+'</small>':'')+'</span></div>').join('')+'</div><a class="sub" href="atelier?c='+encodeURIComponent(r.cid)+'">'+T('Ouvrir la conversation','Open the conversation')+'</a></div>';});
 const I=D.items||[];
 h+='<div class="card"><h2><i>☀</i>'+T('Sa journée','His day')+(sc.n?' <span class="tag">'+T('intuitions justes : ','hunches right: ')+sc.right+'/'+sc.n+'</span>':'')+'</h2>'+(I.length?'<div class="tl">'+I.map(x=>{const k=KIND[x.kind]||['·',x.kind];return '<div class="ev"><small>'+hm(x.t)+' · '+k[0]+' '+esc(k[1])+(x.result?' <span class="tag">'+esc(x.result)+'</span>':'')+'</small>'+esc(x.text)+(x.measure?'<span class="ms">'+esc(x.measure)+'</span>':'')+'</div>';}).join('')+'</div>':'<div class="empty">'+T('Journée calme pour l’instant.','A quiet day so far.')+'</div>')+'</div>';
 const N=D.notes||[];if(N.length)h+='<div class="card"><h2><i>✎</i>'+T('Ce qu’il se dit à lui-même','What he tells himself')+'</h2><div class="list">'+N.map(n=>'<div class="it"><span>'+esc(n.text)+'</span></div>').join('')+'</div></div>';
 $('main').innerHTML=h;}
async function adopt(){if(!confirm(T('Adopter le robot de Kino ? Une copie devient ton robot, et son test démarre.','Adopt Kino’s robot? A copy becomes your robot and its test starts.')))return;
 try{const j=await (await fetch(B+'kino_adopt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:EN?'en':'fr'})})).json();
  if(j.ok)location.href='atelier?c='+encodeURIComponent(j.id);else alert(T('Pas possible pour le moment.','Not possible right now.'));}catch(e){alert(T('Hors ligne.','Offline.'));}}
load();setInterval(load,60000);
</script></body></html>
